front:
  text: 新刻排科夾註戒本疏記序觀夫太虗寥廓既絕諸過於寂滅之津真心靈鑑固具眾德於常樂之域斯之謂法佛本性之尸羅萬德圓備其至矣哉雖然境風震烈心海鼓動隨緣流變逐塵而封執遂使戴角披毛劇苦無盡期焉懷此明珠竛竮六趣難辛疲乏實可悲傷也我大雄氏之出震于竺乾遠本渺茫焉證道於寂光垂影於心土則於寂滅道場初結菩薩戒稱法性之體而斷惡修善隨真如之用而絕應無方體用一源顯微潛通謂之菩薩三聚淨戒萬行悉備嗚呼偉哉然而人性不齊氣稟質殊如何其堪于菩薩大行耶大覺慈父於是乎分擘三聚戒初授聲聞眾以攝律儀戒是以勝鬘經曰受菩薩威儀戒名出家受具足瑜伽論曰菩薩攝律儀戒如諸部毗那耶者是也自其五夢呈妖白毫潛光之後尊者近執蘊結戒藏謂之根本大毗尼藏聖聖相稟未甞分岐路焉洎至乎近護之道不繼於三聖大天之邪說興諍於五緣雖有二部五部十八五百之異執修證無二途津梁其一揆故折金杖援白氎之兆存于斯矣在昔周星飛祲千有餘歲至道乎而其未開漢日揚光像教懸被東夏以降二百年矣天下僧侶但知薙染猶未受五八何況具戒乎逮于曹魏嘉平年中尊者法時抵于雒陽乃依法藏部行羯磨受戒神州之傳戒肇于斯時矣迨姚秦朝覺明譯語竺念操觚翻四分律爾來撰疏凡二十家雖曰各競蘭菊而未得醇粹矣暨夫大唐澂照大師乃搜法華開顯之秘妙而荷涅槃扶律之顧命鈔疏圖儀以被時眾豈非來蒙之方軌秉持之龜鏡乎實自非揭於慧燈授乎法筏孰能闢黑暗示通衢拯沈溺達彼岸者與聲飛五天澤流千歲為四依使維持一人耳矣然辭深義隱未易鉤索尚且祖述者凡六十家各爭鋒於得失交嶋鼓乎勝負而雷同駕說未足以為規準焉其匡攝彝範顯揚行儀者其惟有宋大智律師乎覃于師之五百傑出頻音一倡既絕唱於前達誰歟繼乎餘音者我扶桑國之傳戒律也濫觴于招提鑑真大師中興于西大興正菩薩厥後傳於明忍和尚流派浩渺溢於海內精鍊乎毗尼不羞前達矣嚮者光公始乃會行事鈔記次則融公亦糅羯磨疏記第所憾者戒本疏記及與科文四本別行閱者病焉余欲會之再焉三焉然禪誦無暇加旃以病虗移盈昃未遑及焉有讚州東林靈芝即靜律師者磨以戒珠涼以定水孜孜法門志存兼濟從事于斯會入告成而其為功抽於前代余聞之乃歎曰師之有此舉末代餘曦冥復充乎余宿願者也因而遠讚其功貽厥遐代於戲三部大成而慧曦揚輝涅槃一路燦然可見樂學戒者藉是以行則依聲聞戒出三界門因菩薩戒過變易土得如來無為戒蘊乃遂心海反流頓入常寂都矣是為序維時明和元年龍飛甲申冬安居日苾芻即禪實相書于紫陽雷山千如律寺瑜祗室余自少壯負笈經歷律肆偏被佛祖之慈育稍發五分之萌芽聊存謝德纔攬斯一帙夙讀夜思操觚模學終為之會閱者並云壽之於梓流布宇內予亦所好樂也雷山之相師作為序引透起然而時緣未熟埋之於庫中已二十餘年所屬之徒覺等有與書肆相議之謂以告白之余年並朽邁桑榆迫於西山不堪待時再校讐之更加凡例等以壽梓焉云爾明和八年龍次辛卯仲冬哉生明比丘靜蓮合稽首題夫道化東漸已六七百年南北律匠傑起於世者大唐澂照大師其人也所製毗尼三大部者蓋盡如來權巧之旨且闢群生解脫之門三寶住持之功在于茲矣次為注解發明鈔疏蘊奧者其惟宋朝大智律師而可也本朝天平年中招提唐大和上傳律已來扶桑一統約受誦四分之文及論隨行皆依南山部文者也若依有部學者可謂宗骨顛倒理味差僻矣今時通受攝律儀戒亦依鈔疏於中此戒本注并疏記等特別行于世焉今此會本也我師久用心之務也其功既成再三加校讐而將壽梓矣更令命弟子撿校寫本不肖雖識見荒蕪敢叵違師命但以舊本對校新本一覽已畢歡悅之餘不忍放卷遂忘固陋操觚稽首云爾安永二年龍次癸巳二月中澣於讚東大內郡如寶山圓通精舍閣毫日內山門人比丘清月宜順和南尸羅是諸佛之本原萬行之基趾實為禪那般若依因近則人天之路遠則成道之正因釋門之淄素預不可不知之矣于茲終南鼻祖所撰三大鈔疏流行盛於世就中為可務急者偏唯戒本注疏肝要者歟然而從異朝別行來無奈之何我師竊悲傷之務之孜孜五部具會為一本欲令新學之徒易照校之也且欲令蒼生育人天之種終致大道之權述者也差功成之日令不侫校閱之今又刻鏤流布弘通宇內同心隨喜塞塞胸中矣未暇看他面竭鄙詞聊讚之曰佛由戒證真依行為真人相續於慧命佛日日日新安永二年仲秋之日法正庵比丘玉線謹題凡例三條題中四分律戒本出曇無德部含注及疏南山所出行宗記及科靈芝所著也於中含注則合戒本素為一本而上中下疏記及科各別流行言部五部言卷則四本也疏記各八卷約靈芝之所分科二卷共戒本為二十有一卷今亦合會為三七卷一二三四各有上下據本存之更加之一之二等成之分卷此則余所定置也戒本之注古本並分行細書今為易見多則大書而以印分之或不充行或疏記共不科釋者直依舊本分書本文之下勿生怪矣凡標科中以律印者戒本也以註印者含注也以疏印者疏也低一字者記也科排布疏文上五部俱會以成一覽猶恐有參差後生訂之幸甚矣四分律含註戒本疏行宗記目錄卷一一上之一序疏序戒序卷二一上之二戒序之餘皈敬偈本文序正流通大科卷三一下之一廣教發起序卷四一下之二廣教發起序卷五二上之一廣教發起序大婬戒卷六二上之二大婬戒之餘大盜戒卷七二上之三大盜戒之餘卷八二下之一大殺戒大妄語戒卷九二下之二僧殘自初戒至第七有主房戒卷十三上之一僧殘之餘自第八至第十一卷十一三上之二僧殘之餘自第十二至第十三二不定三十捨墮卷十二三上之三長衣過限戒卷十三三下之一離衣戒卷十四三下之二月望戒已下卷十五三下之三自販賣戒至竟卷十六四上之一九十單提自一至十二卷十七四上之二九十單提之餘自十三至三十二卷十八四上之三九十單提之餘自三十三至四十七卷十九四下之一九十單提之餘自四十八至七十四卷二十四下之二九十單提之餘自七十五至九十四提舍尼一百眾學自初至五十一卷二十一四下之三一百眾學之餘自五十二至一百七滅諍法七佛略教廣略二教總流通分疏家批文并䟦四分律含註戒本疏行宗記目錄終含注戒本并疏記略條目戒經序四波羅夷法第一大婬戒第二大盜戒第三大殺戒第四大妄語戒十三僧殘法第一漏失戒第二摩觸戒第三麤語戒第四歎身戒第五媒人戒第六無主房戒第七有主房戒第八無根謗戒第九假根謗戒第十破僧戒第十一助破僧戒第十二汙家𢷤謗戒第十三拒僧諫戒二不定法第一屏處不定戒第二露處不定戒三十捨墮法一長衣戒二離衣戒三月望衣戒四取非親尼衣戒五浣故衣戒六乞衣戒七過分取衣戒八勸增衣價戒九勸二家增價戒十忽切索衣戒十一蠶綿袈裟戒十二黑毛臥具戒十三白毛三衣戒十四六年三衣戒十五不貼坐具戒十六持羊毛戒十七浣染毛戒十八畜錢寶戒十九貿寶戒二十販賣戒二十一長鉢戒二十二乞鉢戒二十三乞縷戒二十四勸織戒二十五奪衣戒二十六長藥戒二十七雨浴戒二十八急施衣戒二十九蘭若離衣戒三十迴僧物戒九十單提法一小妄語戒二行罵戒三兩舌戒四與女人宿戒五共未具宿戒六未具同誦戒七說麤罪戒八實得道戒九與女說法戒十掘地戒十一壞生戒十二餘語惱觸戒十三嫌罵知事戒十四露敷僧物戒十五屏敷僧物戒十六強敷坐戒十七牽出房戒十八脫脚牀戒十九用蟲水戒二十覆屋過限戒二十一輙教尼戒二十二說法至暮戒二十三譏教尼人戒二十四與尼衣戒二十五為尼作衣戒二十六與尼坐戒二十七尼期行戒二十八尼同船戒二十九尼歎食戒三十與女期行戒三十一食過受戒三十二背請戒三十三別眾食戒三十四歸婦賈客食戒三十五足食戒三十六勸足食戒三十七非時食戒三十八殘宿食戒三十九不受食戒四十索美食戒四十一與外道食戒四十二食前後入聚戒四十三食家強坐戒四十四屏與女坐戒四十五與女露坐戒四十六驅他出聚戒四十七過受樂戒四十八觀軍戒四十九軍中過宿戒五十觀軍戰戒五十一飲酒戒五十二水中戲戒五十三擊攊他戒五十四不受諫戒五十五怖比丘戒五十六半月浴戒五十七露地然火戒五十八藏他衣物戒五十九真實淨戒六十著新衣戒六十一奪畜生命戒六十二飲蟲水戒六十三疑惱比丘戒六十四覆他麤罪戒六十五與年不滿戒六十六發諍戒六十七與賊期行戒六十八惡見違諫戒六十九隨舉比丘戒七十隨擯沙彌戒七十一拒勸學戒七十二毀毗尼戒七十三恐舉先言戒七十四同羯磨後悔戒七十五不與欲戒七十六與欲後悔戒七十七屏聽四諍戒七十八瞋打比丘戒七十九搏比丘戒八十殘謗戒八十一突入王宮戒八十二捉寶戒八十三非時入聚戒八十四過量牀足戒八十五兜羅綿褥戒八十六骨牙角鍼筒戒八十七過量坐具戒八十八過量覆瘡衣戒八十九過量雨衣戒九十過量三衣戒四提舍尼法一從非親尼取食戒二食尼指授食戒三學家受食戒四蘭若受食戒百眾學法一著內衣戒二著三衣戒三反抄衣戒四反抄衣坐戒五衣纏頸戒六衣纏頸坐戒七覆頭戒八覆頭坐戒九跳行戒十跳行坐戒十一蹲坐戒十二叉腰戒十三叉腰坐戒十四搖身戒十五搖身坐戒十六掉臂戒十七掉臂坐戒十八覆身戒十九覆身坐戒二十左右顧視戒二十一左右顧視坐戒二十二靜默戒二十三靜默坐戒二十四戲咲戒二十五戲咲坐戒二十六用意受食戒二十七溢鉢受食戒二十八溢鉢受羮戒二十九羮飯等食戒三十以次食戒三十一挑鉢中食戒三十二索羮飯戒三十三飯覆羮戒三十四視比座鉢戒三十五繫鉢想食戒三十六大揣食戒三十七張口待食戒三十八含食語戒三十九遙擲口中戒四十遺落食戒四十一頰食戒四十二嚼食作聲戒四十三噏飯食戒四十四舌䑛食戒四十五振手食戒四十六把散飯戒四十七污手捉食器戒四十八棄洗鉢水戒四十九生草上大小便戒五十水中大小便戒五十一立大小便戒五十二反抄衣說法戒五十三衣纏頸說法戒五十四覆頭說法戒五十五裹頭說法戒五十六叉腰說法戒五十七著革屣說法戒五十八著木屣說法戒五十九騎乘說法戒六十佛塔中宿戒六十一藏物塔中戒六十二著革履入塔戒六十三捉革履入塔戒六十四著革履繞塔戒六十五著富羅入塔戒六十六捉富羅入塔戒六十七塔下坐留食戒六十八塔下擔死屍戒六十九塔下埋屍戒七十塔下燒屍戒七十一向塔燒屍戒七十二塔四邊燒屍戒七十三持衣床塔下過戒七十四塔下大小便戒七十五向塔大小便戒七十六塔四邊大小便戒七十七持佛像至大小便處戒七十八塔下嚼楊枝戒七十九向塔嚼楊枝戒八十塔四邊嚼楊枝戒八十一塔下涕唾戒八十二向塔涕唾戒八十三塔四邊涕唾戒八十四向塔舒脚坐戒八十五安佛下房戒八十六人坐己立說法戒八十七人臥己坐說法戒八十八人在坐己在非坐說法戒八十九人在高坐說法戒九十人在前行說法戒九十一人在高經行處說法戒九十二人在道說法戒九十三携手道行戒九十四上樹戒九十五杖絡囊戒九十六持杖人說法戒九十七持劒人說法戒九十八持矛人說法戒九十九持刀人說法戒百持蓋人說法戒七滅諍法一現前毗尼二憶念毗尼三不癡毗尼四自言治五多人語六罪處所七草覆地七佛略戒流通分含註戒本并疏記略條目終四分律比丘含注戒本序太一山沙門釋道宣述四分戒本者蓋開萬行之通衢引三乘之正軌也自法王利見弘濟在緣程上聖之悽惶悼小凡之沉溺故能闢不諱之門示祕密之深術張無問之說顯初學之津塗遂靜處而興教源集眾而宣玄範前明由序廣陳發致之功後列大宗盛羅機欲所被約時敷演通行於是承遵合潔等聞正法由茲久住但以時來不競情變所流經陳夢氎之徵律舒分杖之喻致使教隨文結理任情移雲飛二部五部之殊山張十八五百之異取其元始所被無非計情窮其要會之心俱通正業逮乎曹魏之末戒本創傳終於隋運之初芟改者眾或依梵本或寫𨽻文或以義求或以緣據讎校諸說成務蒙然濫罔前脩翳昏後學梵本則文旨乖互方言未融準律則得在宗歸失於辨相義求雖有深會未靜論端緣據似是具周止存別見原夫正戒明禁唯佛制開賢聖緘默但知祇奉故律論所述咸宗本經自餘位班曾未揣度總敘諸見師心者多考定昔緣良所未暇今以戒本繁略隱義局文用則失儀捨則非據若不顯相人難具依余少仰玄風志隆清範昔在帝京周流講肆伏膺請業載紀相尋何甞不執卷臨文慨斯壅結遂以貞觀四年庚寅之歲薄遊嶽瀆廣評律宗但見誦語紛綸未思弘遠高譚有務事用無施纔羅七五之名妄居一字之首但述行藏之要寧開決正之心問以戒律廢興妙憑疏解約之情通本據無文可依自有博學生知行名雙顯而神用莫準情取天乖余意之所未安義當依法為定則諍論自弭何俟繁辭今試敢依律本具錄正經仍從佛解即為注述文唯一卷同昔所傳持犯兩明今便異古庶令初後兼學愚智齊遵麤知則具三種持律精練則是一師大化以斯用求濟成為極又以戒各緣起妄說非無若不鏡曉終歸虗託故隨戒類引刪要補之俾夫顯相通班輕重昭現足以潤身光德足以護法匡時臨文無取謬於文思義則不資他義豈直自貽無漏亦將兼濟有緣故輙筆記序之云爾
