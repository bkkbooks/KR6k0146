body:
  text: 律三大殺戒疏第三大殺戒釋殺戒疏經明性重多以此戒為初豈非身為業先故殺業因首故也言性重者以性含輕重也重則人道輕則非畜約境分心故罪階三位明輕重中初示經律不同以彰過重經明十業並殺為初菩薩梵網十重亦爾問其意云何答化教明於業行業中身殺居先又復殺惱乖慈大士特須偏禁淫無違惱故列于後制教不爾為道而制障道中深勿過淫欲小機自利不慮違慈故與前反各有其致諸經皆爾不可一指是故文中但云經明豈下出意三業之中口意二業依身而成身居其初故云先也又身三業中殺為最重如上所明由此義故經標在初故云因首次言下轉釋重名性名通含對經云重心無輕重隨境分差教依心制故罪亦別疏今就人趣四句分業一非恩養非福田二是恩養非福田三是福田非恩養四亦福田亦恩養分句釋中即對常人父母無學及佛以為四句雖同人道業道制教重輕單複因果竝殊故須標別方無通濫大約而分前一唯凡後二唯聖第二父母則通凡聖廣如後釋疏先釋初句疏言制戒意者以非父母故非恩養又非無學故非福田既非此二則餘人道所以不許加害者人趣報勝善因所招形心俱是受道之器出家之士理應四等為懷慈濟物命今反內懷瞋忿斷彼相續違慈惱他損害道器過中之甚故聖徧禁初句制意中初對句揀境所以下正示制意又二初明所害境勝文中三義初是現報勝二謂宿因勝三堪受道六道之中唯人一道有緣可化故云道器出家下次明能殺過深初明順行四等即慈悲喜捨於物無偏故四皆名等今下明違行上二句明結業次二句顯情過色心報命堪貯聖道喻若器焉下二句示制教疏二釋戒名疏古人云殺生戒者無論人畜約命是同今言大殺對後小害大則重夷小則輕墮故名也釋大殺中初科又二初標古通濫今下明今列意據標大殺亦簡非人但文見廣解無別戒條且對九十揀異畜趣疏故善見云生有二種一者色生二者無色生色生可壞無色生不可壞然無色生依於色生色心相依行者資稟成一假命今以刀輪壞彼色生無色生者相與俱壞使前不感後後不赴前斷報相續名之為殺次科為二初引示色無色者即是五陰四陰皆心故言無色色即凝滑心謂業識此二相依乃成假命故竝名生然下正釋初釋生義上二句明心依於色色心下二句六字為句讀之此顯相依而成報命依行古本作依住今下釋壞義以刀為輪趣舉殺具如罽膩吒王為千頭魚劒輪遶身之類問上言無色生不可壞此云俱壞者答心依於色以色壞故識無所依故言俱壞不妨心識實無壞也前即過去心色既已斷滅故不感後後謂未來心色既不相續故不赴前疏戒者能治之行能所通舉故曰殺戒釋戒同前並以防過為戒故舉過相攬成戒名下皆同此更不釋也疏故涅槃云眾生佛性住色陰中若壞五陰名曰殺生若有殺生即墮惡道色有三種過去現在則不可殺遮於未來故名為殺夫眾生者名出入息斷出入息故名為殺我等諸佛亦隨俗說說名為殺引證中彼經佛說佛性常住不可斷壞故迦葉菩薩乃舉殺業以難今疏但引佛答耳但望壞五陰而得名殺亦由色陰滅故餘四隨滅是以下文正明三色過現不可殺者過去已往現色遷滅念念不停未滅則是未來已滅還成過去現色不立故不可殺遮未來者斷相續故眾生無實攬陰以成但有名字然識依息隨息斷續以分存亡故名眾生為出入息第一義中實無眾生逐陰求之尚無生相何況有殺但隨世諦說為業道非唯釋迦故云我等經文三段初引如來性品證前二生俱壞色下次引梵行品簡上所壞何色夫下復引梵行品後段明上斷報相續疏第三成犯緣具有五種一是人道以餘道非重罪故二作人想三有殺心四起方便五明命斷成犯緣中對下闕緣辨釋可解疏第四闕緣義疏若闕初緣小漫心起但得三蘭以非人畜杌三境替故大漫心起但得一蘭三趣隨犯俱無差故若對尅心加王異境來替張處則有四句可準上思闕緣中初闕三別即大小二漫及剋心也大漫一蘭者以三趣齊害杌境來差心期雖漫望人從重故得蘭罪必對杌木起非畜想理應得吉非此所明在文蓋闕此中結句大漫一句杌作人想小漫三句一非人人想二畜生人想三杌木人想剋心中但加一句王作張想殺則同重餘三同前故云四句通前二漫總有八句疏二闕想緣亦有小大兩漫及一剋心闕第二緣初通舉三位一一位中各有想疑單雙之別如指略中疏且對剋心生想有四句一夷三蘭也剋心生疑有十句一夷九蘭也謂直疑有四互疑有六亦可準知也剋心中句法交亂須作圖相三位不同疏剋心雙闕二緣四十句如王境差心對有十乃至杌木例可解也通前三心總五十四句三夷五十一蘭圖中可見但知前二心差境定後一復加境差故號雙闕耳疏餘大小漫心境闕相可以準知事稀故不能具列指略中小漫但除王人則想有三句疑但九句雙闕除王境差但存三境亦各九句總前三位共有三十九句大略同上圖相唯直疑中各除第一句為異又通改張字為人字讀之準前易見不復重出大漫三境通害但有杌為異境止有一十三句復恐難曉故須列示文中二意故略一可準前二以事稀故疏三闕殺心或無罪如開緣中或得吉羅如打下眾雖死無心或得墮罪如打全破諸比丘等或得功德如看貧病死而無賞或得衣鉢如看富病以勞賞故或得偷蘭謂苦治人過與病藥近死方便但無殺心闕心中六別並以或字間之初如戒本後注所列二三打分大小因打致死故明無心文言全破全即具戒破即毀戒四五看病分貧富此據如法看死故非害心六中兩相苦治即有過因罸而死與病藥即不好心看反令增病疏四闕方便由未起故不制單心或得吉羅雖心緣殺以未動身尋悔故也或得輕重二蘭如十誦中病者多衣望死分得或厭患懈怠不看致死但結偷蘭以無方便故闕方便中三初約無犯明闕言未起者未至重緣也次約犯吉明闕即約重緣遠方便罪三約犯蘭明闕下引十誦以示犯相望衣過輕理得中蘭不看近殺應犯上蘭故標云輕重也無方便者反有方便即攝夷重疏闕第五緣未斷命如上七方便則具七蘭如十誦云殺人未死則狂發戒捨但結偷蘭闕命斷中指上七緣下引十誦略證初緣疏上明人趣非人畜生加害等同但罪輕為別耳指例中非畜二殺並五緣犯具闕同之疏第二非福田是恩養疏初制意者人非化生業寄胎報攬彼遺分用成己身兼復鞠育其恩深重理應敬養報恩植福今反瞋忿乃如逆害違背恩養過咎極深故制逆罪又增夷重餘非恩養降階非逆二非福是恩制意中初文先敘合敬若準俱舍人通四生今據多分故云非化遺分謂精氣也上明二恩一是成身二即鞠養備斯二種故云深重次明違反初明加害違下顯過言背恩者反上二種又增夷者害人罪也餘下簡異疏問今殺父母為知得逆為不知耶答漫心無簡若對父母心雖不知以稱本期何無逆罪如善見中初有羺羊在於樹下後欲加害心乃漫緣隨有父人鬼畜來替羊處以心漫故亦結逆等若對剋心不知無罪故伽論云非父母想若殺得出家不犯逆初問由諸論中所出各異故問決之答文初約漫心成犯謂不簡親疎心通害故若對下次約剋心不犯各引文證二段顯然論明戒障故約出家明之疏問父母出家成羅漢道若有殺者為得幾逆次問亦由教中單重不定故須詳審疏答如十誦中得一夷二逆又涅槃云一殺父王二殺須陀洹罪兼二重以斷父命恩養福田心懷二境二俱損故初答中先引經律以下次顯重意涅槃三十三云羅閱耆王頻婆娑羅其王太子名曰善見業因緣故生惡逆心閉父城外乃至遮斷衣食湯藥過七日已王命便終太子生悔大臣惡邪謂言無罪耆婆復言大王當知如是業者罪兼二重等頻婆娑羅已證初果故云須陀洹也若準觀經進成三果此據爾前故云初果耳又據成逆定約四果經通四聖與律不同疏如俱舍論殺父羅漢得一無間依止一故次答中俱舍名五逆為無間業義如下釋依止一者無別命故但據殺父止結一逆疏問如上涅槃如何通耶答為顯無間二因而成命既是一何得二罪直以逆名標此業重故言二逆其實無也會通中答文為二初示涅槃之意命下次顯無重之理然別造多逆則隨業別受準俱舍中皆次生熟涅槃中作一逆者則便具足受一罪若造二逆則二倍五逆具者罪亦五倍疏因斯明律結罪多少約緣業四位不同因明中上明夷逆雙結律中率多此例故寄此以明文約緣業二種俱互四句一一句中各有一多二位緣即事緣業指身口疏初業一緣異結多罪如二房咽食等謂妨難過量不乞殘宿惡觸總為緣也身口二業隨作隨咽得多罪也即結一罪者如謗假妄如盜掘地無別提罪相從究竟初句前明多罪先明緣異且舉房食房具四緣食容多犯鈔云一咽七罪非時不受殘宿內宿內煑自煑惡觸並隨有者言之身下明業一然上房食並是身業而云二業意令例通如謗清人又欲誑僧之類殺父羅漢此句所收即下次明一罪善見謗假妄成無別妄罪為盜掘地方便蘭罪若準五分掘地亦提疏二緣一業異結多罪者如一人前後加打隨打隨提亦結一罪如盜前後相假成也次句初多罪中一人是緣隨打是業亦下明一罪前境是緣前後盜業是但前方便終趣一果疏三緣業俱異結多罪者如前後殺盜人別罪異也亦結一罪者如尼八事前後成重第三句多罪中人命他物是緣隨作是業一罪中隨對男子是緣八事有別是業疏四緣業俱一結多罪者如發一語具口四過也亦結一罪此則竝易不勞出也第四句多罪者即多論云傳他此語向彼說以不實故是妄語作分離心故是兩舌非輭語故是惡口成論云綺語一種必不相離文中且舉具者言之三二亦爾一罪中各戒各犯故云竝異或作易亦通疏餘有約緣具闕竝可準前指略中令準前者亦具五緣一是父母二父母想三有殺心四興方便五命斷闕緣亦同尋上對之疏第三殺羅漢者末代所稀理何須舉然經律中多有逆相識知其事用為後習明覺開達終因此緣故略明之第三句中先示須出之意在事雖稀於教須識言後習者由今學知以為識種後遇勝緣夙智開發故云明覺等此緣即今所示疏言制意者是應供故名福田非懷育故非恩養欲明此人斷結成聖八輩僧寶第一福田慈濟物故俯從供養理須植因用收聖果反懷逆害損喪聖身自既失利障他弘福情過是重故制逆罪餘七輩僧道非究竟故感福微殺同凡罪自可聖行約業非輕制意中初示句欲下正敘初敘境勝合敬四果四向為八輩俯猶下也反下次明損害制罪自不加敬是失自利斷他勝田即失他利餘下簡去餘聖上四句正簡下二句釋疑上云同凡且據制罪凡聖位別業必重輕疏問如十輪經殺辟支佛不同羅漢者答以聲聞人因聲入道一能說法二能現通三令他得道益深利廣故結夷逆辟支不爾故殺同人如涅槃云緣覺之人志樂獨處若化眾生但現神通終日默然無所宣說不能說法令人得果以此文證福田狹故初問中彼明殺支佛不障戒今以斷證是同福田亦等故須問決答中先明聲聞具三能故重下明支佛不具故輕後引大經證闕二能然支佛有二一者出無佛世則名獨覺二者觀十二因緣得道則名緣覺如上所釋且據大途不妨緣覺善能化物自有聲聞不堪說法疏問殺下三果何不犯逆答惑未盡故福田不滿故善見云若殺白衣阿羅漢不得出家殺三果者不障出家次問立義引證文甚易解疏若爾犯四果尼可是障戒下三果犯不應障答殺望福田故逆不逆異犯尼事通凡聖壞淨境故轉難中汙尼障戒事實不同欲辨殺汙兩別故立此難但殺損福田故不通下位汙取境淨而不局聖人疏問若殺辟支不入逆者何故涅槃知殺有三蟻子畜生為下凡夫三果為中羅漢辟支菩薩為上答彼以約境分心故分三位不明逆夷輕重等相若不爾者即彼文云闡提不墮三種殺中可無罪耶約律中從境闡提人夷約經論闡提無性也三難中即據涅槃轉難初答經明佛及菩薩皆了知殺法故云知殺羅漢上準經有父母二字今此正問辟支故略之耳經文既以三乘同為上品則知緣覺罪無差降答中初出經意經分心業不揀夷逆準此若殺辟支雖非逆重由境尊勝業異常流若不下就經反質初引示經文梵云一闡提此云信不具不墮三殺者由殺無罪不入三品故經云譬如刈草掘地等無有罪報約下比對律制言無性者準經前明闡提無佛性據後決前此名隨他語一切有性名隨自語疏問若殺羅漢為知得逆為不知耶答俱舍云若於非聖而行殺害後臨殺時成羅漢者無無間業以於羅漢不起殺故若起漫心具緣諸相竝如前說四問可解答中先引論明剋心不成若下次約義立漫心成犯大同父母故並指前疏第四惡心出佛身血者疏垂降生善為世福田慈濟含識亦是恩養佛為法王四弘開化惠益群品其恩無外宜應敬養植福清心反加瞋忿興於逆害命不可斷但出身血損法身器其過尤深故制方便業當逆罪第四句制意中初科為二初示句佛下正敘初明恩深合敬四弘即上四等弘即訓大亦由普徧故得名耳恩無外者所被無遺故反下次顯過明制損法身器者多論云色身是法身所依故制方便者即偷蘭也佛不可殺義無究竟制輕業重相別可知疏然出身血其相是一心懷善惡同一業報耆域出血善心治病一劫色有而受樂報調達反此故入地獄恐濫善者故標惡心次科初明相濫同業報者此約時論並一劫故耆下次引緣釋耆域亦云耆婆善醫世尊足疾因針出血色有即梵天此明善心也調達以推山壓佛碎石傷佛指足生陷阿鼻此明惡心也恐下後示簡意疏問不知是佛不得逆者若供不知不應得福答供本漫心生福皆敬雖對佛身作樹神想以心通故佛邊得福若本剋心對佛神想則無福也問中準前合須先問約知不知或可承前羅漢義勢是同故直發此問答中亦約剋漫二心分之疏餘具緣等同前準說指具緣中亦同上五故不繁文疏就闕緣中有同有異闕初境緣四句俱同皆異境來替佛本故雙闕亦爾若闕想疑二句不同以佛正命必不斷故既明出血本結偷蘭境雖極尊約從人制境強方便故也闕緣中初總標闕下別釋初明同有二一境差同一人作佛想二非人佛想三畜四杌四句並蘭二示雙闕同若下次辨異闕想四句疑心十句此二初句前並犯夷今同蘭罪以下出異所以疏因即料簡五逆之義四門分之初列數顯相釋名輕重二定體狀初二懺不三約三業四明通塞疏初列數者父母羅漢出血壞僧為五也明五逆中初文可解疏顯相者要約親生膝下故恩養極也如世律中惡逆過者通祖父母世叔等親何況假父後母姑姨之屬則並非逆所以經律據二惟親二顯相中又二初簡定且約二逆餘同前敘或可餘三無濫不須辨相膝下者語出孝經謂孩幼之時也如下引俗示濫祖父母即父之父母世叔及伯即諸父也假父後母皆本非親同名為逆望上祖等此二又親故云何況姑姨非逆族姓異故所下結前簡意疏言釋名者何故名逆以違恩養福田極故亦違佛世兩王化故名之為逆如論所出云五無間謂常續有無間隔故釋名中初科逆有二義初違恩福父母違恩羅漢破僧違福出血兼二次違王化佛是法王世即人王二教齊禁犯則俱違華梵雖殊法律無異然於五中唯殺父母道俗同重餘三則別疏如成實云一趣果無間捨身生報故二受苦無間中無樂故三時無間定一劫故四命無間中不絕故五形無間如阿鼻相縱廣八萬由旬一人多人皆徧滿故不相障礙業不可思次科論即俱舍釋義猶通成論五義示相甚顯三意束之第一即間隔也二及三四謂間絕也第五即間缺也然形無間一多不礙凡情難信故云業不可思疏問三寶皆福田損佛破僧得論逆者何故不言破法逆耶初問三寶福田是同成逆則異故問釋之疏答謗法重故不入逆中如今五逆不入四重廣如智論及法華中答中初約業重釋如下舉例廣下指證智論云聲聞道作五逆受地獄一劫菩薩道破佛法此間劫盡復至他泥犁中受無量罪如是乃至徧於十方地獄等法華譬喻品後廣明謗經獲罪之相乃至云其人命終入阿鼻獄具足一劫劫盡更生如是展轉至無數劫從地獄出當墮畜生等疏有人言謗法重者謂大乘也對田論逆即壞法輪破法逆也次他解中初科又二初點前義對下示正解就小論逆指歸破僧則通三寶疏問若如此者何故毀呰修多羅但吉答前言逆者謂破滅故今言犯吉但毀呰耳次難中毀毗尼戒毀餘二藏皆同吉羅上云成逆義則相違答釋可解疏若但破僧不名為逆如破羯磨以損輕故若殺羅漢是損真僧以違福極故得逆也三中初約破僧反顯若單破僧既不成逆則顯逆業全由破法若下次引殺聖比例由殺羅漢亦望損彼真福田僧故成逆罪則知破僧一逆法在其中故不別標也疏次明重輕如前列者初輕後重故成論云破僧最大惡別離三寶故離僧壞佛毀法寶故又於佛所起嫉妬心違轉正法復惱大眾乃至三十界內禪誦不行故輕重中指前所列且據麤分細而明之中間三逆望前為重望後名輕所以害母重於父者以佛教中懷育恩多偏尊母故羅漢超凡必重父母出血極尊義過小聖下引成論獨證破僧文有二義初約壞滅損境明重又下次約起心違惱明重禪誦即諸觀法一化境中道行退失或復不進故云不行上約業理不論制教疏二定體狀初二及懺相定體中標列三科次云初二即明逆罪最初第二疏言體狀者如五逆名非佛所制違恩福故業理自重有夷蘭者是佛制也但約人相犯夷不論恩福不具得蘭從殺方便若論破僧應制極重以事不獨建通攝三人故也初科以業制相濫故須揀定初示業體五逆之罪但違業道古法常有故非佛制有下次定罪體即約制教初通示夷蘭二聚統收五罪三夷二蘭但下別釋又二初釋三夷得下釋二蘭破僧攝三人者舊引義鈔云破僧有三一王破二伴破三助破疏言無初者以逆犯相無略可違以外道殺父佛言滅擯可是違教餘如後說次科初約義以定以下舉事釋成文出受戒法中以凡開最初必違略教俗非稟略亦令擯之故知約行偏重隨作即成極業如後即破僧戒疏言可悔不者如大乘中開悔五逆若爾何故經中令王重罪微薄耶答罪無定也即如彼經有愧非有無慚非無或可本定故轉輕耳餘之三夷兩蘭皆可滅除學悔說故十誦九清淨人破僧偷蘭罪從僧懺文自驗矣三中初示懺業上二句判定可懺大乘即佛名方等通懺三世十惡五逆又鴦掘摩羅作五逆因值佛得滅等若下引難經即涅槃上據大乘立義故還引大乘為難闍王殺父阿鼻一劫佛令懺已於黑繩地獄七日受盡既但轉重令微則顯逆非可懺答中二意初引彼經有無不定約心明業雖悔復受理無所疑或下示次意既轉令輕明開成悔餘下次明懺制初判定學悔下引證初證懺夷律令學悔開懺不疑十下次證悔蘭邪正各五方成破僧真佛位別不入僧數故云九人邪徒破僧皆犯蘭罪今既邪正通名清淨故知開悔從僧懺者上品罪故疏三明業相者疏破僧是口業餘四是身業若互作者有語助成若論破僧身現不得必須言說用化前人能破是口不善業所破是不和合性業相中初科又二初明各造俱舍頌云此五無間中四身一語業三殺一誑語一殺生加行加行即方便若下次明互造上明口兼身四若論下次明身不兼口文中能所對明所無別體即是事理二種不和故指為性性即體也疏破僧瞋嫉心起餘四分通三性二中初明破僧調達見佛人天奉敬頻婆國王日給千車遂起嫉心結連闍王以謀害佛又於佛所乞請攝眾為佛所呵即懷瞋恨此明破僧局不善性餘下示餘四殺通三性四逆同之然本是不善性旁兼善無記故示分通也疏破僧雖口說言了未結罪要待前人忍方成其破輪也三中以餘口業吐詞即結破僧特異故別顯之出血不至果餘三同殺命斷成犯故不須論疏四明通塞者時處人分別通塞中三科料簡有則名通無者號塞疏佛在具五滅後惟三無法輪主故初中佛在俱通滅後三通二塞法輪雖在無主競化故二俱闕疏二言處者南洲具五東西俱三出血破僧須佛身故北洲俱無雜心云以命定無相殺故次科若論有無則三洲有北洲無若約具闕則南洲具東西闕下引心論引證北洲言命定者長含中修十善行生單越壽命千歲不壞不滅是故彼人壽命常定疏三言人者俗人及四眾唯四逆除破僧故比丘具五可知俱舍云北洲及餘道皆無無間業何況於餘界解云人道男女能作此業黃門等不許彼無戒因父母於其恩少由不具身分為增長故愛念少故又其於父母不起重慚羞故畜生鬼神道不許有無間業故若智明了如聰慧馬有五無間也三中初正明俗人無濫下眾未具無破僧理故但有四亦通伴助如後所明俱下引論初引論偈餘界即色無色天次引論解前簡人道別除黃門文列三義初無戒因者以具戒者方能具造黃門當體即戒障故次父母下明上恩疎增上謂身不具形報非勝故又下顯下敬薄故有殺者不成逆業然文中但明父母二逆餘不能作於義可知畜下簡餘趣文約愚智以明有無據論有者可對三逆豈有非畜而能破僧出血耶論無五字必是傳訛註佛在毗舍離為諸比丘說不淨觀疏就戒緣中說不淨觀行不得方戒緣中初標緣方即法也疏言不淨觀者如來立藥對治心病多貪不淨瞋以慈心癡不覺了陰界分別初對貪者故云不淨次科總明中初通示三種藥病陰即五陰界即十八界文略十二入配對三迷如前已示若對五停前二同此三愚癡多觀十二因緣四我慢多觀十八界此二可對第三五亂想多數出入息即當後觀初下別指今文疏如智論說具有五種疏一種子不淨攬父母形以為己有故偈云是身種不淨非餘妙寶物不由白淨生但從穢道出引示中初不淨中論云父母以妄想邪憶念風婬欲火故血髓膏流熱變成精宿行因緣識種子在赤白精中住是名身種偈中初句標示下三句釋成上句明當體不淨下二句生出不淨穢道即父母便利處也疏二依處不淨謂在生熟兩藏中間故偈云是身為臭穢不從華間生亦不從薝蔔又不出寶山第二依處亦名生處人有生熟二藏食在生藏猶未變動流入熟藏即成糞穢胎處于中故云不淨偈中初句標下三句簡非淨處以顯不淨薝蔔亦花而別舉者以花極好彼國所貴經論多引蓋此意也此翻黃花疏三當體不淨謂三十六物成身十二內外兩相各十二也故偈云地水火風質能變餘不淨傾海洗此身不能令香潔三當體者亦云自性三十六物論中備列總判為三而少不次今以義分髮毛爪齒薄皮厚皮筋肉骨髓血心此名成身十二如論云中有十二通於內外脾腎膽肝肺小膓大腸胃胞匹交切合作脬水府也肪音方膓脂也𦚻音珊胃脂也腦膜此內十二論云內有十二名性不淨屎尿垢汙淚涕涎唾膿黃白痰癊此外十二論云外有十二名相不淨偈中上句示體次句明流變餘不淨者總上諸物下二句顯示不淨疏四外相不淨者九孔常流俱不可用故偈言種種不淨物充滿於身中常流溢不止如漏囊盛物四中九孔眼耳鼻口及大小道偈中上二句明內穢下二句示外相疏五究竟不淨終歸死膖不可忍見故偈言審諦觀此身終歸必死處難御無反覆背恩如小兒第五論云身若投火則為灰若虫食則為屎在地則腐爛在水則膖脹偈中上半標示下半釋成時至莫留故云難御奄然長往故無反覆生存資養一旦捨故云背恩小兒相似法故註彼習定已厭患身命歎死勸死疏注云彼習定已厭患身故歎死勸死者以修乖方少於遣滯故習此觀封著不捨便滅其身此非有智三中初科智能遣滯有修無智即是乖方疏善見云佛是一切智人何因說觀乃令其死答深見往機曾作獵師多殺群鹿已墮地獄餘報出家若不說觀人殺生惱惡心無已由作此觀人殺生喜得生天上故無咎也乃至說已入靜室中五百人死同世不知知必制戒息世機故引示中如來大智鑒機授法藥病不差今此殺緣全乖上義論申佛意以決群疑相似差機實唯應病答中初敘知機獲益乃下明示現不知佛自明鑒示同凡人故云同世若不如此必生外謗故云息譏註難提比丘受雇殺人居士警怖疏言難提受雇者善見云是外道沙門也頭留少髮依比丘住拾殘食活雇殺中注稱比丘疏號沙門由此二名通邪正故留少髮者表異內眾亦著壞色衣一以覆身一置肩上問此戒犯緣為是何人答據下呵責乃斥相歎內眾比丘外道受雇非緣起也註佛知此事便說禪法疏言佛知此事便說禪法者數息觀也釋改觀中初科禪法亦即觀門故以觀釋但止心名禪照境為觀不淨數息並具二門而注文前後異者以不淨正取照境數息偏在止心故也疏所以改觀者前對多貪故說不淨思覺之人本非彼治故說數息或前觀色是麤今觀心是細也顯意中有二初約機宜對病加藥或下次就所觀以分麤細了色求心先麤後細自淺至深故宜改也疏就明數息如論廣之一數二隨三止四觀五還六淨並息亂法以漸調心示法中大小乘論並有觀法故今通指但云如論今依成論釋云數者名出入息從一至十數有三種若等十數為十若過若減並乖數法隨者心隨息出入止謂令心止住出入息也觀謂見息繫身如珠中縷還亦云轉謂轉身緣心令心現前淨謂離一切煩惱諸難心得清淨並下總結觀意註比丘修習並證上果因訶上過而制此戒疏言修獲上果者即聖無漏在凡之上也獲果中聖無漏者言通四聖疏問如來說法比丘依行深見不淨正是如說有何等過復見訶責答佛說不淨令厭苦本若欲修斷必識身因如何未斷集因即除苦本非唯果不可盡乃使迷因轉深故使修行非道大可訶也如經說身有苦不說厭離於身斯良證矣呵責中問中隨順無違反遭呵責義似非當故問決之答中為四初明教旨如何下顯過今亦有僧不知所以自投焚溺欲冀超昇苦因未除寧亡三有之報死而無悔實唯一勇之夫將謂永滅不生焉知此沒彼出固當勤修三學廣運四弘誦持方等大乘繫念諸佛嘉號冀龍花而得度指安養為所歸深厭死生善識因果欲除苦本其要在茲故使下明合呵如經下引證通標經者大小皆明不可別指遺教云此是應捨罪惡之物乃至云唯有智者得除滅等問五百已死誰當呵者答受行觀法讚勸必多論明五百且據已死為彼改觀即所呵者疏二就戒本中文有六句初句能犯過人二故自手者明是自業三人命所殺境界四持刀下明教他業是比丘下將人附罪入治擯相律若比丘故自手斷疏初句可解疏二自殺中而言故者除有悞者非犯法也次釋戒本第二句註所謂行殺也若自殺若教殺若遣使殺若往來使殺若重使殺若展轉便殺若求男子殺若教人求男子殺若求持刀人殺若教人求持刀人殺若身現相若口說若身口現相若教使歎若遣書若教遣書若坑陷若倚撥若與藥若安殺具及餘方便殺者是也疏注中廣列所行殺相相分為二初自殺有八一自殺二身相三口說四身口俱五坑陷六倚撥七與藥八安殺具就教他中有十一初遣使二往來使三重使四展轉使五求人六教求人七求持刀八教求持刀九遣書十教遣書十一遣使歎也釋注總分中不依文次以類括之疏言自殺者謂自行殺若身若杖隨死皆是自殺可解疏言教殺者或教人殺或但教人死之方便言遣使殺者指示所殺在其方所而往害也言往來使者受語往害至彼還來重復往者是也言重者隨續使人乃至百千害一人者言展轉使者初使往害彼使不去更使人往如是展轉乃至百千最後一人斷彼命者隨前而使皆同一重乃至上列往來重使皆例同犯餘有契要不同心不如意竝如前竪義中說下有四求皆教人相教人八種據文似九前總分中不列教殺則知注中此句通標下列別相耳展轉中乃至下決通前二例皆同犯遣使可知故不點之餘下指餘不同如前者即自作教人門中或能教者剋所使意異或時節早晚坐立乖契顛狂捨戒等教者不犯漫心無寄隨作皆犯下下略示四求求男子者謂欲得勇士往害於他持刀人者即旃陀羅輩兩是自求兩令人求並非自殺故云皆教人者疏言身現相者或令怖畏墜墮溝壑或示死相等言口現相者或以言說歎勸其死或以大聲恐喝令他死者即如世中有厭身者或投火墜巖或刀解繩縊不知教者合掌唱善或扶接登山或為辦繩具斯即教歎正符犯法身口俱現即此之流現相中身現二義初示可畏之容二作取死之狀口現亦二如文自分即下後釋俱現初舉現事決犯縊於計反扶接登山者助彼投巖也斯下結合文相教即扶接辦具對下身現歎即合掌唱善對下口現疏言教使歎者遣人語彼人令彼語所殺者生多眾罪不如早死之詞教歎中初示教相生下出其歎詞即戒本中惡活寧死二句耳疏言遣書者身現其相表於紙墨令用死者如多論中若優婆塞及以比丘知吉凶相令破異國隨得財命皆同殺盜重罪若作死書教使送彼使向親說使自得重遣者犯輕使自依死犯輕亦爾若作死經有人偷讀遺失拾得依經取死造者犯重言教遣書者自不親對遣人作書令彼受死無問自他若死俱重五分作書時字字蘭遣書中前明死書初示相言身現者謂書中所述也如下次引明若據論中未定遣書然吉凶之相容可書報故引釋之若下辨犯使向親說不以書示也及使自害並由能教心克乖本所期但得蘭罪故云犯輕若作下次明死經偷讀拾得死皆重者由本造時漫心無簡故教遣書中初明犯相五分下引示方便彼立進趣故約字論疏言坑陷者知人遊行必從此道故設坑穽令墮死也十誦云為人作坑人從死重非留死蘭為畜造坑畜死提人死吉若不定者隨人畜死重輕如律言倚撥者審知彼人倚撥其處便施刀杖彼依而死者言與藥者文事可解言安殺具者即如世中行刑之所比丘往看施其繩索令彼死者同重多云若為殺故造刀杖者吉羅往趣彼人步步輕蘭或著彼身命未斷重蘭殺具中坑陷又二初示相穽音靜亦坑也十誦下引釋初約三趣互論輕重即是小漫合有為非人作坑人畜死吉稀故不明下云不定乃約大漫隨犯可會倚撥者謂潛安殺具令彼觸動也安殺具者置辦器杖令彼自用即下決其世事多論下示其方便疏文言及餘方便者非謂如上所列而言相盡更餘方便律雖不載但依而死皆是重攝顯略中初文律不載者謂不盡也疏又欲遮惡比丘避於佛制如上網目所不攝者欲加殺害故又張網總而收之欲獲罪人實唯一目故俗云天網疎而不漏是也次科又張網者謂此一句統收多相猶如張網後必有犯止在一事猶如得魚故云一目下引俗證出老子道德經大也謂天道雖大不容於惡如網雖疎不漏於物疏問如汝所釋浪作分疎至如佛意何必如此答凡心度佛誠非擬議然佛立教自有比量如經比智用擬上位何以知然如律文中佛制比丘不得服用俗人外道衣服遂即方便更作餘相佛即訶言汝等癡人避我所制更作餘事自今已後一切俗人外道衣服竝不得著著者如法治據此明證豈非通約也問中欲引後量假設來難答中初二句承意然下正答西土論議其量有三一現量理義顯然二比量舉事相並如今引例三正教量三藏明文因明論云藉眾相而觀於義於所比義有正智生故名比量言比智者成論云知餘殘法思量比知名為比智又云未得真智以相比智經論皆說故通指如經何下引量即衣犍度文一切之意正符前釋律人命疏言人命者謂殺境也疏所言人者仁也仁者忍也俗中釋名大有意致亦可尋也謂人立志存育為先故云人仁也若但言人而人有無命者害非重罪故又重列言其人命也第三句釋人中初訓字俗下示所出釋名即劉熙撰彼云仁忍也好生惡殺善惡含忍也謂下釋義天陽之氣資始萬物人有推愛及物博施濟眾合天之道得人之正故云存育等若下明重言之意疏所言命者謂此身報假之維持終於一形壽所因本故謂命根以命持識令依住故如雜心中命根體者非色非心良由眾生往業所剋期在此形連持不絕故今死者氣雖斷絕隨有暖處識在其中即識住處為命根攝釋命中初科為三初釋名壽無別體即命短長以為人壽故云因本能持於識為壽之本故得名根如下示體以無形段復與識異故二非攝良下顯相先敘業感故下正示命相由煖識息三種相依故有煖處息識未捨生分未絕即為命矣疏然今殺者命根非色何由可殺識本無形殺亦不得故隨相說斷其依處命根不續識無所依故云殺也次科云依處者即色生也疏律經約相但言識者以命根相不可見聞依聖言說信而為有若論識者愚智齊知但殺前生無識能學即為死人也麤相易曉持犯不難隨機之義復現茲矣三中初牒問律經即律戒本如注所引以下釋通初明不約命根若下次明但言二識麤相等者正出戒經之意去難取要令物易解故云隨機註從初識至後識而斷其命疏言初識者謂初託陰止是凝滑不淨故經中說為迦羅之時也如五分云入胎四十九日名日似人過是以往乃名是人即五王經云受胎一七日如薄酪二七日如稠酪三七日如凝蘇四七日如肉團五七日五胞成就六七日已後六情開張初識中經即涅槃彼云肉身處胎歌羅邏時亦云迦羅此云薄酪智論云受胎七日赤白精和合時也次引五分似是兩分續引五王釋上似相五胞頭及手足也不云七七者即同上引名似人故疏言後識者即最終時在後一念為後也後識中云一念者即前所謂有煖處也疏所以言此二識者亦為遮惡比丘念也若殺人者可得重罪如胎分中迦羅邏者即既非人故不名犯所以張網通收初後若有胎人識所依止隨有損害無非極刑即如五分若人似人意亦可見四分下文墮胎等相出所以中先徵次釋初略示前用此義釋餘方便故云亦也若下委釋初敘彼避制所下結顯教意五分兩相皆重正為通收故云可見四分下文即調部云婦人他邊得身語大德言與我藥墮之比丘即呪藥與令其胎墮佛言波羅夷及按腹墮胎亦夷故云等也律持刀與人歎舉死快勸死咄男子用此惡活為寧死不生作如是心思惟種種方便歎譽死快勸死疏言持刀下此教殺相就分為二初持刀者教殺歎譽死者口業也第四句初科但分身口戒本難曉略為釋之文敘殺相先持刀與次乃口勸咄下出其勸詞欲警令悟故先咄之惡活者或現不淨或能造惡也作如是者指上歎相也種種方便者總收餘歎也疏問身口殺相律文非一以何義故獨舉口歎以入戒本答據論戒本不勞繁文但云殺人得重自應通攝然毗尼者以因緣求此殺戒緣由相歎故即以此緣入於戒本前後諸戒繁相並同問中躡前十九殺相以徵文局故云非一答中初正通來難前下決通餘戒律是比丘波羅夷疏是比丘下收入罪擯五六中罪擯二字別配二句註若作如上殺人方便不死偷蘭若殺非人若畜生有智解於人語若能變形方便殺者並偷蘭不死者突吉羅畜生不能變形若殺波逸提實人人想波羅夷非人想疑偷蘭四眾犯相如上不犯者擲刀杖瓦石誤著而死若營事作房誤墮木石而死若扶將病人入房往反一切無害心而死者是疏就注解中初當趣明輕相二非人下分異趣相釋注分文中準前亦應細分初犯不犯為二犯中又二比丘餘眾比丘中復二犯相及境想前又約趣如疏分之凡至辨相例須科約婬中委示餘使自求但舉一隅三隅須反疏就畜分二智變有勝加害犯偷蘭者以相同人心非重者何能害也如世鸚鵡鸜鵒人有教其語者殺未犯蘭此但為人所教未教本非其智故非重也又如狐狸虎豹諸獸旌異志怪諸傳記中變為人相往往非一律中舉龍為首不言餘者若知而害義依法科不知而害亦從律結竝如上解具緣所列釋畜中初句分經智愚兩判智下別釋智變分四初明犯意如下簡濫又下示相旌異記志怪錄並俗中紀述怪事之書律中以龍多能變化故偏舉之雖略餘者義可類同若下斷犯還約知論依法科者即結蘭罪不知從律如常犯提下文指略即前義中三趣門已說故云如上又闕緣後指非畜緣同罪輕重別故云具緣列也疏就不犯中文相極顯所以不犯者如文云一切無害也釋不犯文略示大意就注分二初擲物營事並是誤觸然此誤者由於他事全無害心不同前明錯誤之誤學者知之二扶往返即是無心律不共住律四大妄語戒疏第四大妄語戒疏次明口業所犯法行大妄語戒初標簡中前三身業身為業本並列於前口業依身故次于後兩業既異故先點之疏古來翻經約業顯相多云身口今時正譯審定名體不濫境心故以聲所從者並為語業故經云正語是也所以然者人之面門名之為口口是頑色但知吐納至於所損約從身攝論妄語四出雖在口必以聲相用分業道然其聲發豈止於口七處無壅方成語言餘且略之翻名中初示古翻漢魏秦晉已來所譯皆爾今下次明唐翻故云今時文有二段初顯今兩得語即業體則名體相符語對耳根故境心不濫下引經證古明三業並標為口及列八正乃云正語故還引八正證今得實所下次敘古兩失先明口所屬論下正陳失相語既從聲為耳所得口屬身色自為眼見則心境濫矣又依聲發語遂成業行口是頑色本非善惡則名體乖矣然下潛通外難恐謂聲出於口從具彰名義有何失而見指斥故此防之明非通攝七處者智論云如人欲語口中風入至觸響出響出之時觸七處退是名語言偈云風名憂陀那觸而上去是風七處觸項及齗齒肩舌咽及以𮌎是中語言生於此應辨語業體相音曲名句依止於聲即聲為體方彰古譯名義全乖此不委明故云且略疏所以語業具列有四妄語居首者由過數起順本惑業無始無明無非誑妄非有謂有諸例非一今既出家宜須體妄澄汱成淨反本即真如何不思重增欺負深可責也故在重初自餘罵讚輕故後列前後中初徵起由下釋通分二初敘妄重虗妄成惑依惑起業轉更不實故此妄語與二相順無明即惑誑妄即業非有等者示妄語相如後列相所稱多種故云非一今下彰過上明所應作不作汱名作汰音太淘洗也如下明不應作而作故下結合初句明妄重下顯餘輕重謂四夷之末初即四業之首或可重是大妄初即小妄由上文中大小通敘故也讚即兩舌綺語不相離故不別指疏然斯妄相人多弊之吐言一返追不可得故以義張識其非相四門敝之一能妄在凡非聖意二明凡妄語五種別三立妄為言兩分相四本誑令知不待信妄相標中一反謂忽相違也追不得者言其疾也即論語云駟不及舌列示四門初簡聖凡二簡輕重三簡虗實四簡知信疏初門中明能妄人在凡不在聖者疏由彼聖人有二種實語一者身證二者想心疏言身證者修道德滿證真斯極除斷虗偽妄則斯盡出觀陳說言必稱實義無欺負起誑妄過此身證也初門身證實中初敘身證修等四句即是四諦出觀下明實語據是心證然茲聖道非身不剋心道幽隱從相顯彰即律序云餘身證者經律皆言最後身得是也問出觀陳說即實得道將無犯邪答戒制未具不遮同意疏然彼聖人定前方便理觀事察自然聞彼異域奇相及出觀後如心陳告我入空慧定中見也餘人不解便生疑怪何有空慧得見奇相此則目連虗稱上法如僧祗律本皆有是事佛言實爾定不清淨是前方便謂言定體如斯事相想心實語想心實中且據四分調部目連入四空定以明其相分文為四初示想心將欲入定攝心正想忽見異事而非正定故云方便理觀即空慧事察即方便及下次引目連自述律云目連告諸比丘我入空慧定聞伊羅婆尼象入難陀池水聲律文廣列多種須者尋之餘下三引比丘疑怪既見是相則非空慧僧祇同此故下指之十誦亦然佛下四引佛決疑識慧處無所有慧處非非想慧處亦如是下二句結示問如見而說何但想實答定前方便彼謂定體則同妄語但由不識作正定想故無犯耳疏問若如上引二種實者舉彼大聖亦有二不答如來照境斯盡但唯身證實語所以然者聲聞了境有礙二者劣用不同入則徹於視聽出則如凡聞見有此義故便有想心實語佛則不爾反前可知故淨名云常在三昧悉見佛國又無量義經云永斷夢妄思想念故無想心實語問中由前二語但約小聖欲明極聖與彼異故答中初標異智度大海唯佛窮底證理斯極如理而說故無異想所以下徵釋初敘小聖有想言有礙者即下出同凡故言劣用者即下入出不等故由證偏空智非圓極但除麤惑猶有事迷故也佛下次明如來無想言反前者照境無礙出入同等下文引證初證同等彼經諸梵志問云世孰有天眼維摩答言佛世尊常在三昧禪志不虧悉見諸佛國不自稱說等又下證無礙良以想心所起由不了境佛既通達無礙豈有想乎文引諸菩薩讚佛偈具云大哉大悟大聖主此句總讚三身已下別讚三身無垢無染無所著法身天人象馬調御師道風德香熏一切應身智恬情怕慮凝靜意滅識亡心亦寂永斷夢妄思想念無復諸大陰界入報身妄無實故喻之如夢思想即念疏由彼下凡無彼聖人二種實語發言欺誑令他虗解故成妄過在凡中正明可解疏問凡夫身心亦有事中身證實語如向人說身證苦樂不妨迷忘違境而說想心實語律不結犯與彼聖人想實何異答雖有非犯然非理解緣念之想由未斷本偽妄之心後時違心背想而說還成妄語有斯別故不同聖也問中先敘身證簡聖理解故云事中不下正難想心上標身證理事自分至論迷想聖凡同事既容通濫義必須分律不結者大妄則開上慢小妄唯結違想答中初示異聖智達理知心虗妄而起緣念故名理解之想凡情計實故不同之由下推異所以良由下凡本妄未除雖復開迷後容違想不同上聖結惑已亡雖或想乖必無虗妄故也疏次明凡夫妄語隨緣無量以罪定名不出五位謂波羅夷僧殘偷蘭波逸提突吉羅也次明五別疏就此五位約分為二疏夷蘭二妄同出世法成誑重者良以下凡於出世法未實交證假偷在己惑誑於人用謀名利損重過深故得極重即以斯語用誑非人損過稍輕故結蘭罪階降乃殊同非凡法前二中初標示良下釋成初敘誑人即下次誑非人此二語同境別故分輕重交猶會也稍少也階下總結疏餘三妄語同以世法用誑於人罪便異者良以瞋謗凡情易起實無三根橫搆虗狀以餘重罪誑僧見犯欲令治擯永處眾外情狀尤重故得僧殘又以二篇所犯之罪誑僧聞見謗相既輕故得提罪戲笑不實乖越威儀情過為微故得吉羅三階乃立無服世法餘三中初總示良下釋成初明大謗又下次釋小謗不約小妄為提者自可知故下明戲妄此三語異境同以明差別三下結示服字誤合作非疏上以義約大分凡聖今用教徵便有塗轍自有說凡而得重自有說聖而得輕次引教徵生起中便合作更途轍謂多別相也自有等者後引諸相並約此二隨文分之疏何者如十誦云我於那含果未得或言失者偷蘭若言有者重初文十誦彼因波離問佛大妄重輕乃至下文並佛所答那含未得者彼具列四果今文略之已下並約人問答以顯言相而多以乃至略其問辭言偷蘭者此謂說聖得輕也疏或言我今日不入世定前人言昨日云何答言亦爾不入蘭皆謂言近聖相故結蘭也次文色無色定名為世定不入犯者以言今不入則顯餘時入故文引犯輕彼又云若說禪法得夷此即說凡得重疏或云我是學前人問云何名學便言我是多聞利根禪誦慧解者犯偷蘭若言無漏學人者重三中輕重可解疏或言我是無學乃至答言懈怠不學說聖無學者重四中懈怠者彼亦結蘭言相濫故疏若言我無所有我無不活畏及大眾畏乃至答言我無衣鉢名無所有者蘭言無貪癡斷五畏者重五中無所有者濫空理故無不活等者濫聖德故聖人無五種畏文舉初後第二惡名畏三死畏上即畏不存活此謂畏其死至四惡趣畏答無衣鉢亦由言濫故結蘭罪答無貪等即僭聖德故結重也疏或言我是盡結使人我今是佛乃至答言過去無故所以結盡覺一切不善法名為佛者蘭言斷結使說名佛者重六中初標泛說乃下顯妄相初明犯輕言過去者從本已來無諸結故覺不善者佛名覺者心能覺了即是佛故言下結重可解疏伽云我是佛者我是天人師者並偷蘭以人不信故若云我於四沙門果退者夷所言有涉也伽論稱佛二號人不信者以無濫故此即決上犯重之文下稱四果退亦重者既言我退則顯己得故也疏多論若言不淨觀等乃是凡法亦得重罪多論不淨者五停之一論云是甘露初門一切聖人由之入道故疏十誦云若人作書自云初果以書示人書云得果我實非得犯蘭十誦意託書誑以避口犯疏僧祇云若言某處皆非凡夫者越毗尼我亦在中者蘭以非定指故若言我亦得此法者犯重僧祇中三初得越者泛指他故次犯蘭者霑己分故三犯重者由的指也疏三明聖法起妄必以心境俱差凡法明妄但以心虗不問境之虗實者兩分相中總標分二即前五種論犯兩別疏凡論妄語四句分之初心境俱虗二心境俱實三心虗境實四境虗心實即以分之初句犯夷第二犯墮第三境實不名為犯以心虗故今解不爾如後小妄違想而說即犯墮也第四句者增上慢也由心實故開前大妄由境虗故開後得道聖法中前列四句即下舉事配釋初句正犯此戒第二墮者即實得道向未具說第三上引他解下示今解即準小妄為例言境實者若實證聖豈有心虗然有下凡得不淨觀或感天供想心謂非違心而說可例小妄而結重夷據此論犯不必俱虗第四如文自顯開後得道謂不犯提也疏後以世法誑者以境雖是事通於內外加謗得殘自三根為內他三根為外亦可意有見想為內見聞覺知為外皆非聖法不據前境但使心虗皆成妄語故文云彼人不清淨不見彼犯雖復著實不那心虗結殘可知凡法中初通標以下別釋有二前示二謗言境是事者對前聖法境通理故據論境事止合局外然今謗妄境通內外自三根者親見聞疑也他三根者從他傳也如後二謗注文所列亦可等者上解唯局二謗此義兼通謗妄言見想者謂內心虗起非實見聞也見聞等為外者根塵觸對也皆下總示成犯前雖實犯淨想而謗亦犯僧殘又如實見作不見想向人云見亦成提罪故下引證可解那字去呼疏四明妄語本欲誑人生信今結正時但言了結不待信者第四標中餘戒結正多取迷心妄戒獨異故須辨示疏如昔人解知麤信細云云何極斥古中義鈔引古云知麤信細止得從知後生信不得從信後生知故不待信更有難問今並不引故斥云云疏今言造業各有所由口造語業言了前知壞境既備何得待信以領達言竟欺負即了信疑兩緣壞後方起語造身業言了未壞故未結重餘如竪義立今中即首師解初通標口下正釋前明正造又二初明成犯分齊以下釋其所以上二句釋上壞備下二句釋不待信次明互造語造身者如教殺歎殺深河誑淺之類又身造語業事容混濫疑輕信重文中不出故指如前即三業門也疏就解戒本亦有四意疏所以約制者然則無漏聖道非凡所證由未得故冐假虗談自言己證惑亂群心欺負於世希招名利曀法罔時過中之甚故須極制牒釋制意中敘過有四初至已證明竊法過惑下即誑人過希下邪求過曀下滅法過冐覆也覆其所無妄云已有曀即昏暗罔謂誣罔過下總結問四戒敘意各自云重畢究初篇何戒最重答四戒皆重何有優降但各專一義互望為劣如淫障道之極餘三則輕盜則違惱殺損道器妄取罔時準上相比義亦可解疏二釋戒名者體乖實錄名之為妄過重欺深名之為大成業在口名之為語戒是能治之行故曰大妄語戒釋名中初科貼釋戒本疏如昔解云言非稱實名之為妄妄說聖德事超凡境故云過人法言過有二過凡至聖過欲至色以此二法同誑於人故曰妄說過人法戒引古中彼立戒名云妄說過人法戒故作此釋二義釋過上即據位如說初二果等下乃約界如說四禪四空等疏問何以但言過人法不云過天者答如多論解佛在人中結戒故人中有木叉多修善法入道勝天但云勝人已過天故又勝人以罪重天故無所論問答中多論三義釋之初約制戒釋多下次約人勝釋諸天著樂多不修善劣於人故但言過人又下三約比況釋謂過人已重何況過天理必可知故云無所論也疏三釋成犯緣具九一前境是人二作人想三誑境是虗四知已境虗五誑他心六說過人法七自言已證八言章明了九前人知解具緣中初後是境二五並心餘皆妄法疏四解闕緣疏若闕初緣小漫三句正剋四句異境來替相同前戒闕第二緣漫心想轉有三剋心轉想有四加王人想故漫心辨疑有六剋心辨疑有十雙闕二緣有四十作句並如上可解也闕第三緣境虗今謂實者全無罪容犯提吉如後得道戒闕第四緣知己虗即增慢者無罪闕第五緣有誑心今不作究竟意戲故吉羅闕第六緣說過人法今說人法如多論云自言持戒清淨婬欲不起不誦四含毗尼不坐禪非練若而言我誦我是竝偷蘭闕第七緣自言已證今不言自證或有功德歎三寶故或得吉羅我師是故或得偷蘭虗說他得以謀名利邪命活故闕第八緣言不辨了輕偷蘭闕第九緣前人不聞或不丁但偷蘭耳闕緣中初緣不明大漫若對杌木合有三句即杌作人想杌作非人想杌作畜想二中有三前明轉想漫心三句即約小漫一人作非人想二作畜生想三作杌木想剋心四句加張作王想次明疑心漫心有六者亦約小漫直疑有三一非人疑二畜生疑三杌木疑互疑亦三一為非為畜二為非為杌三為畜為杌剋心十句及下雙闕並同前戒闕第三中實得道戒向未具說提戲笑說吉闕六中說人法者據是小妄但虗稱功行即大妄闕緣故結蘭罪第七中初示闕義或下明闕相歎三寶者即說僧寶通聖賢故稱師吉者但虗稱美不為利故必謀名利同下犯蘭註佛在毗舍離時世穀貴乞食難得婆求河邊有安居者便共稱歎得上人法信心居士減分施之後往佛所因問訶責而制此戒疏就戒緣中初明穀貴遂行邪命者論語云君子固窮小人窮斯濫矣斯言有由以俗誡道鈍士所懷也戒緣中引論語者事相類故彼因孔子在陳絕粮子路問云君子亦有窮乎疏引彼答言君子處於困窮確然守志而不變故云固也小人當困則無所不為故云濫也斯下示引用之意律若比丘實無所知疏戒本七句初出能犯戒者二實無知者是妄語境也三自稱我得下正是犯過戒本也四彼於異時下制疑網也五除增上慢開心實也下二可知如上說也戒本標列中第四文明兩種自言恐疑自首不結正犯故科云制疑網也疏第一如上疏言實無所知於聖無漏由來無得可是虗耶故曰也註謂實無知見法疏注解實無知見者如僧祇云於四真諦名知諸通名見此二於身空無知見故曰也此是妄稱之境也次句釋注引僧祇者彼有四句一知而非見言我知苦集滅道二見而非知言我得天眼天耳他心神足宿命漏盡三亦見亦知知四諦見六通四非見非知今引第四故云此二等此下點示即上空無知見是為妄境律自稱言我得上人法疏三自稱我得上人法者是總舉也我已入聖者別示相也疏就前總舉言人法者謂成人之緣無越陰界故曰法也所言上者謂無漏信戒凡法之表故曰上也第三總舉文中成人緣者以陰界入各有別相和合名人今就別中取能成邊得名為法註自稱說有信戒施聞智慧辯才過人人法者人陰人界人入也上人法者諸法能出要成就也疏就注解中言自稱說有信者釋上行妄語者言也信謂理解不壞之信戒謂八正定道之戒施謂亡我之施聞謂道分無漏聞慧智慧謂思修壞正之智辯才謂四無礙辯非凡所得也此之六相唯聖所感在凡人上故曰上人法故注中初科前總示注意信下別釋言相初明信者準業疏云信有二種一事信此有退失二理信謂內凡分見真理善根堅固不可傾動故云不壞釋戒云八正者初果已去得無漏智故彰正名亦名聖道初三戒攝一正語除四邪命住正語中二正業除身一切邪業住清淨正身業中三正命除五種邪命住清淨正命定道者若得色無色定及初果已上得無漏道時身口任運離諸業非與定道同時故二並名共亦名為俱文云八正即八中前三定道即指二共並聖戒耳釋施云亡我者能施所施及中間物三皆不可得則心不望福求報名不住相施釋聞及智乃約聞思修三慧配之可見懷即思修正即聖道釋辯才云四辯者一義二法三辭四樂說四皆通達俱名無礙此下探取下注合釋上經疏人法者下列陰界入也古翻經者謂積聚是陰義撿諸字書無此訓故今世所翻改陰為蘊不可怪也如古改陰為眾可以通之釋人法定名中初牒示古下引釋古云積聚者語出雜心字書無訓點其非也今下即唐翻如下謂秦晉所翻多云五眾蘊眾二名並符聚義故俱舍云諸有為法和聚故是蘊義疏如論中說陰界一也論本成人但色心耳眾生迷執多不解悟故隨病設藥治之不須諍也秪恐誦藥而迷愈疾非聖意也次科總標中如論即成實陰界一者體不異也義必兼入文中語略論本下示同相眾生下明別相若準雜心凡有三義一約欲樂廣說界中者說入樂略說陰二約迷如下引者是三約根上根說陰中則說入下則說界雖開多別名別體同則無所諍秖恐下以世學者多誦少行說食數寶終成無益故此責之疏故彼文云迷於心者為說陰色相為一分心為四令知識想受三猶未成業若至行心三毒三善隨發成業則不可治故當常爾一心念除諸蓋斯成藥也對病之時並亡去矣病成方憶難可言也釋陰中三初明立法令下次顯分心開迷之意故下三勸對治既識四心知行成業乃達生因即窮苦本體三毒源息有漏業縛著可解出離有期矣常一心者即教藥也諸蓋即機病也一欲蓋貪也二恚蓋瞋也三睡眠四掉悔五疑此三癡也由此五種能覆真性故通名蓋對病竝亡者藥病俱除也若存於藥還成其病如船渡岸似指標月喻可曉也病成難言傷縱怠也任毒不治起行成業後覺叵追悠悠不覺生死長矣疏迷於色者為說入六塵五根俱是色意根不分非迷也次釋入中六根六塵相入名十二入故亦名為處然色名通莫辨體相故離根塵以開迷者疏通迷色心為說界分色為十一分心為七分至於藥治可例上也後釋界者就上意根更開六識為十八界界是別義體相各異故亦是因義相假成用故然法塵二界兼通色心故使經論開合不定或攝在心則色十心八或分為二則十色七心各兼少分今收於色故云十一至於下示上入界通須勸治良由根境和合起用造諸妄業遂受輪轉今既了達隨境制根然此諸根心為其主亦當常爾一心等界中加識對治亦爾故云例上也疏此之人法通凡及聖觀察識妄斯唯聖證謂我能觀此凡想倒不可信也總結中初明同異謂下破妄情疏就解上人法中戒慧非一名諸體唯缺有名出離此法外非餘法能名要順法治惑故曰成就也釋上人中云非一者指前六種缺有者缺猶破也下以治惑釋成就者聖果所剋由惑斷故律我已入聖智勝法疏二別解中我已入聖智勝法謂得生空之智故言聖智會正名聖由觀無我感於聖故又法空解達陰知無故曰勝法次別解者謂釋上所稱之相初總牒謂下別解上約人空解聖智又下次約法空釋勝法註自言有念在身若正憶念若堅持戒若有欲若不放逸若精進若得定若正受若有道若有修若有慧若有見若有得若有果疏就注解中此勝法之相耳疏有人依解廣竪義章動經他日意所異也舉宗以明持犯為正自餘隨律之經略知名相而已諸經論師自分宗體彼尚不解律刑此豈橫知他學縱有前聞亦不得述費時損日徒張無益自宗猶困於未聞況餘經論何由道盡可謂不識分量也須臾死去莫浪多事故今但釋其名也釋注斥世中初四句牒非顯異他日即多日也意異者疏主自謂也舉下明其異相初指宗斥濫縱下遮其舊習費下彰過自下結責未曉己宗強知他學劣識而欲博通蠡杯而酌大海故云不識分也須下誡勸故下標今疏言有念在身者即身念處也故律云有念能令人出離狎習親附乃至無復艱難而得自在也言正憶念者謂受心法也言堅持戒者八正道中語業命也言有欲者四如意足也言不放逸者五根力也言精進者四正勤也若得定者謂三空即空無相無作也若正受者四種一想正受初禪覺觀俱也二無想正受二禪無覺觀也三隨法正受三禪樂由隨也四心想正受四禪有無想外人計為滅心為除此計故言心想也言有道者律釋十一支道廣如舍利弗毗曇所說若修若慧若見即道分三慧也剋證在己為得遂因為果酬因為報無漏是果而非報攝略釋中初言身念即觀身不淨也下引律釋初句標觀功用繫念修學故云狎習乃至者彼續云修習增廣如調伏乘守護觀察善得平等已得決定方接下文遠離諸有故無艱難斷貪絕縛故得自在受心法者即觀受是苦觀心無常觀法無我并上即四念處八正正語正業正命此三屬戒正念正定正方便此三屬定正思惟正見此二屬慧今取前三即聖戒也四如意足一欲如意足二精進如意足三心如意足四思惟如意足亦名四神足五根力一信根二精進根三念根四定根五慧根五力體同但根取能生力從功用四正勤一未生惡令不生二已生惡令速滅三未生善令生起四已生善令增長三空即三解脫門無作亦名無願四正受即四禪天定初禪具五支一覺二觀三喜四樂五一心成論云散心數起名覺散心小微名觀今舉前二涅槃云內有覺觀外有火灾二禪具四支除覺觀二支加一內淨也大經云內有歡喜外有水灾三禪五支一捨二念三慧四樂五一心大經云內有喘息外有風灾四禪四支一不苦不樂二捨三念四一心此有九天第四名無想外道所居涅槃云四禪無過諸灾不及謂無三灾由內無患故十一支道者支即分義從一至十一總攝諸法皆能趣道律但有總名故指論釋彼十一支文甚廣今略引名數須者尋之一支道身念處二支道定慧三支道有覺觀定無覺觀定三空定四支道四念處四正勤四如意五支道五根五力六支道六念謂念佛法等七支道七覺支八支道八正道九支道九次第定十支道十一切八十一支道十一解脫入準法界次第名十一智三慧律自委釋修戒定慧解脫解脫知見慧法智比智等他心智見見四諦得天眼等此三並聖所證故云道分律我知是我見是疏文言我知是者釋上境虗知諦不妄也我見是者亦同也釋我知中前引僧祇知對四諦故云知諦見亦同者應云見通不妄註若言天龍鬼神來供養我若得不淨觀四禪四空定等疏注中云天龍來供戒本不引今所有文引受戒時舉重示相義不乖也釋注中初科戒本不引者指律廣解也今下指所出即受法說相中彼皆判重犯相是齊故云不乖疏問天龍來供凡尚感發有何罪故乃入聖中答相與聖通故齊一重又過常人之所有故問中由事非局聖疑其同重故答中兩意上約濫聖釋下約過凡釋疏下列不淨觀四禪四空例是凡法有誑俱重者多論答云是甘露初門一切聖人由之而入故言過人法也次禪觀中初牒問以疑凡法而得重故下引論答以決所疑甘露者味中最勝以喻出世無漏聖道入道之始必由五停不淨居首故云初門問前明有念在身即是觀身不淨四種正受亦即四禪今注復列何為答由此禪觀凡聖通修前約聖道此據凡論縱不稱聖但云得此亦在重例是以疏中判為凡法意可見也律彼於異時若問若不問欲自清淨故作是說我實不知不見言知言見疏文云彼於異時下明犯過者以後悔前相也疏問妄語之相戒有五位大妄大謗戒本所列自言引虗小妄小謗戒本不出者第四句明自言中問意謂謗妄不殊理當俱列而出沒不等必有深意疏如昔解云上二罪重有壞眾義須僧治罰故安自言餘過是輕故不安著也初解中言壞眾者以犯二篇坌污清眾必加治𢷤須取自言餘但壞行不必加治故不須著疏若爾須治初二篇罪俱是壞眾餘何不著答義應如問但為相隱難知非其自言無由可識故結集家取意集之重著輕略大覆小覆大妄小妄大謗小謗例如此也次難中意云二篇並是壞眾何獨三戒列之答中初正答來問言相隱者三皆語業語無形迹不同餘戒麤相彰顯故重下潛通來難以小妄等亦是相隱何不著耶故此通云輕者略耳大覆即尼八重之一戒本亦列自言僧戒雖無意彰律本重者皆著故隨引之疏又人解云自言有二若問自言通一切戒不問自言如戒本列初篇有者以緣有故列之後篇無者以緣無故不出如夢漏失當時有故即除婬亦應開當時無故不列在律下文開之如是準知上已解竟可細尋取豈非緣也次解中分四初示二種通塞問自言者如諸戒緣如來並先審實後方制戒故云通一切也初下立義如夢下舉例下文開者即律調部比丘睡中為女就婬佛判不犯是也如是下結指上已解者即殺戒云毗尼以因緣求乃至云前後諸戒繁相並同等疏問若如此者文列若問自言列來何為解云類通諸戒俱不須列為除疑故相與列之若不彰者見有不問自言謂不須問自言也故相對出餘戒無不問自言故問自言無對故不出大有理也難中意謂不問自言可從緣說問自言者既通一切何須列之釋中初正答三戒須列之意餘下點示諸戒不列所以大有理者疏家結歎疏彼於異時者犯罪發露前後經夏故言異時牒解中初文即婆裘河邊諸比丘夏初妄語安居竟往佛所方乃自陳故云經夏疏若問不問者當時如來以世疑問汝有實不懼犯過故遂自陳首我行妄聖即不問自言也次科初句總牒當下別釋初敘問諸比丘至佛所自述稱聖遂招利養佛問如疏知而故問示同常人故同世疑懼下次釋不問疏欲自清淨故作是說者見世行惡詣官首露便原六罪佛法不爾業結在前吐言招惡成因已竟苦果難除三中世禮約刑佛法論業不可類同原謂取其本情而赦罪也註意欲以後悔前用實轉虗由口造業言了結重疏注中解取意可通也點注中以前後注文並引律解此取相傳故特點示律除增上慢疏除增上慢者無漏正道出過相有名為增上然於增上之法未得謂得名之為慢第五句正釋中初釋增上即目聖道然下釋慢謂不進求疏十誦云久在山林不覩妙色暫伏煩惱自謂永無故生慢告後近城傍見色起染知己是凡更加精進果成羅漢佛言犯吉障道緣中妙即好也境虗心實但乖言議故得吉罪既已證聖那言障道此據罪體能障為言聖人但不結業非無違制義須悔除如擯阿難結集之時受責悔過之例若據本律則不結罪註比丘慢心自謂得道後勤精進證增上果生疑白佛便言增上慢人為不犯疏注中文相可解云生疑者解言準境虗邊應犯正罪然我心迷無有情過故於持犯不能自決佛判非犯止為心迷注中初句總指云下別釋初敘疑情即於心境疑犯非犯下二句明佛斷律是比丘波羅夷疏是比丘下引人入法也第六文中引人即比丘入法即罪名註若作是虗而向人說前人知者波羅夷不知者偷蘭若遣手印若遣使若書若作知相若知者其犯亦爾若於不能變形畜生向說得突吉羅下四眾如前說不犯者增上慢人若業報得若不言我得或戲笑說疾說屏說欲說此錯說彼是也疏初自作輕重中若遣書印者西域人指並貫環印見相知心義應假語注文科約同前但無境想句明犯中初科雖示印相亦有語助故云假語疏言作相者現身口威儀令異凡度也次科作相即身造口業注中作下有知字謂現相示有所知也疏於不變畜向說何益者以出家人言行相守何得自輕妄稱不實也三中云不變者以對能變得蘭故初難結犯畜既無知何意須誑以下敘其犯意疏就不犯中若業報得者今有見鬼徹聽非是修得恐同聖故如世俗通呪通術通幻通藥通報通如鳥飛空報通也人雖不得亦不怪彼不犯中初科通力有二聖人修得則具六通凡夫報得但無漏盡初正示恐同聖者顯注簡也恐世有者疑謂犯重故須出之如下引類文列五種上四靈妙莫測下一去來無礙故並名通如下別示報通出不犯意人見飛鳥既不驚怪則知報得不足動人疏戲笑已下以輕遮重非謂全持如上制戒明違順也次科由制犯吉故云以輕遮重如上即初戒教所詮中彼云順不犯法成違聖制意是也雖合開文然非佛意律不共住律諸大德我已說四波羅夷法若比丘犯一一波羅夷法不得與諸比丘共住如前後亦如是是比丘得波羅夷不應共住今問諸大德是中清淨不三說律諸大德是中清淨默然故是事如是持疏上明四相釋標章門眾已委知又除疑執故又結也疏就結章門又分為三初有一句告眾情也若比丘犯下除疑執也今問諸大德下欲說後篇又靜眾也疏就初又二諸大德者舉人歎德動神府也已說四波羅夷法者正結章門也標釋結中罪四不別共為一章文分為三也結章告情中初正釋神府即是心識也標下通示總別開合之意疏次除疑中分二疏初云若比丘犯一一法乃至不得共住如前者釋同住疑也時人疑意但言犯者不共住不知何等不共住故今解云未犯已前以人淨故得於二種法中同住今既一犯不得如昔同法共住故言不得共住如前也次科今解中初文又二初標示時下敘疑故今下正釋二種法者一說戒二羯磨疏二後亦如是者釋重疑也時人意謂初犯斬首有戒可破後雖犯過謂非有罪故今釋言後犯亦爾不預前共住之例故曰不應共住也次疑中初標示時下出疑意故下釋通不預前者謂未犯時疏有人言白衣沙彌不足僧數一犯已後如前無異故言不得共住如前疑無重犯故云後亦如是他解中大同上解唯如前義別謂犯重非數與本未具無異故云如前疏問此律重犯隨作不輕何故僧祇學悔人犯止但吉羅亦應驅出者答義同文異也律中犯重有行悔者猶在僧中說戒自恣異於沙彌故同夷罪如打犯重還結波逸提僧祇輕者就不足為言故十誦云與學悔沙彌尼安居中犯僧殘聽比丘受日與摩那埵若學悔沙彌行婬盜殺妄還得波羅夷問異部中四分僧祇重不重別計非相比欲顯二宗之意故此問之答中初句通示學悔預眾而不足數彼此皆爾故曰義同重犯結罪夷吉重輕故云文異律下別釋初明本部重結別下眾故引例可知次釋僧祇犯輕簡堪足故下引十誦示之先明不重唯約初篇僧殘已下例有重犯若下次顯初篇亦有重義謂同名之罪有重犯如前婬後殺等同種之罪不重犯如前盜後復盜等疏問初篇二篇同壞眾一假僧治罸何故初篇著後亦如是二篇則無意有何義答初篇斷頭之罪疑謂一犯後不重科須安後亦殘是有餘無疑不著次問中欲顯重犯之疑唯局初篇故約二篇相比為問答中可解疏若爾初既重犯不應斷頭既喻斷頭亦無重犯答斷頭據果為譬重犯據戒猶存難中重犯斷頭二義相奪不可齊立故引為難答中以各從一義故不相妨
