body:
  text: 疏就釋戒本四種分別一釋名二定句多少三決通諸戒四配人犯相次釋戒本疏言釋名者何謂戒本由犯制戒戒為緣本也又約緣雖制文略未顯更以辨相廣張行體略為廣本又云即是半月說之所本所以文云欲說戒者當如是說餘同前卷釋名中初標問由下釋通有三初約緣起釋又下次約廣解釋律敘緣起發後制戒後列廣相釋前戒文故約前後以彰本義即前五義中教本一義又云下三約說戒釋欲近取證故重舉耳道行聽三前已廣故略指之疏二定句張縮為二疏若依佛解分為九句初若比丘總舉受隨也二共比丘者離明受也三同戒者別明隨也四不還者體淨不捨也五戒羸者體微生厭也六不淨者明業過也七畜生者列犯境也八波羅夷者結罪名也九不共住者治罸法也定句中初張分九句疏二以義縮但有二意初之五句合之為一成比丘體有犯重義下之四句託緣分相若立略本四句收盡一是犯人二所託相三犯法成四結罪目次義縮有二初縮為二言託緣者即上過境言分相者即上罪治若下次收為四初即總上五句二即第七犯境三即第六過業四即收前八九前後諸戒句數雖多不出此四故云略本上明張縮止就當戒更立此四該通一切疏三決通諸戒者疏初句比丘義該八篇文局上六眾學七滅單列持相然非比丘無由可犯故律眾學廣解辨相明比丘義但結集翻譯不欲繁文故略不出可以知也決通中初句分二前總示通局眾學下別顯後二上二句示文無次二句顯義有故下準律廣解可驗文略故知西土梵本必具疏第二第三共同兩句釋成得戒之人成初比丘之義通局雖別義該八篇文局初戒四五兩句文義俱同次四句中前釋二三云通局者通謂初句總舉受隨局則二三各明受隨兼前釋後意顯通該次釋四五亦是文局義通故指同也疏昔解云此戒愛染久習卒難捨離不障初果故開捨染殺盜不爾違損事大不開捨也斥古中初文彼謂唯婬開捨四五二句不通餘戒初果見惑已破思惑全在雖起貪欲非婦不婬故在僧中欲心設起則捨戒還家故有欲飽還來之事故云不障初果也疏今解不同強羸二捨義通諸戒文約婬法欲成極罪故須不捨之言如律云若犯波羅夷無覆開懺此則通也諸篇不明者略也正解中初二句明義通文下示文局如下舉例無覆開懺六聚皆然豈得滯文不通餘聚故知不爾疏又解此之四句並釋比丘具戒成犯初戒立法故有餘篇準式故無亦有道理智能解也他解中初示初有餘無於義可見亦下歎美所解於義可取疏六七兩句文義當戒所收六七正明業境戒戒不同故文義兩局疏八九二句義兼下篇文列初四以有微犯不應說戒則不同住同如棄者八九中初示通局以下示義通疏第四隨結疏約人明之無制戒時事義足者既無後犯一結便足若文不具生疑託緣則更開結或約一緣或至七八如為女說法及別眾等戒第四通明中初明制無頓足以機起不時故多重制既下明隨犯單重初明單結若下次明重結為女說法初制不得後開智男別眾戒初制不得次開病時施衣作衣道行船行大會沙門施等七緣凡七番再制文言七八且趣舉之尋戒本中無至八者疏今約初戒一人隨結配句屬當則有三位第一第六八九四句則屬本制邪舍故也第二至五戒微故立第七畜生心迷故有律中廣相故不敘之別明中初總舉一人隨結者謂因人則制此戒凡對三人前後異時則是各對一人耳文列三位屬當顯然指律廣相備見注文下疏自釋故不繁引律若比丘疏次就戒本疏若比丘者如善見云若者總名不屬一人隨有佛法具戒之徒皆持犯法故云若也如世律令條別顯諸犯者不一之謂也牒釋初句釋文中隨有佛法者此約處也具戒之徒即就人也犯法即指戒本依教守制故云持也如下舉俗律助顯註佛言若比丘者疏就注解中分三若比丘者標列釋由也名字已下總列眾名也是中者結定犯人也釋注總分中謂上三字是標下列釋之由耳註名字比丘相似比丘自稱比丘乞求比丘著割截衣比丘破結使比丘善來比丘受大戒白四如法成就得處所比丘疏言名字比丘者善見云此是總名通邪正及未具也如請比丘以設檀會沙彌未具入比丘數是名字比丘也又如涅槃雖未受十戒亦得受請故知通名列眾名中初文善見初示名通如下舉例又下引證疏言相似者如善見云謂犯重者內實破戒威儀相貌似持戒者其實破戒故名也疏言自稱者十誦云有賊住者剃髮披衣自言我是比丘也疏言乞求者如善見云既出家已隨須衣食如法行乞以四海為家居離於邪命故曰求乞四正釋中隨須行乞者示無盡法故四海為家無親疎故疏如大論云邪命者略說有五初求利養改常威儀詐現異相二自說於己所有功德三強占吉凶四高聲現威令人畏敬五說自得利激動令施非此邪心得利活命故曰正命如八正中次引示中五邪初是身業餘四口業身口現相心規他物故云邪命八正道中正命一種為離邪命故名正道餘皆可解疏著割截衣者有二利故一毀全相離自貪故二既碎雜不為王賊之所剝故常得資身有長道故疏破結使者修道進德惑盡解滿理解心明永無業惡即發具戒從緣而感故曰也疏言善來者道成初果親感至聖金言命之便得具戒故曰也疏受戒白四者即如今時感戒者也總論八種前五約名相後三據受體又三中前二唯局聖白四通凡聖又上二中破結局四果善來局初果所以無三語者或是趣舉故文略之或是但據聖凡三位或可凡中三語已廢故所不出註是中比丘者若受大戒白四如法成就得處所住比丘法中是比丘義也疏次解第三是中比丘者明此婬戒犯重比丘也疏有人云是中者總舉八種也若受大戒者別標定也前列八種或有名濫如沙彌外道雖名比丘不犯夷也或有相濫似割截等或時行濫如乞求破結等或言說濫如自稱也或時體濫如善來羯磨也上列諸位不必犯重或時少分或復全非皆非共比丘義所以結中偏牒第八釋成戒本若比丘也次科簡人中他解初文又三初點文前下釋總別所以行濫中乞求未必具戒破結據是體濫然有破結不發戒者如白衣羅漢之例上下結合少分如行體全非如名相等疏所以然者上八所列但明三受自餘五種相因而立若欲犯戒終約受體破結一受乃是無學善來初果聖無犯法皆不同也今約比丘學戒唯羯磨受是末代法故牒解之顯意中初簡非受破下次簡餘二受疏此中須引刪補羯磨末代戒緣具足五種廣分別說緣成得戒緣差不發既是大事無宜輕削囑援引中初指文五種者一能受人二所對境三發心乞戒四心境相當五事成究竟既下正勸結文疏次解結文疏若受大戒簡沙彌也白四如法者羯磨成就緣也言白四者簡非羯磨受者即如破結善來之徒也言如法者除七非法成前如相也得處所者僧數滿足結界成就緣也住比丘法者簡定俗人外道也或雖比丘心住無記病緣等障不守本性者則不住比丘法也是比丘義者則是戒本犯法犯行比丘義也牒釋中五節初約位簡二約法簡三約人界簡四約眾簡文中又二一對俗簡二約緣簡上四簡濫第五顯是律共比丘疏共比丘者明犯重也受戒法儀共餘比丘則無別也所以出者若所受體同可有犯重體或不同則無有犯故有此同釋諸疑網也次句中初文為二初正釋所下示出意註佛言若共餘比丘受大戒白四羯磨乃至住比丘法中者是謂共比丘義也疏注中若共餘比丘者謂釋迦一化現未兩時三天下內所有僧尼白四受者同有犯也若緣差互少一非受雖復犯過不名夷重以不共戒無戒可犯也釋注中初釋同義釋迦等者舉一佛所化簡餘佛故現未約竪論現即佛在未則滅後通於像末盡六萬年也三天下據橫說且就一往不被北洲故僧尼位別羯磨受同故通舉之若下次釋不同即本受不得者緣差互者且論能所能即受者身帶遮難無心乞受衣鉢不具等所對雖多然亦不出人法事處四法有乖準此而言本受緣非無犯明矣律同戒疏言同戒者佛所制戒隨行通行但受無隨亦無戒護故雖犯違法不同也第三句中初文依體起持故名隨行一化齊奉故曰通行無戒護者此謂受時不起持意納體不得亦非同戒如後問答註佛言我為諸弟子結此戒已寧死不犯是中共餘比丘一戒同戒等戒是名同戒義也疏注中釋之不過教行我為結戒教法同也寧死不犯行法同也今隨教行兩釋其相疏先就教者如佛制教數雖極多咸明止惡名為一戒對人共學名為同戒莫不數齊名為等戒如十誦云同入比丘學法者百歲比丘與初受者同初受戒者與百歲者同又同心同戒同說波羅提木叉故釋注中就教分二初釋止惡為一戒者戒雖無量止惡不異故對人為同者三乘俱稟故數齊名等者皆納具足故如下引證前明新舊同者標示同戒又下別舉三同釋成同相同心收見利二和同戒即戒和同說攝身口意三和疏次就行解隨體無殊名為一戒對人興治持義不異名為同戒齊防塵沙名為等戒就行中奉持萬別皆名隨行故為一也後二同前約行為別疏問斯之隨行據初受言後行乖願可非犯者問中指上所解並據初受行淨可有同義後乖有犯即不名同疏答此句來者釋成願行有感戒也前列共者明同受願也後列同者明同隨行也若受戒時且論受願無思學行則但虗願不感戒也答中初明立句本意若下次明二戒相須疏故涅槃云是人唯具作戒不具無作戒戒不具足如薩婆多無淳重心不發無作引證中經論二文並證初受無心持奉不發戒體不同無犯文據甚明疏故律明此恐人濫犯文列同戒願行相投白四受後犯非則重空願無行後雖行非無戒可違不入犯法也結意中初標示律意即指戒文也準知發體則有戒可違不發則無法可犯律若不還戒疏言不還戒者釋疑故也後戒羸者自生疑念前制犯重心樂道法有戒可違今我於佛生厭不樂為有戒在同前犯重為無有戒無重可犯故今佛釋若不樂者聽捨還家後欲修行得度得受第四釋文中初科上二句標示後下委釋初敘疑後戒羸者即欲犯過人戒力微劣也故下釋疑若據戒文但標不捨注中乃以捨戒反釋疏所以開者凡夫退位知何不為帶戒犯非業則難拔故開捨戒往來無障即是大聖善達機緣任物垂教號法王也次科初敘機劣內凡已上不羸不捨已前皆容有退故云退位即外凡也故下顯開意往謂開捨來謂再受善惡兩通故云無障即下結歎權巧王者得其自在於法自在故稱法王疏增一云僧伽摩比丘七反降魔後更受戒得成羅漢自今捨戒聽齊七反若過非法十誦云尼若捨戒轉為男者亦得出家三中初引比丘開限降魔不免破戒故先捨之極齊七反已外不開開中制也次引十誦明尼不開轉根方得反知不轉即障出家又伽論中尼捨再受即成賊住是也註佛言若有比丘不樂梵行聽捨戒還家復欲出家於佛法中修梵行者應度出家得受大戒云何不名捨戒若自顛狂心亂痛惱瘂聾又向如是人前及中邊人等互捨不成若戲若眠若無知人若自不語若前人不解並不成捨若言我捨佛捨法捨僧和尚戒律我受家法等是名捨戒也疏注中云何不名捨戒下分二初自顛狂下心境不了雖捨不成若言捨佛下對境彰成文相可解注文前段即敘佛開上科已示故從云何下分其文耳疏就捨戒中義分四門一汎列經論捨相不同二漸頓異三捨善已未四具捨緣疏言汎列者如雜心說若捨命終斷善二形生也善生經加受惡戒時捨善戒俱舍論八戒期心盡夜分終故捨且列如此捨戒中初科若準注文但明作法統括諸文則有六種故云汎列雜心四捨言若捨者即作法斷善即起邪見善生惡戒即惡律儀上五通五八十具俱舍期心唯局八戒義兼五戒言且列者示未盡故疏二漸頓者即作法捨中如律我作沙彌五戒等是漸也我作白衣外道等為頓也漸頓中初標簡如下列示隨有退墮漸頓並開疏三明捨善已未者問今捨戒者為捨已生隨行為因之業為捨初願本受無作體邪答已生為因不可捨也得聖無漏方傾善習今所捨者止是本體更不相續故雜心云言捨戒者戒身種類滅也三中初標科善謂隨中二持之行未捨之前所有持行名已生善後未修者名未生善今明捨戒為捨何者問中乃約行願兩審答文方見已未存亡答中初答因業不失結業在心行功不滅故不可捨及證初果無漏智力達罪福性漏業方傾習合作集謂集因也今下次明無作體失本體即無作不相續者失未生善也故下引證戒身即受體無作種類即相續善行二皆云滅證上可知疏四明具緣明捨有五四中戒假緣成還從緣謝受捨各五相反可尋疏初體是比丘住自性者初云住自性者即具本受體也疏二所對人境如多論云若無出家人隨得白衣外道相解者成二明所對開教從緩不必本眾疏三有捨心謂有欣猒心作捨心決定心住自性心久思心歡喜心自有心寂靜心反上八心則不成捨三中八心注云意欲在家念父母等又云不樂梵行猒比丘法即忻俗猒道作捨心謂欲棄捨也決定者非進退也住自性者自知是比丘非狂亂也久思者非朝夕也歡喜者無所悔也自有非他逼也寂靜者心專一也疏四心境相當如律中邊不領前人不解並不成捨四中指律即如注引疏五一說便成多云受捨相對理宜相準何故難易不同者答相違對故一求增上法如上高山多緣多力捨戒退道如高墜下故不須多二不生前惱若制緣多便言佛多緣惱受須多人捨何須也三受如入海採寶捨如失財王賊水火須臾蕩盡四受容預心捨對境情逼喜帶戒行非一語開成捨尚不依行況多緣也五中初標緣多下引示初引問受捨緣相難易可知且取作法受須白四捨唯一說答中初句通答善惡天別故云相違立法難易故云對也一下別顯四義相對初三約喻二約立教四就機宜律戒羸不自悔疏言戒羸者對前強不捨此明羸不捨也謂樂俗緣園田家業便於佛道生毀生惱持戒力劣名之為羸若犯則棄由體不捨對前強弱同戒解有戒成犯重也第五句釋文中初牒示強不捨者謂非愁憂思念也謂下釋相初釋羸義若下顯立所以註佛言云何戒羸不捨戒若有比丘常懷愁憂不樂梵行厭比丘法意欲在家便言我念父母婦兒親里村落城邑園田家業我欲捨佛乃至學事等是也若作是思我今捨戒是戒羸而捨也疏注解中前明戒羸不捨相若作是思下後明戒羸而捨相文中可解耳釋注中前明不捨正釋本文後明捨相反釋不捨律犯不淨行疏六明不淨行者正明戒本所防過也註佛言是婬欲法也男則二道女則三道若從道入道從道入非道從非道入道若限齊若盡入乃至入如毛頭者皆波羅夷疏下注解中約報分相文易見也道入非道前後境差也限齊以下釋行犯相生疑故也毛頭之相極微故犯何況餘者六中釋注有三初釋犯境男女是約報二道三道即分相次釋境差三釋限齊配注釋之律乃至共畜生疏七言乃至共畜生者舉犯境也多論云畜生是六道之邊偏舉下類以況上故云乃至也第七文中初點示多下引釋六道邊者彼云最在邊鄙故註佛言可得行婬處者是也有三種行婬人非人畜生趣復有五種婦童女二形黃門男子比丘婬心向前境三處二處初入便犯有隔亦犯若向睡眠若死未壞若多未壞於三處二處行婬初入便犯如是廣說若比丘為怨家將至前所強持令入三處二處始入覺樂犯不樂不犯有隔無隔亦同上若為怨家強捉比丘行不淨行覺樂不樂有隔無隔亦如上也疏注云所可行處者謂婬戒言畜舉可行者為言殺戒言畜據有命者成犯通塞相也釋注可行中初科舉戒對顯通塞通謂殺境塞謂淫境犯相各異故須簡之疏然趣有六位半兼善惡皆據心行三種善惡故善門明趣初天次人後修羅也惡門明趣地獄為初次鬼後畜也通明中初科上句通舉次句總攝三善三惡故云半兼皆下通示因相又二初攝六種歸於二門故下次就二門各分次第疏天以受福自然無貪所感修羅受福懷疑於見非正也地獄所受非貪多由貪故受苦丸漿之類是也餓鬼所以情惱蓋由瞋毒所興也畜生愚騃受形蓋是癡心所結大分次第不爽業緣也次科初歷示五趣天受福者示果相也無貪感者出因相也以行上品十善故文缺人趣下四因果臨文分對大途為言且據三品十善配三善道修羅下品心懷猶預故云非正三毒配三惡道如文自分地獄非貪謂所受苦事非可愛故大下總結本因觀此善惡無非心行故諸學者當好制心報應無差有逾影響自非大智熟能究之疏經中所明四惡趣者皆非受道之器故以脩羅屬之引經中通指諸經上以脩羅攝在善門有云四惡故引決之皆非等者出經意也屬之謂攝屬惡趣也疏注中有三種下明成犯相初列趣境二比丘婬心向前境下明自身造境也三為怨家將至下明非自心外難所逼也釋成犯相列趣可解疏初文又二前列三趣後五種下約趣明報也疏就中三種行婬即人非畜也疏所以律合三趣論開六道者離合中初問以六趣中人畜各位餘四或合通號非人故言論開者亦且通指今據智論云復次善惡故有六道善中有上中下故有三善道惡中有上中下故有三惡道也十善十惡各分三品疏論據善惡故分律據通用故合答中初文善惡即業報通用謂神通疏故律人畜不異由來解釋非人乃云鬼也若論此戒但說非人天等不列可非犯也然下律中天子阿修羅子餓鬼子地獄無文義是鬼攝此之四趣通用是齊故合為一非人趣也次科指律廣解上明人畜同諸經論故云不異由來下釋非人示其偏局若下點當戒義含然下引後文以證即同宿戒及受戒問難中彼云非人難者謂八部鬼神天子等如文所引而不出地獄故云無文義同餓鬼故攝鬼趣此下結成上文合之所以疏二復有五下明以五報分三離分三趣有十五種是所犯境也明報中五報離分三趣者謂以婦女形黃男子別歷人非人畜故有十五若開非人則有三十疏就自趣境初約覺境以明犯相二若向睡眠已下舉後三境以對覺境同成犯相自造中三境並不覺境對覺境者此戒四境齊犯又四境中上二生境下二死境疏就後怨逼復分二緣前明怨捉將向前境後明怨捉就身行犯怨逼中由開身合故約心論疏問所以自身造境但明侵境不問其心後怨家逼乃問樂者答適化無方意在無逸若俱禁者事難當行怨但逼身心唯佛制故開境合無樂不犯文相可解問詞躡前兩判欲彰開意答中初敘制必須開以大聖設教不定一端故曰無方禁即是制謂若唯一制不濟機緣故曰難常怨下明開中復制律是比丘波羅夷疏是比丘波羅夷者引人依法科也第八釋文中引人即是比丘法科即波羅夷註佛言譬如斷人頭不可復起比丘亦如是犯此法者不復成比丘故名也疏就注解中分二初釋罪名後方便欲行下釋成不相疏就初所以將罪以況斷頭者過之重也如俗極刑勿過大辟謂斬首也約刑制戒兩以通之故鈔引云如人有頭受諸塵也若不毀重能有見諦反此毀壞永不能見故以類也釋注罪名中初文前明舉喻所以如下引俗刑比釋準俗制道事義相類故云兩通故下引示即標宗篇引婆沙文人之頭首具納六塵戒法亦爾能通諸法故以比之故彼論云戒名為頭能見苦諦等色聞名身等義嗅覺意花嘗出離三菩提味覺禪定解脫等觸知色陰等法廣如鈔記委釋疏人又解云犯二篇罪可有上起若犯初篇如人頭斷不可復起縱有開懺障於地獄然於僧用則無成法故文云若作法已僧說戒時來與不來皆無犯矣他解中即以初二兩篇對顯喻意二篇有餘懺已復本如人被斫殘有咽喉初篇永弃眾不容受故如斷頭不可復活故下引律證成無用僧無別眾故云無犯註若方便欲行不淨成者波羅夷不成者偷蘭遮若教比丘行若作教者偷蘭遮不作突吉羅除比丘比丘尼餘眾相教作不作盡突吉羅若屍半壞若一切壞若骨間若地孔泥孔行不淨者並偷蘭若道作道想若疑若非道想並波羅夷若非道道想道疑並偷蘭遮比丘尼波羅夷式叉摩那沙彌沙彌尼突吉羅滅擯是謂為犯不犯者若睡眠無所覺知不受樂一切無有婬意不犯者最初未制戒癡狂心亂痛惱所纏疏二若方便行不淨下成犯相中文分為二初明成犯相後明不犯者開犯法也初人分二初明比丘犯相後明四眾犯相諸戒同爾下更不解就前分二前明自作教他成犯相二屍壞已下境想相對成犯相就前又二初自作明輕重二教比丘行下教作明輕重文可解耳犯相中總分凡四重初約法簡二就人分三心境不同四自他兩異一一對注分節文句疏問死屍半壞行染何罪答有二緣若唯重婬意入便偷蘭縱出不淨不犯僧殘若欲喜樂意者如十誦五分乃至骨間出不淨殘不出止蘭此是大婬戒不就僧殘結以不作出意故隨釋中初科問何罪者若據注中明結偷蘭由兼殘境欲分兩犯故發是問答中初句總示若下別釋又二初約心分相此下結示今犯疏就境想中前之三句本境為言後之兩句境差想也境想中分句前三皆重不開迷故後二並輕由境非故疏義門分之廣如事鈔今略出之疏初明制意若無境想不可定罪輕重義門中制意以心有是非境有錯誤婬酒前三句重後二句輕餘戒初句相應故重後四句乖差故輕疏二明有無者準律約戒不必具有今解無者是略也無別所以次門正釋中據律戒本二十六戒具出境想句餘並不出故須辨之疏有人云一切過境皆重則無境想如漏失者今解不然境雖通犯染起由心如律調部精出約心明有無想即輕重也故知無者但是略耳斥非中初引彼解以漏失戒內色外色水風空等皆是犯境隨境犯殘不須簡辨故無句法今下正斥初立理如下引據彼云非道想不疑殘則明漏失文略不出非理無也疏三定四五句者三中以律中列句四五不定且如初篇婬殺妄三戒並五句盜戒四句殺五句者一人作人想夷二人作人疑蘭三人非人想蘭四非人人想蘭五非人非人疑蘭盜四句者一有主有主想夷二有主有主疑蘭三無主有主想蘭四無主無主疑蘭餘如鈔記具引但由第三一句結罪有無故句法不定如殺戒人非人想轉想蘭本迷吉以作非人殺故盜戒無第三句者以有主無主想想轉亦蘭本迷無罪以無主物非罪緣故若準鈔中則約本迷轉想對明今此一門唯約本迷罪之有無於義易解疏若輕重相望境是可學生不可學迷同是五句如覆重謂輕等輕重中迷重為輕如人作非畜殺有主作非畜盜等皆緣罪境定有第三句故同五句覆重者即覆麤戒律出四句今約罪緣入五句中謂覆藏初二兩篇麤罪犯提迷夷作提迷殘謂吉覆則犯吉此雖本迷不妨結犯律中不出謂一向無罪而覆藏者疏若犯不犯相形則四則五謂前後俱迷非緣罪境即定四句除第三位如處分想無主想等迷雖是定而緣罪境即定五句如非道想非人想減五想等犯不犯中初標舉謂下別釋初明定四處分律出五句今望本迷無罪故入四中無主想者律無此句迷雖下次明定五此即總放輕重二位減五想者此謂盜戒若作無主則是四句若盜滿五迷為減五亦隨結犯故入五句如前或將本四入五如覆麤是或以本五為四如處分是意顯隨義不定不必依文疏四互四五者由是可學生不可學迷即互輕重疏或從四以至五如實無主體唯四句後轉為主即為五也四中初文從四至五者即約前心本迷後心轉入罪境故疏若緣罪境人非人想即五句也若本緣人轉想當杌約從後心則唯四句前心謂人偷蘭罪者屬於方便想差所攝次科亦合標云從五至四謂本是心境相當後轉緣非罪境故云轉想當杌即人作杌木想前心下簡前蘭罪疏五輕重者疏如文次第前疑重後疑輕以境是異輕本境故前想重結本方便心境相當故後想輕以正犯時有心無境五中初文前釋兩疑後釋兩想制教同罪心業重輕故分兩異前疑重下準鈔應云以本緣人人境不捨臨殺有半緣人心故後疑雙闕故輕後二想中有心無境者闕本境也疏又就本境中疑重想輕以疑半心不捨本境故重想則捨本從異故輕就後異境想重疑輕以想緣本但是境差故重以疑減半緣於異境故輕次科初明本境二句次明異境二句疑減半者以疑猶豫半涉是非是於異境復減半心故輕於想疏此判輕重據本重異輕為言若本輕異重例之即是如殺非畜人為異境可以例諸三中初立義如下顯相又如非道漏失道為異境等是也疏言不犯者疏先總解不犯相有五一作事無違說不犯如癡狂等二說犯為不犯如最初人違略起非無廣可犯三說不犯為不犯如律一切無婬意正念攝心故四開前禁後說不犯如怨逼想五當戒別開說不犯如文睡眠無覺故不犯中初科注列五種疏以五意從後倒釋初釋後二即是通緣後釋前三即是別緣第四即釋不受樂句開前謂許身合禁後謂制心樂疏又開大位難別通三次科總舉難別通者即上五開大分三位不樂無意命難故開睡眠不覺當戒別開最初癡狂諸篇通開疏初言難者命梵二也疏梵行難者夷殘二位也恐犯此故已下開之餘之三篇有不開者或是性惡或由事重或以重奪輕故不開之有開反前可以例也釋梵難中夷殘二位標行體也已下開者為護行也餘下簡辨所開有差別也文列三句初句簡性戒小妄毀兩殺打飲用之類下二句簡遮事重如掘壞背別非殘之類以重奪輕者如牙角針筒過量坐具等雖事是輕須加重制故有開反前者亦有三句或是遮惡如輒教尼同坐同行乘船等遮機過故或事是輕離衣奪衣餘語二敷兜羅綿等以輕遮重共女宿藏衣鉢非時入聚等為防婬盜故疏言命難者恐被奪命故不名犯婬開境合教制約心盜雖無文約義許有既不損境暫移後還不作永意何過之有殺妄兩戒罪成無改故並不開命難中上二篇中唯開婬戒初示難相婬下次簡四戒初準文開婬二約義通盜三明不開殺妄疏二別開者諸戒中各有別相故其開通類例不一如婬開睡盜開親等別開中初敘諸戒相別即就別緣各明開義故不一也如下略舉二戒盜開親者謂親厚意取又如殺開瓦石誤著妄開增慢戲笑等疏三通開者如文最初者約初作人有略可犯故言初也未制戒者舉時節也初犯無過何等之時未制廣前故不說犯言癡狂者以不憶識是比丘故此通諸戒通開中前釋最初開未制也次釋癡狂開無心也疏就前別開言睡眠者開怨來逼無所覺故不受樂者開前怨家將向前境禁無染故一切無有婬意者開身造境既無有心亦無境故覆釋中三種並約怨逼釋之言怨有二如王大臣惡賊持刀陵逼是名強怨若親里故二愛染纏擾名軟怨睡眠開者強軟俱開無樂無心唯開強逼雖無文判準理合然無心無境者雖與境合攝念當前必無染著故云無境律不共住疏九言不共住者治擯名也九中釋文云治擯名者若犯夷重滅擯永弃故不共住註佛言有二共住同一羯磨同一說戒不得於此二事中住故名不共住也疏注解中初列兩同後反釋之此律解中但明法不同住如十誦中財法兩種俱不同也釋注中初科上二句點注文同羯磨者眾法同也同說戒者自行同也持奉無瑕方應說戒故此下會釋本律二同並據法說法既加擯義不同財但無顯文故引十誦耳疏如多論中四解一既壞道法無所住用擯出眾外生天龍鬼神信敬心故二現佛法無愛無憎清淨者共住不淨者擯出眾故三為息外道誹謗故四為持戒者得安樂住增善根故又肅將來欲犯戒者生慚愧心不犯惡故次科論中四義求佛𢷤意初與四並生善益內外分之二表彰法勝三滅惡益若不除惡必遭外毀疏此戒是初故繁解釋自此說文多約略也顯繁意中上二句示當戒下二句點後諸戒律二大盜戒疏二明大盜戒盜戒對不滿五故云大盜疏前就內色起貪此就外財生染並由貪惑纏縛故犯形於次第敘次中初明約境分異並下次明就心是同故下正顯列次謂境異須分心同故並內重外輕故有前後內色即有情形謂相形比義疏就戒四意疏言制意者資財形命之本非此不濟人情保重戀著處深然出家之士理須捨己所珍以濟於物今反侵奪以自擁己自壞惱他過中之甚是以聖制意在於此釋制意中三初敘財境然下次顯過狀又二上明為道專崇兩利下明違行反成兩損捨已除貪是自利濟物成用即利他己所珍者謂內外兩財珍謂珍惜物即群生擁猶積也是下三結制意疏二釋戒名者疏問盜劫偷竊不與取等無非損財所以此戒標盜名者釋名問中通列四名以徵別標之意偷竊是一種疏答云文不可具且列一名初答可解疏有人言據俗大盜謂竊神器今言盜者對犯輕過非此戒收故言大盜但世賊盜義通不別次答初釋名前示俗名竊神器者謀篡國位也老子注云大寶之位是天下神明之器今下次顯今名輕過即盜四已下止得蘭吉不至夷重故標大字但下遮妨謂雖有多名皆歸盜義故云義通不別疏有人言非理損者為盜公白取者為劫畏主覺知為偷不與取者明主不捨後釋中初文非理取者因利求利侵虧於人公白謂強力直奪疏然則偷之與劫名局義乖不與取者雖是名通然於義中有非盜濫何者是邪四句分之初與取不是盜二與取而是盜如儉分食錯得二餅等三不與取是盜四不與取非盜如親友意暫用等是以眾名俱不標戒若舉盜者名通彼此損盜義盡又無非盜之濫故云盜也次科初簡餘三名上二句明偷劫名局謂公私不同義乖謂兩不相攝下明不與取名通義濫四句中初三可解故不顯相二約儉時食有限量錯得不還即成重盜若下正顯今名言名通者反前偷劫也由此盜名該彼偷劫故云通彼此也言無濫者反上不與取也疏戒者能治之行能所通舉故云盜戒釋戒中盜是所觀之境治謂能觀之智境智相合思修業成故名為行疏三具緣成犯者此戒五緣疏初是人物以盜餘趣不成重故具緣中初緣雖通三寶至於結重多從主掌是以初緣通云人物對簡非畜如後自分疏物雖人主及至盜損還須人想若生餘想疑謂別境則是輕犯非此戒收是以第二作人物想二中初躡前及下敘文明疑想即境想中二三兩句疏問想知二心有差別不答有同異也了境無疑曰知當境意謂為想俱能了境想與知同然知唯了境想通迷悟故與知異若以此心知是人物於下闕緣轉想不便謂實達境非迷忘故若謂人物想即順闕緣不乖律文境想互義問中或有立云知是人物故問決之答中初答知想差別上句通標了下分示俱下顯同異若下次明立緣是非前敘立知有濫意謂若具緣中標云知者則人謂後闕緣中轉想皆是明了之心故不可立若下次明立想順教以律但有想差不言知故互即差也疏想雖當境若盜輕物不成重罪故次第三明是重物疏財雖滿五若無盜心本自無咎故次第四明有盜心疏心雖起盜財未離處損主未就屬己不顯亦未成重故次第五明舉離處餘三可解總五為三初三是境二四是心五心境合疏問前後諸戒緣具方便今此盜緣無方便者答損財明盜便成重罪有盜成重不假方便恐涉濫故縱有方便亦俱不明但知未離已前並方便攝初問可見若準事鈔須具六緣五興方便今此除之故發是問答中初示成犯齊限有下次明避濫不出如互用三寶燒薶壞色寄借抵拒之類但使虧損即成盜業不必方便然非一向都無故云縱有不明等疏問經論明盜緣雖多少皆無重物者何答彼為成業受苦招生故無輕重如牛呞比丘但損一粟五百生償今雖遇聖口猶是牛律明持犯盜輕開悔得住盜五制重擯出故使法律軌儀其相在此次問中經論即通指化教緣多少者謂所盜之物多少不定不約滿五以定犯相欲彰教意故問示之答中有二初示化教但論心業故不簡境如下引緣以示梵云憍梵波提此云牛呞音詩爾雅注云食之已久復出嚼之亦云牛跡智論云昔作比丘摘他一穗穀觀其生熟五百生作牛償力今遇佛出家得道口有牛呞足有牛蹄之相律下次明制教須分重輕由有懺擯開制不同故須軌定化教不爾所以不分疏四闕緣者其相甚易列句辨犯講者通誦世相無幾時節可惜故不出也如其不解試為略舉闕緣中反具成闕故云甚易學者皆能故云通誦世下示不廣所以如下生下所出無幾謂非久也時可惜者恐虗度也疏若闕初境得三偷蘭初非人物替人物處作人想取二畜生物三無主物俱作人想望本人物不得境差方便蘭後之三物本自無心則非罪也如前義門可以通之此據小漫人物並取為言若據剋心王物替張亦同前判闕境還立如此識相舉一千從可謂達持犯者初緣中二前約小漫以大漫隨犯故非所論上二句總標初下別示三種異境替人物處而非本境故名闕境俱下示犯如下指廣即境差方便中此下次明剋心躡前以示同前判者張物不得境差方便蘭王物無心則無所犯對上小漫人趣無闕故云還立如下結歎疏闕第二緣據小漫者九句偷蘭謂轉想疑心雙闕各三故有九也亦不勞出恐未達者聊試舉之闕第二中即闕人想想疑境定心差雙闕心境俱差用此三種各歷三境故成九句亦下示意同前疏言轉想者疏初須人想可得同境臨欲取時乃作非人物想據後心時俱得吉羅然律但結前心之罪盜人方便故云人物非人物想取偷蘭此句既爾諸句諸戒例同此解後不言也轉想三中初句又三初明心轉須人想者示本想也心境相當故云同也臨欲等者明後心也據下次辨罪相此下三例通諸句即下八句諸戒指殺妄等若據殺戒亦列句數但不敘前後心相結罪之義故云不言耳疏二人物畜生物想疏三人物無主物想罪或有無若先知人物後作無主想則有前心罪若本作無主無心故無罪也三無主想罪有無者即約轉想本迷為言今此正明轉想旁示本迷疏二明疑心者初是人物對境生疑為人非人物為人畜生物為人無主物疏三明雙闕者初盜人物非人物替闕境緣也就非人物復生疑心為人物為非人物闕心緣也二畜物來替為闕為畜邪三無主物替為主無主邪並例準知如此處解餘戒不釋疑及雙闕同是疑心但前疑據境定雙闕約境轉耳作圖示之疏闕第三緣重物作輕想結前方便蘭闕第三中如取滿五意謂不滿疏闕第四緣有盜無盜心前心吉羅本無非罪四中有二初約先有後無前心吉者遠方便也下句次約始終無心如開緣中糞掃親厚等取也由前具緣不列方便故此闕中須分二種當知先有後無即闕方便始終無者正是闕心問前心犯吉那云闕心答望未動身猶非盜等故名闕心若爾至次方便轉入無心名闕心否答身色纔動盜業已彰但物未離未成根本是以擁住次近並名闕第五耳問前心後轉與闕想何異答闕想有心此據無心又前約動身後轉此約初心即轉如是思之疏闕第五緣未離處輕重二蘭隨相分別五中二蘭未與物交次方便也相交未離近方便也或次或近有阻不成擁在方便次近不定故令隨分註佛在羅閱城有檀尼迦在閑靜處草屋坐禪為人持去乃作全成瓦屋佛令打破便詐宣王教取彼要材為王臣人民訶責無使入村勿復安止比丘以過白佛因斯如上制戒疏就戒緣中初明盜緣二為王臣下訶犯之相緣中又二初作瓦屋打破盜戒遠緣二便詐宣教下正是所犯疏就遠緣中明靜居坐禪者欲顯盜相動心禪行尚爾況餘滯境其過彌繁世俗常言顧雍拜萬戶封家人不知葛亮受三郡賞庫無石貯斯豈道邪知足若此可以自勵戒緣中遠緣分二初示託緣之意滯境謂貪吝之人世下引俗誡道顧雍吳志云吳郡人孫權為王累遷官至尚書令封陽遂卿候還家而家人不知後聞乃驚此謂輕其勢祿也葛亮姓諸葛蜀志云瑯瑘陽都人事蜀先主後收江南以亮督零陵桂陽長沙三郡家無一石之粮此謂輕其財利也疏問瓦舍打破不犯罪邪答如見論解以損命妨道惡法相學故勅打破無損財咎問答中佛令阿難打破瓦屋恐疑損財有所犯故答中引論出彼三過示其可打復稟佛勅明非自為疏就犯相中言要材者僧祇云取飛梯二枚故取重財早覺急制為開教主豈是凡邪故彼律明後得無學說自慶頌欲得寂滅樂當習沙門法止財支身命如蛇鼠入穴又云衣食繫身命精麤隨眾得餘注可解次科僧祇初釋要財飛梯亦曰雲梯即相戰攻城之具是國家要用之物故云要財瓶沙王木坊中有五枚故言取二故下出故盜之意檀尼已證初果故云非凡此彰起教非實行故故彼下引證亦即僧祇彼云達貳伽耶梵言之異即作念言我作第一房上座次受駈我令出因分房故第二第三亦駈我出今注不出此緣後續作燒成瓦屋世尊復勅令壞及取王材作舍復見呵責徒自辛苦用多事為自今已後止此苦事依隨僧眾苦樂任時便習無事晝夜精進專修道業得諸禪定成就道果遂說三偈以自慶初偈如疏引初句標所期道果寂滅即是涅槃脫三界苦故云樂也次句示修因因即是行行依於教即三學八正是沙門法此上二句三偈並同各下二句有別並是成道之緣初即少欲行上句法說下句喻顯多欲多惱損害形命少欲無事資養安適蛇鼠入穴相似法故支持也即經云多求利故苦惱亦多少欲之人無求無欲則無此患是也第二下半明隨緣行身名有待必假資緣非別所懷繫命而已隨得隨受不擇美惡即經云於好於惡勿生增減趣得支身以除飢渴是也第三下半明知足行偈云一切知止足專修涅槃道上句謂隨於四事受用有餘下句謂心存聖道更無餘務此之三偈即是頌前長行初偈頌前止此苦事次偈頌前依隨眾僧後偈頌前專修道業又此三偈上二句並滅道二諦各下二句總明苦集二諦初是多欲苦二即多食苦三即無厭足苦三行對治如上所釋即知苦斷集修道證滅尊者道成無學說此自慶以示未悟故云欲得等疏就戒本中約文求相事在弘演諸律明盜其相極多後學未周何由總括然余所撰事鈔隨戒釋相文亦具矣恐本未見故略解之然則盜相難分要知足者可有評判自餘隨境何由通曉戒本中敘意為四初推講演諸下敘相繁未周謂未能徧覽諸部律論也然余下指廣生起然則下示難勸學隨境謂隨逐塵緣者律若比丘其義如上疏就戒句中文分為六初句能犯人在村若靜明盜物處不與者下明其心業王臣已下為俗法訶上三明其盜本不通諸戒下二罪擯如上解也律在村落註村有四種一者四周牆二者柵籬三者籬牆不周四者四周屋也疏言村靜處者遮惡比丘心出罪網也彼生疑意村中有主攝護是強靜處犯盜可亦制罪故今張網綱維廣布罪目但是有主以我心盜非理義立何得無𠎝故列空有二處用收罪人總釋二處中初科上三句牒文略示辟制造過即惡比丘心戒標二處即出罪網彼下委釋初敘惡比丘心故今下釋出罪網綱維並網上繩故列下結顯空即閑靜處有即村落疏村有四種假以事明必過於此理亦通攝據文約相五種圍之對五不周則有十種餘者不出例此二緣釋村中初示義通但取有物周圍不必此四故云必過等如僧祇渠溝壍等圍皆名聚落據下點文相言五種者一垣二墻三柵四籬五屋屋必有壁注中脫垣字置令妄解此五相中或容餘物閒接皆名不周則又為五注中第三且據墻有籬閒餘者準知或可五物二對參閒自有十種一垣墻二垣柵三垣籬四垣屋五墻柵六墻籬注即此句七墻屋八柵籬九柵屋十籬屋三對有六四對有三五對有一準上作之餘下指例言不出者即渠壍等二緣謂周不周也律若閑靜處註即村外靜地也處者若地中若地上處若乘若擔若空若架上若村若阿蘭若若田處若處所若船若水若私度關塞不輸稅若取他寄信物若取水若楊枝若園果草木若無足眾生若二足四足多足若同財業若共要若伺候若守護若邏道是名處也疏言閑靜處者注解村外也就文明處通村內外者總舉盜相之緣位也釋靜中村外謂齊聚落行來處已外蘭若地也疏就分為三初十三種明物處差別次取寄信物下八種明物體差別若同財業下五種明契要差別此之三位隨盜財物皆據有主以入盜科若無主者則不名犯今總明主後就文消別釋中總分為二前分三位今下次列二科明主疏計主物者於物自在集散皆得故曰主也大約以分不出三位總舉中初示主義集謂聚積散謂費用大下分主相疏初明三寶二盜別人三明非畜初明三寶疏謂知事者掌用此物罪福大深如大集中非聖非淨何能監護無有瘡疣三寶中初科上三句敘罪福二皆深者由境勝故如下準教簡人彼經云僧物難掌佛法無主我聽二種人掌三寶物一者阿羅漢二者須陀洹此二聖人復有二種一能淨持戒識知業報二畏後世業有諸慚愧及以悔心如是二人自無瘡疣此二清淨人瘡疣喻破戒惡業疏初盜三寶總而為言有守護者隨盜滿五皆是極重佛物無護如鼻柰邪斷施主故餘廣如鈔次文兩判初望護主佛下二斷施福並犯夷重鼻奈耶云若盜佛塔聲聞塔等幡蓋皆望斷施主福邊得棄捐不受即波羅夷若準鈔中佛無我所例非人結蘭今文不出故指如彼疏言佛物中有四差別疏初佛受用物者如堂宇衣服及以金石泥土曾為佛像之所受用者不得差互常擬供養生世大福故律云若是佛園坐具等者一切天人供養同塔事故所以不許者莫不即體法身之相表處是深不得輕故佛物中初科分三初示物相故下引律證所下徵所以法身無相隨物以彰故此諸物即法身體疏二屬佛物所以得轉者由本施主通擬佛用故得貨易不同前者曾為勝相故唯一定也二中初標示即錢寶人畜等物所下明開轉所以不下對前簡異疏三供養物以幡華等得貨易者事同屬佛可以義求三中物別轉易同上疏四獻佛物者開侍衛者用之義同佛家之所攝故如薩婆多有施法者法師說法誦經者亦取分故餘廣如鈔四中初標示物即飲食果實等次明用與初判屬侍人今時掌佛廟人義通道俗善見云佛前獻飯侍佛比丘食之白衣侍佛亦得食之如下引例論云若施法者分作二分一分與經法一分與誦經說法人謂彼雖施法而人獲分例今侍佛得食無疑古記問云若用常住僧食供佛通彼用否答法苑云後還入常住疏言盜法物亦有其四疏一法所受用者謂紙素竹木上書經像或箱函器襆曾經盛貯剋定永施不許改轉此則一定敬同聖教皆是滅理之所依持故有損益並望涅槃而生罪福法物中初文前出物體皆下示所以紙素函器止是世物但望所詮至真無價故疏有人無識燒毀破經我今火淨謂言得福此妄思度半偈捨身著在明典兩字除惑亦列正經何得焚除失事在福也次科前出謬見世中妄傳說偈得燒故經不見此疏焉知誤他此下次據文斥上引半偈捨身者一彰如來求法之勤二示如來重法三顯正法難聞下引經證兩字除惑顯佛法功深舉少況多其過彌甚儻畏來苦勿逐魔徒二緣並出涅槃經彼云佛告迦葉菩薩言過去之世佛日未出我於爾時住於雪山唯食諸果食已繫心思惟坐禪經無數歲不聞如來大乘經名修是苦行時釋提桓因自變其身作羅剎像下至雪山宣過去佛所說半偈云諸行無常是生滅法乃至聞此半偈心生警疑汝今幸可說竟此偈羅剎答言今我實為飢苦所逼實不能說我即問言汝食何物羅剎言惟人煖肉其所飲者唯人熱血我復語言且說半偈我聞偈已當以此身奉施供養羅剎即說半偈云生滅滅已寂滅為樂菩薩偏於石壁樹道書寫此偈已即上高樹投身樹下身未至地虗空之中出種種聲乃至阿迦尼吒爾時羅剎還復帝釋形即於空中接取菩薩安置平地云云又經云善男子若復有人不知如來甚深境界乃至輪轉生死增長諸結多受苦惱若有能知如來常住無有變易或聞常住二字若一經耳即生天上後解脫時乃能證知如來常住無變易等言事在福者如施主作橋井等事隨在福生緣壞則失名事在無作今燒故經其事亦爾疏餘之三相可以準前指餘三中前二轉易後與侍人並同前判
