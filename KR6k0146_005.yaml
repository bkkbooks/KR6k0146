body:
  text: 疏大門第二七聚重輕四門分之初明位立七聚并解聚義二明離分品位之意三解七聚得名不同四解諸罪隱顯之相疏初門位立者夷為第一殘為第二蘭為第三提為第四尼為第五吉為第六惡說第七並如律文增七中說第二門初科位立中且據一途以列律中或以偷蘭為五第六或云惡作疏有人講論作七聚義素不讀律以意出之總取諸篇方便以之為聚成究竟者以之為篇亦是一家唯識普決不可依也云何名聚衆罪非一號之為聚若如此釋五罪可爾偷蘭惡說聚在何處解義中初科為二初斥無稽講論論即是說謂諸傳律者或指他宗論師故言素不讀律等此有二失一者名局二者罪局律中七聚通攝本因不唯方便故亦下斥非唯識普決者即人造僞論如鈔序所列謂古所出同彼僞妄耳云何下次斥妄釋五罪在文容可指處偷蘭惡說不入戒本則非聚處故舉以攻之足彰虗謬疏今解云古人以戒本罪相文籍所收云聚一處今不存此以名義收但有罪相輕重不同或七或五統以收之隨名束罪用通篇聚若以名聚則止如文夏不依人犯墮罪者非戒本收應不篇攝乃至衆學如法治處其相無限故不同昔今但名收無罪不盡義可解今解為二初出古意今下次申正解又三初立義名義收者如舉吉名則總攝塵沙無邊輕罪餘皆例之或七或五者言七通本因言五唯果罪篇聚二名任稱無在若作此解通達無疑與彼昔義條然天別若下質非上二句牒非夏下引難特引戒本不攝之戒難彼局文理不可立故下結示疏二明離分品位之意即辨離分置七意者二明離分標云即辨者點上科語疏如昔解云語罪為言體唯不善理須就本置不善聚但以體含輕重業相莫分故不就體立一聚也古解中初文有二初敘須立一切業相不過善與不善制戒禁惡故云理須等但下明不立疏若爾身口造業用收衆罪惡作惡說應有二聚何以無者今解以此二業體含輕重相亦難分故不置也次科初敘難身口業別應須立二今下明不立即古師自釋疏是以隨義離分出於五聚五所不攝還復二位以二配五故有七聚生焉三中彼謂一切惡業不出二聚由相難分故離五聚謂夷殘蘭提提捨為五自餘罪相歸本二位足上成七上約從通派別故從一分二就二分七是知七祇是二二還歸一疏有人言如斯意言出何聖量若言造罪不出身口惡作惡說違略方有何得輒言離出於五若未制戒前身口通中便有惡作俗人所犯亦應入聚若制後別中有惡作者五年制淫未有吉羅無廣教故何得云離故知是難他難中初難為二初通斥若下二牒難初難後分五聚七聚並因違略而制是則七聚俱從略出那云五聚從二出耶若未下次難先有二聚五從二出二必在先故約二教兩以徵之初約略教難略是通制二聚別制豈得通中先容有別身口通者即目略教次約廣教難淫是制廣之始此時無吉明非先有制後別中者即是廣教疏有人解云未制廣前實無惡作懸借後制用擬前罪此亦不然七聚並在未來俱借齊妙何止身口二吉用以離分斥曲救中初出他義謂作說雖後用後擬前不妨前有則成上義此下正斥後既有七何獨借二於理亦乖疏如此云云並是古義今人行誦曾未思擇不敘謂言不知若知復無所以如世五塵不無受用若不述者顯相無由不可著也結示中初指古今下嗟時不下顯意如下舉類謂五塵雖過不述焉知古義雖非不敘寧辨此顯識非方能離過疏今正解云大聖立教為顯時心或立結業以收非或立名相以束罪隨其所通得解便止如陰界入隨迷故分可以例曉今解初科中初敘隨機不定結業謂十業七支名相即五篇七聚如下舉例一切諸法無出色心為迷心衆生說五陰分心為四對色為五又為迷色衆生說十二入分色為十一心但為二又為俱迷者說十八界復分上心為七例今篇聚七五離合並隨迷示如下三階疏罪雖叢聚一位三階定其輕重取究竟者莫不齊五故有五聚五犯五制五品五篇五部等是也定其來報年劫遠近者莫不齊六故有六犯聚六種犯是也定其果由因成自有因不感果者莫不齊七故有七犯聚七種制母論七篇等是也次科初二句總舉一位三階者如五篇罪通五六七而無有別唯偷蘭罪局下二階定下列示初階次牒六名者上三本律品是十誦篇即僧祇部乃了論第二階中二名如律如雜心論別對六天六獄偷蘭第三且據上品中下來報可對墮吉第三階中不感果者謂擁住方便也二名亦見本律母論名篇準知二名不局疏如斯位置意在淨行薳于軌反妄悠悠費時損業則無益也三中初總示教意薳下嗟古妄傳薳者草木叢雜貌注字疑是後加疏三明翻名得名者疏列名翻出不異前篇第三解名翻名中初文指前即餘五聚名義同篇故不重出疏偷蘭遮者善見云大障善道也能為上篇方便又是二逆罪根體是不善別示中初科二逆即出血破僧疏惡作惡說從具標目故母論云身名惡作口名惡說作義是長通名身口故律下文無問身口皆突吉羅善見解云即惡作者是也次科又二前明別分具即身口以吉羅無限分之令易故為七聚作義下次顯通含作通說局故云作義長也此就罪體鼓動不異故或為六聚律下文者即諸犍度疏言得名義者疏有人言聚雖有七得名有五初之二聚從法立名謂無餘有餘也第三偷蘭從過立名言障道也第四就惡果第五從對治六七從具也得名中初釋可解疏有人言聚雖有七得名有六波羅夷者名為極惡當體受名僧殘體境合目有殘之罪假僧除滅故也偷蘭障道為稱餘則還同前解次釋中夷從體者即僧祇云義當極惡是也僧殘從體境者僧是懺境殘即罪體偷蘭前約能障此據所障疏如律犬疏更有諍名廢立終非濟人神爽不常何得及之但如上解足為道分蹊徑也結告中初示廣終下顯略初句明無益次二句明難曉神爽即指諸師心見此謂他師情見各異故云不常無暇盡述故云何得及之但下指前已備蹊小徑也疏四解篇部隱顯相者疏問戒本立相如篇所明偷蘭惡說何為不敘四解隱顯即明戒本出沒之意辨蘭吉中敘問可解疏答斯出聖心非凡能決律中所列多云二百五十戒為行正宗故此戒本成斯大數至於餘罪不入戒本非余所解不可情求答中初明聖意難裁律下依文示數多云者諸律並同故至於下謙己讓他疏有人解云二百五十且以數求比丘感戒量周法界可不然也偷蘭一罪不在戒本者豈不以體相不倫因果難定故單抽出用在聚收所以前後通塞不定古解中初科前示數量偷下明不入所以體相約品位重輕因果即從生根本所下指證律中或列第三或在第五通謂三品皆名為戒並號威儀塞即上品是戒中下名威儀疏今就通論俱名為戒是故律云最初犯戒若就相說齊號威儀故云非威儀也又據輕重分之前之三聚過相粗著能治名戒偷蘭則在第三下四過輕能治之行名曰威儀釋成中初科前約通論又下次就別辨問偷蘭第三但攝上品餘二何收答中下隨重亦在第三約雜第五亦總三品但在前則上品為正在後則下品為主中品無位但隨上下故知在前戒分參有威儀在後威儀復雜戒分不入之意良由於此問前問二聚但答偷蘭惡說不入復有何意答據後問答吉羅體同文攝究竟自餘因罪故所不入疏若據均雜往分前四為均後三為雜偷蘭雜中之重故在第五次科均唯果本雜通本因問前明篇義五具三均今均雜中乃云四者答此義如後疏上來判約並據律中可以類解因解偷蘭非篇是聚有何義邪次非篇中初文上三句結前即指戒儀均雜二義並據律者即諸犍度增一等文列名前後也下三句生起問如上破古篇聚名局今云蘭罪非篇是聚者答彼據二名分定五七但破彼執隨稱無在下文皆云五篇七聚意亦如是疏今釋此義如上已論且以義約言位五者皆究竟罪莫不三均偷蘭不爾根本從生各有三品隨品三悔如鈔疏中故是聚攝次科正釋中初文指上即前三階且下示義疏若爾吉羅亦有因果二品兩懺體相不均何得名篇疏如昔解云且據當律或有小罪不從人悔吉羅重輕非本律故初難中昔解意謂本律吉罪皆是責心故云不從人也既無兩懺則成均義吉分輕重出明了論故云非本律也疏今解不然如律文云故作犯二罪誤作除非威儀二相歷然何得不有且如墮罪三十為重罪對僧除九十為輕別人自滅何為不疑同一篇攝吉羅亦爾重者對人陳過輕者心念自責相同無異故得篇收今解中初斥非律中故誤二心結犯單復不獨責心且下舉類墮分兩懺合作一篇吉羅同爾不足致疑疏問波逸提懺三悔不殊故同一篇吉羅不爾對獨兩異何得相比答僧別有殊三悔是一對獨乃異一說不差故也釋難中以墮吉悔別不合相例答中據事各異約說皆同疏問吉羅罪中既通方便如何在篇疏答簡究竟者以入篇中餘方便者入聚所攝次明通因難中問答可知若爾與前古師所立何異答古師篇局戒本文相聚中不通究竟今師不爾以名攝罪篇中吉羅通收作說果頭之罪聚分作說名含因果非獨攝因故與昔異所言方便入聚者謂此聚中通攝方便非謂純取方便一色疏問偷蘭罪中亦簡從生取究竟者用以入篇答不同也偷蘭究竟或均或雜或前或後難定其罪大約分三懺同墮位故入聚收如大疏中偷蘭滅擯大小衆悔廣有廢立無暇述之又非時世所行務也反難中蘭吉俱雜吉得入篇蘭亦應爾答文為二初正答以蘭果罪自分三品當局名均相收還雜前後如上吉羅究竟體無輕重故知不雜定在末篇故非前後言同墮者墮有三懺大衆小衆一人對首對蘭亦爾但蘭分三體互懺不成墮唯一品隨界三別故為異耳如下引證逆蘭滅擯餘通三悔故知體雜下文指廣可解疏二不定中舉處録罪罪唯疑似同篇聚收廢罪論處處非罪緣篇聚不攝二不定中處即屏露二處同篇聚者即所疑罪文列三二實通六聚疏七毗尼中用法殄諍諍通染淨持犯自明故此不論七滅諍中通染淨者謂所諍事憶念不癡是淨覓罪草覆為染若據下文不定生疑罪是吉羅七藥用差亦應同吉不定滅淨宜歸第五今云篇聚不攝此不論者未詳何意疏七佛略教廣前無罪制後犯者但是吉羅同聚收故何以知之初未制廣有犯過者最初犯戒戒是略教所制有罪心違三善況制廣後而無犯耶若不立犯略教不行廣何所補用略何為今則廣略俱陳明知兩犯不惑略教中初定犯何下二釋所以前舉初制以況三善即不貪不瞋不癡若下次約無用以質問此明犯者犯在何時有云隨犯廣制更兼犯略細尋諸部及悔法中都無此說未可準的意詳心違三善未落廣教隨七佛偈所詮行相有違即結學者宜更思之疏大門第三諸篇方便疏四分諸律但言方便不約篇聚位立多少今依明了論解律說罪有五部者三諸篇方便今家中初科前明諸部名通今下示今所用疏彼疏釋云此間為篇今依本義立名部也故知梵本各有所由翻經之家以意商度以篇譯之何事紜紜浪諍字也故彼解云何故名部有二義故一成就根本義二隨順根本義引疏解中初文分三初引疏標文言本義者即下二種根本故知下因斥古非以疏標五部顯是隨義為名不必三均獨得名篇紜紜雜亂之貌浪虗也故彼下引釋部義二種根本如後結合疏初之二篇立三方便下諸篇聚立二方便別配中初科所以多少者示現戒儀不同罪位輕重故疏故云第一波羅夷部有十六罪一一各有四部成十六罪次科總舉云一一者即指四戒言四部者因本各有部類故疏一者遠方便如行淫時先起欲心未動身口便止不作責心即滅遠方便責心者且依論出今須對首了論宗正量部大同空宗故結意犯若約有部未入犯科疏二者次方便動身就彼口陳欲作此對人滅通名吉羅次方便中初文言對人者此明動色業粗故重疏若準十誦多論此則初篇遠方便偷蘭名雖有異對人不殊也故彼文中初二兩篇各有遠近方便位分三階初篇近者界內僧懺初篇遠者二篇近者合為一階界外四人邊悔二篇遠者為第三階一人前悔俱號偷蘭懺同墮罪次科會通中分二初準文會異言遠方便者彼宗但立兩方便動色為始故云遠也中蘭與吉並對首懺故云名異等若論詞句三一實異且就所對故云同耳故下正引彼文偷蘭三品分對兩篇上下各局中品兩通疏若依本律初二兩篇不成之罪同號偷蘭至於定罪不分輕重可依上律如法治之廣如刪補羯磨疏鈔取舍中初示律文初篇廣解皆云成者波羅夷不成者偷蘭遮僧殘亦爾可下取用十誦兩蘭以替了論次吉頗合今宗不成偷蘭之義廣下指略羯磨及疏即懺法篇事鈔即在篇聚及持犯中疏三者近方便至彼人邊或欲摩觸身未交前是偷蘭遮為行淫故觸不為戲樂故觸所以不成僧殘故此偷蘭對僧懺也近方便分三初示犯相為下簡濫故下顯罪體疏第四身交是根本也根本中四分入如毛頭即為分齊疏前三方便皆為成犯故名部也若根本未成前三可懺若已成就則隨根本悉不可懺結部義中果由因克是成就義攬因歸果即隨順義以蘭吉別聚由此二義總歸初篇同一部類疏餘篇方便例此可知指例中以下四篇多少雖異次第大同疏若講至此可引鈔疏相潤成宗必觀時宜廣略機變不事誦文彼此同惱有人不解道理者云為我盡底道余云底何可盡至佛方知今且大略識相奉持勿乖正行是則可矣結告中初令援引必下教隨宜有下杜非議彼意嫌略故持遮之答云至佛方知者即智論云智度大海唯佛窮底今下示略意疏古德相傳立四方便一遠二近三進趣四闕緣此之四位通於篇聚次明古德所立疏所言遠者遠資前境借勢成犯事絶情殊名體全隔故名為遠及論成果非不別因即以此罪名為方便今於此過位分有五遠方便中通示遠義彼謂果罪次第相因名為方便非不別因者即下近中自有方便也疏言夷遠者自言感聖聲了成犯後受名利與盜作緣釋中初夷且約因妄成盜餘可準說疏言殘遠者染心觸語與淫作緣同是殘中支類可比殘中為二初望根本同下就當篇如先粗語後得相觸等支流也疏言提遠者取衣作衣染浣坐等並與初二而作犯緣提中取衣染浣即三十作衣坐等即九十與初二為緣者或因此過而致淫觸等疏乃至四五種類相收緣成果剋便成後犯四提舍受尼受女食衆學入白衣舍等並由先犯後通上篇種類攝戒尋之可知疏如自覆露教他行非過狀自成體不相及非不積習生於後犯犯由緣成故號方便舉例中自覆犯吉教他隨篇重輕此二別犯並容相續犯由緣者緣即前罪疏此方便者但有異義至結罪時兩不通涉所以立者欲令行人觀犯興厭或因染習便成大犯故律文中大妄語戒乃訶大賊明知盜受遠因妄語文證可知立意中初示義謂假異罪相成之義立此方便故言異義然各果罪故不相通所下推益故下引證疏二者近方便攬體成果情事相狀如上明了三方便說近方便中雖三方便遠近不同相從根本故並云近疏三者進趣方便心規前境運用不息或自造業或設殺具心雖剋漫事無暫止即號此緣名進趣也三明進趣初解中初科規猶謀也專心一境名剋泛通多境名漫疏若事未差念念增其不善未結蘭吉之𠎝若事畢心達終成至果中遭阻礙初是闕緣次科古謂未至止隔但是違理故增不善若論違制自歸果罪及以闕緣故約制教則無進趣疏問善本難生律明步步有福惡本易就寧不步步有罪答今言制教必須心事止隔方定其罪步步進趣非教所明上問罪福乃是理之違順如何將順理福難我違制罪也問中舉律福文比例罪相可立進趣答中初正答上下反責來問疏若此立義何故諸諫白二捨者有三蘭故知有進趣也答此亦以羯磨言教第三息處故言三蘭非謂三罪如世人言堂中有三伯門外有三兄但第三耳非三人也次難白二者一白二羯磨竟捨故結三蘭答中但作一罪通之舉事為比在文可見疏有人言進趣方便或有或無若藉一世因成中無隔絶既因不定如何結罪或藉異世因成如諸諫戒中有法隔乃至殺盜微涉遲疑皆有其罪如律文中捨者三蘭次解中初通標不定若下別釋初釋或無一世謂同時無閒對下異世可解或藉下釋或有諸諫羯磨殺盜遲疑皆謂心事相閒不一時故疏有人解言一切造業其必有因業成當果則篇聚所攝如何此因乃名違理若以違理惡因而成違制罪者則違制罪時更無違理惡業然違理違制各有二業故知其因雙分兩緣其義極矣是以十誦多論步步偷蘭文誠驗也第三立義中初科初難破彼謂因中違理果方違制因果不等故云如何等若下正難因既違理不違制果應違制不違理然下立義初明理制相兼以違制其必違理故云各二業也故下正立前明因但違理今須違制故云雙分等是下引證疏據如此理亦無同異兩世念念趣境皆有違教之心是以律云發心作心念作即其證也次科中初點破上句承前義下句顯古非兩世即上一世異世念念下立義初正立是以下引證律中發心心念犯吉明知違制疏問此之進趣與近方便復何殊邪答言進趣者心事不絶為名言近方便者從因至果時分延促為義何以分之如前了論立三方便此義合之總名為近初問可解答中初示名義不同遠者名延近則名促次通延促何下正分兩別但近方便定約三時進趣念念隨結如起淫心即遠方便後心思度未動身口念念吉羅則是進趣才動身口即次方便身未交前步步偷蘭則是進趣身分才交即近方便未至究竟並是進趣欲令易曉不覺詞繁疏問延促雖異趣果不殊即是進趣何必有別答息不息別次難以望趣果則三方便俱名進趣義無別故答中息即近方便不息即進趣疏問不息名為進趣有息必在闕緣何須繁紙橫立斯位答不息方便如箭不停近方便者如行暫息不妨意遠非是闕緣第三難以息不息各有所歸則近方便義成無用故云何須等答中先約二喻顯二方便不妨下正通前難謂近方便雖復暫息而遠期根本闕緣不爾事止不成故疏四者闕緣方便義分二門初列名顯相二校量同異疏初列名者言方便者乃是趣果之都名業未成前諸緣差脫故令此罪壅住方便第四闕緣列名中初科前示名業下釋義言諸緣者總下通別二種疏有人製疏改曰不成以律文云不成偷蘭今解亦得何須較執即律文云方便求盜不得偷蘭斯則明證斥古中初引古彼謂方便既是趣果之名今不至果豈名方便止可名為不成罪耳今下斥局較音覺定也然既各有誠據義無不可豈得專執一文邪疏今言方便隨相衆多且以事約分為七種所謂闕緣乃至心息此列名也正列七緣且舉初後略中間五種如下牒釋疏言顯相者疏初明闕緣泛解有三疏一通名闕緣七方便者闕不至果並為緣來豈非通也顯相中闕緣三種通即總該篇聚疏二別名闕緣如諸戒下各有闕緣不可以盜而開殺戒各不相通故名別也別謂隨相不同上二泛論總收一切第二兩亦正示初緣疏三者亦通亦別何者是邪凡是犯戒體是比丘若造罪未果或自命終捨戒邪見二形生等或未制廣教或病狂癡但有三緣不名犯戒俱為造因未成至果故名闕比丘緣望下六別對戒並通故兼二號三中初標徵凡下示相初標緣若下次明闕相罪未果者方便義也列相有三初列四捨體壞無法次未制廣最初不犯後病狂等自不了知初則體相俱壞次則體相俱如但無制法後謂體具相乖問未制廣教那名闕比丘耶答雖曾納體未辨法相無教可犯還同闕人今已制廣則無此緑所以鈔中止存前後二種仍加十三難受戒不得等但下總結初結闕緣望下次結兩亦問已下六緣可例此不答亦可例也以互望皆別對戒並通但境強一種不必盡通如是思之疏二境強者如欲行殺前境及強倒欲害我差此進趣壅住在因故曰方便然境強非偷蘭偷蘭由強而生餘之上下類此可釋次緣分二初敘緣然下定罪強非罪緣故曰非蘭因強壅住故云由生也餘下指例如云闕緣非偷蘭偷蘭由闕緣而生等問境差中亦有境強與此何別答此本境強下異境強故不同也疏三者緣差方便如欲殺盜往逢異人或恐有事或刀杖毀壞或要期未遂總號緣差就義通名七緣皆是隨相取別唯此第三第三分二初列相有四一非本所期二慮他所獲三殺具有闕四如不見前境等總下結名以名通七緣相局四位疏四境差者隨戒並有且據大殺四境來差謂人非人畜生杌木第四境差標中初示緣通且下次標所出人是同類非畜是異趣杌木即無情疏如欲殺人剋心在張王人異境而代張處緣王張解望人不殊究竟成重由異境來張人不死殺意又息壅住方便故曰境差人異境中初科分二初明差相且舉張王兩姓以分本異二境緣下結犯初結異境由下結本境罪是偷蘭號闕緣方便也疏問本殺王時但作張解無殺王心何因得重答張王非罪緣人是殺境雖無王心然有人想殺緣既具何得非重是故律云男想殺女佛言波羅夷罪可以類之初問以心境既差理非結重答中初正答望張境差望王心差故云非罪張王是別人趣是通今就通結故成殺重是故下例證疏問殺王重罪乃取張因而成極果為望張邊別有方便次問意謂果成因沒應無方便古有異解故問以決之疏解云張王姓別人境不殊重果位同輕因相等故攬張因用成王重如律本中列過五因用成五重古解為二初立理謂本異並人因果無別故攬相成如下引例如律盜戒有四句一方便求過五錢得過五錢波羅夷二若方便求過五錢得五錢波羅夷三方便求過五錢得減五錢偷蘭遮四方便求過五錢不得偷蘭遮今引第二過五方便能成五果此亦因果兩別相攬而成可為今例疏問既攬張因成王果者本立境差方便今因成果無境差矣今解中初科以攬因成果果成因滅境差不立故知非矣疏今正解云人趣乃同形者有異不攬相成與王未交屬前張因對王已去別起方便即攬王因還成正果本境張因壅住方便號此方便名王境差立義中初通示因果各異與下釋成初明王果本下釋張因言王境差者以張是本境不得名差故從異境以彰差義疏問不攬張因以成王果何故律文攬過五因成五重果答彼以同損一主元來有心故得相成張王既別何得例也釋妨中以向古師執此為例須為通之令無後惑答中顯示境有一異不例可知疏昔來諸師於人異境更立諸相通列六緣中加疑想用分多句事理境心不無其致此通戒本無宜復廣若解本律可更舒之指廣中初敘古所立諸相即下六緣及餘句法一是人二人想三有殺心四興方便五命斷更加第六疑想以殺但五緣故言中加也復於疑想分出句法且依首疏三趣各有五句杌木非情無境強義但有三句總十八句文中但云人異境至於作句則通四境今備列之事即制罪理謂業道方便究竟皆兼兩業境即四異心謂想疑已上並指諸師所立之義此下顯今略意疏餘有非人畜杌來作異境通望本境不死偷蘭若望異境無心無罪餘異境中初文可知疏問王人異境亦是無心何為結重答人想而殺境心相應是故成重不起非人想故無罪也釋疑中初躡前人異境相並為難釋中以餘三境趣類全乖不可相例疏問若無罪者云何律中非人人想偷蘭遮者次難中初引律者即殺戒境想第四句疏答此由境差方便罪也由非人來人想不捨殺張心成而境乖異望張方便望非人邊本無罪也具足五緣殺非人者但偷蘭遮如何其因已是方便義不然也他師釋中初科上二句定罪由下釋所以彼謂律結蘭罪還從本境不望非人具下引殺非人罪質成上義五緣者一是非人二非人想三有殺心四興方便五命斷如何等者以非人作人想在人為境差望非人為想差故是殺非人因也謂果罪但蘭豈得因罪即結方便蘭耶以非人方便但吉羅故方便字合作偷蘭或改已是作不為者非此明律結蘭罪不望非人斥他異解故云不然也疏有人言上立異境想疑心中想則決徹人差結重餘則無心但屬本境疑則不爾緣兩境生故就兩境雙結二罪斥疑心中初文彼謂想心同上疑心不同以未決徹本異二境並有心故云二罪者本境方便蘭人異境是夷餘三異境並疑心蘭疏今解不然但列本境縱使四異來差本境若強若疑皆列本境何以明之畜是小𠎝杌非生罪如何來差俱犯偷蘭豈不望人從本境結次科還即古義對破前解故云今耳下云今明正解始是今義文中初判定云但列者即指律文境想句中何下徵釋且舉畜杌難破前義據此破詞則知前解異境皆蘭疏問異境有強方便屬何答強想猶懷本境故知此強不望異結如是類例若疑若想皆從本境三問中據上已明強從本境更欲別示故問所屬答中強是異境想緣本境故云強想如下例通據此立義不問疑想異境之上永無罪也前門境強乃約本境此明異強須知兩別疏問異境若強差我不殺強是本境異非罪者異境忽弱而被我害未害之前方便屬誰若見異已去別有方便此則本境方便自立若見異已去無別方便害異果罪因還本境若此立義則無境差次今釋中初文分三初牒前義異下反以境弱為問若見下雙難初約有方便難則本異兩境皆有罪故次以無方便難則異境果成本境因沒故云無境差也疏今明正解本境一品齊是偷蘭異境來差人境緣人有強有疑莫不殺心皆結蘭罪若至非畜例有強疑以懷人想強從本境非畜異境一向無罪若兼疑心從兩境生本境疑蘭非畜疑吉若至杌木並結本境以杌異境非生罪緣正解中初明本境通結異下明異境別結又復為二初明人異境若至下次明非畜境又二初通標強疑以下別釋初釋境強若兼下釋疑心非畜二異正犯蘭提疑故並吉杌非罪緣故無所犯初師局就本境異則不結次師疑心兩緣異境皆蘭不簡輕重觀今所判文理精詳比前可鑒疏第五想差方便義張八位疏初心差境方便如律人非人想等二境差心方便如律非人人想等三心差境究竟如律淫酒戒若懷非道非酒想疑但是正境皆結究竟四境差心究竟如欲殺誑張人張去王來緣王張解若誑若殺是境俱差齊成究竟五心境俱差成方便六即此互差成究竟以事思取七心境不差成方便如出佛身血境強緣差之類八心境不差成究竟諸戒並是五想差中此門八位前四互歷後四具兼一三全是想差五六心境兼差此門唯收四句二四屬前境差七八即境想初句故此四句皆非科意句法相從故為八位耳五六二句令以事思者五中如欲殺張王人替處是境差心復轉想謂為非人即想差成方便第六如欲殺張王人替處心作李想還成究竟言互差者互即是俱承上第五故云即此或恐字誤七中出血一罪永無根本境強緣差事不究竟心境無改疏就此想中或有從輕向重如殺盜畜生轉想向人者是或從重至輕即反上句是或互轉者如彼淫酒破僧俱是正境想疑或生無非究竟料簡中三初殺畜盜畜方便但吉轉作人想殺盜皆蘭二殺人盜人轉為非畜後心並吉故云反上三互轉俱重如淫前作非道想後作正道想或前正後非無非果本私釋更立互轉俱輕如非人畜生心想互差可以明之疏第六疑心方便者相對義張八位方盡疏我疑他方便人非人疑也他疑我方便身現妄語相前疑不了是他疑我究竟我疑他究竟如口造語業但使言章了了不問自他疑也疏上四句單疑也今此雙舉何者是邪自他俱疑成方便如身口互造也即成究竟者妄語言了也自他俱不疑成方便如出血在佛也即成究竟者一切戒是也六疑心中前四互句初即境想中第二句問與前境差中疑心何別答前對異境此就本境餘三俱約妄語配對後四俱句前二還約妄戒但具兩疑與前為異言互造者亦即如上身造口業後二亦是相從而出疏第七善心息方便者如欲造罪身口雖發未鄰究竟忽起善心便止前業壅礙不暢但居方便七善心息初中鄰近也云忽起者或因他勉或遇勝緣或思佛戒或畏因果若非此類善心寧發居方便者前心偷蘭疏問此乃善心生今何言息答實如來問向若不生惡必趣果由此善心能息惡想即所息處號為方便又如律文捨者偷蘭捨時非罪由能捨故前惡不至後果故號前因為方便也釋難中此即善生惡息於義易知欲生下答故此為問答文為二初正答又下引例能捨則同善生所捨可類惡息疏第二大門校量同異者二校量者即總料簡前七位也疏初以自身造境對置殺具明方便多少者身自造境具七方便設置懸擬既非自身故闕想疑但五方便明多少中初標示身自下別釋初明自造故多設下次釋置具則少以想差疑心必約到境懸擬相成不可論故疏剋心辨差其境則寬以元在張王非畜杌後來差故漫心辨差其境則狹以通三趣有境齊害唯有杌境用分輕相乃至想疑剋漫可解次科言寬狹者謂異境多少也初明剋心寬王非畜杌即四異境次明漫心狹杌境輕者非情無過止有方便上據大漫若約小漫如欲通害人趣望剋為狹對大猶寬乃至下此明境差想疑二位並通剋漫二心寬狹義同故言可解疏二心境分別境差境強緣差據前境論闕比丘緣想疑心息據自心辨或闕惡心如好心息或闕有心如狂心息心境中三種屬境四種屬心闕比丘緣或約四捨或是狂癡故屬心也或下別示息心則兼二義問狂心息者與比丘緣何異答此據止息初緣不息俱不至果疏三宗致分別問此七方便依何而述答出在律文境想五句以彼文言人非人想人非人疑即是向述想疑二位非人人想則是境差如前所指餘四方便義通剋漫境想無文是故律云不成偷蘭則攝四位可以知也宗致者顯示七緣皆有誠據宗即文之所出致謂立之所以問意可見答中初指三種所出律中境想五句初人作人想夷二人作非人疑蘭三人作非人想蘭上三通名想疑四非人人想蘭五非人非人疑蘭此二名境差文略後句餘下次明四種義立剋漫二位本出境想今此四緣皆可具之故云義通則明境想有義無文也是下指通文以攝由此四緣皆不至果故可通準不成之文私謂闕比丘緣準諸戒末並云顛狂心亂痛惱所纏即其文矣疏大門第四明持犯義略分四門初知名字二明體狀三釋成就四辨位致四明持犯鈔具七門此但明四故云略分名必召體體成有處心容明昧四段辨相大途已顯餘如對篇逐位別配疏就初門中言名字者持有兩種犯亦同然各有止作例分為四名字中名即是字無別所以不必強分然須先了二名並依受體而立由本受時不出二心一者斷惡二者修善所發業性即本願體隨中守護對分兩持違反本受即戒兩犯疏先明二持疏所言止者方便正念護本所受禁防身口不造諸惡目之為止止而無違戒體光潔順本所受稱之曰持持由止成號止持戒如初篇等可以自明此對不作惡法為宗止持中二初牒名方下釋五節初釋止義言方便者或但攝心離過或復修諸對治止而下明持義持由下總合如下舉事以顯此下指歸行宗所以爾者欲使四行無濫故疏惡既已離事須修善必當勤䇿三業修習戒行有善斯護名之為持持由作成故號作持如衣食四緣威儀雜行作意防擬方成戒淨此對修習善法為宗作持中躡前生起必下釋義亦五初釋作有下明持持由下合名如下指事衣食藥三皆通受淨房有制量乞法或可糞衣乞食樹下腐藥羯磨疏中科為根本作持修道假此故名四緣雜行總收衆共皆作持攝此下示宗可知疏所以前後不同者論云戒相止行相作也又云惡止善行義之次第次所以中初徵意者以修捨義順今相反故又止作體同今分異故論下次引釋論即百論文有二段初釋不同彼明佛說法有二種一止相二行相謂息一切惡名止修一切善名行外道難曰已說善行不應復說惡止以惡止即善行故內曰止相息行相作性相違故今變其語取其義耳又下次釋前後彼云外人又難曰善行應在初以善法有妙果故內曰次第法故先除粗垢後染善法疏次明二犯疏言作犯者出家五衆內具三毒我倒自纏不思對治鼓動三業違教造境名之為作作與持違汙本所受名之為犯犯由作成故曰作犯此對造作惡法為宗作犯中初牒名出下釋義有四初釋作初句標能犯之人次二句敘起業之本不下正明造業釋成作義作與下次釋犯犯由下三合名此下四顯宗兩犯並不指事者翻持可知故疏惡既作矣必不修善是以第二即明止犯良由癡心怠惰不奉教法行違本受厭而不學故名為止止而有違反彼願本故名為犯犯由止成故名止犯此對不修善法為宗止犯中五初躡前生起良下四段亦如上分作犯造惡則通三毒止犯慢法偏對癡心疏二明體狀者疏如昔解云離身三邪離口四過意地不起三不善根名止持體屈身禮拜行檀放生讚歎三寶讀誦經教意修三善對治三毒各修諸觀乃至離染淨行慈悲四弘等名作持體起十不善名作犯體止不禮拜布施修慈乃至觀行名止犯體二明體狀昔解中初明止持通指十惡屈下明作持初二句即身業讚下是口業意下即意業上明事行各下次列心觀初句即指五停心總別相念等離染行者即十二頭陀四弘即四無量心文舉慈悲而略喜捨如後對破二犯相反可解此師大要不明化制兩教業行不同故下並約制教難破疏有人問曰止不行施禮拜讀誦悉為犯者出在何律何聚所收如律文云佛不制者不應制也何以得知不施非犯如智論中兄弟二人出家造業各於施戒互不修行弟為白象以不持戒兄獲羅漢乞食不得由不行施如何而言不施犯罪次引正解斥破中標有人者即是首師初難中四初牒彼計出下責其無據如下引文顯妄即律中非制不制是制便行文也何下舉事證非迦葉佛時曾為兄弟兄但持戒弟專行施故云互不修也至釋迦時感報乃異今謂兄不行施乃名持戒明知不施非破戒也疏又且律中但約身口至於意地未聞戒訓如何而言不修四弘便是犯也次難中即善見云凡夫常緣欲境聖人若制心犯無有得脫之期疏又若犯者何曾見悔不施等罪故智論云不行十二頭陀四無量心不名犯戒但是於戒闕莊嚴耳三難中由律悔法必據犯制不施等善律既不制豈得有懺故下引論可見疏故知上立違於律論若論自行止可違理若不修慈何成道業毒蛇未出義不安眠如救頭然名有慚者結顯中律論即如上引若論下遮疑非謂施慈等行都不修之但非持犯體耳須知善行約教二別如上所列但屬化教道俗通修如後制聽所攝事法局於制教唯道行之故云止可違理則明非違制也若不下顯示須修可解問此中但破止犯彼立作犯有何過失答前舉十惡還是化教十中前七乃入律制本宗心犯如別所論疏今更依教立持犯體能所分別正立中標云依教者能所二體皆出本律以四分結犯並問何心律序又云當審觀意雖兼身口由是無記非罪福性今明持犯必約成業故專取心為能持體問受中作戒色心為體今此能持即是隨作但云思心受隨應等那不同者答受取緣成必須兼色隨取成業但約心論學者深思方見遠致疏言能持者即心為體身口是具不名為業若不思慮不成持犯能持體中初科雖通指心正取思業疏故成論云是三種業皆但是心離心無思無身口業又云身口者乃是造善惡具非善惡業體次科成論由是當宗故可為證皆是心者此指意識猶通四陰若據成業須至行心行即意思以思從心起身口二業復由思成今從業本故言心耳疏以此文證故知意思為能持犯體三中正顯體狀體用齊舉故云意思意即心也疏言所持者收二種持就制聽兩教交絡互明所持中標示但云持者下列四行合須云犯或是語略或可翻持自可明故下約制聽二門止作互歷故言交絡疏先出二教之意先出二教者今明持犯唯據律藏文雖浩博不出制聽特異古師濫通餘行故須先示二教大綱疏言制教者禁諸出家有惡皆斷名制止也有善斯習名制作也若斯以明是大略也若違此二雙結兩罪並由制成故號制教制教中初示二持未陳別相退舉總意故云大略若下明兩犯制止反作制作反止皆名違教一一結罪疏言聽教者作與不作一切無罪聽教中如造房畜長必不俯從乃成上行依開而作自攝下根今望作不作邊故言無罪然至作時還須依教房舍尺量長衣日限違則有罪疏故地持云有罪行者制無罪行者聽文成證也引證中行字平呼謂造作也疏所以須二者唯制不開中下絶分進道無由唯開不制則令上行慢求息於自勵故立此二攝機斯盡出意中初句總徵唯下別釋初明須聽唯開下次明須制上行欣制乃能勇進唯開退屈故云慢求故下通結立斯二教攝彼三根故云斯盡然上根稟制未必從聽中下二根制聽齊奉上來諸文且陳兩教大體未顯持犯體狀有人即以二教為體又復有立萬境為體並由錯認前文致斯妄立委如事鈔所破疏如昔解云二教攝法各有分齊止持作犯唯對二教事相以明作持止犯通對二教法事以辨所以前段不通法者法唯進修方知事但離過自攝故所以異正明體中初科昔解止持作犯局事無法與今少異餘則大同所以下自釋不通之意以律制法正在進修止持離過非進修故又事通善惡故該二持法唯是善故唯局作疏問如上立義止持唯事不通法者如五邪七非並非正法若作有違義須止約此法與事殺盜不殊有何等故不在止攝如昔解止但對事明於義有乖今不同彼無論事法聖制止作則通持犯下以位分體狀無別今義中初牒彼解如五下舉法比難如昔下斥非立義此謂事法既有止作則通四行下以位分者即後四門並舉事法對可學不可學以明體狀方顯止門與作齊等故云無別則異古師單復偏對也疏前就止持制教門中有二種位止持制門中云二種者即下制止制作或是可不可學問今論所持體狀何者是耶答如後所明善惡事法即其體也問何不直明事法而先出二教者答此有二意一為簡化教不使相濫故二由此二教各攝事法體狀各異持犯不亂故前標云攝法分齊意可見也問所以事法復論止作者答由善惡不同四行所攝體相別故問何故須分可不可學答若在二教一切心境皆名可學由心迷悟犯不犯別所以分之問舊記何以立二教為體答彼將前文即為出體正明體處謂論四行所以攻異浪爭不息問立境為體復有何過答境是戒緣體無持犯壇場受戒豈唯受境隨中持戒豈但持境應知於本受體有護有毀遂與教相有順有違故有持犯耳問如母論云犯必託境又事鈔云森然萬境何事非持今不取境則違彼文答但由持犯必對境緣如犯淫戒須託三境如持殺戒亦對三趣至論持犯自指淫殺論云託境豈不思之又境是局狹收緣不盡如諸戒列緣境唯一種若言淫事一切皆收又復於一男境自發五十六戒若但言境境即通漫今言事者即指別戒大抵諸家所立與今現文略無關涉不足為破但恐新學致疑故此略辨委如事鈔疏一者可學事制止何者是邪如淫通三境盜分四主既是惡事不可妄行故須止也可學事中三境者人非人畜非人攝四天修鬼獄故知此三總收六趣三皆犯重故云通也言四主者三趣之外加三寶境四犯各別故云分也疏二者可學法制止如五邪七非體乖聖教明了其相必不得行故同止也法中五邪即調達五法一乞食二糞衣三露坐四不食酥鹽五不食魚肉五皆盡形一制無開故名邪也七非者謂所作羯磨違律制也一非法非毗尼二非法別衆三非法和合四如法別衆五法相似別衆六法相似和合七呵不止廣如業疏此二惡法不殊淫盜故云同止疏言不可學事者由心迷倒隨境不了於殺盜境疑慮不分望非犯位故是止持而心不了是不可學不可學中約迷忘者謂臨事造境忽起之迷非可預學令知故言不可舊謂心迷學不得者非也疏二者不可學法如四依五邪七非三法是非相濫忘思不了雖未依行故名止持非學所知名不可學法中云四依者以調達倚傍四依而立五法邪正相濫容有迷昧三法者即單白白二白四或可心念對首衆法疏問如此生迷與愚教者復有何異答愚教之徒生來不學故隨所壞並結無知今此不爾素並明練忽然迷忘非學所知故於教相無罪可結問答分示愚迷兩相在文可解疏二就止持對制門可學事中制必作者如衣鉢體量也言可學法者制必須作如三羯磨等制作門中今明止持不宜論作為欲顯示雙持犯義如後問答衣以布絹為體長五廣三等為量鉢以泥鐵為體三斗斗半為量三羯磨中說恣二法必須常行餘對別緣有必依作疏問此止持中但得守戒而已若有作者便同作持今明作者豈非合亂答今言制作即成止持若不依行則是作犯今順教作便成止持如三衣一鉢法須具有故制畜之豈非作也望無犯故名為止持依教奉行又是作持初問答意以佛制作不作有罪望不犯制即成今止若望依作歸後作持方顯止持離過作持進修於一事法兼具二持今取離過收歸止中則非亂矣疏問與後作持復何別邪答義同意別具二持犯其致在茲問後答中義同者無別事故意別者止中說作但取無犯還成於止後作持門正約造作具二下發起後文疏因此便明雙持隻犯義略分二意初約心用後約教行次雙持犯標中語略合云雙持雙犯單持隻犯疏若據心用以明持犯一切諸戒並二持犯何者是邪且如淫戒順教禁防即止持義觀厭現前無思染穢縱有境逼三時不樂名為作持違作止犯違止作犯心用中通諸戒者凡持一戒必起護心望離惡邊即成止持望起護邊復是作持兩犯亦爾違教作惡必無對治文約淫戒示相可解此謂二持兩犯各自相通非謂持中有犯以善惡行別違順心乖故也疏若據教行必託境生依教奉行作而無犯何者是邪且如三衣教遣備具不敢違侮名為止持如教䇿修順行不犯名為作持違此二持便成兩犯可同殺盜有教開作名作持邪次教行者此門須約有教令行方具二持如僧殘二戒二房有處分故三十中九戒長衣月望長鉢長藥急施此五佛令淨施故二離減六年此三有羯磨開畜寶說付俗人九十中十二戒說粗罪輒教尼有羯磨開背請別衆切德衣開食前後并非時入聚有囑法足食勸足餘食法開殘宿不受七日盡形開口法故淨施問主僧事與欲提舍二戒尼指授教令呵止蘭若受食令語使知衆學中一戒杖囊有法開此約戒本具雙持者餘皆單持是則一切作持其必兼止若但止持未必有作自餘羯磨衣鉢等事則見廣律文舉三衣其相甚顯侮音武慢也可同下對單持辨異以殺盜等無教開作則無雙義疏問依教造境名作持者如淫怨逼禁心境合豈非順教應具二持答此以難緣禁心名止非謂恆爾若無怨逼對境有犯況復合邪若作此釋莫問事法無聖教聽並是單持廣更如後引難中初篇四戒淫開怨逼律令作蛇口火中等想教既開作合成雙持答中怨逼作想豈與三衣等作同耶若作下總判廣下指後諸篇疏二明止持對聽門中事法者亦有可學及不可學疏言可學事法者謂房舍尺量長衣廣狹指授白二加說淨法是也於此事法亦聽作聽止必有房財理須加法故聽作也若有妨難犯過衣財不合加法故聽止也聽門釋可學中初標示謂下出體於下明止作聽中有違還復令制故得有止疏言不可學事法者謂房財大小迷忘互生作法是非昏昧雜起望不違教名為止持迷非可學故不制犯疏次對作持亦就制聽以明持相次作持中標云亦者亦前止持故疏先將作持對制教中明制作者位通事法釋中依古者昔謂作持無不可學今且一向依彼出體下文難破方顯今疏還通二位疏言可學者並制修學事謂衣鉢行護也法謂一切教行也竝託事法進用修成而無違犯名為作持不敢違越又是止持制門通示中初句牒示次句明行相對簡止持是離過故事下出所持體並下顯示雙持疏問此止持與前制門中止持復有何異答前對惡法無由可作名為止持此就善法必不違越名為止持各有意致可通解不問答為簡兩門止別若爾前制作中止與今何異答與彼同也今所簡者指制止中止耳若爾今此明止為屬於何答還屬前門由此而知止分二種一斷惡門止正攝止持二修善門止旁收作持作唯有一但局修門又復止惡局前作善定後作中之止則通兩門在止則離過不殊在作則同由善事約此以分止作無濫疏就聽門中亦對法事事謂長財房舍法謂處分說淨亦有聽作聽止如前所言次聽門止作還指止持事法無別何以分之答聽門事法二俱是善本屬作門但兼止義故在前出但前取聽止此明聽作故不同也若爾所以前後俱明止作者答為顯雙持義故及論止作各攝所歸不可混也疏如昔解云作持門中事法唯可學無不可學者非此所明以非進修聖不制學不同止持通不可學以唯離過故得明也今破中古解為二初直判不通以下對止顯意彼謂學必造修如四重等非可為之故有不可學疏今解不然不可學迷非學能了乃至四果猶有事迷何況下凡而能通辨故於事法無問止作皆有迷忘而非罪攝何以明之如律長財開忘不染房舍指授亦開想疑既不結正明知不犯今解中初文古師約事所以不通今立心迷則該四行四果事迷者見思已破理解雖窮於事未達故有忘認瓶衣之類故下決通諸門何下引文以證二戒想疑文見戒本疏問若不結犯何以律文結偷蘭邪答忘非偷蘭此結想疑方便耳前心欲作過量不處分房後心轉想謂是應量處分之房想差前因不至後果故結偷蘭可不解也釋疑中此引房戒境想為難彼結蘭罪今云無犯則相違故答約方便文義易知疏若依此明與昔持犯通塞全異諸有讀者任情兩取顯異中通塞者彼不可學俱局止持今通四行諸下勸令從長非謂存古而言任情欲明今古兩解是非已彰特以此語激勵後學下明兩犯對翻二持者但望心違無別體狀是故一一皆指事法即其體矣然止犯中明云所對世人不知事法是體讀至此文如何消解教旨極詳但未思審或復情執何足為論疏三明作犯其狀如何此犯所立翻對止持但不依戒行事法有違皆名作犯疏第四止犯以對作持所對事法怠而不修皆名止犯疏此二犯中亦有可學及不可學類止持中彼此交映則衢術歷然為繁紙墨故不疏出雙結中由不別陳故須略點制聽止作可不可學一同二持但犯為別疏三明持犯成就處所心行對業三門分別三成就門標中前雖明體未識四行成在何時故以三門辨明分齊初約三心二就行心三兼身口疏前將止持對心以明若無染汙以明止持行前三心得有持義謂識想受此之三心非業非記流入行心方成別業故分四陰以為二分豈非本有戒體外無染汙光潔純淨名之為持三心非記受體是記故得持也初科上句標舉若下正釋為三初通示據此非持取本受體說名為持故云有義古人目為端拱止持以非造作任運成故謂下別簡四心分二所以統論四行止持有二餘之三種並局行心故也豈下結顯三心下釋疑問三心何分答了別所緣境名識即通指六識取所領之相名想謂取所領六塵之相則為六想領納所緣名受謂六觸因緣生六受一一各有苦樂不苦不樂三受之異皆從違順非違非順而生造作之心能趣於果名為行謂六受之後各起善不善不動業等亦名六思思即是業若大乘經則受想行識列次不同由受生想從想起行由行成識今依小論則識想受行以取最初一念了別之心名識次起想像名想復次領納名受後起業思造作名行問破毀之人有此持否答據篇聚中犯一重戒餘戒常淨儼然是則持毀皆有持義今文且從持說故云無染耳疏二就治行明止持者必入行心方得成就前之三心不名為持善性便有惡無記無如欲離過作意遮約或對境防或起心護豈彼無記而得成持若據作持例同後止既就境論三心非分次科二持中初明止持以非思慮不成事業故云必入等前下揀三心善下揀二性如下舉事顯相若下二明作持同後止者簡前三心止故疏若據二犯行心成就前言持者三善為行今言犯者三毒為行前三亦無識想受等通善惡行局不善性善無記無二犯中亦約四心三性以定行體尋文可了注中以行通善惡故須簡異疏若事前後心則異生別持別犯則可知矣前後心者即鈔中自作教人自業相成二種義門廣文如彼今略舉之如前遣人漉水即止持令人送欲即作持教他殺生即作犯令他造房不乞處分是止犯後修止持彼四同辨乃至前作四事後作止犯例上可知雖心境不同善惡閒雜不妨前後行業自異故云別持犯也自業相成亦類同上說但望自作為異疏三就業明持犯相者疏言身口者離殺等過名身止持受食食等名身作持離語四過名口止持知淨語等名口作持身口二犯反上可知三中初科初句雙標離下列釋前釋二持身下明兩犯言反上者行殺盜等名身作犯不受食食名身止犯造口四過名口作犯不作知淨名口止犯疏單意業中不名持犯故律文云單意者不名犯也單意者若至身口必兼意思如上二業未及身口粗細心念通名單意初科據文立義然單意語通此據瞥爾制限大乘故云非犯疏若爾何故律云發心作心念作皆名犯者難通中以二文相違故須簡辨問發心心念為同為異答上是方便期成彼事下是果頭如惡覺默妄染心看女等疏答此謂發心將由身口雖未動相即名為犯答中初釋通約遠方便論將由身口故非單意未動身相即是發心疏有人言制聲聞戒於可制者言之獨頭心念忽起緣非不名為犯重緣向念可得思覺而不制約故是犯科所以文云心念作也次釋中初約大乘釋前不犯獨頭即瞥爾異名重下次據本宗決後犯文謂後念還追前事故云重緣向即前也問意已成犯何以前約身口明成就耶答就意辨成皆遠方便心念果罪少分有之大論趣果須至身口疏任情兩取後為正義結中上句是縱下句是奪問世云小乘不制意地今那制耶答此由不辨假實兩宗制限深淺故也小乘實宗定不制意動色成犯假宗制意但約重緣簡非瞥爾是則三宗歷然大小無濫學者至此宜須精究疏上明成就竟餘有通塞諸門增微雜相量時須者可尋事鈔中卷持犯兩以相成故斯略也指略中初結前餘下總指事鈔七門三門同上第四通塞自分四位故云諸門一心門將心望境門自作教人門自業相成門第五漸頓文中不指第六優劣即是增微七雜料簡即今雜相量下囑後講習輩也疏大門第四位列持犯者第四門中唯明不學無知止犯罪相有無輕重隨一事法皆須二九故云位列疏佛立教相止為奉行若但讀誦非本意也然受戒後勤學教行於諸事法明若指掌忽於境想迷忘而造律制非犯此不可學迷也若由來不學不思過犯隨所造作不問事法但作有違皆犯根本緣而不了結無知若於二持雖不違負望非明決不名為福若緣不解但是無知是以佛言隨作犯根本更增無知罪敘結分三初明立教之旨然下敘結之所以初明學人開迷文中明學須具二義言學教者謂精窮三藏學行者謂專修對治若此為學方開迷忘自餘泛爾皆不學收舉世相傳才過學肆便稱學人自謂無罪觀其所業曾未勤勞求其所行略無奉慎豈能全免不學無知請詳此文足為龜鏡律制者即諸戒後境想中開若由下次明不學須結又三先明迷犯若下次明昧持故知不學由不曉教持亦成犯是下引證即不攝耳聽戒文疏今略標舉須配位法此立兩箇九句交絡有無為持犯方軌總標中初句指前須下生後言交絡者即於事犯各有識疑不識三心互織作句如圖所顯言方軌者若解二九隨一事法無不該通故事鈔云類通法界是也疏先就止持明罪有無輕重分齊於可學事法作九句分三品止持可學標中有無等者有即疑及不識無即是識輕謂不學及疑重即不識立句之意如作犯門具明所以疏上品一句識事識犯事謂殺盜三衣一鉢犯謂夷蘭提吉若能於此事法明了無疑奉行可謂上品持律之士上品事中殺盜制止事衣鉢制作事犯中夷蘭對殺盜提罪對衣鉢吉羅通上止作二事今略示圖相則依文易解疏中下二品各分四句初識事疑犯二識事不識犯三識犯疑事四識犯不識事下品四句初疑事疑犯二疑事不識犯三不識事疑犯四事犯俱不識疏言不識者犯謂不犯迷輕謂重疑中亦爾疑有疑無疑輕疑重疏上品一句事犯俱識不可以結不學無知顯數中上品可解疏中品事犯句雖兼識然於罪事生疑不識隨有迷處皆結兩罪一是不學二是無知四句單雙罪則有八猶自名為中品持律以句帶識非是全迷中品前示罪數單雙者下半事犯是單皆有二罪名雙猶下結品疏下品四句罪事俱迷隨句有四則十六罪此則名為下品持律然於末句最第九也由涉疑故是解家津不識罪事非智之甚可不然也下品中初示罪相然下別示第九初指句由下對簡前三句不下正顯後句津合作律又復寫倒甚合作堪疏此中計罪有二十四六波逸提十八吉羅無知故重則不識是也有疑不學但是輕收總合中初合數無下示罪體無知通輕重不學一向輕疏問既名愚教即是犯位有何等義名為止持答不犯根本故名止持事犯有迷自是愚教止犯所攝舉宗判義持犯何乖門答中根本名持正在今位枝條是犯自攝後科故云舉宗等也疏次對不可學事法以明止持各分三品疏初三句中一識事識犯二識事疑犯三識事不識犯疏中品三句一疑事識犯二疑事疑犯三疑事不識犯疏下品三句一不識事識犯二不識事疑犯三不識事不識犯次不可學列示中即前九句欲使結罪有無易見故三三品列疏此三三句各下二句於犯帶迷有疑不識各有不學無知二罪合十二也亦望不犯根本名為止持合數中初正合此三三句並第一句於犯俱識故唯下二句有罪耳亦下結宗疏但事是可學想疑忽生緣而不了聖不制罪罪是可學若有迷者皆結其罪顯意中所以唯事開忘者事是臨境造修有迷可恕犯是教相縱令先學後忘還成懈惰故不開也疏問於事有迷故開不結必於犯法亦有迷忘如上引律過量不處分想疑皆開何為於此而結不學無知答計理成例是所不惑可如作持對法中說此中交絡事法互有不學無知故生此位問答中初難意者以古師作持中無不可學故躡事為難意使例同所以答中但指如後至作持門還指同前謂事既開迷犯何結罪犯既是法而不開者則作持迷法亦應不開答中初承前難意若迷法者宜同事開故云成例可如下指後作持不可學九句此下顯今止持就事立句但可例同未該後法問此止持門不明法位者答影略互彰止持就事作持從法至於四行各具事法故知止持一門惡事惡法各有可學及不可學合四九句餘三同此總有十六九句不學止犯立一八句此約四行通數如上若就別論一一事法皆通二九是以鈔云類通法界義在於此疏問如殺盜等論罪有無人非人想主無主想有何義故律判不定答大有意也或緣罪境人非人想故但結心罪或緣非罪境有主無想故然彼迷心並不結犯皆約前心方便為言第二難中上云迷事聖不制犯而律境想結不結異故引為問答文初句歎教通答或下別示有無然下結成開意謂正迷時並無犯故還歸事開疏二明作犯可學事法如初九句不可學者如後九句結罪多少輕重皆同但犯根本以為別耳作犯中初科可學則有九根本罪不可學中三識並至根本三疑半涉本境無不有罪但重輕為別如殺盜等可以思之三不識句除淫酒犯根本餘戒轉想並有方便本迷一切無犯疏就此根本不識事中始終無心如誤殺人等不結其罪前則有心中後無心但轉想疑除淫酒戒餘結方便若不差者還結根本若心了境不造前事則無罪也料簡中初科為二初標品位三識三疑俱有罪故不須辨之唯三不識有無不定故此委示始下正簡有四初明本迷前下明轉想除淫酒者該上本迷準下酒開方便若不下於不可學轉為可學若心下如善心息也疏問有何等義分二九句答欲使持犯相易也次科問答云相易者謂階品差降則結罪有無多少可見如次所顯疏故前九中上品一句中下各四者由緣一事帶疑不識交絡互明出其犯相九句就事皆結究竟緣而不了愚教之罪自結不學無知也其愚教罪亦是究竟無果可趣有識無疑則非罪攝明前九中初明立句以識等三心歷於事犯上下不定故云交絡九句下明根本罪緣下示枝條罪古師謂是方便故特點之疏論後九句三品各三由不識事境非可學不妨於犯是可學故致列其相事總而罪別也次明後九初中略舉不識必該疑心是則三識非不可學句法相因故可知矣此中立句事但一心且如上品上半皆云識事故云事總中品疑事下品不識事皆然下半犯中識疑不識三心不同故云罪別疏問若據此論識疑二事分句為六可是犯攝不識等三便是無犯云何說言作犯九句答若就本迷實唯六句然緣犯法有疑不識即是其犯故說九句次科上中二品有罪可知此下唯明下品三句初問中以作犯門必須有罪下三非犯故設此問答中初縱來問然下奪歸須立疏若爾緣罪疑等乃是止犯何得說為作犯位也答從根本邊說名作犯次難中以止作犯別不合同位故答中從根本者三不識句雖不犯罪非不造境故得歸宗疏若爾不識事識犯全是無罪止應有八何得有九答如上已明相從句法後難中以此初句本枝俱無義不可立答如上者即指初答疏有人解云何須如此今總為分若可學事法生可學迷一向九句莫不犯根本也若可學事法生不可學迷則有八句除不識事不識法也以心迷故學不可得如有主無想過量不過量處分不成羯磨不辨若始終迷除第七句若轉想迷還有九句後心無罪結前心因也次總分中初三句標示但隨具闕不必定九故責云何須等若下示可學具九若可下明不可學不定又三初明六句標簡云八者寫誤準鈔並作六字事法二位皆無下品故云除不識等以心下釋除所以如下引事以顯上舉盜房釋開事也下舉處分羯磨釋開法也次明八句除第七者即下品初句餘二句枝絛帶罪故得存之後明九句可知疏三明作持二九句對於事法立句辨相如上止持可學法中此但順教作事而已不同止持識相守持今為略述三作持中初科為二初指同此下簡異疏上品一句識法識犯造房白二是識法也不乞犯殘是識犯也疏中品四句識法疑犯識法不識犯疑法識犯不識法識犯疏下品四句疑法疑犯疑法不識犯不識法疑犯不識法不識犯次科以法立句同前圖樣中品三四二句與前小異合云識犯疑法識犯不識法疏結罪分齊大分二位順教作事不犯根本愚教不學則犯墮吉如上例顯三中初標分順下別顯初明持義愚下示犯相還指止持故云如上疏就不可學法亦有九句如前段後九句三品法雖可學迷倒忽生佛開不犯不同昔解是以律中不處分想疑皆非殘故不可學中三初標指法下立理不同下斥古前止持中問答指後作持者即此文也疏四明止犯亦二九句翻對作持可以自明四止犯中指句可知疏如昔解云止犯法中無不可學今言迷倒隨位皆有如不說淨見罪不露即是可學若迷若忘即不可學如是例知通諸戒相引古中初科為二初牒古二立今說淨覆藏二俱開忘故引為據如下例通一切文言諸戒舉其大槩須論戒下若事若法皆具二九類通法界即其義焉疏有人解云止犯位中對教不學則唯八句除法事俱識也對事不學九句通有如造房舍衣鉢雖達相了知何妨不乞處分受持加淨皆獲殘提等罪是也次科止犯一位須分三種一不學止犯即不學無知也二事法止犯即於制聽善事善法故違不作也如文兩別初止犯中除初句者二種並識非無知故問與下同異答下有根本故可存九此則不爾故但有八問二持門中亦無根本何不除去二識句邪答彼是持門無罪可立此是犯門無罪何用問二犯門中如何列句答應翻二持下品為上以犯門解義罪多為勝鈔意如是
