body:
  text: 疏自上已來略於文前開示標相今次就文義張三位結前中標相者標即教詮相即前四章總別門中所明之義今下標後疏初從稽首禮諸佛下一段偈明法正無學將傳行教光被於時但為末代鈍機情多狡詐謂是別懷未能師奉故先歸敬歎戒功能勸以奉行名廣略二教總序興致已彰正宗宜顯故次第二從和合僧集下至當於中學來名廣略二教別序正流通盛開持犯諸通塞行別行已成衆德圓滿後當流演顯無窮之相是以第三明人能護戒下總舉兩教勸修弘益總判中初明序分狡猾詐諂謂多猜疑無淳信也別懷者下釋歸意云謂妄意言不承宗緒故先歸敬者即初一偈歎戒功者即次一偈勸奉行者即欲除下諸偈也正宗中廣略二教各有序正流通故云別也合此二教總為正宗序與流通皆言總者竝望二教各有三分為言通塞即開遮持犯開遮通該廣略總收諸戒流通中云別行者躡前正宗廣略不同又二教中行相各異故遵奉二教道業內著美望外彰故云衆德滿也疏就前二序三種分別一名二意三前後也疏就初名分有四種異一約人異前偈法正所撰和合已下如來布教二對時異前偈未來百年正序如來初化三總別異前偈法正一宗和合通五百部四就義異前是勸信後是所傳發起序也序分初科立名中四異皆云名者一法正如來從人名也二未來現在對時名也三前別後總就宗名也第四例同諸經名義可解疏二建意不同若據當時敷化各唯一意如來正序不慮不行何有勸信止是發起之由不妨勸信敘己集結義兼發起據後引成非是臆說是則發起亦通勸信建意中初明別意文中但敘佛不須勸則顯法正不勞發起以教興佛世正但傳弘止須加勸此彰二序各專一意不妨下次示互通前敘結集意發正宗後引佛序意在證信言引成者謂引佛序成正宗故疏三明前後者問發起之序興在於前今何後列答若致在初有兩非便一彰廣序隔於正宗不相鄰接發起非便二彰勸信本意不具謂唯勸宗不勸廣序今總居先二種都便反上解取前後中約時不次非理為問答中兩非便者初據發起非便後即勸信非便反上解者一彰不隔二得皆勸故云都便疏就初序文分為四節前有半偈明將演正法濁世障多恐有留難故歸敬三寶稟承加護二有半偈歸敬本意令法久住三戒如海下九偈廣列戒之體相呈露時心勸以奉持四世間下明教行攝持功不虗義四節判中總分偈文四句為一偈二句為半偈一句但云句耳自下分文皆爾律稽首禮諸佛及法比丘僧疏就初文中義文分二初釋三寶後解歸意疏且夫三寶三緣不同初名義者自可如常不學不知故須略引初半偈略示中初科為二初示境別緣即境也初下次敘名義顯今須釋疏言佛者梵云佛陀或云浮陀佛馱步他浮圖浮頭蓋傳音之訛耳此無其人以義翻之名為覺者具二義故言覺察者對煩惱障四住如賊唯聖覺知言覺悟者對所知障無明如睡唯聖獨悟無明有二一迷事無明善覺三趣二迷理無明覺法實性通而獨悟並名為覺釋佛為二初翻名梵名有七或云沒陀或下加耶字具下次釋義覺察義中煩惱障不出十支總為見思三界見惑粗故易斷合為一住三界思惑微細難破離之為三故為四住此障凡夫不覺二乘同斷覺悟義中無明一住通號無明別分事理初迷事者障俗諦故世出世法唯佛通達名如量智故能開覺一切衆生故云三趣謂人非人畜總收六道竝是所覺此謂覺他也二迷理者障真諦故法性真理唯佛盡證境智相冥名如理智此即自覺也然此二覺二乘不覺菩薩分覺後二句總結通而獨悟唯局果人此即覺行滿足也佛地論云具一切智一切種智二智對疏二覺離煩惱障及所知障對疏二障於一切法一切種相真俗二諦能自開覺亦能開覺一切有情自他二利如夢睡覺如蓮花開夢喻迷事蓮喻迷理故名為佛揀因人也更欲委辨非宗且略疏所言法者此土方言大夏梵音即云達磨或云曇無曇摩之異傳耳未解聲明故言多僻法有二義一自體解法如三聚等二軌模解法今據後義至聖演教意在成行如車從轍如器從模法非目覩以喻成也又如行必從道道不從人道即行之所依法式無越此也釋法中初示華梵西國有聲明論辨定語音訛正今指翻傳之人未善彼論故所出不同法下釋義初言三聚者一色二心三非色非心此三體性差別不相混濫故云自體次義如文自顯初標示至下喻釋又二初約車器喻二取道路喻釋成軌模義也並上二句立喻下二句對合疏僧者天音具云僧伽此無其人以相翻之號為衆也或有舊解言和合衆即體相為名言斯等人同具六和四人非一崇成衆法故也然諸經中但單衆翻不兼體說廣如羯磨疏解釋僧中初翻名單就相翻是今正譯或下出古解初翻名和合是體衆即是相言下釋義具六和者釋上體也四人者釋上相也成衆法者辨一切羯磨也然下指歸正義羯磨疏中但取衆翻廣有廢立不復繁引疏此三益世近拔三有遠清二死希世獨達可重名寶故寶性論喻分六義一希有義世寶貧窮所無三寶薄福不遇二離垢義世寶體無瑕穢三寶絶離諸漏三勢力義世寶除貧去毒三寶六通難思四莊嚴義世寶嚴身令好三寶能嚴法身五最勝義世寶諸物中勝三寶諸有無上六不改義世寶鍊磨不變三寶八法不動上雖六解同舉喻成核其寶字同訓珍美如常所引通名中二初約義略釋上三句顯益近遠二字必對因果二死者一曰分段三乘共亡二曰變易唯佛永盡希下一句結名希世者世間無故獨達者超諸有故故下引文廣釋今用四種三寶對此六義初義通四住持無信不遇化相無緣不遇舍衛三億可以明之理體局聖凡愚不遇一體二乘不遇第二義中唯約理寶歸敬儀云住持三寶體是有為具足漏染又云化相體是無常四相所遷滅過千載但可追遠用增翹敬據後一體在迷隨染故此三種皆無此義第三喻中六通在人唯對化相神境他心天眼天耳宿命漏盡六皆明徹總號為通毒謂苦惱下云寶能現除貧苦與此頗同第四通四住持化相能發信仰理體一體可以修證皆是嚴身第五亦通四餘三易解住持佛法雖是世物莫不表示法身功用無極儀云金木石土體是非情以造像故敬毀之人自獲罪福故知此寶得名無上法亦準同剃染之僧為世福田人天中勝破戒惡行猶過外俗況餘持奉其勝可知第六唯局理寶儀云此之三寶常住於世不為世法之所陵慢一體雖常然就迷邊隨緣流變餘二無常非所論矣八法者智論云衰利毀譽稱譏苦樂四違四順能動物情名為八風理寶人法皆是出世無漏聖道不為八法之所動故上下總結疏就三寶中重分四別一舉衆相二明本末三分次第四敘功用重分中前但釋名名通四位故開義門料簡顯別故云重也疏初衆相中有四種三寶衆相中他宗皆闕理寶四位分別獨出今疏疏一理體者如五分法身為佛寶滅理無為是法寶聲聞學無學功德是僧寶二化相者如釋迦道王三千為佛寶演布諦教為法寶拘鄰等五為僧寶三住持者形像塔廟為佛寶紙素所傳為法寶戒法儀相為僧寶四一體者如常所論唯約心體義分三相如涅槃說三寶同性等初明理寶文出多論五分者戒定慧從因受名解脫解脫知見從果彰號由慧斷惑惑無之處名解脫出纏破障反照觀心名解脫知見滅理四諦滅諦涅槃學無學者初果已去同見真諦名理和僧然此理寶亦即同體但望佛僧證理邊為別故多論云佛亦是法法亦是佛僧亦是法止是一法相有差別故分三寶化相中三千者所化之境諦教即四諦法門雖多而以首者言之又四諦統攝凡聖因果大小教門廣略異宜無出此四拘鄰此云本際即鹿苑中初度五人首曰拘鄰即憍陳如也二曰頞陛三曰跋提四曰十力迦葉五曰摩訶拘利住持中戒法是僧體儀相即削染也一體中如常論者即指經論之宗三相如後自委疏二明本末者二明本末疏四種之中初理為本餘三從相故為末也如毀佛出血據相無罪化佛無心非情無惱也以損法身所依故結重逆法僧損益本末例然故大集云若打破戒無戒比丘罪重出萬億佛身血者豈不以形服出世為聖道標若加輕毀則三寶通壞故也總明中初正示如下舉事以顯先明佛寶此明化相以理為本化相應身故云化佛多論問何以出色身血得逆罪耶答以色身是法身器故法身所依故法下例餘二寶如破法輪正望真諦無證入故如殺羅漢亦望證理福田極故是則化相皆望理寶以論罪福故下別證僧寶即約住持以證化相初引經文破戒無戒打業極重故知不取儀相論僧豈下推經意形服是住持僧聖道即理寶僧住持佛法由僧弘顯是故毀僧則兼佛法故云通壞又智論云如泥銅等體是無記非感罪福以成法身相隨前敬慢有罪福也此住持佛亦本於理經卷準說一體在迷迷從理起悟還復理本末可知疏問就當四相亦有本末不問答中上是四位對論今欲隨位各說故此請問疏答諸家都隱今試舉之此由常懷何得不識且如住持三寶圖寫佛形峙然端拱為佛寶之本也自餘賢聖八部周列為佛寶之末也故殿宇廊廟神鬼禽獸斯非寶尚何得福生但是莊嚴至聖同崇尊德所以若作若損皆望本緣法僧住持非無本末例上說也答中初示意且下正明峙即高聳之貌賢聖即三乘弟子八部即經中天龍夜叉等本緣即佛法僧例上者法以經卷為本函帙等物為末僧以具戒為本常住受用為末問住持可爾餘三如何答文雖不明隨義可說化相佛僧亦取受用以分本末法中四諦苦集是所破道是能顯此三皆末滅理所顯名之為本理寶中五分事身應末所證理身是本法者能詮之教假名字說為末所顯之理體絶名言是本僧者學人為末無學是本又學人未盡煩惱無學尚存苦依二皆為末同證真理通號理和為本一體中衆生本性寂照自在三皆是本今既在迷昏動拘縛三皆為末疏三分次第者三明次第疏如理體三寶同上次列若核其本證理方具法寶為初但理不自顯託行以彰故先五分佛寶居首又解理由人顯道假行成釋尊出世方聞三寶還依化相故理無別理寶中初二句指前衆相若下進退以釋約證法合居先從行佛當在首又下重解比例化相並佛為初疏二明化相佛先法次僧後者以釋迦初證唯佛獨尊非尊不可在初故為首也大聖雖現止得動其耳目至於煩惑要假法除次演聲教用滌心惱教之所及行是所歸雖說無證還同不說故拘鄰會正方僧寶現此則化儀次第不可乖也化相中初標示以下隨釋初敘佛初大下明法次教下釋僧末此下結示疏三住持中僧初法次佛後者由道假人弘世途法爾故迦竺初達現僧儀也述五乘為善因明三途為惡果現法儀也斯法遠大非凡小之所開故表畫像於涼臺推其所說現佛儀也住持中是約此方以論前後準知西天佛滅已後法委於僧與此不別初通列由下別釋初敘僧先述下釋法次斯下明佛後開謂開示涼臺者即騰蘭齎至白㲲釋迦像及四十二章經漢明帝遂於南宮清涼臺令畫工圖佛立像并寫經緘於蘭臺石室疏四一體者法先僧次佛後體是心體本來無染妄覆迷倒故興邪正今了法本理實無三隨相用分一方行化故照理邊即為覺義體離名言即法義至理無滯和合僧義非法不知故須在初非佛不曉故後說也僧居中者體未純淨如雜血乳分有所遣豈喻醍醐故不同佛也四一體中初標列體下隨釋又二初示三相前敘迷今下明悟上二句悟實體本一故下二句悟權知方便故涅槃云善男子汝今不應如諸聲聞凡夫之人分別三寶於此大乘無有三歸分別之相所以者何於佛性中即有法僧示法本也為欲化度聲聞凡夫故分別說三歸異相明隨分也故知分三暫被凡小故云一方行化即娑婆機宜也故下顯一體義照即能覺智理謂所覺常住佛性離名言者體寂滅故理無滯者隨染淨緣故非法下二顯次第初二句明法初知即是悟法體常住隨悟得入故必居初次二句明佛後逮至極果方究盡故下明僧中此據初心至於等覺皆是中間涅槃迦葉問品云衆生佛性如雜血乳血者即是無明行等一切煩惱乳者即是善五陰也乃至須陀洹人斯陀含人斷少煩惱佛性如乳阿那含人佛性如酪阿羅漢人猶如生酥從辟支佛至十住菩薩猶如熟酥十行十向十地等覺並同此喻如來佛性猶如醍醐上列三乘皆是分遣未及果佛故云豈喻等也疏據四位別論次第今總四位可例明之理體一體二皆常住則通三世化相現在住持滅後此約如來從凡至聖出世入滅則一體居初若從佛出開演化導則化相應初理一居次住持最末義可知也疏四功用者疏四寶為言理寶為勝由常住故為世所歸餘三隨設體是有法功用正明中云理寶勝者理通大小生空真如是小乘理清淨心本即大乘理今須約大以論勝劣歸敬儀云理謂至理天真常住還是心體若爾與一體何異答一體在迷專據凡說理寶約證唯從聖論故分二矣是故理體獨勝餘三疏問心本清淨非世所染一體常住何不為勝問中理一兩位淨常不別獨推理勝故須明之疏答就理為言誠如所問語相為論穢雜非現何得同佛所證心源故涅槃云或有佛性二人俱無明知行果異俱有答中初文上二句縱許來問語下奪歸前解上二句明一體劣下二句顯理寶勝理體雖一生佛異故故下引證迦葉問品云善男子或有佛性一闡提有善根人無為勝他利養為他所屬繫念無色天如是修善人也一闡提此云無信或有佛性善根人有一闡提無邪見斷善障自性故或有佛性二人俱有性平等故或有佛性二人俱無二並凡夫不同如來已證之性故云無也善男子我諸弟子若解如是四句義者不應難言一闡提人定有佛性定無佛性若言衆生悉有佛性是名如來隨自意語經明如來有三種語前後三句方便教中隨他意語指前權數俱有一句一切悉有名隨自意語今經實意又經云若說一切衆生悉有佛性煩惱覆故不能得見我說如是汝說亦爾是名隨自他意語經明四句此中略舉二俱以證生佛之異二人即闡提善根也望佛所證則二人俱無望凡皆具則二人俱有明知行果即指如來修證經云十住菩薩少分見性故知唯佛證性究竟凡夫但具何得相擬疏有人云住持三寶末世為勝理在冥通但為玄德世唯相有假相開通濁世鈍情非相不動約機接俗信不虗也他答中初二句標示住持勝者局據滅後若就通論化相現在為勝一體常住在迷無染豈不為勝隨義雖通理如上判理下二句顯理非勝體離言象故云冥通神用難思故云玄德世下釋住持勝約下二句似是疏家許與之詞疏二解歸意若就後偈為演律藏令法久住約義以論六種差別一荷恩故佛說法藥僧是弘傳為拔毒箭興顯於世皆於我益何得不敬二加護故濁世障深將欲傳通多感魔業作諸留難若不威加無由遠離三生信故謂妄意言不承宗緒故前列敬知稟有由四表敬儀五衆所歸並宗三寶今欲通法必先興請近行世供遠住法故五顯勝相如成論云三寶最吉祥故我今初列六開衆生佛法僧念故以三寶大利惠益無邊微沾希向歷劫不朽故前列之令興敬念歸意中初指文以明約下就義別顯六種中一二及五恩威勝相皆屬所敬三四與六信敬存念並屬能敬毒箭者喻我倒三毒能害淨心故以喻焉四中世供即然香稽首六中不朽謂善種不失此約半月將演聖訓盡敬祈請內誠所為六意備焉疏就釋文中初稽首禮是能敬儀也後列三寶是所敬境也就文釋疏形表心敬頭頂至地故曰稽首稽者下也如經論中敬有三品據世俗禮則有九品稽首稽顙頓首頓顙並是一也能敬中初科上四句示名義稽訓下者下至地故如下引二教以釋三品出智論一口禮言相問訊名下禮二屈膝即跪立名中禮三頭至地即稽首名上禮九品出周禮一稽首拜頭至地頓首二頭叩地也三空首頭至手謂拜手四振動戰栗而拜五吉拜拜而後稽顙謂吉事而致拜六凶拜稽顙而後拜謂三年服者七奇拜奇居宜反謂一拜也答臣下拜八褒拜音報再拜也九肅拜但俯下手拜稽但著地頓乃叩頓首即是頭顙謂面額名雖多別事亦無殊故云一也疏禮者敬而已矣由屈敬故表情盡儀故云禮也禮者理也事行合於正理也餘如鄭玄注周禮說古德相傳禮謂拜手據俗中解禮則通諸不可廣說但知略也次文中初示禮本敬在於心禮見於身心敬不已身乃致禮是則禮者唯主於敬更無他意故云而已禮者下次釋禮義禮記云禮也者理也樂也者節也君子無理不動無樂不節又云禮者體也體不備君子謂之不成人設之不當猶不備也餘下如上所引皆彼文也古下三斥局言通諸者一禮訓於理不唯在拜又如上九禮豈止拜手知非局矣不下示略廣在歸敬儀中疏衆聖非一謂諸佛也致敬教主所以通者顯道無二齊須同敬故兼諸佛也又下列七佛即通奉敬若準流通三世齊禮次釋所敬佛寶中初文上二句牒釋致下釋通敬意餘宗戒本但歸釋迦獨今四分遍敬諸佛道無二者通而為語自行修證化他權實別論今意釋尊制戒開遮重輕並觀三世無異轍故又下據前後序釋上諸義疏問教是小乘無現在佛文所列者乃通過未答此宗大乘如羯磨疏光律師判非是小乘故戒下云現在諸世尊斯文良證也釋疑中初問意者以今小教但明大千世界釋迦一佛以為化主無餘佛土文通諸佛義實乖宗故須會釋即指前引答中初正答此宗大乘者即分通義指如疏者彼約五義以顯分通一沓婆回心二施生成佛三相召佛子四捨財用輕五識了塵境如彼廣之光師下據他判故下還引流通為據疏上以稽首通敬餘二名為及也次釋餘二疏法如上解法寶中指如上者見釋名中疏比丘僧者攬假成用也比丘者梵天本音名為苾芻傳之訛僞故致斯耳僧寶初科先示僧體人無自體五陰合集號假名人陰本無用假人有用總四人假以為僧體故云攬假四人和聚能辦前事故曰成用比丘是別攬別成僧故兩列之比丘下標名業疏云或云煏音闕芻疏此方無人以三義譯一曰怖魔或令魔怖遵修三行出三有也由此義故名之為僧故五分云為解脫出家名為僧也二曰乞士有二義故上則乞法以練心下則乞食以資身得法奉持驗以四教受食觀厭須離五邪廣如常解三曰破煩惱者欲使依名思義顧瞻有本不至流俗唯欣出要故云於我法中怏修梵行盡苦源也義譯中初科上二句標示一下別釋初義兩別怖魔者明其本志魔怖者約其功行魔有四種天陰惱死遵下通釋二名三行即戒定慧由下結名故下引證此釋比丘皆云僧者以衆假別成故別從衆號次義中乞即求義法是道因食乃道緣因正緣傍故分上下得下明二皆從正方成此目四教即涅槃四依一依法不依人初令依法謂不以人廢教二依義不依語二揀依教不以言害理三依智不依識三揀依義不以情礙智四依了義不依不了義四揀依智不以權妨實此四辨決邪正行者依憑故五邪者一為求利養改常威儀詐現異相二說己功德三高聲現威四說己所得激動令施五為求利養強占吉凶後義中初句示名欲下顯意依名是聞思義即思顧瞻下是修由此一名克全三慧顧瞻即觀察有本即煩惱不至流俗者棄捨世樂故欣出要者高慕聖道故故下引證即佛以善來度人之詞初句生正信次句修因下句證果苦是生死源即煩惱疏又解在因名怖魔乞士破煩惱也在果名殺賊應供及無生也相對轉勝故殊絶也對果中初文果號阿羅漢亦具三義翻前三因殺賊者二惑盡故應供者是真福田德堪物供故應字平呼謂相應也無生者苦報永亡故因名己勝果號復勝故云轉也疏問乞法練神何不至果答如筏喻者渡已不乘藥為治病病亡藥遣若不除藥又成深病止得就因形有資待若從果德應為物供乃至因有惑可破果無惑可生例而知也問中以因分二義果偏對食故問釋之答中初明法不至果筏藥二喻以顯至果因法無用形下重示餘三因必至果乃至者略前怖魔魔如怨賊因中怖之果上已殺謂斷盡煩惱不受後陰永無死苦天魔反懼義同殺也律今演毗尼法令正法久住疏次解第二歸敬本意初句明意後句明益次釋半偈疏說非過未傳顯當時故曰今演此謂能弘之緣也明意中能弘緣者今指說時演屬說人二竝緣耳疏毗尼法者謂所弘之教也毗尼翻律律訓為法轉釋取義令易解也釋毗尼中所弘教者即指戒本名義齊列故云轉釋疏如母論云毗尼名滅滅諸惡法故曰毗尼所滅有七謂犯諍煩惱比丘及尼少分一切處也二百五十戒為少分也淨戒心慧微細戒者是一切處也引文中母論先示名彼云毗尼能滅不善根息諍能滅障法三世三障能滅五蓋惡行見行惑業名為毗尼今以諸惡一句總之所滅下列相初言犯者方便趣果污體成罪故論云從犯毗尼出罪毗尼是也由犯成罪故二諍者如四諍起七毗尼滅論云能滅鬪諍故三煩惱者論云能斷煩惱故有本改為毗尼誤也四比丘五尼者即二衆不同戒六少分七一切處二下別點後二非出彼論戒實無量且據數作為持犯蹊徑故云少分淨戒即別脫心即定共慧謂道俱微細戒者總上三種別脫微細者謂戒本之外八萬無量塵沙制也疏如上滅解但是對治所除至於相翻如上解是會名中上二句出論意上之七種總括為三一諍二惑餘皆屬業竝是所除此明論家隨義釋名不當正譯暗點古師所據之失下二句總歸今譯如上即總義中疏又如明了論毗尼有九義一者比丘毗尼如故出不淨等二者比丘尼毗尼如獨行戒等三者二部毗尼如所學淫盜等四罪毗尼如八緣起所生對治得滅五惑毗尼如三界五品惑也六者有願如沙彌十種學處七者無願如白四竟諸戒並起八者時處如邊地受五得數澡浴中國不得昔用三歸今時不得熱時數洗寒時不得等九一切處毗尼如殺盜等一切時處皆應共學等了論初二即二衆不同戒三即同戒四中八緣起者一有罪從身生不從口意生如不閉戶共非大戒眠等二有罪從口生不從身意生如善心為女人說法過五六語等三有罪從意生不從身口生如心地諸罪四有從身口生不從意生如善心為男女作淫使等謂媒嫁也五有從身意生不從口生如故出不淨等六有從口意生不從身生如染汙心對女人說淫欲語等謂粗語也七有從身口意生如有染汙心為男女作淫使等八有不從身口意生如先對人說大妄語彼人不解此人已對治三方便後時彼人若追解其語此人即得波羅夷罪五云五品者論作五部舊記準發智論云見苦所斷結集所斷結滅所斷結道所斷結別示見惑修所斷結總示思惑三界各有五部成十五部惑有願者具戒方便故無願者已滿足故八中論作一處疏加時字如下明處昔下明時此二並約受浴顯相餘事準說疏據此九位罪惑兩種滅義以明餘有科條並從法也又解罪惑對治事理多途若非律教何得詮別故通歸法方顯彼此也示名中先約兩判又下指歸一義初示化制相濫事行治罪理觀治惑事則篇聚重輕理有性相等別故云多途若下明律能簡別故彰法義疏二解演布益中由上傳持正法興顯明益略釋中躡上顯意疏問會正之極勿過明慧如何久住偏約毗尼問中據論斷證慧學功高文偏指戒假問以釋疏答明義不同各有兼正據理深淺能治功用戒律指事伏業方便故劣明慧若就住持建興三寶則律為勝由世隨相有律附緣生親成大用故文云以衆和合故佛法得久住也又約根條定慧不及自不能起必由戒生如經依因此戒生定慧等教據斯義故弘演之答中初通示據下別釋先約斷證推慧為勝若下次約住持以明戒勝初正示真理體寂非證不知外無表示住持義劣律相昭顯故獨標勝由下釋所以初句示世諦隨事對理體空故言相有次句明教依事立緣即事相止作二行竝假衆緣以辨成否下一句正顯功用謂衆別兩行生善滅惡內軌道衆外發俗信維持光遠功由於此故云親成大用也故下引證即律序偈顯示久住全由衆法律藏獨勝文據甚明又下次約根條義如卷首教興意中教下二句總結二意對合文旨疏所以善見論中佛告阿難有五法令正法久住一毗尼者是汝大師二下至五人持律在世三中國十人邊方五人受具四乃至二十人得出罪五由律師持律故佛法住世五千年廣文如彼引證中論出五法初是約教後四從人二五相濫約義兩別但二取知法之能五約延時之久三四二種受隨分之問所以住法須五人者答除出僧殘餘皆可秉四人雖體不辨邊受受法不行僧寶永絶道假人弘由僧絶故佛法無託苟闕斯人法皆覆墜五千年者有二初五千年中一千年得三達智通三世故二千年得四果三千年得三果四千年得二果五千年得初果第二五千年學不得道萬年經書滅盡但剃髮披袈裟而已願諸後學竭力護持但得五人是名法住末世雖多但知剃染戒德不修律範安識豈能令法光顯於時況二千年尚得四果去聖未遠但不䇿勤必有勇進何患不及請觀聖論退而省之疏良由一聞行教信而奉遵業非外傾定慧內發遠近兩果無不思懷引生後進永隆萬載故為久住也出所以中初明修因慕果下云近獲人天遠成五分此為兩果引下明相傳不絶顯久住義疏然此歸敬一行偈文戒本或無者但是後人妄減非是梵本略之通撿諸部戒心卷首皆明歸敬考文約義理必具之豈得徑歎戒功前沒三寶輒增勸信誰能奉行故知引者是也昔人謂同大律或且標異前弘刪略傷甚為過久矣斥略中即願師集本文相有四初明減略通下二取他宗例決十誦僧祇五分解脫四本皆然考下三約義斥非彼本卷首便云戒如海無涯故云豈得等不列三寶無所稟承故云輒增故知引是者取覺明慧光二本也昔下四出古除意上句明簡廣律下句明異他本前弘即上二本刪下結責有本大同字倒又多於字或且誤作戒字律戒如海無涯如寶求無厭欲護聖法財衆集聽我說欲除四棄法及滅僧殘法障三十捨墮衆集聽我說毗婆尸式棄毗舍拘留孫拘那含牟尼迦葉釋迦文諸世尊大德為我說是事我今欲善說諸賢咸共聽譬如人毀足不堪有所涉毀戒亦如是不得生天人欲得生天上若生人中者常當護戒足勿令有毀損如御入險道失轄折軸憂毀戒亦如是死時懷恐懼如人自照鏡好醜生欣戚說戒亦如是全毀生憂喜如兩陳共戰勇怯有進退說戒亦如是淨穢生安畏疏就第三段戒如海已下廣陳體相上演毗尼雖久住益未委住持有何體相引文成證深有遠趣第三釋九偈初科躡前生後尋文可見言引文證者偈詞始末顯相勸信並依誠教故疏就分為三初一偈明戒德宗體弘廣引生能為聖道之因基也雖列本基業理微隱自非假相無由生解是以第二欲除四棄下三偈略舉篇聚結說有人則表行相有承寄也上乃教明未詳持毀縱欲承遵恐徒疲頓故次第三如人毀足下四喻五行明持毀得失衆別之行此之三位統收義盡何以知邪前明戒德宗體所歸次明戒相生行緣境後明戒用結成本業科文中初段云宗體者宗即戒法體謂受體此據已受之人納法成體故云聖道基也弘廣即指海喻引生即如寶喻雖下敘次段初句躡上業下發後業即戒體造作成故號為無作非色心相道理難見故言微隱略舉篇聚即欲除下一偈結說有人者即毗婆下一偈半有本則表下多持字有承寄者即我今下半偈上下敘第三節初二句躡前縱下起後四喻五行前二行是一喻後三行各一喻又前二別行後二衆行如下委釋此下總示初明法體次即戒相後是戒行則知此段備敘四戒宗體是教行之本故曰所歸戒相所列成犯緣境為成二持故云生行戒用即目戒行用謂功用非行不彰從功表行故云用也結成謂行心造作本業即二持善因因能感果故云本也或通持犯善惡二業彰戒功深持益毀損疏就前體中上半喻陳明清惡生善之德也下半舉益勸聽也牒釋初偈疏就初喻意戒旨深遠淺識未間故借近事以況斯理喻意中初文近事即海寶況比也斯理即上戒旨疏有人云諸方類聚各有偏習故天竺恆言多涉譬喻此方不爾今解不同詩有六義比興存乎睢鳩葛藟事微喻大何得偏指推委華胥次科先出彼意上二句敘人處不同諸方且指華梵類聚謂人物同處下二句示偏習之相今下顯非毛詩序云一曰風刺上化下曰風二曰賦布義曰賦三曰比取類曰比四曰興感物曰興五曰雅政事曰雅六曰頌成功曰頌睢鳩即鳥名睢匕余反會雄雌有時不淫於色詩者用比文王后妃之德詩有五章第一卷首此不煩引葛藟力軌反菜也生於水邊刺平王周室道衰棄其親族葛藟生於河之崖得其潤澤長大不絶興者喻王之同姓得王之恩施以生長其子孫今乃不顧反不如彼葛藟矣詩有三章出第四初關睢正夫婦葛藟正親族此二皆王者為國之本故云喻大何下結責疏就喻有二初明深廣無涯性不納穢喻次明能出衆寶使求無厭喻疏言戒如海者海為衆流所歸戒為衆善所集體周法界故曰無涯清澄離染性不容穢律本所明意存後解戒文所述但舉無涯具兼之也次科深廣喻中初文二釋初周遍義二離染義衆善即世出世間凡聖行業體周法界者就境示量也律下會釋初指律序彼云譬如有死尸大海不容受為疾風所漂棄之於岸上諸作惡行者猶如彼死尸衆所不容受以是當持戒此即但有清澄一義戒下會今文謂文偏而義具疏然涯之一字世濫者多或山下安崖則山邊險處若水右安崖則水邊畔際今喻海界不可兼山或名為儀傍通非正楚夏之異何得妄言應從改正五佳反也乃是世語隨俗無過脫經學識不涉上迷次科初定字體字義兩別不可相濫或下正語音楚夏謂南北音異佳字音街則與山崖字別音同今時略韻亦通崖字乃下示意上二句遮情下二句勸學脫猶或也疏二如寶喻中寶為世重求得無厭欲明戒海非但清澄兼生道品三聖所重故言寶也常行志求無時暫息故去無厭也次出寶喻正釋中初科道品者約行次第三十七品廣如事鈔約人進位大小賢聖疏然戒寶豐積贍周生類故使前聖果圓後賢因滿引生來業展轉住持衆生無盡戒寶無竭也據文能求之懷也從義所求無限也次文初句明體量之廣欲句顯被物無遺故下示無窮之益前聖後賢並通三乘上是自行引下明化他來業謂戒善功德法體常住在人所興人相繼接法何有盡有同世寶滋長無窮據下合文意偈云無厭正約能求然由無限故使不厭以示此科從義釋故疏又寶有二能一現除貧苦者顯戒現止業非能感名利交免三塗之貧苦也二資成形命者顯戒近獲人天遠成五分斯益既厚故求無厭三中二義初句標喻顯下法合初除現生貧苦止惡積善故不貧人天聖道故無苦交俱也次義中標喻法合亦如上分凡聖兩報由戒資成世出世別故分近遠斯下雙結疏問如經論說海喻多種今此偈中止列二者問中多種者海有八德一漸深漸入二潮不過限三不宿死尸四百川來會無復本名五萬派悉歸而無增減六出衆珍寶七大身衆生所居八同一醎味戒本上句可配初德次句對第六旁兼清澄即是第三欲顯戒文出二之意故問申之疏答作者知時明喻舉要初明深廣清澄喻顯說戒儀專被行淨如有纖過非聽說之儀也是以今初開宗即明簡衆喻衆成由行能懷聖寶故次辨求無厭喻此二攝化始終餘非要務故略不敘答中初歎美部主初下次正申所以前明無涯喻深廣清澄兼含兩義衆成下次示求寶喻此二下正通來問前喻衆行後喻自行說戒攝僧要唯此二故也疏就法說中初舉喻益勸護聖財後明體不虗圓必假說聽之力方便攝持名之為欲對治行成非緣不起名之為護戒德內充資神養聖目之為財財即道品恐濫於世故云聖法合上寶也次法說勸護中初文欲護二字即是能持始終二心神即心神聖謂聖道疏所以不合初喻者前顯戒體量周無際後顯多寶充足所求求在無限終從戒海故所出之寶無窮則知能生之海無際是則聖財通於三道欲護聽衆亦被三乘若作此解具兼兩喻次科初徵起前下正示意以所出之多足顯能生之廣故但合寶即兼海矣是下點前聖財不專戒學方顯出生無窮之義三道約法諦緣度也三乘約人可知若下結示文旨疏說戒明約非別所弘既同奉行義無不集故云衆集聽我說也說聽中別人對念無人曲開文從本制故云非別等約即制也疏上歎戒體無際無厭愚夫迷旨非不遲疑故次第二列相顯示次釋三偈初科上二句結前無際無厭即指二喻疏就分為三初一偈舉列廣教勸信修捨次一偈半引佛成證結說有由後有半偈顯己承傳勸受聽說次科總分中修謂履善捨即離惡結說者結謂總括七佛說即創制廣教佛不說廣偈云說者即是制耳疏就初文二前之三句廣教戒相滅惡之功下有一句舉功勸聽疏欲除四棄者舉此教本能防未非應起不起名之為除非謂已犯而說除擯假名比丘方便禁警使初篇業冥伏不起名為欲除所除是何即四棄也而言法者法義極多今取能成犯緣故云法也釋四棄中初正釋非下遮濫假下重釋內凡已還未見真理無實德故通號假名初果已去名真實僧冥猶潛也法義多者如自體軌持之異今取等者謂諸戒相各列犯緣具則成犯揩式軌定犯由緣辨故曰能成即二義中軌持解也疏若據義收滅障除遣隨言皆得莫非離過而為本也總示中以文列三篇三名別對恐生局計故總示之文無遣字義類無異故通舉之疏初篇既離行本得成若不淨撿二篇衆法難立故名滅也疏上具戒行不顯威儀則形心不淨衆法無託故當靜緣令非不起是曰障也次釋殘墮皆躡前義勢發起後文並云衆法者對今說戒當機要故疏既已識相依說須行故又勸聽也計初一勸義則兼通但以末世鈍機情多浮濫聖所制禁凡所常行恐未志奉妄有輕忽故又重勸釋勸聽中初牒釋計下明重意初二句指前偈但下申所以專念曰志遵行曰奉說本為行非聞不曉惑重信輕故頻加勸疏問戒行之本具通輕重何故但舉三篇問中以戒本五篇不具列故疏答滅惡之戒通攝五篇且列上三餘蓋存略又解初三戒攝下是威儀且舉綱領故不隨事又云今列篇相正存聽說序中所為凡有二人專精不犯非治所科犯已從滅法唯三別初篇非數所攝雖懺終不成僧二篇唯是衆除三篇同對別捨廣教具含二淨義須列相示之答中三釋初文略釋可解次約提綱釋戒分列二不明偷蘭威儀標一不顯餘三故云且舉等三對懺法釋初示列相序下約人釋義序為二人者文云犯者應懺無犯默然故初專精人因而先出次犯懺人正釋今文犯雖有五懺但分三提舍吉羅並對首悔故同一位若論初二同是衆法但初不復本次局二十故分二位又據下三約說三一有異望人對別是同二淨即前二人初人持淨次人懺淨疏第二毗婆尸下明能說教人就文分二初一行偈列教主之名後半偈結人以成法表無虗演意也釋次偈半教主名中疏若依增一初佛百年前說略教後方說廣如是後佛八十七十六十四十二十及至釋迦十二年後方制廣教初文七佛說略年數第減者以鈍根漸多稟略漸少故釋迦中制合作說五年已制故或可制弟子說義亦無妨疏問如律文云第三第五二佛唯略經說何通答適化無方隨機隱顯斯乃聖心布教盛衰非凡所謀律隱二佛之廣生請制之由經陳七佛之通表化儀之相未可偏執五過自生問中律序舍利弗請佛制廣問言何佛法得久住佛言毗婆尸等四佛法得久住以制廣故毗舍那含二佛法不久住以不說廣故則與前經相違故舉問以會之答中先敘難測無方猶言不定盛衰謂律明住滅謀謂圖度律下顯經律之意各據一端機見有異未可和會五過出成論謂迷名生法癡隨文增五失一不正信二退勇猛三誑人四謗法五輕於聖法疏問文中唯引過去不明現未者答往佛有教可傳師資成訓勸信易立所以引之現未無教無由生信次問中佛在六為過去滅後七皆過去答中初答唯引過去後答不明現未現佛化他方教法不被此未來同此土教法復未設望今現無故云無教疏問序文闕於現未何故流通具明三世答各有其致戒序將弘聖教恐時不奉故引已起之教成勸信之由流通泛引戒益必行會聖聖不虗會三佛皆行因教圓德無不果滿也第三問中欲伸前後出沒之意故此問之答中初句通示戒下別釋初明今闕時謂時機流下次彰後具泛廣也意明序首勸信過佛教成有所信故流通顯益可通三世彰益大故疏釋七佛名如略教解疏就結人成法中七佛非一曰諸宇宙無上曰世尊行滿位高曰大德也為我說是事者引上廣教被下世機定非私傳聞必至聖此則顯己承習有由何得不奉結人中宇宙者俗典但指天地之中今則必通大千境內行滿者三祇纍積位高者衆聖中尊引上釋是事被下釋為我顯已即說戒師疏文中分二初句上有所承今將紹續如教而談云善說也若為名利無益而傳則是綺語非義所攝下句明說說必被人忍乖法儀故又誡勸贊美傳習之賓故曰諸賢諦受無倒故敕之云咸共聽也三承傳中初科文闕牒章分句孤起疑是寫脫上句前釋我今欲如下釋善說下約綺語反顯善義下句中初敘重意望前二勸故云又也贊下牒釋傳習賓者即目聽衆敕誡也疏如經論中大小兩乘俱有賢聖並約道業有顯晦也據翻從俗釋訓賢者多才行也聖者無不通也斯並約事為言全乖佛義有暇廣之次文初約佛教大乘十住十行十回向名三賢十地名十聖小乘外凡有三內凡有四名七賢初果至無學名四聖道業顯晦者一往以分聖顯賢晦然賢聖中次第淺深自有顯晦據下示俗訓謂翻譯時依此俗典禮記中才智倍人曰茂倍十人曰選倍百人曰俊倍千人曰英倍英曰賢白虎通中明聖人者謂道無所不通明無所不照聞聲知情與天地合德也此二皆從世智為名故云約事異上佛教所明行位故云全乖有下示略此謂偈中諸賢之語稱美時衆必據佛教修行之人名濫俗儒故此簡別疏第三段中如人毀足下廣張隨行行法乃多舉要衆別所以爾者衆無別衆攬別以成別無恆別行立成衆故託斯二以持正法就文四喻前兩寄別行以生喻明損益以誡持後二寄衆法以生喻明淨穢以誡說此則初行後教生成義順一途之釋也釋後五偈分科中初敘立科意衆即四人已上作羯磨事今指說戒別即自行隨行雖多衆別收盡故云舉要所以下釋須二之意此明衆必假別能成衆二行相關故須雙舉故下結成文意就下分文初二喻並言毀戒即是別行誡持後二喻皆明說戒故為衆行誡說此下合示若據常途因教生行則教先行後此明行具方成衆法則行先教後故云一途也疏就初兩喻即為二意初以戒為身足喻止持也一形所託必憑足而遊涉萬行所資要藉戒而成立如經所明若無此戒功德不生也後以戒為車軸喻作犯也御者所持在軸軸壯而轄堅行人不壞於本亦業全而戒具反則違本如文所訶總解意也釋前二喻分示中身足喻止持者此約義科據下附文則前偈喻止犯後偈喻作持耳車軸喻作犯就文判也業全則受體無缺對上軸壯戒具謂隨行不違對上轄堅如文訶者即死時恐懼也疏次釋前喻喻分兩偈初約止犯之損令觀過生厭後約作持之益舉樂果生欣身足喻中初偈疏就初分二上喻下法疏釋文云毀行之士名曰如人內無明略外有愆失名為毀足戒品既壞世樂尚虧何況道果而有登趣故曰不堪有所涉也別釋中初科明略謂智謀也世樂即人天也疏就法合中兩對相曉依文可解法合中上喻已釋故但略指據喻言通凡聖兩果法中舉凡意在況聖疏次解作持偈文上半明人天兩果舉勸修因下半明勝果所尅必假良因義須守護文相甚易未勞解也次作持中初文可解疏問上云戒興存道本非為福今偈所勸反彼何邪問中引前教興作難疏答上已略開今重廣敘元制為道誠如聖言但為聞教之機時含利鈍鈍者引以世報權示化城利者以慧資成便至寶所斯並隨機設化當尋本據若執戒為真道道則戒結所收唯戒極高復是見取所攝為樂持戒翻成穢染如百論中難陀之事至時長引取悟於心答中大論戒律不出二義一本如來出世之意三歸五戒下至微善無非為道而作弄引過分而談二乘聖果尚非本懷豈以世樂而評聖旨此約教本也二者二乘聖道必由戒剋人天兩報戒見二取穢汙諂詐持奉多途此約機緣也若了斯意則教門同異無不會通初二句指前標後元下二句通前興意既云元制即教本義聖言者即指前引為調三毒等文但下正釋今文而云利鈍即約機義應知今序且被鈍根下流通中利鈍雙被化城寶所出法華經彼明如來施權說小如以化城暫令止息至後顯實喻至寶所獲珍奇今借彼喻會通今教凡聖兩報言同意別思之可見斯下雙結上句結成今意下句指歸前意若下明背道過失初即二種利使為樂下即明汙心百論者彼云樂報有二一者生天二人中富貴若持戒為求生天與天女娛樂若人中受五欲樂乃至引阿難語難陀偈云如羝羊相觸將前而更却羊鬪欲前而退羝音低牯羊也汝為欲持戒其事亦如是持戒如將前為欲如更却身隨能持戒心為欲所牽斯業不清淨何用是戒為疏上解止犯作持竟結示中欲發下問故在此結不當前後疏問上云身之所假足喻止持及釋文中乃論止犯斯則持犯同門如何分判問中初牒前相違斯下正難持犯行別善惡業殊不宜同門故以為難疏答持犯止作事通前後望戒全者名止持無心攝護名止犯勵意防慎名作持具緣造非名作犯據此以論隨事始終皆二持犯餘如後解答中初二句通標若據持犯心境體異非可同時但心起不常善惡相閒故約前後可得兼明望下別示隨舉一戒並具四行則持犯同門於義無失據下結指隨事事即戒也始終即前後皆二持犯即止作四行故知後從犯釋則貽毀戒之文前約持科欲示兼通之義餘下即指卷末持犯中問文既明犯那用持科答此由序中闕止持喻故約義科如下點示可見疏次解作犯喻中上喻下合疏假名行者執持圓戒學調伏心名之為御御攝三業將遊塵境名之為入五欲之賊能劫善財使沈惡趣名為險道縱放身口隨境不禁名為失轄轄在二輪之表犯必兩業之門故也無作戒善萬行所憑名之為軸身口轄失定慧輪摧戒善便喪故如軸折如上諸損智者懷悲將趣三塗義無歡泰故云憂也作犯明喻中車喻多種執御之人喻能持心兩轄喻身口二業即是隨行二輪喻定慧兩學橫軸喻本受戒體初配上句圓戒者具足體也沈惡趣者舉果顯因也縱下配下句轄是括輪之物在軸兩頭括束於輪故云二輪表也兩業即上身口疏次合喻中上句合九字下句合一字可知也法合中初科分句對字在文易解疏問毀戒業非何人不畏豈待終時方生恐懼次科問中欲彰部主知機之意故特徵之疏答人懷愚智持犯兼之律序具彰今更為引智士覺過尋知厭蕩愚夫縱罪初無改悔身心強健放逸刑科要至死時方生怖畏以色力痿悴神慮無歸自知佛賊贓狀業現苦具將臨何得不畏是以律主懸知濁世非死不憂故舉勸持無令後悔悔無及也答中初通標所被即律文云有二智人有罪能見見罪能懺有二愚人有罪不見見罪不懺愚智兩機俱通持犯故云兼之也指律序者彼偈廣列持毀得失今略引云如師子虎吼醉者不恐怖醉喻愚人小獸聲雖微醒者聞即懼醒喻有智如是三垢人一切惡不懼合上半偈三垢即三毒智者於微惡常懷於恐畏合下半偈智下二正釋初敘智者知過必改不待苦勸下明愚人遭苦思悔正顯文意初明生怖初猶都也以下釋所以痿謂困頓悴謂瘦悴內無實德假冒形儀妄受信施侵壞正法故云佛賊刑贓露則刑戮將加惡業現則獄報即至矣如大論云持戒之人命終之時風刀解身筋脉斷絶心不怖畏反知毀盜寧不怖耶學者臨文宜應內省其有死而無悔者則教所不救矣是以下出制作之意疏準上據下應有止持有益喻翻犯明持可以相領有無互現未可齊觀辨闕中初文準上者前二偈止犯作持據下者後兩喻各具二行上下既具可驗此闕示意有二上據相翻下約隱顯疏尋中梵偈文法喻自足彼葉一偈三十二字唯此方言多少無準或三四字或五六七節以聲言用為偈句次科示梵偈中初文彼用貝多樹葉以書經教故言彼葉又不論長行與偈例以四字為句八句為偈今文唯初喻八句餘並四句則明傳譯有所闕矣唯下示此土不定如文選古詩隨人所撰不拘章句準知經律五七字偈並隨方俗非本梵式也疏或尋偈字便訓為竭謂攝前散章竭盡文義也即反偈字例竭音也檢諸字書無可憑據積習生常何由頓曉二中初斥釋義即下斥反切字林作丘竭反毛詩音義去謁反漢書音義其逝反故知音竭殊無所據撿下總責疏又尋翻經古譯則云偈他頌今云伽陀頌斯則伽偈兩聲相近省略本故後所出者但云偈言故知偈他翻為頌也故今所翻無序之頌則云伽陀有序之文便為頌曰可以分也三中先出古今不同應法師云偈者梵言也正云伽陀或云室廬迦謂三十二字此方當頌攝斯下究存略所以故知下示華梵故今下明兩分今翻謂唐翻也無序即孤起偈有序謂牒前重頌此約華梵以分義無別也疏上所解文別行喻竟疏就解衆法教行喻中亦有兩行初舉教為明鏡喻顯作犯止持之人準教立行要由說聽之功也後舉教為神解喻顯作持止犯之人內省智略殷鑒淨穢也又解云前喻戒體若毀若護其果兩成後喻戒緣若縱若防其因兩就故篇聚雙列因果具含意可見也次衆法喻初科由偈文云好醜勇怯通含持毀故以兩喻各對二人據後從文合云兵戰喻今取𩰖戰必用智謀故言神解耳又下復伸一判戒體即五篇根本毀約究竟護取行成故云果也戒緣即蘭吉方便縱謂起心防據警察故言因也故下雙結如上疏次解前喻分二如上疏奉教兩衆依常集聽以行觀說如人照鏡鏡即教也止持行成能喪作犯之醜令戒威嚴名為好也作犯之惡能摧止持之善名為醜也斯並兩託教鏡而生欣戚好醜因說而現也隨釋中初科兩衆者持及犯也依常者黑白兩半也疏下法合中隨對可知戒善具足則名全致懷喜合上好而生欣遇緣壞行則名毀故懷憂合上醜而生戚也合喻可解疏就解教為神解喻中法喻為二疏如譬所明作持戒者妙在方便約止非緣對境相陵同兩陳也強弱相傾如共戰也正智達過明白無違如勇者進也癡墮居懷無心遮約如怯者退也次科喻中約止即能持心非緣是所防過能持所防則為兩陳正智等者謂心強過弱持心勝也癡墮等者過強心弱非境勝也疏下法合中說戒亦如是合初句何以知耶由說聽交對愚智勤怠彼此相違如陳合戰也下句中覩己行淨由持故成名淨是則戒淨心安趣道合上勇進也怠惰不學心昏境慢止犯穢心將鄰苦趣故常畏合上怯退也法合中初句以說戒師提示過境同集聽衆隨事觀緣故如合戰愚智約性勤怠據行即淨穢二機淨勇穢怯故曰相違下句對喻可見心安是成因趣道即慕果止犯即不學無知罪疏何以得知前喻作犯文彰全毀故知已起重罪也後彰淨穢故知將興輕罪既不違教是非莫知隨作恐犯故云穢畏也對簡中兩喻配犯前重後輕在文頗隱故特點示將興謂止犯之人既無所曉微細威儀必多陵犯故律世間王為最衆流海為最衆星月為最衆聖佛為最一切衆律中戒經為上最如來立禁戒半月半月說疏次明第四戒經弘益中分二初偈喻辭後總法合修說之儀第四顯益分文中喻辭四句是別列一切下二句即總合如來一句指人勸修半月一句至時合說故云修說儀也疏就初四喻即為四意疏王者尊勝威德超衆喻戒住持功高萬善故也然世間之王有三種異謂梵魔輪恐濫法王故云世也大海弘廣包括衆流戒善周通德收衆行也朗月明空除煩識妄戒除業惱見道知歸佛是法王衆聖師仰戒是正行九道崇之釋喻中列示有四初王喻又二初對合然下明簡濫梵王即色界初禪天主魔王即六欲天主輪王有四金銀銅鐵金輪統四州餘三第減可知海取二喻弘廣包含即前所引八德中二月喻亦二涅槃云能除熱惱即除煩惱也破暗見道謂識妄也戒下兩句即對二喻業謂七支惱謂煩惱道即諦理佛中九道謂三乘六趣疏斯等四喻世所同高借以曉之通明戒法疏問四喻顯戒其德盡不問中由通兩釋各有其理故問以引之疏答如來說法義周無滯略舉近事何得攝盡初答中上二句通示說法別指制戒制戒之意非止一端豈唯四喻而能盡理故經律中廣有譬喻如鈔標宗尋之可見疏又解假以世喻略收皆盡一往統舉空有所收有中極貴勿過王也包納水陸勿過海也光涼明暗勿過月也出有大聖勿過佛也縱有餘類竊比難矣次答中初總舉空有即真俗二諦攝盡世出世法今此四喻不出二諦前三並俗有後一真空故知喻戒義無不盡有下別示明猶照也出有唯佛此據理諦化相住持則通世諦縱下結顯以超群獨勝無及於王深廣遍周豈過於海照迷濟世唯月難倫凡聖尊崇獨佛無等此外餘物不堪為喻故云竊比難也疏就後偈中文分為三初有半偈總合上喻次有一句舉法屬人明無虗制後有一句說教之時非合上喻疏就初文中一切衆律中者合明三藏所明群行並有調伏業非之功義稱為律律即法也戒經為上最者指今所演如上四尊既同傾仰聞何不奉並謂三乘之夷途也法合中總合有三初釋以經論二藏通有法義故云義稱明非本翻也下句中即約行根住持二藏不及正宗行要毗尼不如故稱上最四尊即前四喻所顯四義既同等者顯示序中推勝之意夷途平路也疏又解但餘二藏明律相處皆名衆律故論云隨經律是也次釋雖兼二藏不取定慧論者未詳何文疏又解一部律宗雖明緣起辨相開遮法聚等文俱調身口各有正儀應同名律但為非結正宗不名為最戒本一段親起行基言約義周攝僧斯要故文所云戒經最也後釋中緣起等者即二部戒本初明國土犯人起過白佛即緣起也後有廣解即辨相開遮也戒本後有十犍度等即法聚也俱下釋衆律但下釋戒經為最疏然末世鈍機雖聞法勝若非至聖所立恐生疑慢故重舉人釋成法勝是以文云如來立也乘如實道來成正覺故曰如來也過犯既興隨便制約故曰立也法教所詮為存止善曰禁戒也次句中初示意前列七佛故云重舉乘下牒釋如來之名文出成論真理平等體絶虗妄故云如實乘履此法出現利生故得斯號即真應二身也過下釋制戒止善即禁戒義疏但以三乘既攝必藉教成故約晦望折中之宜時便為說故曰也釋後句中初二句述意上句示衆同之制次句明制集之意故下貼釋晦望即黑白兩半促則廢業延則浮慢故曰折中疏問但言半月即得被時何須重者疏答月含白黑兩半故也又但至半月即須說之故重言也問答中初約兩半釋又下約單就一半釋意謂雙牒乃是連纍無窮之語疏上解勸信序下明第二大段序正流通約文為二始於和合僧集下至已說七滅諍竟戒經中來正明廣教行法二從若更有餘佛法下至有慚有愧當於中學來明略教行法疏就此二教諸門分別一解名門二定相門三所為門四前後門五相成門六時節門次釋二教疏就初解名者疏何名略教以佛初成道將開化法創起希仰寄心無地故先示行法令依奉行不待犯戒未有罪故不得懷疑起謗略陳教法故曰略教初章略名中初標徵以下正釋初二句示教興之時創下明機緣已發故下明立教不下示名相不待犯者異廣教故不得懷疑者謂若即制廣容生疑謗知機制略不得生故疏言廣教者由略名含未曉前相雖造諸非不謂有犯故須廣張網目收攝罪聚鈍根之流聞便得解因廣說故名為廣教廣名中初標由下釋準前釋略亦應四節但闕初時廣在略後自可知故初明違略即廣教機生通禁三業未列過相故曰名含等故下明立教張網目者隨事別制也收罪聚者科約篇聚也因下結名疏又此廣名略分三位謂名報治也初篇品等以為名廣如初聚斷頭等二獄苦相對以為報廣如初罪生報九百二十一億六十千歲等三擯悔有別以為治廣如犯初罪覆故永棄有悔盡形略教所詮但舉其網未張此目不名為廣廣相中初總示初下別釋此之三位皆通六聚文中且據初篇示相篇聚名如後釋報中文列四重歲數即墮𦦨熱地獄僧殘二百三十億四十千歲墮大叫獄偷蘭五十七億六十千歲墮嘷叫獄波逸提十四億四十千歲墮衆合獄提舍尼三億六十千歲墮黑繩獄吉羅九百千歲墮等活獄餘如事鈔治廣中治含罰懺文舉初篇永棄即滅擯盡形即學悔七九治法通該六聚如鈔僧網中僧殘已下衆別悔法廣如懺篇略下對略結顯但此三種在乎略教蘊而未彰故皆名略疏問廣略二教通被時機佛初成道何不頓說問中略是頓說但問於廣意謂二教何不俱頓疏答聖人布教義不徒然藥病相投是其宗趣故初不說止是無機所以善見論云若滿未起輒先制者生誹謗故我等出家棄捨財色於世名利無所希求云何如來反以木叉繫縛我等豈謂善識世人心器又於佛說不生敬重令法疾滅故不先制待犯便制則知聖恩如醫破癰待熟方舉答中初敘教主知機時機多利奉略無違故云無機所下引證論有二意初明生謗即止惡意我等已下出其謗詞又下次明起敬住法即生善意如下舉喻於義易曉舉謂以針刺也疏二定相中疏略教有四初彰過門略如訶欲中如火如刀等二止觀門略如勸修捨三善三毒等三調伏門略如下略偈止唯三業四發行門略如經律中諸惡莫作阿含經解止在三學定相明略中初科四略前二舉廣及釋呵欲文見淫戒勸修亦初戒緣云當於如來清淨法中於欲無欲等修捨即是止觀止謂捨惡對下三毒觀即修行對下三善後二引略順釋三指釋迦佛偈四即迦葉佛偈阿含解者彼云諸惡莫作淨戒具足清白之行戒學衆善奉行心意清淨心淨定學自淨其意除邪顛倒是諸佛教去愚惑想除倒去愚即慧學疏上明四略義通道俗約教被人第三略中教設在道取其行方理通於俗亦不可怪如初篇戒過體則通取其聲教兩分其位各有理也總判中初示四門俱通約下簡第三通局初明教局本被道衆取下次明行通由無罪聚同十業故方法也如下引例過通教局義無異故五八俗教篇聚道教故云兩分如前二判義無去取故云各有理也疏言廣教相亦有多種廣相三釋並約義門總判大律疏一止惡教如篇聚等二生善教如受說等別釋中初云篇聚即僧尼戒本並攝止門受說等者即諸犍度皆歸作門疏有人云一遮未起教如僧尼所制戒等二滅已起教如訶人覆滅等二中遮未起者通收止作以受說等雖是作善還須離過故滅已起者唯局作持訶人等者即訶責覆藏滅諍俱睒彌遮犍度也疏有人云如上所說非無其致然教所被止在根機今分廣律不出三品如受說等法為上人教德衣財食為中人教訶人滅諍為下人教據此為論則此篇聚大歸不在上二也三中初敘立如下列示受說等者等取安居自恣德衣即迦絺那犍度財食即衣藥皮革等犍度也據下準判上約三機但對犍度篇聚止惡義是下人故也疏三明兩教所為則有四別三明所為疏初根條異略教不待犯制根本法輪廣教略壞方有則枝條也二為人異略教利機無過可起廣教待犯犯必鈍根三對過異略教不因過制無問自說廣教必待犯後制通淨穢四請不請異廣必待請如補壞衣略不待請一往便說別釋有四初後約教中二在機初云根本者能生廣故法輪者摧業惑故三中廣通淨穢即顯略教純被淨也四中律明舍利弗請佛制廣故言待請補衣之喻即佛答詞疏四前後相反者有三義故廣教制雖在後今說必應初明四明前後三別疏一以時機須爾末代鈍根聞廣如睡故聖前演望有欽承若為說略則用全疏微被少機不可不用二隱顯故爾廣教相彰化用形勝故前略題三業義通須後三功強故爾略教既壞制廣還興從興攝護功成先說略教不爾無補廣之能旦順別機故須後說初約時機則明佛世唯可用略聞廣如睡者以廣況略也若下明略不稱機微下釋兼略所以次約教相隱謂言通顯即相別形謂相形故前句絶後約功能取其能補唯廣功強順別機者不兼鈍故上云少機末世稀故疏五立兩教相成者疏問略教所為在彼利機於此鈍根事同不說故須制廣廣則毀略而制用略何為五中問意欲明戒本存略之意上敘略教不契時機下敘廣教已廢前略疏答元制略教雖為利機言略義通非不收鈍由鈍不解違略起非是教行俱缺也後遂制廣用充前略何以知然但略有包通之理廣無異略之能鈍士當機先作無犯廣名雖異還同略教之功是名教行俱補斯則兩教相成通無廢立約緣利鈍據實兼之答中初明違略制廣言略者唯一偈半故義通有二一者教通三業明行無不收故二者機通利鈍二根無不被故此明利根了知所造本於三業故能奉略鈍者不識能造隨緣壞行故須示相以為廣教充猶補也何下正顯相成初句徵但下釋上二句明補教略中具廣故曰包通廣即略相故不異略鈍下明補行違略無犯開廣續制全彼行故篇聚差別故言名異無非三業故云同略斯下結顯上二句明不可去留即彰戒本兩存之意下二句明所被通局上句明二機局對兩教下句示兩教各具二機疏六說二教時節者六明時節疏若依本部十誦增一十二年前略教所被後付弟子則通二教引示中善見二十年前說略今引三部皆十二年義鈔云隨根所見異故疏何以知然略教通含利鈍俱攝未張輕重又總機緣廣教不爾反前不說故善見云一切諸佛但說教授木叉不說威德木義豈非直陳三業通被群機若具篇彰便同廣戒故律文云此是如來最後說戒是良證也由佛自說不容非濫十誦五分云若為犯說頭破七分弟子不爾肉眼所見天眼舉罪違佛制故次所以中三初約二教對明上句推問略下正明初明說略意上二句通標下二句配釋廣下次明不說廣意既張輕重則非通含但被鈍機故非俱攝義鈔云若為五說利益不普是也故下次引示又二初引善見略教但指三業而直示故云教授廣教追事有怖故云威德豈下結顯後引本律說戒犍度云佛在瞻波國十五日說戒時佛在衆默不說戒初夜已過阿難請說佛言欲令如來於不淨衆中說戒者無此理也中夜後夜請答亦爾時大目連即以天眼觀犯戒者去佛不遠即以手牽出佛言聽作自言治自今已去汝等自作羯磨說戒此是如來最後說戒據此可驗佛不說廣明矣由下三正示所以此明如來因前重犯不說之意則知略教唯被淨機廣制通及淨穢五分云諸佛常法有五百金剛侍衛左右若問三反不以實答頭破七分天眼違制者即上目連因緣又婆論云不得用天眼知他惡法疏問十二年前已制廣教今言說略其義何乖問中僧祗五年制淫自後隨制顯有不淨之機而十二年前佛猶說略即對犯說故曰義乖也疏答律中所列重犯故耳自此已前先作無罪猶同無事至於說戒儀軌前說略已及至廣制說不難知故增一云因重犯戒佛止不說命上座持律能通利者說之故毗婆尸佛一百年前說忍辱偈後付僧說乃至尸棄釋迦八十十二可以情求答中初釋相違律所列者指前證文以目連牽出犯者因盜金蓮花葉望檀尼是第二犯故云重也此前無罪以須提那等皆最初故則顯如來已前說略皆非犯者同無事者略教云為無事僧即清淨僧也至下詳究說廣初敘難定前引諸文但云十二年後付弟子說不明爾前說不說故若據如來定不說廣此疑弟子故須決之故下引示經明如來因犯不說始命弟子可驗爾前定不說廣以文非顯故曰可以情求七佛年次如前委引注已前偈文法護尊者所作為廣略二教通序前開持毀之言以成說聽之本也疏注中已前偈文下結前生後意也第二牒釋疏欲明律主將演正法惠益時心廣張持毀之相式表弘傳之致也即結前文矣結前文中時心即通目後世同聞之衆廣張持毀前四喻式即訓用疏問如來說法天眼常明僧唯目覩義通淨穢如何制約還同佛邪答法利所先務在通洽有染聞戒於道莫行說必被機非人不授故母論云設僧百千但一毀戒則不合說明知聖制不欲徒然問中初二句示佛說唯須淨次二句明弟子通淨穢目覩謂肉眼也如下正難以序文始末無非簡淨欲彰序意故此問之答中初敘教意教被兩機故云通洽洽猶遍也有下明序意初正示上二句明簡穢次二句明取淨故下引證初正引明下顯意持者於道有進犯者聞之不行意令說聽成益故云不欲徒然則知序文深符佛意矣注和合已下二教大宗自分三分序正流通疏注中和合已下二教大宗生後文也疏文分為二已如上判生後文中總分如上者即前已判廣略二教疏就初段廣大分為三始於和合至序後如是持來明將演篇聚用曉時機機通染淨義須和問此則與後正說為興教之由名為廣教之端序序中略明犯者必悔無犯同聞所以第二從諸大德是四棄法下至已說七滅諍法如是持來八篇行相通明止作準此承修定慧因克是則名廣教正宗既識相護持理非獨善將流聖化廣被未聞所以第三諸大德我已說戒經序四棄下明廣教流通分也廣教三分中始下敘序分和即白法問即撿淨序下明正宗初躡前生起二人俱淨是合聞故所下正敘止作二行該乎八篇故曰通明既下敘流通分初躡前生後所下正敘疏就初廣序又分為三從初至白如是已來明集僧簡衆同遵行法表形心無二與下所說作發起之由義也衆雖和合必有犯非不應淨法何成說聽之則是以第二從諸大德我今欲說木叉下明誡敕時衆思省淨穢語默表情虗實檢行如斯自審則是聞廣教之當機也說戒法重事通迷悟故須三覆用表殷勤知過必改乃堪此衆是以第三諸大德我已說戒經序下正述三覆撿問有無勸持之相也廣序總分中從下敘初段集僧簡衆總括前緣同遵法者別對作白表形心者通示緣法之意形心即收三業衆下科次段則謂儀則明誡下四句括略一序文義始終對之可見說戒下即第三段住持功強攝僧義勝故云法重由法重故不容妄聽故加三問覆謂反覆正述下二句對三問勸持一句對總結疏就初別序文分為二初有七句能成衆法之緣也二大德僧聽下所成說廣之業也釋中初科分文中業即羯磨白法才成所為即辨望上衆緣故曰所成若望說戒即屬能辨疏就初緣中統明羯磨作業僧寶成務而事有因集不可妄施必具十緣方辨前業緣成中標文上二句明羯磨功用言統明者總一百八十餘件衆別皆然而事下明作法具緣因集謂假緣成也疏何等為十一稱量前事二託界成法三集僧方軌四以法成僧五和別相形六簡衆淨穢七心欲表和八陳戒本事九提問所宗十舉宗成答別列中大約為言一八及十緣通事別餘之七種緣相俱通今文第八隨事顯緣故云陳戒即行籌告令也四中以法成者謂自然作法各攝分齊即羯磨云約界明集是也疏斯之十緣即十門義各有量據不可卒施具如所撰刪補羯磨及彼疏中具辨臨機引用廣略隨宜也其中問答釋疑一同彼說若欲寫取此復何難以紙墨易繁時功難駐不獲已者時復疏之此既大義業相因由理須遙指何得復略然有不見彼文者此乃往緣以業自責余老矣桑榆轉迫不暇重述也結略中二初指廣隨機羯磨有二卷十緣見上卷之首疏本四卷今為八卷若欲下二顯略有二一慮文繁不逗機故二恐費時妨自行故不下示下有所明此下顯上須對指然下傷後世不遇羯磨疏者彼文委辨緣成廣明非相作業成敗被事如非示衆別之行儀顯僧宗之綱要維持修奉不學焉知故不見者則投心無所舉事成非教既不通行何所託況疾滅三寶無利羣生實由往世業緣致使難遭正法然今鏤板教府盛傳我輩獲聞實唯宿慶然常情淺狹貴少賤多雖復聽尋鮮能注意寄言後學勿事悠悠余下重示略意日之西垂影在樹端謂之桑榆迫即訓近言居世不久以重修時七十許矣疏就前緣成即文為七有為六者但意言也牒釋標中有為六者即以前二合為一緣如下指斥律和合疏言和合者將欲廣說情事相違義須先和方應後集故言和也和合中初科情事情即僧心事即說戒事涉是非情容異見故有相違注時有與同師知識別部說戒法當尊重承事恭敬布薩一處住和合說戒違者與罪佛言有三種和合一應來者來二應與欲者與欲三現前得訶者不訶反此別衆也疏注中引與師友別說戒者為表教法所被元在機緣緣有和別即界無二遠表無我之理近成兼濟之能故須尊重承事用開相利之道也釋注中初文前釋緣起教法即和合之制在機緣者顯教不孤起緣和別者同師是和別部即別即下釋制意未證真理即事表之故云遠也兼濟謂自他二利能謂功德疏有三種和下開其相也初和身集也二心三口也反成別衆者以僧之為義同具六和三業片乖不名僧務廣如彼說也次和別中初釋三和上但通制此分三相故云開也反下釋三別謂應來者不來是身別應與欲者不與欲來是心別現前得訶者訶是口別具六和者且通舉之此中但取相和故下別指三業餘三體和屬下僧集下指如彼即羯磨疏律僧集會疏二僧集會者廣說和白非僧不行前雖送和未顯成僧之法必須戒見利三名表圓成之相故言僧集會也僧集中初敘廣說須僧前下簡前相濫三業外相猶非僧體故云未顯等必下正釋今文內外兩和體相俱備故云圓成相也疏有人合之兩成一句今言僧會是和合也如律功德衣中僧集和合則前後不同據理通得分為二分顯義易見也指異中初出異見今下顯今釋是和合者謂舉三體成前三相故如下舉例彼此二處前後列異可驗非合據下縱奪顯意分即段也注時有比丘說戒日若在界內若有戒場不往說戒處佛言應求應喚是我所教若出界外若往而不坐者如法治之疏注中引說戒時界之內外不集坐者為表法本為人人通勤惰理必相攝故雖界外亦須內集釋注約界集中初科人通勤惰者勤者至期奔集惰者不往須求疏問元結界法為欲簡人通界無別自得說戒何須外集若須集者用結何為答結界之意為行僧法法有通別故制開遮羯磨多為別興不集無過說戒通收淨穢有背結罪欲使淨者行教染者順方則機教兩舉定慧斯剋化流不絶成護法也問中初敘結法本意通下難上外集顯界無用答中初示結界所為法下釋通所以初二句總標通如說恣內外俱集是遮別即受懺等法不制外集是開羯磨下別釋初釋別開說下次釋通遮欲下顯通集之意淨染是機教方皆教故云兩舉注自今已去隨所住處有一比丘至說戒日當先至布薩堂中掃灑敷座具水然燈并舍羅等若有客來四人若過作白說戒疏注中引律隨所住處必具說戒者住持相也次科住持相者萬二千載之所賴故今時僧舍雖多行者無幾欲令法住是可得乎注乃至一人心念清淨疏舉獨住者少例多也獨則心念三說對則彼此表淨成僧廣張白相違此非法乖和別衆三中初句牒示獨下次列三法違下對釋注中非法別衆非法言通別衆語局或人不應淨或法有差訛或供具不備並名非法別衆一種該上三位乘和之言須通三別注若有非法別衆說戒者如法治之疏言如法治者不過人法也人則同住上座法則對首吉羅四中人謂能犯法即所犯疏問惡作惡說同號吉羅止不說者犯何等邪問有二意一以注中但結非別止而不說未顯罪相又吉羅梵號既翻作說今止不說非一一所收疏答犯惡說也說本口言今默不說應非惡說但以吉羅為罪望人作者為言身口俱止同犯吉羅可以作說為名二止俱非罪攝今以止口不說非無動慮慮動業成還同惡說義無妨也答中初句定罪說下釋成初徵其非理但下明比擬可結可以等者謂不可以名為妨也今下顯示名義慮即是思雖不至口思動似說故曰還同亦猶默妄判收口業也疏如諸制戒相是止善房衣財食作法而生近表作持遠防作犯犯既不起便是止善可以類也舉例中初示止持通一切戒房下別舉作持例成上義作是搆造既成止善口止無言得成惡說相翻取例故云可類房即二房衣如離長財即畜寶食如足別等凡此諸戒並具雙持律未受大戒者出疏三明未受具戒者上既擊磬詳集五衆同來僧集說戒四衆俱出但明未具亦應兼尼遣未具中初科攝前文意僧下正明簡衆但明未具者點文之局止收三衆尼雖已具義須同遣疏所以遣者以說戒衆法彼學未周體不同流故須遣去次科初徵以下釋學未周者即沙彌有願不同流者即尼衆報別式叉沙彌尼具兼二句疏行事之家務須周給既聽序偈如法召下上座約敕無逸為先廣如所撰刪補事鈔三中言周給者事須有序不可闕故言召下者準知尼等得同聽序約敕之詞指事鈔者彼云此衆僧布薩汝未受具不預聞之各隨本業誦習謹慎莫放逸注時有比丘令餘人遮說戒事疏注中引遮說戒事者表淨法穢人不樂聞也佛世尚爾況末代乎止得勤勤自勵一死知生何道也釋注初中注云令餘人者即三衆及白衣遮謂不令衆僧作說戒事初釋遮意佛下嗟時止下誡衆一死之語請為思之經云從人身中得人身者如爪上塵失人身者如大地土且現身微病欲聽無由況當死去前途未委縱使即還人道猶經二十餘年脫於餘趣受生何啻百千萬劫既沉戒障永背真乘其有卒世不聞無非重障其或始終無闕須慶宿因宜自深思更增勇勵注佛並令至不見聞處餘人未受戒者疏注中令至不見聞處者以六衆下類不令上僭大僧淨法非彼見聞次安置中六衆道四俗二僭謂濫上十誦白衣前說戒除為瓶沙王令心清淨疏問聞非可行故不合聽目對僧集如何不許答計理應爾下衆無知多生慢習制令耳目不矚則重法尊人生其欽仰也問中難前著不見處答文初句縱前所問目對不聞義亦無過故云應爾下下正釋制意慢業本有轉令增長故云慢習注非人來者聽之疏所以注中除人開鬼者以非人具通隱顯徹見自生深信不勞事約也人則反之三中非人具通者得通有二一者修得如諸聖人具六通者二業報得鬼神外道亦具五通但無漏盡耳徹見即天眼通明見善惡衆僧行淨必無輕易注又不應在尼前作也疏尼同僧法應預同聞莫非下類慢習須爾四中上二句明體無高下下二句顯位有階差律不來諸比丘說欲及清淨疏四明不來說欲者小學乖法已出清衆同儔不來恐生異結或諸緣障心達事壅故聽傳情應僧和義自分為二欲表成僧淨陳行具可以知也四明說欲釋文中初躡前起後異結即各結別部令僧破故或下明開意諸緣如下注釋自下釋欲法初制欲淨各傳欲應羯磨淨應說戒後廢前教例須合傳故從此釋注時說戒日有病比丘若看病者及三寶事不來聽戒佛言應與欲及清淨隨其廣略若不現身相不口說者不成若病重者舁至僧中恐病增動若出界作以無方便可得別衆羯磨說戒故也疏注中引病等者成欲緣也言廣略者緣奢促也重者舁來以法濟也恐增出界以事攝也欲明衆別兩行互相資成不可逼也言無方便別衆者以大聖布教意在清心心濁之元我倒為本故無同界別我乖宗但使一和通成僧法則我倒漸亡定慧之力功由於戒故以事約之可不然也注中初釋欲緣注列五種鈔中更加作衣緣竝名如法言下釋欲法奢促者奢謂緣緩故須廣說對首陳詞促即緣急乃聽四略一云我說欲二我與欲三為我說欲四現相準鈔約健病以分四略唯病廣通健病重下釋重病云事攝者且令身安不聞法故欲下總釋開意衆法多方使私緣各遂別人情順得衆行功成故云相資也不可逼者謂須開也言無下釋制意初敘教意故下明立制故無同界者無猶不得也所別望能別故云別我反增我倒故曰乖宗此明制意之急以顯注中無方便義則下顯益事約者即別衆之制律比丘尼衆遣何人來耶疏五明尼來請法者已上四緣止是一徒自行今兩衆相攝非法不可弘之故因說戒便有斯告成外化也五尼請法初科敘意中初總結前緣徒亦是衆今下正示今意非法不弘者謂必假說戒緣也疏文云尼衆遣何人來者此問尼也或云尼遣何人傳信從僧乞教授者即謂所告比丘也以言中不了故光師製戒序云誰遣尼來請邪此謂比丘受信者得意忘言任通無在但知行德兼備不可妄傳故須待請方往教授也次科文列三出初云此問尼者點何人字指使尼也次釋何人是所告者即尼遣僧事儀不便後約受信釋上誰字即僧遣尼語意無失謂受囑者令尼來問可否即為遣也刪定戒中亦同此示得下遣執但下示意行德即所請人須具十德如鈔具引注佛言若有者即應起白言比丘尼僧和合禮比丘僧足廣如刪補羯磨中若無來者答云無尼請教誡也疏注中明廣具如羯磨必無來者如文可知注釋指廣者事鈔亦同大有四科一受囑出衆三說告僧二展轉次第揀德求請三還白上座四上座誡敕委亦如彼律今僧和合何所作為疏六明問發者以衆集約相不舉無由可知故審事源通問其集六問緣中初示問意約相即三業和同然未彰集意故云不舉等故下釋問詞言非別指故云通問律彼應答言說戒羯磨疏七答成法者文分為二同住相進非法不弘故答所為以表集意云說戒也非作此白無顯僧心心樂所表非言不顯故曰羯磨七答法中初科分句別釋初釋說戒相進是同住之本非法下示相進之方非作下次釋羯磨上二句明立意下二句示法用樂字去呼謂同忍也疏有云或答布薩說戒者布薩西音說戒東語乃知布薩名含不妨淨住義攝二名體一不可重言欲顯羯磨名通說戒事別故陳此二則表衆義盡指異中初標異即古戒本布薩下示二名東西二音非正翻度乃知等者出不標梵言之意含謂通含不專一相故鈔中或翻長養或云斷增長等懺罪八戒皆號布薩三千威儀翻為淨住淨身口意住於戒故雖具多翻不出此義故云攝也二名下指前非欲下明今意表衆者即律文中二種攝僧統收衆行故云盡也注佛言若說戒日不得在房疏注中引律不得在房者表人能弘法也注比座相檢來不來者疏比座相檢者是無乖別也注應先白已然後說戒疏先白後說者教法難聞先令使知不容自怠也今行事者上座於說戒日令維那唱告知僧說戒及至戒本復重舉之據事似繁約義無爽前是衆法直告後是僧義同遵也釋注白告中初示白意今下明白法初明告衆應云大德僧聽今某月某日衆僧和合某時就某處說戒及下明單白據下出重意爽失也直告者簡下羯磨問和忍故注若癡比丘言先不誦或有忘者不成說戒當依能誦戒者比丘五夏當誦使利若詣比近當誦戒序乃至餘法疏又云依能誦戒者以行不頓成必待教學不誦恐忘將何依據故制五夏或盡形也制誦中以道假行成行由教立若非教本行成虗喪將何依據斯言有旨焉得為僧棄而不顧若論讀經求利則專憶忘勞至於誦戒修身而生平未矚輪回長劫非此而何律中愚癡比丘五夏不誦戒羯磨盡形不得離依止注還至本處次第說之不應重誦疏又云不應重誦者正法軌模理有常準重誦倒說則聽者浮昧故不許也五中初敘正儀重下顯制意倒說即是重誦注若不得者但說法誦經從座而起不者如法治也疏又云若不解說戒但誦經法者以三學資人戒為教本故前制之必無能誦方說經法六中上明本制必下示緣開疏問既誦不得白讀何傷答凡欲化物必俟說聽之功安有讀文而能附事故世之論士無見執文佛之揚化登機即演說戒同然事符聖制故唯制誦不可讀也自有讀文而起諸行不是常法故不說也問中白謂公白答中初明乖理俟即待也故下舉事以質自古高僧多尚持論隨言對答執卷非能登猶對也自下遮疑但人根各異緣發不常見聞觸知通皆入道但此方耳利偏尚音聞誦持訓誡尤多行益聖教苦制終不徒然自餘別途不可為例事鈔舉此比擬羯磨故知二法白告義同問前云羯磨須假十緣今戒本文但列七者答四不須問此七必問又復七中六種通諸法教尼局說戒十所不攝則為十一矣
