body:
  text: 疏就解戒本廣宗八篇次解第二疏義門分別有八種意初明業不自成必由惑發雖眾多不出三毒故以篇戒配毒成相發雖在惑暢必在具所以第二配屬身口兩業乃現作必有由故次第三明自他義上顯成業由境而興故次第四遮性相攝然初制意為存道本故次第五配篇種類名相乃異須定行基故次第六持犯方軌凡所禁制約報彰持故次第七僧尼同異上雖張相未辨小學故最末論沙彌任運釋僧殘篇初總列八段束之為四初即是惑二三約業四五六據教七八就人從二已下一一皆有結前生起遮性二位或約情非情或就事輕重並從境分故云由境也八篇戒相遮性統收故云相攝也為存道本者下篇諸戒為防四重四重即是入道之基故持犯總收四行四行統一切行故指持犯以為行基疏初明第一配三毒者疏就此十三初有七戒因雖三毒成必貪心次二謗戒因亦三毒成在瞋嫉二破兩戒亦因三事癡慢心成後有二戒因瞋癡起成亦同之配毒中因即始起成謂究竟始終二心同異不等故須兩列然起不可定今但取成初七貪成者漏失等五從內色起二房由外事生二謗瞋嫉成者如律緣起瞋恨沓婆嫉他好請嫉對違境亦屬瞋中二破癡慢者癡謂立邪破正慢則稱佛自尊慢攝於癡後二瞋癡起成同者瞋謂遭擯被諫癡謂謗僧抵拒疏若當講解須敘戒緣用顯三毒成業相貌次廣敘中因佛制婬戒迦留陀夷欲盛次第起前四戒迦羅舊知媒法遂結第五佛聽造房比丘廣乞因制六七故總歸貪餘略如上至後注中更自委釋疏故僧祇云有戒從貪欲生如弄身婬觸染語媒嫁也有罪從瞋恚生如無根謗毀呰驅出打搏等有罪從愚癡生如邊邪等見有罪非三毒生如無學犯引證中僧祇通明諸罪非止一篇僧殘篇中止有七戒染語即兼二麤邪見即二破如無學犯者誤心遮也疏第二明身口相者疏漏失摩觸唯身心犯二房據本由身成犯亦有教人口業犯義自餘九戒口業成犯亦有身業助成之義如後四諫縱設不言隨滿便結何待口也意通前業不可別配三業中初配漏觸但是身業而云心者以通從別相帶而言次二房亦有口業犯者如下教遣是也後九下明互造且舉諫戒不必假言而二麤媒嫁二謗如後戒本並通作相故意下若單意業未必有身口若身口業其必兼意業故云通前也疏故僧祇云有罪非身口從心生即應問言何心取物殺人觸女斷草掘地是名取心不取事也有罪取事不取心者不應問他汝以何心婬飲酒與未受人宿過限隨有犯者當如法治引證中除後三戒罪從境制四分破僧從境同宿約心自餘一切皆從心制故知無心不犯可證上文意通之義疏第三教遣不同相者疏二麤二房四戒自作成重故不須說教人作者於身無潤不同犯輕教遣中通示四戒者一往麤分如下細簡疏若二麤能所互有染隨染而結重別釋中二麤能所互染者重不染者蘭義鈔云能所互有染心能所互輕重能所俱有染心能所同犯明有教人成重之義疏若論媒相不問利非利俱同犯殘媒嫁中初科古約得利今取染分故云不問等疏昔人解云自重教輕者便引律云若我語僧恩不在我故知有利方結殘者不如此也斯引緣耳必結成業教他同犯如白二遣人媒合眾同犯者以染愛分故古解中引律者即調部文彼因檀越憑求他女為婦僧為白二差使往問許已作使比丘念言我今若還白僧恩不在我即自往彼語居士已生疑白佛佛言眾僧偷蘭使比丘僧殘古謂僧犯偷蘭則是能教不得利耳不如此者斥其錯解以佛判僧蘭乃是方便非約不得利也斯引緣者指彼誤引以彼使言恩不在我乃敘本緣非正判犯故必下示正判也以僧犯蘭由不至果若同往報合眾皆殘故云必結等也如下引證亦出調部緣起同前但作使比丘問已還伽藍中白僧僧即告彼居士令知佛言一切僧殘愛染分者分字去呼謂皆沾染分故疏若如二房亦有共作義亦同犯也二房中共作同犯者雖是教他由有己分即如善見段段計人過量亦犯疏二謗為言教人起謗損境暢思不問為己不為己皆同犯也二謗中初文誣污清人損境情重故不獨為己疏有人云不同犯所以然者若教他言持我三根往謗彼人僧若撿校不問所教故知是輕故善見云慈地得殘能教人也尼得吉羅所教人也次科初標所立所下釋成故下引證以慈地比丘教妹尼對眾僧前謗沓婆故疏任情所存然作業是重未可同於外部三中初句縱古然下奪歸今判古據善見乃執異部耳疏次有六戒教人但輕漏失摩觸及四諫戒若僧未設諫教者但吉若僧設諫教莫捨者蘭以有僧命眾法可違故漏觸教人成者犯蘭義不待言釋後六戒正示中初總示若下別釋先釋四諫漏下次釋漏觸不待言者以易知故疏問如漏觸教若未成但犯吉羅如何四諫作未成犯已結蘭者答不同也彼但自壞損他又無僧命可違故待事成方蘭此諫教人自他俱損復有違於眾法反前故重初問以漏觸四諫教人未成結犯輕重故問釋之答中初句略示彼下正釋初明漏觸反下二義文多自壞二字義鈔云彼教人者但是損他可驗傳誤此下次明四諫相比可知疏問所諫之人違白未竟但結吉羅何以能教犯重所教輕者解云所諫結罪因果分齊違白若竟其果是蘭故白未竟其因但吉又有僧殘重果可趣能教之人無果可趣隨語違命故但偷蘭次問所教拒眾應合犯重能教語助理合過輕事乖常理故須問釋解中初明所諫犯輕二義通之初對前輕過釋此就一白自分因果果既是蘭因不當重又下望後重果釋由後有重故結前輕能下次釋能教重義言無果者無上二果當體即果故疏次明遣人謂九戒遣人為己作者同於自犯如漏觸於己身之類也四諫無有教人為己違諫故所不論遣人中教謂令彼自為遣即使他就己如漏觸等舉事可為眾法行諫必對犯人止容自拒故無遣義疏第四明於遮性之義疏媒嫁二房是惡名遮自餘十戒體是不善名性惡也以媒房等自損妨道等同殘業者如母論云結戒法異輕制重名欲令行者稀而不為令進道也遮性中初總分諸戒以下別釋媒房初約事輕徵其所以如下引論釋通初正釋彼分四位犯重報輕如疏所引犯輕報重如殺畜等犯報俱重四夷等是犯報俱輕誤心吉等廣如事鈔持犯篇明欲下顯意疏第五明戒皆初篇種者疏如多論云如初四戒各有種類種類中多論云二百五十戒以類而言有四種類以罪而言有五差別即四戒為種下篇為類疏何以知然如十三中初有五戒三十中尼衣使浣染毛三戒九十中與女人說法同宿安坐強坐露坐教尼已下有十戒悔過法中第四戒於眾學中高視等屬婬種類初淫中十三有五漏觸麤歎媒三十有三如疏九十有十五戒上列五戒露坐即在教尼下十中則有十四準論後列與女議共道行乃成十五文中闕之上四可知同宿通道俗餘三對俗女教尼下十一輒教二日沒譏三教四同道五同船六與衣七作衣八屏坐九與女露坐十尼贊食第九對俗女餘並對尼悔過第四即蘭若受女人食眾學高視彼因佛入舍衛人民於屋樓閣看佛及僧六群仰視男女好醜因制不得視入白衣舍及坐二戒即四分左右顧視已上二十六戒疏二房畜寶𧵍寶販賣乞縷奪衣迴僧藏衣用淨賊期四悔學家覆食汙草水等為盜種類盜中十三有二二房畜下即三十準論有七文闕勸織藏下即九十有三用淨即真實淨輒著戒四悔中學家盜攝者以僧法制斷往受同盜故覆下眾學中三覆食即以飯覆羮草水即生草淨水二戒十誦因六群從守園人索令浣衣彼不與及不浣衣乃於淨水中大小便由壞他物故落盜中已上十六戒疏汙家憍奢用蟲飲蟲殺畜打摶尼食大摶便於草水並殺種類殺中汙家即十三中一若取擯謗合在妄中今取汙家令他不得供給故在殺中或取惡行種華溉灌於義似疎憍奢三十中一即四分蠶綿臥具也用下九十中五尼食即四悔中初戒因取尼食令彼飢困故大摶下眾學中三大摶在殺者或能令他不得食故或云容有食噎致死者非草水即上盜中二戒望損物命又在殺中義通兩用故列前後已上十二戒疏二謗兩破戾語一二居士王臣妄語次十指授食說法戒等並妄種類妄中初十三中五戾語即惡性不受語也一下三十中三妄下九十中十一妄語二毀呰三兩舌四僧斷事發起五為女說法六以偈句教未具七未具前說過人法八說麤罪九與欲後悔十毀毗尼指授即四悔中第二佛令呵止不呵而食而食故在妄攝說法等者即眾學諸戒十誦二十一條一騎乘二在前三在道四在座五人坐六人臥七覆頭八褁頭九叉腰十現𮌎十一現脇十二抄衣十三左右反抄十四放衣挑十五著屐十六著革屣十七捉杖十八捉蓋十九捉五尺刀二十捉小刀二十一捉弓箭四分但有二十已上總四十戒疏講者不可單歷欲令他解次第張相結過屬著豈不然乎疏者加之甚易恐繁故也結示中初令廣示疏下次顯文略疏中準論總配九十三戒餘雖不出大略可知但不顯攝屬之意故令講者臨文提示然今記中隨有隱者已略明之餘如圖相一一列示疏第六明持犯方軌唯有二房具兩持犯餘名止持造則作犯持犯中標判者前約心用教行以明雙持今就戒本須從後義疏若為明者疏如昔解云止不作房名止持從僧乞法名作持言二犯者止不乞法名止犯作房成者名作犯據犯名體是一據持名體各異釋中初科引古又二初列示四行彼約守戒無汙為止持故云止不造房也造房乞法方有作持兩犯據下次總判名體據犯名體一者文誤準義鈔合云名異體一言名異者止作別故言體一者同造作故據持名體異者名異同上言體異者止持守戒不為作持造房乞法今詳古解略指三失彼以止不作房而為止持則全不曉持義前約四心分為二別行前三心體無汙染義名止持行心思慮業相顯彰方得名持豈有不為而名持耶又止持作犯須約一事相翻以明若謂不作名止持作成名作犯則事非一體義非相翻又若不作即名止持則應不問量之如非但使作房即成作犯又復依量而造為屬何持若屬止持理應不可若屬作持且非乞法是則二持俱無所屬又雙持雙犯亦據一事而分止作今既二持名體各別則非雙持之義不可立矣略言三過餘如正解疏今解持犯之生皆從法起違順教相故有犯持據房為言事法分二各具二持名體須顯安有端坐不修為持如殺盜等隨境制禦識達業相方成前行號曰止持豈可臥地我不殺生便於生境能發隨戒戒隨三善緣境而生前立義中約行明持無問止作前之三心不名持犯云何此中我不造房名為止持義不可也今破中初通示持犯之本法即是教未立教法無持犯故據下別示房戒初立正義反古三失事法各具止作名體如下所顯安下次斥古非初舉重戒例破禦謂正念離非即能治之行識達謂明辨行相即解教之智必須此二方得成持自餘悠悠但名泛善學者臨文細意詳究戒隨下次約隨戒飜破指前立義者即持犯成就中今師必據造房以明與古全異故此斥之疏故前義立後以事法明持犯相如此可識次科生起中上句結前餘文生後事理合作事法寫誤疏就房事明持犯者依教不越名止持驗教知量名作持出於教量名作犯不順教故名止犯此則約其度量顯其違順止作持犯名體各別次分事法中初科四行舉要為言止取離過望不犯罪則名止持反成作犯作取修善望依制法名曰作持反則止犯方顯四行名體不濫驗合作撿度量即長廣制法疏次就法論恐犯教制如法無違名止持從僧乞法名作持故違不乞名作犯即此違教名止犯此亦名體各別止據無違作據順教極分明也若有昧者翻犯可知後法中先列四行止據下重示二持令翻犯者古謂乞法但有作持及以兩犯既存兩犯必具二持以翻作犯即止持故疏問準此持犯與前既乖約事明作身營可悉故犯僧殘約法明作其相如何答此之過量及以不乞緣雖兩望果由房結對相思事隨有四違纔一舉手營搆土木即有偷吉四罪隨生安有過量偏屬作犯若如此問後戒無過無作犯矣準此成例身業是過約緣分罪隨多少也問中意者以不乞法但是不為何有作犯故躡前事相比徵之答中初正答兩望即過重處分此謂不乞還望造房得有作義對下次斥偏局又二初約多罪難對相即房境思事即行心籌度事法各有止作兩犯故云四違偷吉此約方便二作犯兩蘭二止犯兩吉或將妨難二處為二吉者妨難之罪但是離過單持所攝非此所明若下次引後戒例難此二重難雖釋前問乃是對破古師耳準下結顯後戒無過而有作犯可例此戒具二作犯既有二作則兼兩止並望身業造作過量具兼四犯又復乞過有無不定故云約緣等也疏今以句法用收教相意同持犯方軌中說九人造房中有迷悟一人識達法犯無疑故不結其不學無知餘之八人隨相多少歷句中初科為二初指前文九人下示立句疏初但一句識法識犯法謂白二犯謂僧殘既隨僧乞名曰作持於僧殘罪欲犯不得名曰止持如此約句何有不解上品中初標句法謂下釋相既下判行復示雙持於義益顯仍斥偏執疏中有四句一識法疑犯二識法不識犯三疑法識犯四不識法識犯並乞造房同號作持由於法犯迷而不學各有罪故中品列句結行在文易解疏問罪是止犯作持何用答就事作故無犯名持何妨於法無學故結問答者以持中說犯理不當故疏下品四句一疑法疑犯二疑法不識犯三不識法疑犯四不識法不識犯疏所言疑者疑法白二白四或用單白直和或須不須故曰疑也言不識者謂直單白不須白二或須白二不識通塞亦是不識對法既爾約犯僧殘迷疑同此下品釋迷疑中迷即不識言約犯同者疑謂為殘為蘭為無罪等迷謂直犯蘭吉等疏既無識兼不及中故名為下品若論法犯俱有迷者最是下下之人而名持者由於僧殘有乞無犯示品位中初三句正示無識兼者異前中品半識相兼故若下別簡末句而下結行疏問等同不學疑迷二相結罪不同者答疑兩緣生故是解律分有智性故結吉羅不識不爾癡故昏迷同於黑業故結提也如上廣之門中但問無知兩結之意答中初明疑相由半涉是非故云兩緣生也解律字有改為津非不下釋迷相黑業經論明白黑二業即善惡也此雖非惡由癡暗心縱毒成業故云同也疏第七僧尼不同門者輕重分戒有六不同僧尼中尼十七戒今約僧中十三對明同異疏言漏失者僧重尼輕如多論解女人煩惱染重難拘難制若制與重罪惱眾生故也又云女作在屏苦乃盈流故輕男子不爾隨事能出故重明異中初科言尼輕者但犯提故多論二義初約染心男輕女重教必隨教又下次約難易則男易女難教則緩急疏摩觸一戒尼重僧輕所以然者尼則煩惑情重既受摩捉必為陵逼成大過故方便之內制與重名丈夫摩捉必無陵壞不假深防但就限分故制輕也又女人貪觸情重律有背夫從觸之相如彼賢愚試蛇以㲲女住男去情有著故摩觸中初正示尼重即八夷之一所下顯意兩義明之初約陵壞有無又下次約觸情輕重律下引證律明女人有十種惡業第六謂體背夫主若見端正男無羞追逐下至從彼受於觸樂賢愚云時特叉尸梨舍衛二國不和特叉王欲試舍衛有聖智否遣使送二蛇麤細長短相似能別雌雄斯為大善波斯匿王及諸群臣無能識者時梨耆彌歸問兒婦婦言以一端細㲲敷置於地取此二蛇著上雌者靜然雄則搔擾何以知之女之為性愛著細滑得軟生染不欲動搖男子性剛轉側不安故可別也疏云女住男去即雌者靜然雄者搔擾也疏言二麤語僧重尼輕男則剛獷無羞為之事數故重女則輭弱多恥為之義稀又趣重果方便縱造但結蘭罪二麤尼輕但犯蘭故亦約二義釋之初約稀數又下次就趣果問比丘為婬故語為得何罪答亦方便蘭若爾與尼不異何以尼眾一向結蘭答女既耻為自非交染必無泛語若爾必非期婬為語何罪答如文亦蘭但非因罪耳疏二房亦爾所以不同僧是多利孤遊造房事數故重尼則反前故輕又如多論二人共造不獨宿故人無房量縱有過者輕而不重二房中尼蘭同上故云亦爾所下徵示初約稀數釋尼反前者化緣微寡則非多利出處須伴則非孤遊又下次約共不共釋人無房量者由是共造各不滿量也疏媒謗已下同犯可知顯同中媒嫁二謗四諫共七戒二眾不異疏第八明方便任運義者如沙彌時遣人為己麤語歎身媒嫁二房及以二謗進受戒已前所遣人七事成就三性之中任運成殘餘無遣人同犯義故不說任運任運中但使有遣人義即有任運初明有中文列七戒餘下二明無謂漏觸樂在他四諫須身現律諸大德是十三僧伽婆尸沙法半月半月說戒經中來疏次消文中標釋結並同須引牒釋中先示三章八篇皆爾疏就釋相中律初故出不淨戒疏第一漏失戒疏此戒人多喜犯者良由放逸心性不思死至故也若依涅槃常思觀察我此生死未有邊際世之事者無由造矣多論云佛所以不聽者為令正法久住故又止誹謗故又欲生天龍善神信敬心故又婬欲惡法正是生死之源障道根本理宜制斷令梵行清淨故釋初戒制意中初敘過本引涅槃以證次明制意引多論委示文列四義初住持二四滅惡三是生善鈔云四律並言云何以不淨手受人信施疏次釋戒名者方便動轉標心究竟名之為故體分盈流故曰也釋名中體分即不淨疏言具緣者但唯三緣一標心出不淨意二方便動轉三出便犯具緣有三隨境成犯故不列境註佛遊舍衛城迦留陀夷欲意熾盛身色瘦悴獨處一房好牀蓐被地施敷具飯食豐足隨念弄失諸根悅豫顏色光澤諸比丘舉過白佛佛無數訶責已而制此戒疏就戒緣中明獨處安敷故起逸過豈非不思世間不可樂想故致斯過也戒緣同上制意不可樂想者謂觀世間無常不淨生厭離故律若比丘故弄陰失精疏就戒本中四句疏初能犯人疏二故弄下明其過業男陰女陽之相無暇述之生沈終浮死則伏仰異也次句釋文中男體是陽而用屬陰女體是陰其用屬陽凡人溺水生則沉下死則浮上男伏女仰可驗陰陽今戒制僧故目其根以為陰耳疏精者持身之寶也必徧身分中如善見所釋律中分色輕重乃至二果色如漿者欲心薄也釋精中指善見者彼云舉體有精除髮爪及燥皮無也律下彼云精有七種一青者轉輪聖王二黃者輪王太子三赤者犯女色多四白者負重人五黑者輪王第一大臣六酪色者須陀洹七如疏引註實心故作出不淨意前境有六若於內色外色內外色若水若風若空隨作方便若出即犯疏注解云實心故作者謂非心所行不名犯也解上故字也釋注初科非心不犯者反釋實心故作成犯疏言境有六者據戒無境也何以知然若空動身亦名犯也若不出境通收內外恐漏罪網故便列之境中初云無境者以隨緣可出非局一境故引空動證無可知若下次明律中列境之意內外如下所列疏言內色者律中受色謂心領納名之為受與受相應色名為受色即是人身有識持者二外色者謂非情色也三內外色者兩色中間也五分云內色己身外色他身也四者水中逆順而出也五者風中相同於水乃至口吹者六者動身也文相可解別相中初釋三色內即有情通於自他如自手或他身分是外即非情牀褥壁穴等處兩色中間即兼二色如以手持物他身衣障等前釋受色受即四陰之一心依色陰和合成身故云相應色也即人身下直指其相人身即色識持即心人多錯解故委示之次引五分示不同相本宗自他並是內色四水五風並謂逆順觸根皆可出故第六即空為境律除夢中疏三除夢中者開緣也註佛言亂意睡眠有五過失一者惡夢二者諸天不護三者心不入法四者不思惟明相五者於夢中失精善意睡眠有五功德即反上句也疏注解善惡兩夢其相可知疏善見論夢有四種一四大不和故夢如見山崩地動飛騰虗空虎狼賊逐等二先見故夢如晝見青黃男女夜則夢見三天人與夢或有善惡天子為現善惡兩夢四想心故夢此人前身為福則有善夢誦經禮佛等若為惡者則見殺盜等前二不實經云如夢幻等是也後二為實經云但取夢相如方等佛名所說第三句釋注引教中初科前列四種後總判虗實如夢等者經中多取喻法不實故如方等者悔法有三一無生二作法三取相彼明取相故令求夢以表罪滅此皆聖人所示如上第三是也疏如善見云夢通三性若見禮誦是善性乃至見青黃赤白為無記也次科引示中乃至者文略夢殺生偷盜姧婬是不善性疏若爾三性豈非罪耶如成實夢中成業如蛐蟻等是以律中五種過失豈非罪也如五分中不攝而眠五吉羅也此云不犯開於殘耳徵釋中躡上惡性以難今開如下釋通初引成論明結業如蛐蟻者示感報也次引二律明違制律中者如注所引過失即罪但無罪目故引五分決之義鈔明夢業不感總報不無別報疏如僧祇中云夢者虗妄不實若有實者於我法中修梵行者無有解脫以不實故得盡苦際三中引祇律者以修行者尚有夢中造罪由無實故不能障道律僧伽婆尸沙疏僧伽婆尸沙下結罪名註若方便弄不失偷蘭比丘自相教若失犯偷蘭不失突吉羅尼波逸提下三眾吉羅不犯者一切不作出精意疏下注解辨相可知第四句點注中亦應科分犯與不犯犯中分三初明方便次辨相教後對餘眾律二觸女人戒疏第二觸女戒疏佛所以制者多論云有六義一者出家之人飄然無所依止今制此戒與之作伴有所依怙故二者息諍根本故三為息疑嫌心不但為捉而已言即作大惡故四為斷大惡之源禁微防著故五為護正念若捉女人失正念故六比丘出家理應跡絕塵染標心累外為世軌則若捉女人則喪世人崇敬心故二摩觸戒制意中一五六生善意二三四滅惡意息諍者人多妬色故息疑心者疑謂作婬故云大惡失正念者以著欲樂不能攝故疏次辨釋名者輕重離合三意疏言釋名者身相摩對名之為觸故曰也釋名可知疏言輕重者疏問僧尼俱觸而罪有輕重二人俱宿而罪無階降者答觸對為言陵不陵別故夷殘宿中懸對譏義是同故俱提也輕重中問意以二眾觸宿結犯不等故答中上明觸別下示宿同未即有譏先防而制故云懸對疏若爾如尼受染心衣食共男入室譏義不殊何為階降答染心衣食深防重罪故重共入闇室當相譏疑故輕故非決也轉難中受染心衣食犯殘共男入暗室結提此引尼戒難前同宿譏同罪等答中初明染心不就譏論故異次明入室從譏故同異上懸對故云當相制緣既異不可相決故云非也或可決合作例疏言離合者有人問曰九十制坐則尼女分戒十三明觸則道俗同罪者何離合中問意可解疏昔齊大德隱律師曰結罪便故所以合之若對比丘二女俱殘若對於尼二男俱重故不分戒九十須離者僧對二女俱提理應須合但結尼罪則道俗輕重不同故使離之釋中初科初總示即高齊曇隱依光師學律撰鈔四卷今用彼文若下別釋初明觸合僧尼二觸並合制故九下次明坐離尼對比丘屏坐吉俗男則提此謂因尼犯不同致僧戒兩立疏若爾者尼離五衣俱提如僧對二女坐提僧則三重二輕相同尼對二男坐也此亦輕重不同何為得合答若就二三結罪不同實亦應離俱對受法以明離故合也然前屏露直是事中之譏隨義故別不同衣有聖法對法以明同離故不分之次難中初引僧尼離衣相並前既尼犯兩別僧坐因離此亦僧制重輕尼衣何合答中初縱奪釋通然下事法對簡事中譏者與尼坐戒律因迦留陀夷與偷蘭難陀尼共坐居士譏嫌與女露坐亦因迦留與優婆私坐乞食比丘嫌故白佛等隨義別者即上對尼輕重之義不同衣者五衣加受離失不異故疏又難若使結罪便故戒不分者如下行戒僧則二女俱提尼則二男俱吉此亦是便何故分耶答結便應合開緣有異故離如尼女同行尼則開僧將援俗女則無又尼行必假多伴為除譏醜俗女但有第三便無濫過所以分也後難中以同行戒彼此犯同亦應須合答中初句縱次句奪如下引緣以釋初約將護有無釋又下次約伴行多少釋下云行途逈遠招譏過大縱多比丘一尼亦犯要得多尼為伴方開疏三具緣成犯有五一人女二人女想三有染心四二俱無衣五著便犯疏闕緣中境心二闕略同前篇罪輕為別闕緣中初二指前非畜等替心定境差名闕境前境不改非畜疑想則是闕心歷句辨犯輕重有無同故不出疏闕第三緣無染心者無罪或結非威儀十云若女為水所沒開令接出雖婬心起但捉一處莫放至岸更捉僧殘僧祇中若他女人沒水作地想者持出不爾者與竹木繩索等闕第三中初正明或結非威儀者鈔引僧祇若共女人捉物呪願捉器行食等皆非威儀有欲心者吉十下引示十誦婬心由是開緣故無所犯捉一處者開中制也至岸無開乘前欲心再捉成重僧祇地想治勝故開治力未充則不開捉故云不爾等鈔云十誦四分開處猶多僧祇水溺難緣至死不開是也疏闕第四緣二俱有衣吉羅互有衣偷蘭闕第四中通上具緣二俱無衣共為四句結犯階降疏闕第五緣隨有遠近方便二偷蘭故闕五中遠合作次遠方便吉具蘭並歸第三緣明之疏不同昔人受樂便犯但先有染來觸於女著便是犯何得論樂故十誦云比丘觸女不問樂不樂皆殘若女來觸比丘要須動身受樂結殘餘廣如鈔斥古中初斥非故下引證往來兩分據斷有準下指鈔者彼分三別一比丘往觸不問樂不樂二女觸比丘動身受樂殘亦準十誦三不動受樂律但結吉鈔約先有染心不動犯蘭動亦得殘疏問婬觸近重境犯殘非方便盜四亦近重而成方便者問中以隣重既同而因果制別故以為問疏答盜五必假四故四而非重大婬不假觸故觸非方便故多論云犯婬不假他如己二處也初釋引論自婬以證疏又云盜有續成重故作方便名再觸非大婬如何結究竟如律云再盜不滿五佛言相續夷次釋引律此據初盜期心未遂必作斷心多反亦蘭疏又內外起心異故分因果別後釋中婬為內觸心期婬事觸則因蘭摩是外觸即成殘果故云因果別盜唯外起無別因果註佛在舍衛國迦留比丘以佛前制便在內外伺諸婦女將至房中手捉捫摸樂者便笑有不樂瞋恚罵辱諸比丘舉過白佛便集僧制戒疏就戒緣中俗女譏笑有二相者如薩婆多云諸女何以來者一以世俗怱務出家住靜安樂故二善友知識聞法故三僧房嚴飾可觀故何故入房者謂出家人斷欲清淨信無疑故何為笑罵者一有欲心多少故二為知識非知識故三樂覆樂露故四有親有難無者無故如是應知戒緣引論次列三意初女來意復有三別次入房意言無疑者信彼出家必無欲故後笑罵意中四句雙列分配笑罵上二可知三中樂覆則笑樂露則罵四中有親則畏難故罵無親則無畏難故笑律若比丘婬欲意疏戒本五句初犯人二染心三女人者觸境四身相觸下明過業五若觸下結罪疏就解文相言欲意者明本緣也凡有觸女不必皆殘故出其心用成業本戒本第二句中初釋欲意言本緣者以愛染心是觸之本凡下顯示戒本須出之意註愛染汙心疏注云愛染心者心本性淨由愛染之故曰也然愛有二相如子之愛二親如父之愛一子斯則念之重也今言愛者謂婬欲染汙之愛也非淨心故釋注中但云愛染則知欲意非為期婬然下簡辨愛心明非通濫律與女人疏言與女人明其觸境女名乃通人趣別也如下輕重對趣分心第三中如輕重者指注辨相若準下文但明畜吉鈔引僧祇非人女亦吉釋云謂無婬心意顯有婬心理應結蘭罪註謂境有四覺睡新死及少分壞疏就境有四覺睡生分新少死分也釋注中總約生死用收四女律身註從髮至足疏言身相觸約其業相也從髮至足者括結兩頭綱網徧也第四句釋身中初點文從下釋注身相多別觸皆成犯髮足二字統攝一身無不盡故綱網徧者教制無遺故律相觸註若捉摩重摩或牽或推逆摩順摩或舉或下或捉或捺若餘觸方便律若捉手若髮疏言相觸者律明觸相乃有十種易解若捉手髮者手謂犯起先由髮謂釋除疑結也時有疑云捉手身肉則有適樂細滑髮是身分何業之有而結罪耶故今以髮入於戒本但著則犯由染汙心觸相中初科前指律中十種者如注所列今引律釋之一捉摩者摩身前後二重摩律文不釋相亦同上但重為別三牽者牽前四推者推後五逆摩者從下至上六順摩者從上至下七舉者捉舉上八下者若立捉令坐九捉者捉前捉後捉乳捉䏶十捺者以手按也四處同上捉中若下次點戒文二相時下別釋除疑初敘疑情故下示出意疏今四分中不分其相應以四句明其輕重覺不覺境如是分之故善見云髮髮相著爪爪相觸悉得偷蘭俱無覺故若互觸者理結僧殘同戒本也歷句中初指句一覺觸不覺手捉髮爪二不覺觸覺爪觸女身三覺觸覺上三並殘四不覺觸不覺偷蘭如下引故下次引善見別證第四句若互下後約義意決前二互鈔引十誦互觸並蘭今據戒本捉髮成重故云理結僧殘等舊云此決初句次句亦蘭然今文中但云互觸須通兩句律若觸一一身分僧伽婆尸沙疏若觸一一下引業成過也第五文中二句躡前觸相結成罪名故云引業成過註若觸四女著便僧殘女觸比丘動身同犯若不動身但犯吉羅先有染心偷蘭互觸有依偷蘭俱有衣者吉羅若與二形相觸偷蘭若以欲心觸男子身或衣坐具乃至自觸及以畜生一切突吉羅尼波羅夷下三眾吉羅不犯者有所取與戲笑相觸是也疏就注解人女中三位初二俱無衣分二初明比丘觸四女相後明女來觸比丘相犯有輕重可解耳二明互觸有衣相計應約身動不動約心樂不樂分輕重以偷蘭含故文中不分也對後俱衣例同下斷釋注犯中初科三位初對文可見次互有衣中言計應者亦須同上分二比丘觸女並蘭女觸比丘動身受樂亦蘭不動但吉先染亦蘭偷蘭含者由互觸中多結偷蘭罪相通含故不別舉也對下即第三俱衣亦應分二往觸來觸動及不動無非吉羅故云例同下斷也疏觸衣鉢等亦結罪者並是禁約之極心為罪本故隨境制不令妄起故也次科觸衣鉢者即深防制故云禁約極也疏尼結夷者大分為言約境有深淺義非即重也三中境深淺者即分重輕腋已下膝已上腕已後名重境餘名輕境重輕二境互觸皆夷俱重可知俱輕得蘭故云非即重也疏言戲非犯者不以婬心則餘戲耳為開殘故非不損威儀不犯中雖內心無染而外相乖儀理須結吉故云非不等律三與人女麤語戒疏第三共麤語戒疏下及歎身制意同觸莫非欲染纏心隨境而避佛制如緣可尋三麤語戒指制意中探引後戒雙指同前莫非下略示大意四戒並因迦留陀夷避制相由而結如注委引疏釋戒名者婬欲鄙惡極是不善故名為麤今說其狀表彰於口故曰語也疏犯緣有七一女人二作人女想三有染心四麤惡語五麤語想六言章了七前人知解註佛在舍衛國迦留陀夷聞佛已制前二戒故便於女前欲心向彼說麤語比丘舉過佛因制戒疏就緣中列前二制者釋成後犯緣也如上解之釋戒緣中言如上者即指制意避制之文律若比丘婬欲意與女人疏就戒本中有五初出犯人二明內染三出犯境四陳過相五隨說下結罪也註女人有智命根不斷疏三出語境中注解人女有智命根不斷者異於觸境彼境通於死活此則唯是其生故云命根不斷也彼則通於昏睡孩童此則唯論有智時可知言染淨迷悟罪分輕重故此戒女異於前也戒本第三中初總示以摩觸境通麤語境局故對前觸以顯別相彼下別簡初簡死壞彼則下次簡昏小知言染淨即辨麤非麤迷悟即知誤非誤罪輕重者律云情相領結殘解語不解義偷蘭故下結顯律麤惡婬欲語疏麤惡婬欲者正是戒本所防業也註麤惡者非梵行也婬欲語者稱二道好惡也若求若教他求若問若答若解若說若教若罵所言求者與我二道作如是事若復作餘語如是解者是也疏注解中非梵行者釋麤惡相也說二道好惡明其欲相文須識者恐未明了妄為次死之罪下有八相律文具解既離非相故廣列之第四釋注中初分語相文下顯示注中的指之意下點八相竝謂對女說上麤語差別之事且出八種臨事何窮注中次列但釋第一餘七略之今為具引律云若教求者若復作餘語教他求二道也若問者即問言汝二道何似若答者即云汝二道如是若解若說亦如是若教者言我教汝如是治二道可令敬愛若罵者即言汝二道破壞腐爛等既下示注引意疏此律約緣明比丘向女人說也就後解中若問若答明知女說染心相領亦同犯也故五分中彼此互說皆犯殘罪下戒亦同通互中初示本律前後二文約緣者據本迦留則無互義後解即八相中既容問對顯通彼此互說皆成故下次引他文為證下戒同者即指歎身互說同犯疏若復作餘語者言極非染表事是穢故也廣如鈔中釋餘語中言非染者律因消蘇女名著赤衣時女形露便言消蘇好否若女情相領僧殘指廣如鈔故不盡錄律隨說麤惡婬欲語者僧伽婆尸沙疏隨說已下引過結罪註若一反麤語僧殘隨語多少說而了了者一一僧殘不了了偷蘭若與書印遣使作相令彼女知僧殘不知偷蘭除大小道說餘處偷蘭與非女人黃門二形麤語知者偷蘭畜生不能變形若向男子麤語一切吉羅尼偷蘭下三眾吉羅乃至下戒亦爾不犯者為說不淨觀若說毗尼受經問答無欲意故疏注解辨相中不知偷蘭者以解語不解義故結方便餘可解五中釋注頗略隨與點之注云除二道說餘處蘭問女人婬通三道此戒但云說二道者答口雖通婬本非婬處故說非重非女黃形非全女相適情義少罪亦階降畜取不變能變應蘭不犯中並約說法教授因而言及故非犯科律四歎人向人女索欲供養戒疏第四歎人索供戒疏言多巧偽美己之善意專在欲言現清淨蕩逸其情妄謂歡適故言歎身索供戒也四歎身戒釋名中上二句敘歎身意下四句明索供疏犯緣有七準上可知註佛在舍衛國因迦留陀夷聞佛已制前三戒故伺諸婦女將入房中自讚歎身汝可持欲以供養我諸女訶恠比丘舉過佛因制戒疏戒緣明起過者釋重犯相更避造罪者計義同犯無非愛欲託境少異故分四相欲約後犯除疑妨故戒緣中初通示更下委釋初示義同謂同麁語託下明相異前唯鄙語此乃善言故云少異欲下顯重意謂若不別立恐疑無過故律若比丘婬欲意於女人前疏就犯戒中六句一是犯人二是欲意三過境四自歎下正明犯法五大妹下是其所稱六可持下結罪屬彼註女人如上疏就注解人女言如上者即麁語中女不同觸身也戒本第三句注釋如上者以上二戒女境不同故須定指不容相濫律自歎身註歎身端正好顏色我是剎帝利長者居士婆羅門大姓種疏就歎身注中初好顏色者歎其豐美以調前女也二我是剎帝利下明種族高貴女人性弱貪附此二者多故以動之令其心醉也第四句前釋色族女下顯意醉謂迷著律言大妹我修梵行疏我修梵行下舉善法以動也疏問既修梵行義無行非何用索欲供者答必實行欲索者偷蘭大婬方便也今本不行口言其相妄開婬門擬通適故耳第五梵行中問答甚要能破二疑一自稱梵行不當索欲二索欲婬因理應蘭罪一披後答頓釋深疑雖不期婬發言求索故云婬門通即是暢適即訓悅註勤修離穢濁也疏注言勤修離濁者濁謂欲染所以汙染離由勤修也釋上梵字當唐言淨行也釋注欲染即五欲所以污染離句絕律持戒精進疏言持戒精進者明止作兩持無有缺也註不缺不穿漏無染汙疏注解不缺不犯第二篇不穿不犯三四聚無染汙者謂餘篇聚皆明淨也又解初持方便言不缺也中持正本言不穿也後奉持戒隨助之心故云無染汙也或以戒見威儀具持故以三配之可解持戒中釋注三義初約篇聚釋文收下聚不配初篇是行本故持則堅完犯則喪失故不論穿缺也餘篇聚者謂下篇惡作惡說又下次約三時釋初中後心配缺穿汙或下三對四事釋不缺即戒不穿是見無汙對威儀正命即攝戒中律修善法疏修善法者謂頭陀等相並生善道之法也註樂閑靜處時到乞食著糞掃衣作餘食法不食一坐食一揣食塚間坐樹下坐常坐隨坐持三衣唄匿多聞能說法持毗尼坐禪是也疏注解中分六位初舉頭陀明節儉法二舉唄匿明稱讚法三舉多聞明廣見法四舉說法明開智法五舉持律明奉行法六舉坐禪明剋道法修善注中初科六位統收善法束六為二不出解行或復為三即是三學疏就前頭陀約相十二以事束之止唯四位謂衣食處儀也於衣知足立二謂糞掃衣一衣也於食知足立四謂乞食不餘一坐一摶也於處知足立五謂靜處塚間樹下露地隨坐也四儀唯一即是當坐繫念現前發智觀察也餘如鈔中次科四位總收可解食中不餘食者但能節後一坐食者前後俱節一摶食者不復受益處中五種注中缺露坐後世寫脫律本具之事鈔頭陀篇中一一具出制意名體行相功益此不繁引故略指之律可持是婬欲法供養我如是供養第一最僧伽婆尸沙疏文中可持是下引罪成也註若作如上譽已供養我來不說婬欲者偷蘭餘境雜犯如前戒說不犯者若比丘語女人言此處妙尊最上此比丘精進持戒修善法汝等應以身口意業等供養於彼若女意謂為我歎身若說毗尼言次及此彼謂歎身若錯說者並不犯疏就辨相中若但說欲如前戒若但歎身結偷蘭歎身索欲方犯此戒罪餘相狀可解第六中釋注辨相云餘可解者注指前戒謂遣書現相報別趣異等並同故也就不犯中初如實歎他及說法等彼謂歎身非我心故律五媒人戒疏第五媒嫁戒疏制戒意者然此婚娶禮法乃是生死之結障道之源出家離著彌須遠彼乃復往返言議乖越威容深是鄙恥理須遮制然復事務猥濫妨修道業跡涉譏醜不免世訶具斯諸過故所以制五媒嫁戒制意中敘過有四初明障於聖道乃下二明乖於僧儀然下三廢於進業猥鄙也跡下四招於世謗具下總結疏釋名者為彼男女往返相謀以成嫁娶故曰媒也媒者謀也計度二姓用為好合釋名中初示名義計下顯事相計度謂量其可否好字去呼疏論犯八緣一人男女二想實三為媒事四知是媒五言了六受語七往說八還報犯疏闕緣可解註佛在羅閱祇迦羅比丘本是大臣善知俗法城中嫁娶盡往𧫎問時婚娶者逢對好惡便願迦羅受於苦樂居士譏訶比丘舉過佛因制戒疏就戒緣中迦羅本知姻媾相祿休咎故雖出家還尋本業斯積習生常不言有過如今屠販之士迷利故所以行可不然哉故律中先客書者不得畜筆先客縫者不得畜針先客木者不得畜斥斧等並制惡習也又言婚對好惡願受苦樂者俗人無識不謂往緣既得違順便言媒人與我苦樂斯為過兆故制在茲由諸比丘與迦羅類故彼言有涉也戒緣中初明迦羅本緣姻媾皆婚娶之名相祿謂命分休咎即吉凶如下舉事為況故下引教以證令知出家必除俗習又下次釋毀讚律云彼婚娶得適意者便歡喜供養讚歎言令迦羅常得歡樂及餘比丘亦得供養若彼不得適意者便言當令迦羅常受苦惱及餘比丘亦受苦惱不得供養等然彼毀讚言及餘人須出其致故云由諸比丘等由是同類例遭譏毀據此戒本注中願迦羅下合有及餘比丘一句恐是寫脫律若比丘往來彼此媒嫁註使所應可和合者是也疏戒本四句第一可知往來媒者正是業本持男意下釋前成相為成婦下是其罪也戒本分句可解疏解媒業中言往來彼此者舉其事相顯其媒也注云所應可和合者謂良賤貧富於事所異由開解故成也釋次句中由開解者謂假媒者辯說成故律持男意語女持女意語男疏三持男意下反釋第二往來之相男女兩意並據可娉之家或鰥夫寡婦則自言仇好或童男處女則伉儷在親故律通言莫非男女也第三釋文中初點示男下牒釋娉即是娶彼此意願故云可娉無妻曰鰥無夫曰寡此等多無長上故但自言仇對也好合也伉儷謂敵偶童男室女必由二親故下指成文通收前二註女人有二十種母護父護父母護兄護姉護兄姉護自護法護姓護宗親護自樂為婢與衣婢與財婢同業婢水所漂婢不輸稅婢放去婢客作婢他護婢邊方得婢是也男子亦有二十種並同上列疏注解中女男兩相各二十種先明女者以好合之來男多求女故隨求處所以先明釋注初科據能求則男合在先故約所求以通律意疏就女相中良賤等論者亦遣疑網也但令婚娶不簡良賤竝犯殘也次總分正明中初示文意但下釋疑相恐謂賤者不成媒故或疑良賤互不成故疏有人言母護男取母護女故可和合若母護男乃至取邊方婢無此理也故文云所應和者今解如上現見世間婚娶何由可對乃至有婢為趙夫人漁師欲於王女天人交會可不然乎斥古中先出彼見古謂男女二十相對可媒耳仍執上文以為證據所云應可和者但是二家好合豈簡良賤類殊故知不爾今下斤非略舉三事質其妄執漢書云孝成帝趙皇后本長安宮人謂省中侍使官婢名宮人非天子掖庭中者善能歌舞號曰飛燕成帝見而悅之召入宮中大幸之智論中國王有女名拘牟頭捕魚師因見染著不能飲食以情告母母送肥魚遺王女不取價王女怪問母以情告王女許之令月十五日住某天祠像後至時而往王女到廟獨入而天神即厭此人令睡女即脫瓔珞遺之而去女去方覺婬火自燒而死律中比丘與天女行婬犯重用此多緣證知不簡疏言母護者父崩母養恐有顛危常自監守故言護也如世孟軻母為三徙故道成儒宗也言父護者其相如前如世曾參為子不娶故也二親俱在其護自明乃至兄姉例同上也初母護中初釋護義如下引示言父崩者天子曰崩古語通用故得稱之孟軻者史記云字子輿鄒人也軻少與母偏孤居近墓軻乃常戲為墓母曰此非所居去居市傍軻復戲為商賈母又曰不可居又居學舘之傍乃為揖讓進退有禮母曰此真可以居軻遂為大儒孟子序云幻被慈母三遷之教是也父護中如前即反上文母喪父養等曾參者孔子弟子參為後母故妻以蒸梨不熟因出終身不娶其子元請焉告其子曰高宗以後妻而殺孝已尹吉甫以後妻放伯奇吾上不及高宗中不比吉甫庸知其得免於非乎文出家語此明父護子也疏言自護者本無師友性與天成雖遇塵染涅而不緇也如大迦葉柳惠之倫也自護中天成者謂天然自立論語云不曰堅乎磨而不磷磷薄不曰白乎涅而不緇喻君子在濁而不染同塵而內正付法藏傳明大迦葉年十五父母欲與娉妻聞之愁惱白父母言我志清淨不須妻也後父母為娉得一金色女乃至共要云我若眠息汝當經行汝睡我行如是清淨不喜塵染後白父母求出家等孟子云柳下惠姓展名禽柳下惠是號不羞汙君不辭小官進不隱賢必以其道遺佚而不怨阨窮而不憫與卿人處由由然不忍去爾為爾我為我雖袒裼裸裎於我側爾焉能浼我哉憫懣也裼裎皆衣浼汙也疏言法護者或世法自防不許荒逸故俗云三十之男二十之女待禮而行過此已往相奔不禁之類又如世律非媒娉合罪在徒刑恐違此法故法護者律云修梵行也今約世法以釋故云或也初明守禮世法謂王教俗云者出禮記內則篇男取陽數女取陰數減則不得過則許之故云不禁相奔謂住為夫婦也又下次約懼刑不敢非濫疏言姓護者族望所重海內稱之若濫染汙事則不可要須媒媾非此不得也姓護者恐辱貴族不敢為非故海內即指天下在四海之中故疏言宗親護者姓雖高貴至親物故若妄造非宗親所護故曰也宗親護中至親即父母物故謂死如物柯故疏上十是良其相自顯下明十婢律有正消文相可解故不出也次明賤中疏文示略今引律釋云自樂婢者樂為他作婢二與衣者與衣為價三與財者乃至與一錢為價四同業者同共作業若未成夫婦五水所漂者水中救得六不輸稅者若不取輸七放去者若買得若家生八客作者雇錢使作如家使人九他護者受他花鬘為要十邊方得者抄劫得也疏男子二十種相同於女改名便得不復煩文故律略示也男中二十良賤半分良者云男賤者名奴別相同上疏就男女交絡互為句數其相煩多且如母護男取母護女乃至下婢一男娶二十女二十男則四百句如是指印書使現相等例之無量歷句數中初示互句之多且下略舉直句言四百者且約語媒如是下例通餘四五種總二千句用此參互則不可數故云無量但識下文受說報三明犯分齊無不通矣律若為成婦事若為私通乃至須臾頃僧伽婆尸沙疏四言若為成婦事下除疑網也世云媒者為盡生也婦是伏事之言箕終於命報可有重殘私通暫時未必有犯為除此妄故結終始從婦至於須臾無非欲事故並犯重收綱攝網也釋第四句初文前總示文意世下出疑情箕者即掃洒之具明伏事之禮俗書並謂掃洒是婦人之職為下明斷疑始謂婦事終即須臾私通居次故云至於等疏言須臾者時之異名也僧祇云二十念為瞬二十瞬為彈指二十彈指為羅預二十羅預為一須臾日極長時晝則十八須臾夜則十二須臾若夜長日短反上可知此則西梵約日夜為度數法也此方漏刻經中不問冬夏兩至例分百刻約箭在水用刻分時未遑廣述所謂時節學也次科為三初標示由是時之別相故云異名僧祇下次引釋瞬謂目一開合也羅預亦是西梵時名未詳所釋俱舍名臘縛而云三十臘縛為一須臾與是全別不可和會日極長者且舉夏至夜長日短即謂冬至晝則十二夜則十八故云反上春秋二分則晝夜半分焉此下三明二土不同漏刻經梁朝出之明置漏刻之法不問下冬至日四十刻夜六十刻夏至反之春秋二分亦各等半箭在水者刻漏制云箭長四尺五寸分四面每面三時二十五刻四面共成百刻其箭在水壺中壺上安木蓮華作木人高七寸跪坐花心兩手捧盤壺中浮箭自盤心涌出以驗時刻之數水漏下一刻箭上涌一刻每箭上壺二十五刻一度放水故四度而成晝夜未下顯略遑及也時節學者謂知時刻別是一家之學非可於此具論註若初受語吉羅往說不報偷蘭若還報者僧殘若遣使若書指印現相隨媒多少說而了了隨其往反一一僧殘若不了者偷蘭除二道說餘身支節而媒嫁者偷蘭若媒非人黃門二根者偷蘭若媒畜生及人男者吉羅若持他書往而不看若為白衣作餘使者吉羅比丘尼同犯不犯者若男女先通後離還合若為父母疾患繫閉看書持往信心精進俗人亦爾若為佛法比丘使亦同疏就注辨相初自作輕重中媒緣有五先舉語媒後四例結疏就語媒中有三疏受語吉羅者計應是蘭僧殘方便而吉者意不往說對往輕也釋注受語中對往輕者謂受而不往故結輕吉疏二往就說而不返報若報成重故但偷蘭往即犯蘭是殘方便疏若爾初罪是蘭而言吉者則殘罪方便唯是一蘭答所言吉者望為作使非是威儀故犯一吉又傳情欲更犯一吉止為息心故不行往所以方便罪同偷蘭如上方便義中二篇則兩蘭也問意躡上二罪可解答中初釋不往犯輕文明二吉由此篇犯相故心雙結一者應懺二則非儀今傳情欲即是應懺也所以下次明往即結重指如上者謂作意欲往即吉受語即下品蘭還報未及又中品蘭同上次第三方便矣文中承前一吉故云兩蘭疏三就還報故殘何疑疏語既三時重輕下四例此可悉若使及書言中自了指印現相必假言通故僧祇云作相者當知見我著垢衣持空鉢坐卑牀說賤語者不得也反上吉相得與不得還報者殘餘四中初指例四相雖殊三時無異故云可悉若下別簡以遣使遣書有字語傳情故云自了指印現相但是示信立約相中不顯故云必假言通故下引示語令覩相證須言通反上吉相者應云見我著淨衣鉢持好食坐高牀說法語即得相也疏注中隨媒多少隨信往反一一殘者疏有人解云上媒境既多故通其相若據結罪如媒男女一家好合以來但一殘耳釋多少中他解媒境者即上男女各二十及五相等彼謂一一之言屬上多境非是一家容有多犯又復結犯須據和合疏今言不爾一家婚媾何由即合情雖相會而事相須重或經年紀信使重沓然後方許者自有一發言情宛同符契者今判約罪止可同律附其三返即結僧殘不待二家和不和也故僧祇中同此結也正義中初約久近不定以斥十二年曰一紀契合也今下準律判犯反古二義對上可知下指僧祇即上引云得與不得還報者殘斯為明證疏就不犯中男女先通者非初情會欲非我也故十誦遣婦作書雖未唱令和者犯蘭出門者重然其相狀意在本通故五分中為男倩女為女倩男長使者蘭明後有會故也不犯中初科前釋開意故下引文以決本律文漫故取外部示其分齊據輕重兩結則知本律不犯義同未唱望非僧殘故在聞耳然下釋犯意以知彼先通遂為和合欲使復通故云意在等十誦就此而入犯科故下轉證本非媒事恐後有通亦制與罪證上和合知後必通犯無疑矣疏父母疾閉看書往者以媒為俗使故開為父母生身重故又開俗人者未受歸戒無法相收故文約截信心精進也良由內外兩眾同法同儔雖形參道俗而法情無二故開餘文可解持書中初釋開親初明因制之意以持書通使未必為媒因媒而制故列開中開為下正示開緣文中但釋開親疾閉兩難易知不點又下次釋信士上明簡信良下敘開意同法者五八體通故同儔者皆稟正化故雖形參者遮疑妨恐見形異而謂法別故餘下指略即點注中佛法僧等律六無主不處分過量房戒疏第六無主不處分過量房戒疏就制意中疏初明開諸比丘自造房者然上士之報氣剛方盛堪忍寒暑情非以惱隨受捿泊即是修行長道之緣是以如來聽在塚間樹下露地靜緣資業無畜房宇中下報類形必萎顇制同上士塚間修道力分不堪或隨退沒則非隨機達化之用是以如來任其分量但能弘道則開資給或小房石室兩房一戶起不礙頭坐趣容膝足堪進業意在於斯六無主房戒制意中初科文敘三根以彰隨緣用教須否初明上行頭陀不須之意泊止也次明中下報劣必須開立萎顇謂薄弱也文明開意皆云為道若但養身恣情取適則非教意小房等者且依律受法趣列其相下約起坐示低窄之極末世奢縱反競豪雄不論道業空虗但務堂舍高廣乞法制量舉世無聞樹下塜間斯蹤久絕仰追聖世良用慨然疏何故不聽過量不處分者然則出家之士理非滯著隨事將擬即堪修道若有信施量時而受縱有經營容身使罷今乃廣作煩勞不少一須人結搆妨廢正行二如多云長己貪結壞少欲知足故三處處乞覓惱亂二趣不生信敬壞滅正法令不久住故四專任自由不乞處分容有障礙僧事多惱亂故五或容自損或違慈道壞梵行故以斯諸過故制罪也次意中三初雙徵事法然下二正明制意初敘少欲順教今下明違法多過上二句總標一下別列五中前三過量過後二不乞過前中初過多事長業則反正行第二多貪增惑則反少欲第三多乞惱他則反自滅法二趣者如戒緣中人非人也四中不乞處分眾法不行故礙僧事第五若在難處則有命梵二難自損即命難違慈即梵難以下通結疏問四依須行不行不制四開有違制輕重者答四在少欲依成上品若使不行便當中下是故依而不行聖不結犯四開非勝稱緣而設而於自分不行故有輕重別制但為房是疎緣義不交急營搆過多具前五種是故制殘餘三依開資身正要事不獲已必須服用約情敘過微故制墮問中含二意一問違依無過違開有罪二問違開制罪房重餘輕答中先答初意前明違依但由機劣力所不堪而非故違故無所犯下明違開食依房藥四依之後隨列開法故云四開言非勝者開對下機教則緩故自分不行謂不守開中制法故但下次答後意初明房重交猶至也義鈔作要急或恐傳誤下明餘輕三依開者糞衣中開畜長取衣等乞食中開受請即有別眾展轉足食等腐樂中開長藥請藥等並見墮中疏次釋名辨離合疏初中專任在己故稱自為身獨運造故云無主大非法限故曰過量餘同上也釋名中言自為者戒本標名則無此語比下有主亦云為己況疏文牒釋犯緣明列理必有之但恐寫脫耳指同上者亦應分對所防能治諸戒皆爾疏言離合者疏問初後皆房何故分者答同少異多故不可合何者有主無主異有量無量異羯磨法中相翻是異有三別故所以分之離合中初問答中三異上二易知羯磨相翻者前戒則牒自乞無主後戒乃云有主為己疏若爾前房亦有不乞過量何為復合答欲明房雖一口罪則四含過濫是多懼非輒造故也又顯過量不過量俱有不乞罪處分不處分俱有過量罪轉難中由前二罪合為一制故舉為難答中初多罪答四含者加妨難二吉懼非者非猶不也又下次約互顯答疏問此罪混合何以開於最初答前初是過量後初是不處分也最初問中一戒兩犯何者初開律無指的故云混合答文易解疏若爾前已有不乞則是後第二何故前列答結集者意次文不同何以知然若同一戒文義不同約異戒相形則不能比類如前大殺已結小殺明知此列結集境通非謂小提迦留前制若前已結後犯非禮不應訶言最初犯戒以此挍量同別類矣再難中既云不乞是後戒最初則前戒不乞反是第二答中初二句略示何下委釋前明二戒不可合制文義不同者如上三異故約下引類異戒不類者謂餘戒列相並無此例雖例同殺戒亦是廣解非關戒本故知唯獨此戒次列不同耳如下正引同別類者同謂大殺合結別謂小殺後制義同二房故云類也疏犯緣有六一無主二自為三專乞求四過量不乞五具二想六房成犯列緣中五具二想即過量不乞疏闕緣相狀大同犯多悔少故不廣也闕緣大同者同上具緣翻具成闕耳犯下示略意疏就闕第六緣房未成多論云末後二團泥未竟已還輕蘭餘一團泥在重蘭如善見云末後團泥在留待當成蘭決心且罷即殘又如僧祇最後不定或瓦木版石灰泥草等隨作房法也第六中初引二論並以團泥以分因果擁住因蘭則名闕矣次引僧祇通指諸物但取末後不獨團泥疏此非法房自他兩用一入一吉房主若死休道及施僧者乃可通用據此悔殘理亦開受受用中初明犯相房下次明通用文列三緣開施僧者若據販賣食施僧不得受或房用是疎或用非入己食則反此故不同也據下疏家義斷亦不同食縱懺不聽問悔已開受為自為他答既無本過義通自他問為須除量外否答文雖不顯義不須除以房物重大造立已定不同衣量容可截續註佛在羅閱祇聽諸比丘作私房室曠野比丘便作大房乞求煩多惱亂居士乞既難得遂斫神樹神及比丘以事白佛因往曠野訶責引喻便制此戒疏就犯緣中初明隨開造房便樂大作惱亂居士遂斫神樹即是二趣俱惱之緣也多見二論云樹神兒子遊戲上下遂斫兒臂神大瞋怒將欲加害夜往佛所聞偈得初果言佛訶責引喻者喻有二初舉龍鳥以下況上也後舉賴吒比丘不往親乞以親況疎也講時依律敘之亦有助光行迹矣戒緣中初釋惱亂發起之由多下引論別證非人聞偈者佛言若人起瞋心譬如車奔逸車去雖能制不足以為難人能制瞋心是乃說為難言佛下次釋呵責龍鳥二緣如前篇引賴吒比丘者律云佛告諸比丘昔有族姓子名賴吒婆羅出家為道至父母家終不乞求時父語言汝是我子何不從我乞耶賴吒說偈曰多求以不愛不得懷怨恨是故我不乞恐生增減故當知賴吒於父尚不從乞況汝等乃在諸居士家多所求索令彼不喜等文中兩點喻意然非假設並是往昔實事但彼引緣欲彰人意不喜乞求比類呵責故云況也下令詳引誡勗後進必有高節則美行外彰故云亦有等律若比丘自求註彼處處乞索也疏戒本分二各有十句疏初立法中明造房之緣務也疏初明比丘謂造房者非犯士也疏二明乞求者以有自物則無過量非法乞求惱施之甚故犯過量也注云處處乞者成前惱多相也立法十句中第二釋注成前者即指戒緣律作屋註屋者房也疏三作屋顯所為也除作餘事不須乞處分故注以房解用別開總也爾雅釋室與宮不別據俗釋名更有品類如今宮第宅宇異等故無暇廣也第三釋注云別開總者屋是總名房為別相故下引俗書釋其名義初爾雅者示名通也彼云宮謂之室室謂之宮次據俗下彰名局也言釋名者此即通指字書非一文也劉熙釋名云宮穹也屋見於垣上穹崇然謂王者所居也第者漢書注云有甲乙次第故謂公候之舍也宅釋名云擇也令擇吉處而營之宇說文云屋四邊也此二貴人之居通則無非屋舍之名別則須分尊卑之異今但識其通名別相廣亦非要故云無暇律無主註彼無有主若一若二若眾多也疏四無主者對後有主故無過量罪也注中似有主一多及通無主義故僧祇云彼有男女在家出家皆得為主無如此主故言無主四中初云對後者使結罪無濫故注中列主一二眾多反明無主故云乃通等及字傳誤然本律中不明道俗故引僧祇顯通七眾律自為己註不為他作疏五自為己者除為他作既不潤己則無犯故自為中為他無犯者據本罪為言律當應量作是中量者長十二佛磔手內廣七磔手疏六當應量下明分齊也疏所以用佛為量不即身為量者身不可約以小大故佛則限其一化也第六磔量中初科人身不定佛則定故然佛示身亦有大小且取王宮丈六以為準約故云一化疏佛磔手者磔謂張磔可從石也今有從手從足俗字耳次科張磔者謂以大母指與中指張開相去之間今下點非以律本中多從手作疏本律無文可依五分二尺為定僧祇二尺四寸者此律翻在宋朝元魏所用一尺當於宋家一尺二聞傳佛教從北自南則為魏尺當於佛磔所以五分磔長二尺者此律翻時道生智嚴等竝是名士既明曆緯又善方志所以通於東西定於尺秤誠有由矣三中初科上句明律缺五分下示所取僧下顯不同所以初明僧祇宋受東晉禪都建康為南朝元魏都長安為朝魏北用增尺宋用周尺譯者不詳即用魏家二尺於宋則多四寸彼律是佛陀䟦陀羅譯中天竺僧故不體此方時事如以果汁為木蘭之類聞下出譯者之意彼以教法既從北來宜準於魏自猶至也若準初卷僧祇乃在東晉義熙十四年譯今言在宋必涉兩朝詳之所下次出五分曆緯即陰陽書明星辰纏度則分寸可知方志即地里書明南北時政則是非可辨東西即南北二朝或可花梵兩土疏南尺本是姬周所用從秦漢魏並無改張晉氏南遷斯法永定元魏撥亂文籍焚除無可依準故隨世立用古尺一今魏一尺則唐雜令還述如此隋煬博物還依古行習俗生常故古非用今還用魏以通時俗至於分度星次律量衡平藥石分銖祠祭升合無非準古所以律本大鉢三斗小者斗半姚秦時政用古未訛故此翻文頗得通允次科初明宋尺可準漢魏者魏即曹魏晉南遷者中原既亂中宗度江南鎮建業立社稷于建康為東晉焉元下明訛變之始則下敘唐朝承用雜令者魏徵撰彼云以一尺二寸為尺隋下明前代復古煬帝隋第二主撰博物志通明物理習下明後世不從初明用魏即前元魏至下次明用古文明兩用顯其無準星次謂眾星周天而行必約分數以明行度律量謂俗律決犯並準丈尺衡猶準也上二辨尺藥下明秤二十四銖為兩合和兩分不可增減故祠下明升斗已上四事必須準定故皆從古所下會同本律疏有人云何足如斯但隨國用如今時節有四尚不能迴破為三明知隨國用尺則比佛量自得斯非言也若以隨國即得鉢量三斗不勝尺量諸說難一何由定其持犯未足開決深疑也斥妄中先出彼見引時例尺西土三時無秋分故斯下一句責非若下例難勝讀為升言不勝受唐三斗故尺下顯濫據文斥他亦彰今意委明尺量使持犯揩定令斷割無濫事鈔所謂古今諸師曾未霑述故即補闕反光九代故知決正尺斗始出今宗疏今且準酌意言為允如有隱括不畏紙貴也所以如來常光一丈常身丈六多論以人長八尺也即如文中二尺為卒率音律也長二文四尺廣一丈四尺既明內廣理除其外也僧祇邊壁丈二尺若通其本止一丈耳顯今中初明理當教無明判義例決通故云意言如有等者示須廣之意晉左太沖作三都賦豪貴傳寫洛陽為之紙貴所下次引據常光常身竝簡現起則有不定一丈或云一尋佛身倍半則磔必倍尺故云即如等音率為律有本細注疑是後加率猶數也長下示量上明縱廣量後引僧祇出高下量彼用魏朝一文即是宋朝文二今取姬周應除二尺故云若通等律當將諸比丘指授處所疏七當將比丘指授處所下文可解也註彼比丘看無難無妨處己到僧中脫革屣偏露右肩禮上座足右膝著地合掌白言大德僧聽某甲比丘自乞作屋無主自為己我今從眾僧乞知無難處無妨處如是再三也疏注中廣列作之方法初看無妨難者以羯磨所因在于妨難必有作法得罪不成故先定基址後方從乞六門分之一能處分人是非二僧私二地須處分不三有妨難作法成不四處分法約作於人處五不處分罪分有無六沙彌已乞受竟須不指授釋注中初科前點注意六下列義章初人二處三法四人法處三種合論五罪六下眾疏初依律量觀信與不信信即依作不信往觀如僧祇中都無解羯磨者一切往就作房處一比丘唱云僧為某比丘指授作房處三說亦得若處遠隔水等緣但差二三人亦得若越年異界作私房多妨難處皆不成也初中前引本律量可如下次引僧祇往觀初明僧往以無能秉故開唱告若下次明別人往若越下顯非文列四種竝約造房比丘為言疏二僧私二地須處分不者皆須加法以妨難是通如明了論樹空山巖石陰等得行住坐臥如作房舍所攝若不爾者自損惱他故也二中初正示如下引證以樹空等義非私處同須乞法難處自損妨處惱他疏三妨難若有作法成不者疏昔解云成若爾何故律云有妨難不應與處分答乞處分者制其專任之過本不防於妨難所防不同故又得成如律有妨難處不過處分但得二吉文誠驗矣三昔解中初句判定若下釋難前引律難顯是不成答據所防復有成義故云又也如下引證疏今解不成毗尼因緣三求無過則成持也此戒緣者正妨難也戒本所列還分妨難及後廣解妨難愈彰故律文中互有不成何況俱者必有作法與法正違眼看妨難卓然而云無有妨難者大可笑也今解中初句義斷毗下斥非初約義斥戒本廣解文現可知若據戒緣不明妨難或指二戒斫伐神樹神欲加害即為妨難故下次引文斥律列四句一有妨有難二無難有妨三有難無妨三句皆不應與處分四無難無妨唯此句得成必下三約作法斥疏若爾前言二吉此豈凡心答此是處分先成妨難後起法成不壞無殘可結妨生不合強作故吉此是緣外相違故生不壞前法如受戒後難生不失前戒相似也釋古執中初難由前古師引此為據故問通之答中初二句立理法下明開制此下釋開成之意羯磨後生故云緣外如乞法時本無妨難得法已後惡獸始來等下引受戒難生為例具戒者汙尼賊住必無後生二形破內永變非畜戒亦有失邊黃五逆暫變二趣則無有失今云不失蓋據此耳疏若爾人病衣重病差法在不答不同也以此要心有期病差必違前法如受戒後捨者以遂要期便失次難中以羯磨離衣病差法失故引為並意言既許難生不壞亦應病差法存答中初句直破前難以下釋法失之義如下引例受戒後捨通指四捨疏若爾狂病既止須解者何答此由得法本不由心所以病差法存須解三中顛狂羯磨病差須解例難自失答中文意易見疏故知有妨難處分不成同受重難障戒不發次舉例中初例可解疏若爾百遮同難應不成受答房非道本三義不成一妨難容可待無二可避餘處三不可避者容全不作故有不成受則不爾一青黃三角不可待無二即身自有不可待避三若以小遮不開大受未成通化永乖出期由此道本故不類也次難中律有一百五十餘遮今舉大數故云百耳言同難者謂同妨難遮中不稱己名不稱師名年歲不滿先三定不發戒餘通得不帶遮為受僧但犯吉不妨得戒今難意云遮同妨難何以有成答中初明處分三義不成受下次明受戒三義相反百遮中顏色太青太黃眼生三角並是戒遮今略舉此三以彰不改然年歲衣鉢稱名疥癩亦可待無文據一往為語疏四明人處者四中以凡作羯磨必有所被今此處分人處兩兼情非情合義須定指故有此科疏問處分法者為與人相應與處相應耶答此羯磨者與處相應何以知之論云處分地得餘處不得也初問可見答引論證即多論也疏若爾與處相應者餘人就此上應得作不答不得也次難答文不委意在後通疏若爾結界法亦與處相應餘人亦不得羯磨答不同也結界時無人別乞復不制稱人名法無所局故得此並反上不合故多論云餘人就此房上作重屋但問房主無不處分罪第三難答中初示不同二義相反故有通局不稱名者謂羯磨不別牒也故下引證一須問房主二唯作重屋驗知自乞不通餘人疏五明不處分罪有無者疏若元不處分此何所疑今謂已得處分依限而作過限未知此過得不處分罪不五中初問若全不乞定知有罪故約已乞以為問端疏昔云此非全不處分但得小罪不犯殘也疏有人云雖本處分處分不作反出於外理得殘罪故文云僧不處分此言知何不該疏有人言如昔是也故律云僧處分過量一殘故無不處分罪別三釋中後師引文助成初義既各有據義難取捨意以後師文義為允疏問處分羯磨防妨難不答不防也次科中初問答易解疏若爾說淨法竟應不防長答本有妨難則不聽與處分待無方得說淨不爾懸防長故有過不合止由處分不防妨難處分竟便得生說淨正防長故作法竟即無由起次難中立法是同所防有異故引徵之答中初約防不防以分兩異止下次約生不生轉釋不同疏六明對沙彌者若彼沙彌時乞處分後受具戒竟方作房者更不須乞人法不異故也沙彌中恐疑大小位別欲明前法存亡故也律彼比丘當指示處所疏八彼比丘下正明與法相註爾時眾僧觀此比丘若可信者即聽使作若不可信者眾僧往看若僧不去應遣僧中可信者看若有妨難不應處分無者應與眾中應差堪能作羯磨者若上座若次座若誦律若不誦律應作白言大德僧聽某甲比丘自乞作屋無主自為己今從僧乞處分無難無妨處若僧時到僧忍聽當與某甲比丘處分無難無妨處白如是大德僧聽某甲比丘自求作屋無主自為己從僧乞處分無難無妨處僧今與某甲比丘處分無難無妨處誰謂長老忍僧與某甲比丘處分無難無妨處者默然誰不忍者說僧已忍與某甲比丘處分無難無妨處竟僧忍默然故是事如是持彼作房者應知初安石及土塹泥團乃至最後泥治訖者是也疏就注解中分三從初至無者應與來商度彼人堪可進不二眾中應差下至如是持來明與白二之相也三彼作房下明作成分齊也相中可解第八釋注云相中可解即指三科文相然第二與白二中先列四位簡能秉人上二約臘次下二取智能不誦律者但解義故以舉法被事必曉如非律擇堪能不容妄作律無難處註有虎狼師子諸獸者下至蟻子若不為此諸蟲獸所惱應治平地若有石樹株杌荊棘使人掘出若有坑溝渠陂池當使填滿若畏水淹漬當豫設堤防若地為人所認當共斷當無使他有語是謂難處也疏九言無難者注中所列命梵而已如虎狼等為命蟻子等為梵若有石樹乃至水漬無非在後為命留難也為人認者計是妨緣今入難位者恐後諍競起非淨行也九中初通示二難若下別點餘相諍競相言則違佛戒故云非淨行也律無妨處註謂通草車迴轉往來者疏十妨處者止存一緣如諸部論中廣引必欲締搆理須精博不爾陷非良由不學故也十中云一緣者即如注引草車謂大車也如諸部者十誦四周一尋內有塔地官地居士外道等地善見是人田園尸陀林王誌護等備如鈔中必下恐專據本律誡令通曉律若比丘有難處妨處自求作屋無主自為己不將諸比丘指示處所若過量作者僧伽婆尸沙疏就後犯本亦分十句初犯人二難三妨所以立法最末論此中而先述者答立法在後行之次第由僧處分止為妨難也此中論初作之次第非所起也餘句易識可解耳後犯本中初科前標三句所下次明妨難前後不同非所起者非即是過餘下略指七句四自求五作屋六無主七自為八不乞處分九過量十結罪註若彼作房於妨難二處者二突吉羅不處分過量二僧殘互相有無者隨其所犯若使他作成犯亦爾為他作成者二偷蘭二吉羅若以繩絣地作受教者過量作者犯殘不還報又不問彼並犯吉羅比丘尼偷蘭不犯者如量作減量作僧處分無難處無妨處如法絣作若為僧為佛圖講堂草菴葉庵小容身屋若作多人住屋如法者是疏就辨罪中自他分別疏初自作中二吉二殘有無可解次科自作中初文言有無者注明具四而互有不定律約句數辨之初三罪四句一不處分過量無難有妨二不處分過量無難有妨此二句二殘一吉三不處分不過量有難有妨四僧處分過量有難有妨此二句並一殘二吉次明二罪有六句一不處分不過量有難無妨二不處分不過量無難有妨三處分過量有難無妨四處分過量無難有妨此四句並一殘一吉五處分不過量有難有妨二吉律止有五句應加云六不處分過量無難無妨二殘有妨難得乞法者並約羯磨後生三一罪四句一處分不過量有難無妨二處分不過量無難有妨並一吉三處分過量無難無妨律止三句亦義加云四不處分不過量無難無妨各得一殘疏問為互過結罪俱過方結耶答如見論云長中減一磔手廣中過一磔手亦犯僧殘然此互過是兩口房廣長俱過是一口也俱是一業終是一殘可知問俱互中唯明過量一殘答中先引論示犯然下對房顯相言兩口者一口則無廣長互義俱下明制業無差恐謂俱互有重輕故疏二教他作中亦同犯罪教佗中初文教即是遣故注云使耳疏為他造非法故約緣分輕重也次科輕重中點注二蘭二吉疏二以繩絣地下明房主巧師過有無相但云受教者犯所以不定者若作過者房主則重巧師則輕故也又不問彼或不還報罪通自他也有無中初示科意但下釋不定罪名注中多一殘字撿律亦無只由注中通言犯故乃有釋文若定犯殘此文何指若下釋成意謂罪該二人重輕有別故不可定又下釋報問對注不次律制房主房成須問不問吉羅又制巧師作已還報不報亦吉故言通自他也疏上明身業為他作非法中但是勞務業不問房主犯不犯一向自得偷蘭罪不同口業教他作前人殘教者蘭前無罪教者吉由無身造故次對簡中初明當戒教他犯相受教營造故是身業不下次明餘戒結犯有異如教他弄觸等並據前作不作辨犯輕重四重亦爾下篇無蘭應同結吉疏就不犯中如量減量開前過量處分及無妨比上開之如法絣作開上過分齊俱有殘簡吉等若為僧下開二殘相草庵已下小故非犯不犯中初科如量至絣作等此並依教明開為僧者此對為己明開疏多人住者以擬多人住故非謂多人共造也如畜長例釋多人中非謂共造者容同犯故如畜長者多人未分物過日不犯則同擬多人也分屬已定共處亦犯如共造也疏有人云此由造作過量犯非謂如量貯畜罪如見云若沙彌大僧多人共作不犯段段計分一口過故亦犯他解中意謂房長不可例同長則共畜有犯房則共造無過如下引證無犯必約段段計過方有犯義律七有主為己不處分造房戒疏第七有主為己不處分房戒疏制意犯緣竝同上但無制量為別七有主房指緣同者今須辨異一有主二為己三長佛六磔廣四磔須乞四不乞五不乞想六房成對前同別可知疏如見云長佛六磔手廣四磔手已上者須處分乞法量者此通二戒減此則不須乞註佛在拘睒彌國時憂填王為闡陀造屋便斫路中神樹路人訶已比丘舉過佛訶責已若斫神樹吉羅便制此戒疏就戒緣中問既有主為辨何須斫樹答為取下地擬施基故多人受用被訶非一戒緣答中去樹為基明非取樹施字平呼多受用者律云尼拘律樹多人往返象馬車乘止息其下等律若比丘欲作大房註大房者多用財物也律有主註反上無主是也律為己作當將餘比丘往指授處所註彼比丘如上知已應至僧中禮上座足等從僧三乞文同於上以有主為異律彼比丘應指授處所註僧應觀察若有信者有智慧即信彼而與白二若不信者如上進止律無難處註謂師子罷熊等獸也若不為彼而所嬈者應如上平治乃至畏識認應先斷了律無妨處註中問容草車迴轉者律若比丘有難處有妨處作大房有主為己作不將餘比丘往指授處所者僧伽婆尸沙註辨相開通如前房戒唯無過量為異也疏就戒本中先明立法有八句除自求及量限後戒本中除自求及過量文相可解餘如鈔戒本中立法犯本除句並同下指鈔者彼云此房屬於己身若死遠去不還隨念分處若與三寶親友白衣自賣取錢隨心自在唯不得賣地地是僧物僧不許賣房僧得罪若房主不自處分者屬四方僧次第住之
