body:
  text: 疏次明單白知衆法者二所成法疏何以須者僧通凡聖情見難諧我雖欲説未知許不又説戒廣略則有五階聖制乃通凡心須顯故須和默即應緣同初敘意中初徵問僧下釋有二義初約僧情不同諧和也又下二約説戒差別五階者律有三五十五種初説至序餘者應言僧常聞二誦至四事三誦至十三四至二不定五廣説初五句也復有五事一説序至四事已略二至十三已略三至二不定四至三十五廣説二五句也復有五事一説序至十三二至二不定三至三十四至九十五廣説三五句也今且據一段故云五階或可五合作三聖制通者但使有緣並開諸略凡心須顯者隨緣緩急令衆同知故須等者情和緣合法事可行也疏就制此白如彼具詳恐不委見故略分判就文為三初敘告事情二忍同可不三舉事成結也釋文中初指如彼者即羯磨疏白法五句總分三別初敘告者即初二句次忍同者即三四二句後結成者即後一句疏約句有五律大德僧聽疏初大德僧聽者警衆情也將欲表述恐有異緣故命章大告不容耳識妄聽也釋初句初中表述即次句緣本異緣謂他想首提美稱目彼同聞故云命章大猶遍也疏有人言斯則贊美誡敕之辭也大者莫先為義明九十六道有師資之僧佛道之僧運廣莫過故云大也釋大字中初科上二句通示大下別釋九十六者外道六師各有十五弟子執見各異故僧者衆義彼亦稱之上求下化故云運廣疏又云出家四果乃是真僧無學最高故云大也雖僧未階必得無障以出家者必為解脫因中談果亦云大也次釋中內外兩凡皆假名僧見道已去號真實僧無學真僧中之極獨得大名雖下遮疑可知疏又云三寶為言僧田最勝義通餘二如愛道施緣能生大福故云大也三中若論功行佛法無倫今約兼通故推僧勝如下引證賢愚經云姨母用金色㲲上佛佛云可施與僧我在僧中佛同應供僧為解脫人能弘道法在其中故云通二疏有人言諸義不無今所論僧為簡小學但取無願故云大也四中對沙彌有願此義頗親疏所言德者有所得也以得善居身故名有德出家捨著福度含生戒善自修滅諸過業修習定慧斷結成道備此美稱乃稱有德之人也次釋德中初通釋字義出下二別列德相備下三總結德相中六意釋之初句猒離行次句慈愍行戒下修功德行二初句及下三學等即自利行福度一句利他行三從初至定慧即修因斷結一句是剋果四捨著滅過及斷結是斷惡度生與定慧即修善五即上斷惡攝律儀也三學者攝善法也福度饒益有情也六福度即誓度衆生斷惡即誓斷煩惱戒定慧誓學法門成道即誓成佛道文中六句出家法行無不攝盡以人通凡聖行兼大小故以因果三聚四弘釋之無妨疏所言僧者唐言和合衆和有二種謂人法也言人和者雖復殊方異質品族不同若至同聚則𮌎襟莫二事順心同如水乳合故也言法和者戒見行命説戒布薩有必齊遵無宜乖逆故也釋僧中初翻名和合是用衆即是體羯磨疏中唯衆單翻今此存古但知體用有殊不妨以義助顯和下釋義人和中先約俗論依正姓氏三種皆異若下出和相初二句通示次句指事別釋事謂羯磨所被後句喻顯法和中戒見等是別法説戒即衆法義收羯磨行即威儀合是儀字布薩合作羯磨疑是傳誤疏然僧義大約六和為先身口心和所謂人也戒見利和所謂法也人法乃具數須成四三人已下無用斯法今此成僧故有此白六和中還收人法或約內外體相德用分之斯法即此單白也疏所言聽者專心靜察聽我所陳陳何相邪意欲將説淨戒非雜染所聞故有斯示若素自明白堅持無損已有毀缺懺説令淨脫不專聽便忘所犯帶罪終身一何自纍故須靜聽也釋聽中初通示陳下敘説戒意若下明須聽意纍謂纍縛律今僧十五日布薩説戒疏二今僧十五日布薩説戒者雙牒緣本兩告衆也標日是其時緣説戒是其宗本上令攝耳止為此也第二句準刪定戒改布薩為衆僧則無重言之過律若僧時到僧忍聽疏三若僧時到僧忍聽者謂心和事順理必承修也若者為語不定之辭言由漸也僧時到者到即至也一者人到清淨大沙門入也二者時到十五日布薩時至也僧忍聽者責忍同也今欲説戒聽許以不同則默然不同者便説也第三句初通示若下牒解據業疏云法事契會謂時到也彼取合宜之時則通一切羯磨此約作法之時唯局説恣二法以時有限定故得此釋責問也疏此聽心用和忍之聽異上初句耳識所得也不解此二聽聽同聲者則言表不通不成羯磨前聽即在去聲他徑反後聽即是平聲他丁反恐不解此違損事多自説戒時罪福猶可脫臨受戒惱害尤深故須極誡也揀濫中初分義異不解下示音別恐下顯意律布薩説戒疏四布薩説戒者單牒宗本勸速忍同也布薩多翻此應清淨餘如事鈔所引也釋第四句指鈔即説戒篇如前略引疏戒本不同或云衆僧説戒者或云和合説戒者任情兩得理通無妨也點異者今本依律出之至刪定戒中則前云衆僧後牒和合律白如是疏五白如是者詳述前事結告本情故也疏自餘成不等相如刪補羯磨鈔疏中須時抽取用之結示中指在三部歷學方知此據一白略示而已注佛言當隨王者若十四日若十五日應作數法疏注中日月隨王法者謂隨俗也釋注中隨俗以年月日時閏餘大小皆出俗中律曆故注若黑若白各有十五隨月稱之疏言黑白者以道俗位殊時數亦改故也俗則年有四時道則歲唯三位略於秋分也故三時之始冬分在初表無常也令有慧者觀時入道不容非逸也故冬四月以八月十六日為初春四月以十二月十六日為初夏四月者以四月十六日為初也明黑白中初科前明異俗故下推教意俗以春為始取其發生道以冬為初則取凋落出家厭世非求榮故故冬下列時位疏且舉一方不可偏執如今印度諸國以五月十六為前夏覩貨羅國以春初為夏首此則隨方土之所宜任機緣之取捨也次餘國中五月十六為前夏則九月十六為冬初正月十六為春首即善見中六月十六為後安居是也覩貨羅者西域記云此國地南北千餘里東西三千餘里東厄蔥嶺西接波斯南至雪山北據鐵門其國冬末春初霖雨相繼加以風土率多瘟疾而諸僧徒以十二月十六日入安居三月十五日自恣等業疏云余參傳譯親問來人是也此下會通疏半黑白者隨月晦望也間以淨法隨位説之律文日日説戒妨廢道業故限晦望折中之宜也釋兩半中初牒釋間下明説意律下示制緣疏先黑後白者舉三時三始必十六日為初也又云十六日已去白虧黑生月一日已去白生黑虧約相取分故有斯召先後中初正示文中不顯所表亦以白虧黑生表無常敗壞使觀厭也又下示得名所以注若得四人應作此白三人以下當三語説戒也疏若得四人下文相可解律諸大德我今欲説波羅提木叉疏次解第二發起序中文分八段律文具解今且生起後方釋文次釋誡敕初分示中律具解者即注所引也生起八段次第相由在文可見疏從初至説木叉已來標舉説宗歎功勸信有生善滅惡之義疏但斯正戒乃是衆同所聞理宜崇遵必無乖別是以第二令集一處顯形心無異疏形心既和事須詳審聽若異聞則乖説意是以第三諦聽善思正明警敕有開解之用疏凡欲聞戒為被行淨之人必有違犯便乖説聽之法是以第四若自知有犯已下正勸時衆省己之違見過尋悔應法成行疏染者既誡無過當機自表已淨世號伐德但止默然聞成義顯即名答對應上問意是以第五不犯者下省己之順默表已淨疏上五通告止在別緣三根外彰衆網須正必有他舉理須對實是以第六若有他問下誡勸時座犯持之士深懷二答六中云別緣者即自行二答者下釋云有犯露答無犯默答疏若內實犯而外表淨令僧妄解罪障尤深是以第七如是比丘下明隱覆之瑕不實之損行穢自纏特由抱過勸發露也疏若順教修理有深益是以第八若彼比丘下知犯識懺還淨上起三學增明克成道業不虗之益也八中上起即懺悔名出了論謂翻前犯時居下故名為上戒法續生稱之為起克能也疏生起此文非教本意講説之家務傳言相西梵諸師凡欲敷演但依文義廣説所由至於科約蓋闕如也縱有分判大通無局如龍樹解大品以為二道天親釋涅槃以為七分須知意也不可浪事悠悠費於紙墨大破正功無任法利顧諸學者可不思哉今欲消文就義分之更有科約終非大濟故削略也結略中三初示意教本資行非圖多説今此敘致但利講解故非本也西梵下二舉中梵例顯初敘本無如今藏中大小乘論止是長途散釋而已縱下遮妨其間亦有科判之者故須此示大通者謂以義總分無局者非隨文細碎龍樹下即智度論釋大品般若彼分二道判盡一經一聲聞道二菩提薩埵道天親造涅槃論分經為七一不思議通反示分二成就種性遣執分三正法實義分四方便修成分五離諸放逸入證分六慈光善巧住持分七顯相分用論配經方知終始此且略知七名而已據彼西梵敷演之式則知科判本非急要故云須知意也不可下三顯略浪橫也費損也破正功者妨自行也無法利者無益他也疏初云諸大德下舉宗標示也釋初段中初云舉宗即木叉標示謂告衆疏諸是不一之名顯教正訓廣必四人已上故云諸也大德不異前通釋諸大德中初文不異前通者指上單白已釋故疏問廣説戒法其必在僧如何今告乃言別也答戒法通收何隔僧別望法是僧望機是別法被在人故須問別不足怪也問中如羯磨告衆則云大德僧聽單對一人則云大德心念今此對僧反彰別號故須問釋答文初二句通示戒法以制總十方法分三位故曰通收望下正答來問望法是僧者單白廣説故望機別者檢問自行故私釋若準羯磨初令同聽乃是告僧後責同忍云諸長老亦是問別今此説戒前陳單白已是告僧後文敕聽例皆召別據斯比擬義無異也疏文云我今説木叉者正標宗也木叉果德之名戒剋在因今言果者因中説也次釋木叉初中上文標判木叉下考名會釋剋定也疏光師戒本云我今説戒者以名顯時心略隱果號而今所引乃是律文不可全蔽故須出也次科先示古意彼謂果號乍聞難曉以文舉梵言義非現行故云以名等而下指非恐乖聖旨不可改作則古今兩別是非可見蔽覆也注佛言新受者未聞戒不知何學聽集一處和合説之疏注中引新受戒者不知學方佛大慈念故制斯教同集一處和合説之望欲近約身口遠傾我倒同出三有齊斷四住是佛意也今時行者但受福田之資多無解脫之念乖佛意也但自躓頓神識耳釋注中初科前明制説意身口是業近約在因我倒是惑遠傾從果今下嗟時衆受福田資者虗霑信施也無解脫念者行染塵俗也躓豬史反困也注波羅提木叉者戒也疏注中佛自解云木義者戒也解名中初文佛自解者顯示律文出自金口也疏有人言斯非佛解乃法正之言今解不爾五部十八乃是人分至於律教無非佛旨何得無學妄敢錯辭縱有披解自為卷帙可以尋也所以斯戒必有隱相唯佛自通下重有疑如法聚條部有問為解豈非戒為衆善之宗非佛餘聖故不達也次科初出古判今下正斥初立理顯非謂部類雖分教旨不易即前序云賢聖緘默但知祗奉是也錯音醋置也自為卷者如多伽見母諸戒論等若許擅加何須別解於義自顯故曰可尋所下彰佛獨説上文證定豈下示意私釋大千界內佛為法王律是佛敕唯聖制立自餘下位但可依承良以如來行果極圓窮盡衆生重輕業性等覺已下猶非所堪況餘小聖輒敢擬議有如國家賞罰號令必從王出臣下僭越庶人失信亡敗無日佛法亦爾若容他説群生不奉法不久住故也疏今又釋云戒非木叉木叉乃是絶縛之果戒是正順解脫之本隱因彰果故如上釋牒釋中前釋文已解故云又釋義意無異故指同上注自攝持威儀住處疏注云自攝持威儀住處者此歎木義能滅惡也滅惡中總釋可解疏由斯戒法能持七支有過皆塞名自攝也身口既攝光淨如珠順本所受故名持也行善所及各有憲章名威儀也威謂容儀可觀儀謂軌度格物並由內懷正法故使器宇超倫也別釋初科有三初釋自攝即含法體塞猶止也次釋持字即戒行三釋威儀即戒相憲章指律教行與教合美德顯故格正也器宇即目形儀倫猶羣也疏言住處者正行由教而成教是行之所依故名住處如經戒為功德住處也次科教行對論若約相成則教能行所若論相依則行能教所此釋住處正取於教上舉能成顯下所依注行根面首疏注中行根面首此歎木叉生善相也由戒能生成萬行喻若於根如經云若無戒者諸善不生即其證也又如論云戒為衆善之根生善中勝無過斯法喻同面首也生善中二喻根喻出生面首喻尊勝初總判由下別釋初據遺教但合根喻又下次引多論雙合二喻根義同上首居五體之尊戒為萬善中勝故也注集衆善法三昧成就疏注中集衆善法者能會正慧也三昧成就者能明正定也此之兩行並藉戒因成上根義如經云依因此戒得生定慧也三中初別釋二學集善配慧者歷諸道品無非觀慧三昧者亦言三摩提此云等持亦云正定此下總顯戒功釋上能會能明之語已上三引經文並是遺教疏上來歎木叉惡滅善生深有殊功次歎木叉發引群心能成法軌四中初科上是歎行即結前也次下歎教即生後也以教相條別持犯揩定能使行人舉動有儀故云能成等注當結當説當發起演布開現反覆分別故也疏言當結者若於法有違覆過顯淨當如法治治在説後故言當也交今未唱望後許陳言當説也八段序分與正宗為興致之由言發起也三分解中初釋當結即默妄罪當猶將也次釋當説即下序文召令懺露交猶對也三釋當發起八段即序八章問此釋初段正説發起云何都以八段為當答初略標宗望後多分猶未陳説故通指之疏上有三當總是緣漸八篇正戒輕重條然顯示故云演布開現也正宗中上二句躡前緣漸即發起義八下正釋現即示也疏廣教流通篇別重舉恐有理墜罔冒將來故云反覆分別也流通中初二句指文篇別重舉謂牒前已説即是反覆也恐下示意誦有遺漏則是沉墜誤於後傳故言罔冒疏有人云八篇正宗各有三致何得通收廣教如初篇中諸大德四棄即當發起中開四相列坐齊聞即布現後結三問重條前章即反覆分別並是聖言引用何得不依他解中初立義指斥如下舉初篇別配此則唯就正宗明之然前列三當此師但舉發起一義餘二文略義必通含並下二句似是他師結責之詞又如疏家取用之語上文配釋全據本經故云並是聖言也律諸比丘共集在一處疏二諸比丘集者表法無乖明人不別也第二段釋文中法即指戒謂法非偏被人無獨説即明同界須集之意注佛言同羯磨者集在一處乃至應訶者不訶是名如法疏注云同羯磨者來名身集也形礙法通須陳欲法名心集也身雖赴座容有訶止默忍法圓名口集也以斯三業共成一僧故云集一處也釋注初科注文乃至字略其心集疏中備約三業解之形礙身有緣故法通可傳欲故法圓羯磨成辨故一僧僧即衆故疏又解云同羯磨者明説正戒行淨者同自餘過犯不足數者不同羯磨不須集也言應與欲者謂此行教不可自輕大急要緣事不獲已方開與欲自餘輕小則不須也且如病緣重者輿來少者僧就可以知也言應訶者謂四羯磨諸雜治人行法在身無容秉法身雖足數口不陳非故也若斯陶練方得實人可不然也他解中三節並約揀衆一簡足數過犯謂三舉二滅人更兼尼等四衆啞聾睡狂等人二簡欲緣大急即三寶疾病等三簡合訶四羯磨一訶責二擯出三依止四遮不至白衣家此四律名得滿不得訶諸雜治者即收行覆藏等人並由奪其智能不得訶法必非此等方名應訶若下總結陶練即是揀擇實人謂合教者注若衆大聲小敷妙高座立上而説疏言敷妙座者重正法也開立説者惠及人也意在説聽有功道根無失豈可無聞徒勞彼此何所益也次科初釋制意次釋開意言立説者律因衆大聲小不得盡聞佛開立説猶故不聞聽作轉輪高座立上説之道根即戒體注八難餘緣隨時略説疏言八難者謂王賊水火重病惡蟲等是也言餘緣者寒熱雨濕人多坐迮等是也廣文如鈔略説中初文八難文略人與非人餘緣略衆中多病布薩多夜已久或鬪諍事論毗曇毗尼説法夜久等義加寒熱不出律文疏隨時略説者聖教被機時來不一衆首智人商略事務戒有十段略説有九斟酌用捨故曰隨時也次科時謂時緣如上多種故言不一十段戒文初段必廣故但略九然作白已卒難排門不可説序但云各正身口意則十皆可略但白在序中義同廣誦故云九耳注若客舊外集數有少多説過此序告淨便聽疏言客舊外集者法攝人也如有違背不無其罪則人從法也初來聞序不勞告淨以聞三問也八篇中來必須告淨以不聞序四中初釋制集法攝人者望制衆也人從法者望制別也初下釋告淨八篇中者才過三問即須告淨注餘廣如律疏斯事衆矣不可即言故指律也五中言事衆者謂淨者陳淨犯者發露一人自告多人別牒總告客少不勞重説等多更説事儀詞句並見事鈔説戒篇即猶卒也律汝等諦聽善思念之疏三汝等諦聽下誡妄緣也凡心難繫喻同野鹿聖人體之如鎖猿猴也攝耳尋聲名為諦聽以三藏教網用慮業非名善思也釋第三文中初述意野鹿喻馳散即遺教云亦如惡馬不以轡制狂象無鉤猿猴得樹等皆喻識心剎那生滅鎖即對治門也攝下釋文今時坐聽心多別慮或復睡眠請細讀此文用䇿蒙昧注佛言端意專心而聽法也疏注中正心思擇名端意也一心無倒名專聽也釋注中上簡邪思下簡亂想律若自知有犯者即應自懺悔疏四自知有犯者以説戒本意唯在除犯聞而即行便同上起故文云即應懺悔者是也第四釋文中初科敘説本意以彰須懺才聞序告不容延久故云即行上起即懺悔從喻為名故云同也疏悔是此土之言懺是西方略語如梵本音懺摩也懺字非倉雅所陳近俗相傳故耳次科倉雅皆俗中字書名如三倉爾雅等疏懺悔義應此處道之可妙同於事鈔也指略同鈔即懺六聚篇注佛言謂所犯事未懺悔也有二種智人有罪能見見罪能如法懺悔若欲悔者當詣清淨比丘説犯名字如法除已方得聞戒乃至於罪有疑亦如是説若僧並犯無人可懺不問識疑白懺後説疏注中犯事未悔者釋成有罪相也但以無始無明想倒為本動念緣境何得蕭然唯有智人能見能懺自餘惑重何由開悟故律文云無學果人不故犯戒三果同凡未免緣縛可不思哉釋注中初科前牒示但下推釋初敘犯多上二句示惑下二句明業蕭然謂清靜無繫之貌唯下明懺少故下引聖誡凡初二兩果故心犯性須斯二尼怨逼受樂三果故心犯遮四果誤心犯遮疏注列智人以成行悔之法詣清淨者用顯託境明心説犯名字識相不虗也如法除者明依教起悔非泛濫也次悔法中初通示詣下牒釋託境即所對人明心者決所犯罪疏識疑同犯開白懺者罪據覆藏對衆陳情白告悔斷同大懺也開白中初科罪據覆藏者由覆成過露則無故同大懺者不異上篇衆法悔故白文如羯磨識罪白已即淨疑罪後決重懺又偷蘭已下諸篇皆滅不開上二疏何以得知者以凡造過集諦所收知苦斷集見道便剋豈有自言便靜斯業次徵意中初科初句徵以下釋集諦世間因也見道即初果此明至聖方斷集業凡夫口陳豈能即斷意顯律懺不明業理故可懺淨疏今諸戒首令懺已聞者既悔前罪斷後相續露過現前於心無隱便同淨用得預聞持不論往業招生增惑次科初明懺淨所以律懺宗旨此文極顯不下示教分齊業即業道招生即苦道增惑即煩惱道此三心行判歸化教律據違制故非所論疏此但事悔伏業而已終須行淨深見我倒知我倒本相等虗空但有妄緣故纏三有審見此理明白無疑分得正見方傾苦趣若此之悔名為滅業業何可滅障不招生故名滅矣乃至無學尚酬往因如身子嬰病目連遭苦可以類通想不迷矣三中初二句躡上律懺終下發後理懺初示理觀且據小宗性空觀析見無我理相空唯識具在事鈔我倒本者即是無我故舉虗空為喻審下判位言分得者即內凡以上不生惡道若此下結示初明行勝前但事伏此理滅故業下轉釋滅義不招生者但無總報不無別報定業不轉至佛猶償是故學人好自觀察常以善緣熏練心識勿謂無罪業理灼然華嚴偈云假使百千劫所作業不忘因緣遇會時果報還自受佛言真實無得自欺乃下引示大論舍利弗患風疾增一目連乞食為梵士所打骨肉爛盡皆謂酬往業據此可知理懺不滅故云可以等也疏問行淨之士應有二人不犯應先如何後問答不犯者希自然合教犯者多數覆過是恆説本除罪為先故先問於有罪問答中約行以論淨勝穢劣持者合先今乃反倒欲彰聖制布措有旨答文可見二人如下科律不犯者默然默然者知諸大德清淨疏五不犯默然者不自伐德默應答也第五文中有善自稱謂之伐德注佛言無犯者有二種若本不犯若犯已懺也疏注中不犯有二初則專精不犯後則犯已能悔第二白法莫不於己無瑕同成不犯之色也釋注第二白法者且指懺殘通下諸聚皆名能悔以殘毀體懺復僧位義同再受對望初受故云第二戒善清淨故云白法諸經論中黑白二業即目善惡初篇永無復本下聚行缺體全是以行懺不彰此名色猶類也律若有他問者亦如是答佛言如二比丘相問答也疏六若有他問者謂舉罪比丘如法徵責有犯露答無犯默答義同世語故注如二比丘相問答也六中此謂有犯同聽三根外彰為他所舉敕令實答初解約語默二答以釋如二比丘者舉事以比也疏又解云三根不昧五德有聞對衆舉治何得懷默故須虗實自雪彼我彰情是故佛解如相問答者是也他解中二並語答三根即見聞疑舉由此生故云根也五德律制舉罪必具五德一知時二如實三利益四柔軟五慈心如鈔自恣中解雪謂分析律如是比丘在衆中乃至三問憶念有罪不懺悔者得故妄語妄語者佛説障道法疏七如是比丘在衆下明不懺有損也第七文中不懺即覆過結業有損謂違制障道疏言故妄語者既默表淨獲何罪邪古來諸師亦有商略此既一塗正義不可不知先以義開後方消判牒釋中初文注明吉羅而問何罪者以古謂方便今為根本後方定判故作疑問引起義章疏今釋序中默妄六門分別初定重輕二明通塞三對問緣四就罪辨五約人論六經處犯疏初定罪者疏昔解云序中默妄但是方便何以知之然罪表淨誑僧未彰故是方便定罪中古解立理可見疏問言未彰口僧雖虗解結方便者如身造口業默起表聖虗解是同何因究竟以斯例默應犯墮罪解言不同身業表聖覩相無濫故是重罪今默表淨在衆通含不偏在己故知方便初難中身造口業相同默妄彼得果罪故取為難解下但以濫不濫分不濫成誑濫故未成下文歷句委破此解疏問若言默妄以默為體餘之妄語虗説為體今以默妄為説方便亦應以止為作方便然止不得為作方便默妄豈得為説方便解云妄語為義言章了了今則默表其相未形前人非決何成究竟次難中先定犯體今以下正難作犯必以作為方便例妄亦須説為方便今何反之解中以默表語為妄方便即無所妨疏問默罪之人私心決暢止在三問隨問默然詐淨義畢有何所少而是方便若默表淨更須口言方究竟者僧中羯磨默忍之時亦應但是和家方便所作之事亦非究竟今則不然隨作結成何名方便今解立理中初科前難古非凡言方便有果可趣事未究竟今此默妄無別果頭故非方便若下舉例相並益見彼非今下次顯今判問此默妄罪別有方便不答未至召問作意欲拒例亦須結無則單犯疏但默妄吉羅律文具有古師立篇義局三均故以此罪入方便攝今論篇者別有意義故所不論可如下也出意中三均如後彼謂具則名篇不具號聚除衆學外惡作惡説究竟不均皆歸聚攝默妄在聚故是方便今下彰異指後立義篇聚二名互彰無在五七兩分均雜非濫均唯根本雜通本因今此默妄雜中果罪疏又汝上言對衆通問身相不動故是輕者此亦不定口造口業但言章了前人聞知不問疑識俱結究竟身造口業無論多少前不疑濫則非方便難互造中初文為二先牒古解即如向云在衆通含不偏在己故是方便此下顯非初敘各造身下明互造無論多少者正用此句對破前説疏何以知之以句義定如多人坐有問者言成聖者起一人獨起前人不疑故結究竟若多起者前人生疑故結方便或多人立問聖者坐一坐犯重多坐犯輕以前諸句動故生罪今下諸句不動亦犯如有衆中多人坐立言非聖者動身一動多不動輕多動一不動重於我聖相明練無濫故得重罪如是例知句也歷句中初二句標如下先明動句古謂動身則重今約坐立二位各有一多共為四句一重多輕尋文可領以前下次明不動句初結前生後如下列示彼謂不動齊輕今還以一多重輕以彰不定如是例者如云是聖人者莫動身一動多不動輕多動一不動重疏有人云三業互造必無疑濫縱獨表聖前人有疑不可結重或多人現前謂非凡可是輕也以此例前相收方得古解中此師不約一多以論但取疑與不疑而分輕重言相收者謂一雖合重疑必犯輕多雖是輕不疑亦重疏問有心欲誑人合口成妄語行心欲見色合眼應成見問答中初舉根境難前互造疏答妄語含意根見色由眼識行心非眼識云何名見色答中上二句對顯下二句反質疏若爾行心非眼識故非見色者意業非口業不應成妄語答三業得互造意地成妄語六識不互用行心非見色故成論云口家四業意亦可造斯良證矣轉難中躡前非見以難互造答中初約互與不互釋通前難故下引證互造疏問何故在凡三業互造六識定用答三業雖殊同意為體六識不然各有體相故論説云根無互用過也次問中聖人六根互用故約在凡為問楞嚴云佛能諸根互用及大菩薩等此據十信已去六根淨位答中即成論云離心無思無身口業故知同以意思為體六識下見聞嗅嘗觸知根境各異故下引證未詳何論疏問三業同意體如何以分互答從具以論互廣如初篇竪義中説第三問答可解下指初篇義門即第二三業成犯備明單互豎即是立疏二明通塞者疏如昔解云序中問者問通篇聚但有犯者不合聞戒故序中問通令首露知何不該餘之三問悉是別問當篇於此篇罪有淨不淨故知問前不同於序通問於下通塞中昔解初科彼謂九處三問前一屬序通問一切後八隨篇各不相通疏問序通問下可如前論八篇問前既有實犯説已方問豈非違教答序中總問顯淨默然既無露罪恐不憶識妄謂淨行理不可然故隨篇示令知罪相雖先説戒猶非覆罪以心迷淨於行非過如人法説初問中以問下則順問前有違故敘為妨答中為二初約迷忘釋通雖下二據非覆遮難如人法者即人犍度彼云有比丘犯僧殘一罪憶識一不憶識憶識而覆者名覆不憶者非覆取此以證迷犯開聞疏問若心迷淨有犯聞戒心不迷者無義得開何故律中對首心念得聞説戒答此謂開緣不容悔故非謂通爾犯不聞戒大位約之次問約在衆發露以為難端答中初正釋來問犯下潛通律意律云有犯者不得聞戒雖有此制不無通許故云大約疏今解上通義不容耳隨有九位問皆通下廣如後説今解中初二句明引古之意言不容者顯非所取容或作融言其滯塞意在不存故先出耳隨下略示今解言問下者世多不曉乃謂説初篇時但問犯夷乃至衆學亦問本篇今應難云犯下諸罪應聞上篇則違律文犯者不得聞戒如何通耶今言問下謂將説下篇通問衆中於七聚罪微犯憲章不合同聽非謂但問本篇而已下文當見疏三對問緣得罪多少疏如昔解云雖經三問共成一法故今默者但犯一罪如諸乞辭及以白四言雖重彰皆成一法三問緣中昔解初立義如下引例如諸乞辭即受懺等前皆三乞白四者且如受戒四番羯磨共成一受餘亦例爾疏今解不同既有三問隨問覆默還得三罪如白四諫共成一法隨白羯磨結四偷蘭莫不對問對諫俱有拒心故結多罪今解中初科前立理如下舉例白四諫法隨遍結蘭例今三問隨問犯吉疏問以諫例問故得多罪違諫第四便得僧殘亦可默妄加四犯墮答諫對別人違僧命重説戒直問前過未彰故成僧法三問便止此在僧中默故犯吉若據對首有罪陳淨具有三墮心念例知釋妨中約諫根本相比為難答中考文凡有四異一別人僧法二違拒默覆三諫勸直問四過彰未彰情事不同未可比例此下辨異對念口陳二俱語妄心念例者説不對人理得三吉疏四約犯罪論者疏問今有犯多罪者既違序問為得幾罪四約罪中問詞且舉違序餘八皆爾疏答默淨誑僧但得一罪以罪從問緣生不由誑罪生有問故違無問不結故知一罪不同覆藏由覆罪生但經明相則隨罪結古答有二初立義問雖有三共成一法既從問生故無多罪不下二遮妨由覆結犯隨罪少多恐引為難故預簡之疏今解不同問緣明相俱得多罪以此二緣結罪之位覆藏既得從罪生罪問緣豈非從罪生罪問緣若不從罪生罪同聽之人悉應有犯以有問緣之可違故然今不爾有罪違問無罪不違故知有罪便懷默妄何得上云不從罪生今解初中前明默覆結犯從罪義同問緣若不下次立理奪破從問義失疏故知默妄亦是覆藏之別名也但可經宿經問不同至於覆罪一而無二次科初示名異但下會犯同由默與覆俱違發露故也疏若犯十罪隨其三九皆有默淨則犯二百七十吉羅又如一人而被三舉隨受供給皆獲三罪如是類之三中初正示且約十罪多少準知又下引類此約一人具兼三罰者為言疏五就人數結罪相者疏既犯十罪欲令衆人知我行淨我若露者知我行非不齒録我故望多人還得多罪如妄語法一言誑多隨人人聞聞皆得罪對首心念例如上分五約人數釋中初敘犯意齒録謂人不稱記也故下示罪數如下引例對下指同問對首可爾心念獨説豈得例上答若約鈔文令向四方僧發露故知不露則為誑僧然境不現前何由限約但望獨説非儀犯吉亦同隨數故得例指疏六明默罪經處多少者疏如昔解云七聚之罪六罪三處犯或云八罪者謂淫觸二粗屏露二處通尼及女斯之八罪各在當篇二不定并初序三處犯以不定中尼女合制九十便離各有其致若欲發露唯一處得偷蘭一品但是序犯唯惡滅諍此一偷蘭序中七毗尼中犯六明經處昔解中初總明諸聚後別示偷蘭初中六罪約屏露八罪分尼女謂下列罪自斯下示犯處古謂序中通問當篇別問通諸篇聚並有二罪唯二不定含此八罪故涉三處以下別簡屏露離合之致如後自辨若下示發露一露俱無不必三處次偷蘭中初二句通示唯下別簡惡滅諍者即多人語毗尼調達破僧辨定邪正隨邪破正則有蘭故疏斯古義也今猶講之若不敘者無由興教立破二能於是在乎結斥中初指斥彼約所犯之罪局就當篇以明默妄故作此釋若下明引意因前古非方見正義立今破古述作之能故也疏今解不然但有犯者不合聞戒何得犯夷不合三處餘篇得聞故知難也隨問九處皆有隱心則隨犯罪今解中初指非難猶妨也隨下示正義疏若爾立義序問便足何故勤勤九處別問答序中問者將説八篇恐有犯者乖於説聽四事中問例亦如之欲説後戒故先陳問恐有忘誤謂言行淨隨篇重問為成正説由有犯者不合聞故問答中初問躡上所立既不隨篇則序中已具自餘八處過在繁纍故須通之答中初明序問四下釋後諸問且舉四事殘下準説後戒者通指七篇十三中問則指六篇如是第論義無別矣成正説者淨行同聞不乖法故考今所釋與昔天乖是中則言屬在僧問淨則罪通七聚將説先問故云問後九處並爾學者精詳疏問七滅之後無戒可説何故復問答罪相如塵細看細見憶識之心前後紛擾隨有解悟即須首露靜則對人衆則心念尼律法聚七佛略教其相如此何得言無故文云更有餘佛法應當學之知何不攝也次問中答文為三初通敘重問靜謂人少容可對首衆謂僧多即座心念尼下別指所説以廣律中僧戒本後次列尼戒後列犍度即是法聚皆有犯相如言人遊行五衣離宿等僧結吉羅並出尼律法聚可知略教亦吉如後自明故下引證應當學者即罪名也問略教可爾尼律法聚既不列相有何所聞而須問淨請為通之疏問露罪為義不藏為先但一序問便問便露何須鄭重三説九反第三問似與前濫前對序問難後無用此彰三九重疊之意疏答欲明戒誥警敕行人如諫一事尚有僧屏七通露罪多惱何為不經九處初答中上二句正答如下舉況七通謂屏三僧四通猶遍也疏或可前問有拒或致迷妄忽聞後問豁然披露時來不一故致多翻聖説不徒深有其旨因言長理須知發露有罪皆藏九處成默序中一露下問非罪以無重隱之𠎝故也若序中問露已還覆隨經問處還須露罪以覆隨心不由言説如人法中前露後藏文證可解次正答中初明重問豁即開發之貌聖下示制意初通示有下別釋初明覆經多處序下明露唯一處若下明重覆重犯初立義如下引證如人法者彼云有比丘犯二殘罪覆一露一彼罷道已還受大戒已先所覆後發露先發露後覆藏僧應與彼隨所覆二罪與覆羯磨隨後所覆第二罪與覆羯磨是也疏若爾露罪還成覆者首陳何益答披露肝膽慎終如始一露不覆隨問何𠎝豈非益也轉難中躡前重覆徵露無功答中顯前律制意令盡露肝膽即目犯心疏上來隨義略解默妄今次消文餘皆可解消判中初科餘可解者下文但釋障道餘不解故疏言障道者下注解云障於禪果此成上文不實答損也良由惡業習起戒品不淨無由發生定慧剋成禪果故曰障道此遠資為言亦如上説所言道者略説為二梵天道者八定為宗聖人道者四果為本既染塵境體沉下界犯則三塗持便欲有如何默淨以自陷乎釋文中初總示文意良下牒釋文相初通釋云習起者相續不止也無定不成禪無慧不至果禪果二字即下二道此遠資者以犯戒墮惡但障欲有福報文言障道故是遠資也卷初已明故指如上所下牒解初釋道字通含禪果禪通凡聖果唯局聖梵天道者且舉初禪通收上地色無色報凡唯漏業聖即助道天台云神通變化無漏觀慧悉從四禪出言四禪者即色界四天所修之定禪是梵語此云棄惡能棄欲界五蓋等一切諸惡故四定者無色四天定一虗空處二識處三無所有處四非非想處總上二界故云八定聖道可解定慧是因二道並果由先毀戒定慧不發既無因行寧有果剋覆過默淨障道在茲既下次釋障字持合作執注佛言僧説戒時默妄語故犯突吉羅言障道者障於四禪三空四果告諸比丘如彼大海不受死尸設有漂出我法亦爾不受死尸謂死尸者非沙門梵行自言沙門梵行犯戒惡法不清淨穢汙邪見覆藏內懷腐爛外現完淨如空中樹雖在衆坐常遠離衆衆亦遠彼故知懺罪方成聞戒也疏注中默妄但犯吉羅者有輕重也望僧虗解斯業重也望非言述重而制輕勿謂為小九百千歲亦難堪也一犯尚爾多犯如何不可救也故論説言如小團鐵入水沈也又引海喻文相可知釋注為二前釋罪相初通示望下別釋誑僧境勝故業重即如五分僧中妄語重百羅漢前是也默表無言故制輕勿下指報誡勸目連問經列六聚犯報犯突吉羅九百千歲墮泥黎中準雜心論即墮等活地獄一晝夜耳委示歲數具如鈔中一下舉況故下引證婆沙云愚作小罪永墮惡智為大罪亦脫苦為團鐵小亦沉水為鉢鐵大亦能浮又涅槃云莫輕小罪以為無殃水滴雖微漸盈大器有智思之注中三空謂空無相無願三解脫也又下次點餘文疏但略指而文相難解略為科釋從告諸比丘下大分為二初明覆過故知下結示初中又二前舉喻可解我下二合法初二句對合謂下委釋初釋死尸雖下釋不受初中又二初通標犯下別釋初至覆藏釋上非沙門句犯戒不淨即身口業穢汙邪見等即是意業內懷下次釋上自言句空中樹謂中心枯朽者律若彼比丘憶念有罪欲求清淨者應懺悔懺悔得安樂疏八若彼比丘下由憶識罪懺得禪果成上發露有益也亦就遠資為言第八釋文中翻前障道釋成安樂注佛言以清淨戒學故便得清淨定慧名得禪果為安樂也疏注中釋相文甚可解釋注略指即是三學相生之義律諸大德我已説戒經序今問諸大德是中清淨不三説諸大德是中清淨默然故是事如是持自此已前廣教之別序也後説之文即廣教之正宗也疏次解第三結序勸持相就分為三諸大德我已説戒經序者結前生下問也二今問諸大德下正問衆中應後法也三諸大德是中清淨下舉默表淨應説勸持三釋撿問標分中云正問衆中者戒本是中兩字世人不曉謂指戒文所以或謂問前或云問後準今科判乃問僧中則由來疑諍渙然冰釋傳迷斯久學者須知疏問所以説戒須問羯磨不須問者釋問淨中初問以俱衆法有問不問必有所以故問以釋之疏答解有多途説戒為於行淨有犯不應説儀羯磨別為前緣緣成則合事辨故隨白問終為成法不別舉也答中初句總示下引五解前四明異後一顯同初約所為自他不同前緣即法所被事緣成即通十種方便隨白問者謂單白羯磨並問忍可意專被事故云終為成法無勞撿淨故云不別舉也疏又解説戒僧別兩舉説聽必約清修羯磨多為別緣僧成即堪御法次解約衆法別行單具往分別即自行説戒為僧兼別須問羯磨為別單衆不須疏又解兩法在僧俱須行淨説戒制問為清行染之人羯磨不制法通純雜之士如僧殘行法開停為他明知罪未出也聞戒知犯必開默露明知説被淨也三約淨穢通局不同初二句通示説下別分如下引證初證羯磨通雜聞下證説戒局淨疏又解羯磨所為在事也説戒所為在犯也有犯不得聞戒斯明證也故説戒之作為兩種人持者為能清犯者為所清若知有犯即須遮舉懺洗令淨方聞後戒乃至律文見犯不説經二十年羯磨不爾標舉時事三根五法相圓無染即成僧用故不制問四明立教所為罪事差別初雙標有下別釋初釋為犯有四初據聖制證故下約所為證若下引遮舉證乃下引廢説證即僧祇比丘鬪諍緣也羯磨下次釋為事相圓對五法無染對三根五法即五現前此謂説戒必取體淨有犯不開故須責問羯磨但取相淨便成僧法故不勞問疏又人解云羯磨成不問僧取曉事同三問則無妨也第五可解疏問須知淨行一告便足有何義故殷勤三反答説聽相應可名傳法雖聞不識容犯妄聽故須三問鄭重窮檢一則未呈昏忘多則在衆致繁故限以三法儀所致也次問中前文已明九處今此更論三反答中初明須三之意一下示加減之過疏言淨故默者衆非口呈行淨繁亂伐德成勞但默便表答辭也言是事持者淨行得聞正戒機教相應定慧由斯成剋理須持奉故也事即淨行如文可知釋勸持中初釋默然繁亂乖儀伐德非理默然自表則離諸過次釋是事等初敘勸持事下點文相事即戒相以人稟教指教歸人故云淨行經中如是二字指法之詞即指後文也疏上來所明釋廣教之序竟疏第二大段次釋廣宗疏所以正宗廣教何為興者良由五衆不攝情根於諸名利無思檢約廣生有漏隨塵起染外纏邪慢內增癡惑是以如來隨其所犯略教既壞制廣補之使夫持犯的明愚智齊曉戒禁時機深有弘益即斯言教號曰廣宗第二正宗通敘中初科上二句徵問良下釋通為四初敘機生情即是識根即六根識遍諸根故云情根內無治法自恣放逸故云不攝此明起業之本於名利者即成業之緣廣生等者明作業之相初句通示隨下別釋上二句明造業下句明增惑起染通三業邪慢局意業邪謂諂媚馳求慢謂貢高陵物此二對他故云外也惑通三毒無明是本故云癡也此取律序舍利弗請佛制廣佛止之辭彼云如來未為諸比丘結戒何以故比丘未得利養未生有漏又云若比丘得名稱多財多業便生有漏云云是下敘立教使下顯益即下結名疏初制廣教隨犯便結輕重前後雜亂難分至佛滅後一夏結之重者道源輕止世謗八篇以次漸降不倫欲使前識本基後知隨行故有斯位次科初明佛本隨制至下示結集始分重即四夷故是道源輕謂殘下諸聚雖體含遮性而大約遮多故云止謗欲下出集者之意本基即四重隨行即餘篇疏將造文解先以義通正宗本體止存持犯犯相楷模其唯篇聚略以四門定其途路初明正果五篇二明重輕七聚三解方便罪相四解持犯方軌開章中初科上二句標示正下敘起上二句示教體次二句明教相犯緣軌定即是楷模略下分章四門次第初唯果本二通因果三局因罪上三別相持犯第四總義持犯疏就初門中四種分別一位立五篇并解篇義二置名不同翻名顯相三但置於五不立四六四立篇次第先後不同疏就初復二疏言位立者僧有四重尼有八棄以為初篇僧有十三尼有十七為第二篇僧有百二十尼有二百八為第三篇僧四尼八為第四篇僧尼同百為第五篇斯約戒本故以數分如律五犯以名收罪此則義通誠有旨也初明正果位立中初通列二部顯相同異斯下結示通局上二句示局如下顯通律列五名不限定數攝一切罪義無不盡言有旨者歎美律意也疏上位立竟篇義如何疏如昔解云相形種重階降不類故名篇也何以知然如初滅擯二從僧悔乃至第五輕重有殊次解篇義昔解初師中初立理即取偏頗不等之義何下證成疏有人言上立篇義相形是難二十法聚前後列位可亦輕重然篇字有二偏頗偏者從人而立篇章篇者從草而立蓋不識字源故有偏頗之義次解初科為三初指前二十下引難以諸犍度亦即篇章何有相形輕重之義故知非理然下指謬分釋字義顯無所取疏今解篇章之篇者謂流類均等與諸章品義齊一也凡立篇者必具三均謂名體究竟此是定義初篇同號即是名均齊須擯治即是體均非方便是究竟均乃至第五三均不無故號篇也立義中初引類示名凡下約三均顯義初通列三義均即是等初下別配五篇但出初篇餘可準説故云乃至疏有人言必具三均方名篇者俗書法聚何必具三而得立篇後解中初科俗書但分章節法聚科約事類此二既得篇名何有三均之義故知前解未為盡理疏今言篇者始於四棄終於七滅則為八篇文義聚處即名為篇何必具三如似戒序亦應名篇經云序品即十誦云五品罪也次科中初正立此從戒本文相為名全乖律中以名收罪故下不破亦非所取如下例同戒序彼既不取三均之義所以序文不妨篇號經云者引證即下會名疏今解上釋通有其致今解總示中以三家破立不無所取故云通有其致即縱許之詞疏初云偏頗立篇但不體字何妨罪義輕重不同篇是法章有所科約故也初解字非義是未為大失篇下以義助成不同之相疏第二解者從草釋義此亦自迷如何悟彼篇字從草止是草名邊殄反之世號篇竹亦可人噉篇字從竹乃是簡名自漢已前本無紙筆例用竹木兼之紈素而用圖録後漢蔡倫創造於紙用易簡素古書簡䇿可有一章以韋編之號為一篇故宣尼讀易韋編三絶者是也次解但斥迷字所立均義下文正取初指非篇下分示前釋從草篇竹者爾雅注云似小藜赤莖節好生道旁可食篇字下次釋從竹竹木者竹名簡木名櫝蔡倫漢桓帝時人或云順帝搗魚網為紙用代簡素此為始矣韋即熟皮宣尼即孔丘字仲尼前漢平帝元始初追諡褒成宣尼公故以召之疏今定篇義三均亦可如似法聚義類不差受法戒法各別聚處名為犍度此亦如彼名體究竟同在一位用篇名收五種階降復何爽也今定中初文上二句正取如下會同前第三師舉俗書法聚難破三均故此通之於理無妨應知俗書亦從義類耳受法即受戒犍度戒法即説戒犍度且列初二已下準犍同度梵言此云法聚爽失也疏問如上立義罪位分五各具三均墮罪之中僧別兩悔第五一罪對首責心既有二悔明知輕重何得均邪問中墮吉二篇各有兩懺體則不均故以為難疏答今言均者以義收罪縱一篇中懺有輕重至於名種一而不異何以知之初篇名棄則不覆開悔及不足數相同棄也二篇僧治則行覆在別至於本罪出必在僧三篇對首而或兼衆財事難遣對僧徵核及論捨罪與別何殊第五一篇雖有二懺故誤兩心雙捨本罪何妨義攝以位通之釋中初科為二初二句標示三均義立隨義可通不必定約懺別為妨縱下正釋初總釋上二句縱於來難下二句奪歸今解以乍觀懺法雖似不均據論罪體不妨均義名不異者皆提吉故種不異者罪相等故何下別釋初二兩篇懺犯皆同但犯夷分於覆露懺殘兼於僧別有斯少異故先會之提舍一向是同故文不列第三第五正析前難墮分兩懺財事有無至於捨罪無非對説吉羅二悔心分故誤及論所犯名種不殊故知據罪還成均義疏今立篇義莫非章品之嘉名分段之別號也縱使聚從五位義具三均篇名在七本因雜攝故知篇聚通於本枝五七位罪定其均雜也次科初示名義縱下顯互通古立三均專在於篇不具號聚然篇聚義一不可偏配故約七五用分均雜則知古解非今全用故下結示通局疏二置名不同翻名顯義疏就初置名疏問有何義故置此五名答大聖如來深鑒物情濁世根鈍須立粗刑逗彼時機聞名息過如俗本禁蒲鞭示恥季世深酷故有徒流可以通望也第二置名明所以中答文為二初敘立意以篇聚所立指身口過惡以為別相從治懺獄報而作通名故言粗也略教被利相非粗顯威德教授由是而彰如下舉類蒲鞭喻略徒流如廣古者以蒲杖辱之則能改過酷謂酷虐以俗況道教意可見故云通望也疏又此五名有通有別別如下釋通須略知如本四分但云五種犯或五犯聚或五種制僧祇云篇十誦云品名雖或異攝罪義同次科初標指如本下正示本律三名上二約罪下一從教僧祇十誦並從條類了論為部義亦同之名下會同可解疏次解別名疏初波羅夷者此無可譯如世五刑今古乃異西梵同此可以相翻初罪不爾東土本無不知以何罪同止得事義相譯別名中夷罪初科初標無譯謂無正譯如下次明義譯初示兩土不同意謂同者則容可對譯今此不同故須從義疏故本律云波羅夷者譬如斷人頭不可復起世之極法勿過此刑由犯斯罪於彼聖果永不可克又名無餘者從衆法絶分為名故文云惡行死尸衆所不受又名不共住者亦同上解引示中本律三段初是約喻後二從法説戒羯磨二種衆法皆不預數故云絶分下引文證即律序偈略其詞耳不共住義律文還約二種衆法釋之故云同上疏僧祇解云此罪名墮非唯失道不入二種僧中捨身便墮阿鼻地獄生報不久何得不畏十誦多論亦有明解廣如事鈔下名別著他部中僧祇三義二義同前失道即斷頭不入即無餘後加墮義故曰非唯報有三種一現報二生報謂後生即受三後報謂生報已後通及未來下指十誦彼亦翻墮多論釋云由與魔鬪墮在負處謂毀根本無勝力故與今僧祇釋義不同故云下名別著著顯也有本輒除此句疏二名僧伽婆尸沙者善見論云僧伽為衆婆者為初尸沙云殘謂犯此罪衆僧前與覆藏末後出罪故本律云僧殘是也由罪纏行人非全淨用僧作法除故也律名此罪又云有餘以行法不絶為稱母論云如人為他所斫殘有咽喉故名殘罪明了論解云所言殘者僧中受房舍利養最在其外故也次篇四節教文殘義皆異善見初翻梵名云衆初殘謂下釋義云衆僧者即上衆義前與覆者即初義後出罪者即殘義衆義是通初殘為別以覆出二法皆衆作故故下引律初示名同由下釋義則與前別非全用者是殘義僧作法者即僧義律下示異名根本不壞對前為目問前云衆法絶分行法絶不答由行絶故不堪預衆今行不絶懺復本淨即堪同法是則夷罪行法亦絶僧殘衆亦不絶母論喻釋還對斷頭了論約行別住治罰以釋僧中即僧義在外即殘義疏三名波逸提者十誦云此罪墮在燒煮覆障地獄故云墮也明了論解本音為波羅逸羊達反尼柯部此云應功用也有三義故一罪名輕細難識好毀二性遮兩罪其相交雜三人多輕陵數犯其過大須功用對治勿令滋廣上座部云波質胝柯翻能燒熱此罪報得大叫喚地獄因時能燋熱心果時能燒然衆生第三篇名初十誦中燒煮覆障乃地獄通名準雜心論中墮衆合地獄一晝夜則夜摩天二千歲人間十四億四十千歲了論中初翻名有下釋義初輕細者入威儀分故二性遮雜者三十並遮九十中三十條屬性六十戒是遮廣如下釋三輕犯者謂非重故大下結名上座部者彼論自引上約對治此就因果文中獄名與上雜心所出不同疏四波羅提提舍尼者義當向彼悔也故戒本云我犯可訶法今向悔過準此罪名可訶向彼悔何關罪相第四初翻名故下引據準下點非正翻疏五名突吉羅者如律本云惡作惡説也分身口業故有斯目明了論中二業一名俱為惡作身口為非無非鼓動故也五中本律從具有別了論約造無殊此但略釋具在事鈔疏三明但五非四六者疏如昔解云藥法有五對此五藥故立五篇三中昔解五藥者一滅擯二僧法懺三對首三説四對首一説五責心悔以此五法能治五罪從喻名藥疏若爾後明七聚可有七藥名七毗尼可有七諍故知不爾今解中初科七聚則病多藥少七滅乃藥多病少舉此二例皆不相對則顯古師義未盡理準似他師作難後為釋通反成前義疏今更立義蓋是如來一方化儀對根之教宜聞説五次科義取機宜足彰教旨一方通指娑婆根即是機疏前所難云對藥立諍法門多種或病多而藥少如四輪摧八難或藥多而病少如七滅殄四諍或藥病等如今五篇釋難中初牒前難法下次釋不定四輪者成論云一住善處二依善人三發正願四植善根初輪摧五難三途長壽單二摧佛前後三摧世智辨四摧聾盲啞疏問下四可救可名為藥初則擯棄則非藥義答藥有二種殺活同名如初則滅棄其猶殺人藥也既犯極刑無任僧務隨事不成彼我負罪今則加擯復無斯咎彼則永絶財法濫坌無緣此則僧倫清穆立法成濟若斯行事藥義存乎初問中悔法除罪可得名藥滅擯不爾故問通之答中初定藥名既下釋藥義初敘病今下示用藥謂藥則殺惡存善擯則除穢成淨故得名藥疏問對藥立刑似有其致今疑其藥不攝刑科偷蘭一法何藥所治初篇覆露則兼二藥乃至第五同上須多如何對藥以立篇目故知非也次難中初二句許前義今下申疑偷蘭無藥夷吉復多如下難破疏今重解云藥病相對大途為言至於定罪不無通塞用藥或通皆不出五偷蘭聚攝輕重不倫至於用藥非無對首初重兩治覆從初藥露從第二第五兩懺故作第四誤則第五如斯處藥通別何疑重解中初科為三初通示用下別收偷蘭三品對衆多少通皆對首攝屬第三夷吉分對在文可解如下結顯言通別者一滅擯藥局收初重二僧懺藥通二學悔及懺殘也蘭墮兼僧正悔在別非此所通三對首三説藥通二提蘭四對首一説藥通二提舍重吉五責心藥唯局輕吉初後皆局中三並通疏如七滅藥現前則通憶念唯局三法五法通局又多尚得名藥以殄四諍此亦同彼病雖位五藥亦名同至於對治不無通局故五藥中或有捨墮此僧中懺但據乞鉢為言可即總對墮也餘如羯磨疏中次科初正引現前毗尼通治四諍兼下六藥憶念局者并不癡罪處唯滅覓諍不通餘者又多人語局言諍自言草覆局犯諍又事諍中具上三諍用藥並同則知六藥兼通事諍三五通局者重示現前也四諍中言覓犯各有三品共為九品事諍自有九品共十八品不秉羯磨則三種現前通治四品下品言諍下品犯諍及事諍中下品言犯並用三法為通自餘名局若作羯磨五法現前通十四品十四是通餘四名局上舉現前粗對四諍則一向俱通下分三五細配諸品則有通局故云又多餘廣如後此下會同故下別舉捨墮質成通塞不可局對捨墮懺法僧別三位乞鉢一種偏制僧中下文指廣彼明懺捨兩師各計一云捨財須僧悔罪從別一云捨財捨罪並須僧中等疏問藥病二種是誰先後答藥先病後第三問答中一句略答欲發後難疏問凡言藥者為病設藥今未有病何故先立答立教不同不可恆準俗中治病或有為病而處方或有設藥而待病今明聖教化儀道同五藥對罪豈局今代是故律序古昔常法可以知也轉難中難意可見答中初通示不定如諸經律隨機立教今此五篇立教待機方便權巧故非一槩俗下就喻顯別為病處方如餘經律設藥待病如今五篇今下正通來難三世承傳非今始制下引序證彼云所以立王者由世諍訟故衆人之所舉古昔之常法犯罪者知法順法者成就上喻下合戒律亦如是如王治正法疏若爾所論佛初成道何不設藥要待病起者答無病輒治人多誹謗既不奉行反種苦業如上善見治癰喻也轉難中藥既在先理應先設此約漸制以難常法答中顯示不先之意前辨二教已引善見故此指之彼云如世醫師未善治病見人始欲生癰未大成熟輒為破之病者曰我本無病強為破之受大痛苦聲聞弟子亦復如是云云疏四明篇部次第義者疏就所防罪隨犯即結如前所明今之次第意有何據解云蓋是大聖臨滅度時欲使教法傳世有儀故命持律廣開斯要所以結集文云一切僧尼及諸犍度所有教法聚在一處文誠驗矣四明次第安布中初躡前發問如前即指通敘教旨中解下釋通初正釋以迦葉結集稟佛囑纍乃差波離先集律藏故云命持律等所下引證即五百結集文彼云比丘一切事在一處為比丘律比丘尼事在一處為比丘尼律一切受戒法集一處為受戒犍度乃至二十雜犍度等並如上文中簡要總舉而已疏於五篇中正死之罪宜加先勒有餘之罪其即第二如是漸降乃至第五欲使僧尼觀過興厭先粗後細斷除業非克出道益理數然矣明先後中二義並出結集排布之意初科前敘次第欲下顯意勒約也疏又且上明位行今據根條為言何以明邪初篇之體能治行本入道正元若壞初本後四枝條無由生行故知初篇行立衆行隨生最須奉修故須先立第二衆法綱網須成必事乖違何能匡化故須次立身口法式行越威儀自行不成何能靜業故立第三上雖三業無瑕深為行淨若染世譏塵翳正法未能榮顯故須第四自行外化乃復須明若不敬順三寶禁約四儀説授乖方便沈法網故須第五趣道正行根條中初文為二初指前生起何下徵釋若約通論前一性重及下諸篇違理之罪並是性戒後四遮惡俱屬譏嫌不獨提舍又前二名戒分後三威儀分又復五篇通號威儀豈唯墮罪又前四篇皆持法網並是正行豈止衆學今文且就別相以論初篇中初示行體元始也若下顯根本義故下明標首第二衆法者犯殘壞行不任秉御則衆法不成身下敘第三威儀分中提為首故上下明第四提舍四戒並因譏過故自下明第五初二句躡上三四若下正敘衆學一百戒中二十六戒敬佛八戒敬法五十一戒敬僧十五戒四儀雜行説授乖方者別舉敬法也疏問初篇過重離則不難理應是劣何故説勝問中若據根條重輕則初篇最重若望對治難易則第五至難今以對治難前根條欲彰教旨不必一向疏答義有多途不可一槩若就根條以判初則行之所依餘四枝條故劣若就進趣修成初篇過重易離不假勝進修治故名為劣乃至第五過微難護必須專意無由識相是以戒本舉應當學者勸能治行也若就純淨無染名為最勝答中初二句通示若下別釋初重述前義後若就下正通來難文中且示初劣後勝中間相望互兼勝劣故云乃至文舉戒本應當學者以上諸篇並列罪目唯此第五獨立學名足彰難護疏又如羅漢驅龍但以持戒之力莫非輕重等護故使功高五百又如律文畏慎輕戒猶如金剛又如菩薩浮囊等喻可以通例引證有三初引百論昔有一毒龍五百羅漢力不能降有一羅漢至告云賢善遠去龍即逃形或人問之答云但輕重等持故爾次引律序彼云如飈音標火雖微莫輕以為小所經諸草火燒盡無有餘所造惡雖微慎莫謂為輕如破伊羅葉常墮於龍中等伊鉢羅龍昔為比丘曾損伊羅草葉故受斯報文取其意但云金剛喻堅持也後引涅槃彼明菩薩輕重等持堅固不犯海喻生死浮囊喻戒羅剎從乞喻三不善心初全乞喻四重二乞半喻十三三乞手許喻偷蘭四乞指許喻提與提舍五乞微塵許喻吉羅可以一句總結三文
