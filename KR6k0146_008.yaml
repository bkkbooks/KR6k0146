body:
  text: 疏就僧物中則有四別僧物中前二屬處永定通名常住但前無分義後是可分故加常住十方以簡之後二俱是即施通名現前但前局當處後通內外故加現前十方以別之疏一常住常住物如堂宇田園人畜米屬處已定不可分割必欲惠給餘寺羯磨和與若直送者是名盜損或有主掌自盜不望十方不滿隨取計五便與極重如僧祇中縱集得僧亦不可分故初中分四初出物體屬下示名義或下明結犯餘盜望主此義易知故文但出主自盜耳如下引證疏二十方常住物如飯餅等見熟之食本擬十方聞聲同飯有盜此食望護結重望僧結輕以僧分業無滿五故二中初列物體本下示別名通名同上故不重出有下明犯相有二望主重者謂餘人盜望僧輕者即犯偷蘭或主客同盜或主自盜問二種常住並通十方何以前不望僧後望僧者尋文可通疏問聲鐘告集是僧皆飯未知他寺奴畜得否答不合也僧具六和隨處皆是人畜別屬義非通使使既是局食亦如之問中意謂他寺奴畜彼此通僧應得食故答中初句判定僧下釋所以初示僧通之義人下明奴畜不通鈔云行至外寺私有人畜用僧物犯重以施主擬供當處僧不供別類非福田故僧家人畜犯吉今多私務將帶人僕食彼僧食明文犯重之疏三現前現前物如今諸俗以供養僧無問衣藥房具並同現前僧也如中含施招提僧房所謂別房施是也又如經中僧鬘物者此梵本音據唐言之對面物也即是現前對面之施耳鈔引昔解謂花果者隨字顯相乖其事義也三中初示名體如下引證中阿含經阿難受別房用施招提僧所謂別房施即翻名也謂以別房施現前僧又如經者即涅槃文初翻名顯相鈔下點示昔非謂事鈔中誤用昔解彼云房宇是招提物華果是僧鬘物即取華果結鬘之義故云隨字顯相華梵不辨即是乖事義也疏四十方現前物如僧得施及五衆亡物以此物施通擬十方有僧皆得故此福分廣大無邊及論立法不可盡集制作通法用約十方隨現集者皆有其分故曰也若未羯磨盜者偷蘭以十方僧不滿五故若羯磨已而行盜者隨其輕重據現結正既定罪相隨務則多講至於此引鈔解也四中初簡物相以下示名義制通法者即白二羯磨若下定犯相輕重兩判準善生經初犯蘭者由未作法人無限數望十方結後隨輕重者既作法已人有數限故隨所盜輕重兩結疏二盜人物就緣分三初明掌護損失後明被賊盜相疏初中妙同鈔引善見論中若守護財物謹慎不懈而有盜者私竊而取或強逼取皆望本主結者以非護主能禁之限故也若反此者守物須償以本盜人欺守護故是須還他若不還犯次別人物釋中初科上句指廣彼約二主分為七種一掌護損失主二寄附損失主三被盜物主四賊施比丘物主五枚囚縛賊主六狂人施物主七守視人作主並廣如彼須者尋之下引善見即彼初位論中初明守護謹慎望本主者有二義故一非能禁二無填償本主索償反成盜故若下次明慢藏反上二義故從守護疏二被賊奪者如鈔所引義張二位謂現不現結罪時當隨二主心絶已不若財主已絶賊主得定此不可奪如律賊復奪賊二財主雖定賊主不定此則可奪以緣不具故三財主遲疑賊主已定此不得奪以緣成故何問本主四俱不定此則收得由心不定業非通暢故也今以四句可約判之次科歷句中初總舉現不現者即對面現前盜及不現前盜二主謂財主賊主若下別列初後二俱可解次句以賊心猶豫盜業未成故云緣不具也第三反之故不得奪疏問今有賊施得取物不答據理成也以物非定屬隨後作主如似世錢可定屬也隨人隨用隨處隨定隨損隨結可例通之問中恐疑共盜故問釋之答中初判定以下釋所以如下舉事例通疏三就所盜略舉通收情非情道並攝盡矣如鈔所引明了論解恐不見鈔故又引之三中標文初總示如下生起疏如彼解云盜義極多且約六根起非法行若偷六大亦犯重罪釋中初科六根即約能盜以攝所盜六大即括所盜以顯能盜故知盜境該通無窮疏何以明之如諸仙人是𮌎行師有人蛇螫作仙人書見者皆愈然須價直比丘被害偷看不問損與不損看時即犯以此例諸祕方要術不許人傳偷見違惱何啻在五所謂眼盜下根例之如誦呪治病欲學須直比丘密聽計直犯重偷嗅嘗觸亦例此知若要方術病緣即差得直方與得直聽寫比丘受學心緣得差不與價直故犯重也六根中初句徵起如下列釋初委釋眼根𮌎行師准論合云𮌎行蛇毒藥師謂蛇以𮌎而行螫施亦反謂蟲行毒也下下例餘五根疏次約六界前地水火可知如律中有呪扇藥塗比丘偷搖不與價直是謂盜風若起閣斜臨妨他起造是名盜空智者識界也人有伎倆不空度他得直方與比丘方便就他學得不與價直即盜識也識不可盜以無形故但可從緣盜其智用耳次六大中大謂六皆廣遍界謂六相差別體同名異前後各標就文初略指前三如律下引釋後三初明盜風若下次明盜空智下後明盜識伎倆謂藝能也識不可盜者謂不可盜去但其機巧為人所學故云盜耳疏三明非畜物者如上立義已明可尋鈔中罪輕重也非畜中指上立義者近指當戒具緣闕緣遠指篇前境差方便下指鈔者彼明盜非人物有主望主結夷無主望非人結蘭盜畜生物古謂犯夷今師準十誦多論但結吉羅疏文中處者總舉用收其相也疏初地中者恐人不了處之所在故以相列令知犯境不得迷也如律中解即地中伏藏有主守護若盜此物計五成重今約律中佛地僧地若有伏藏隨出隨屬佛僧二位亦無還主及送與王可如鈔中捉寶戒說次物處初釋地中初明列相所以如下引釋指如鈔者彼云地上屬王不論地中如給孤獨聖人亦取此物故知無罪疏二地上處者如今道地所得物也疏三言乘者謂象馬等乘也就此乘上有財欲盜離乘便重即以乘為處也若欲取財無由得離雖乘行百里千里但得偷蘭後離方重若兼乘盜心絶乘離即犯重罪僧祇盜四足者驅向所期足遍犯重不隨所向者輕本期不定舉遍即重本主來逐心未得者輕也乘上初示物就下辨盜初明就乘盜物若兼下連乘俱盜又二初正判僧下引類疏四言擔者謂所有物屬於步擔義同前乘可以兩分擔中亦約擔上盜物及連擔盜判犯不同故云兩分疏五言空者明了論中約有辨空結罪如上今律明空謂有衣物鳥等從風所吹有主之物而加盜取明離處者即空異處是名離處故善見云盜空中鳥左翅過右翅尾處至頭上下亦爾俱得重罪杖遮不隨者蘭十誦中有主鳥銜重無主鳥銜者蘭空中初標異彼論約起閣侵他空處故云約有辨空今下正釋初明空處故下引示左翅過右約橫飛說尾至頭處約直飛論上下可解以空無分齊還約鳥之飛動以明離處之相十誦彼具云諸有主鳥是物去比丘以偷奪是鳥物波羅夷若野鳥是物去比丘偷心奪是鳥物偷蘭遮此奪鳥物望人結罪亦應約空辨處故此引之疏六架上者謂諸架壁有財物也若盜離者即以為處如十誦中取衣不取架持架將去不得重後離架時方得重亦同上判義相似也故又出者知無異也架中初示處若下辨犯亦下指同謂同前乘擔離合兩判故下顯重意知無異者若不出相不知同故疏七言村者謂託村為處律中初約盜物後盜村體或以機關攻擊強力水澆言辭辨說誑惑而取皆重七中初盜物者律云若村中有金銀等若牽挽取初離得夷是也盜村體者即如所引攻擊水澆損壞也強力者律云依親厚強力而盜取也言詞辨說者誑誘取也說音稅疏八阿練若者村外空地二位同村可知蘭若梵言即翻空處二位同村即盜物及體律云空處有金銀等又云若以方便壞他空等是也疏九田處者田有多種百穀所生之處總名為田律中兩相如上村解十誦云若為田故相言得勝者重不勝者輕若作異相過分勝者重僧房舍者亦爾不言理之曲直如尼言犯殘中但得述理官占無犯不許橫言今以義約若後主想決則應屬己若不定者應非重科田中初示名相律下引釋初本律言兩相亦即物體十誦相言謂詣官詞訟得勝重者謂非理而得不如字誤彼作不勝若作異相者彼云若不勝已更作相若所得地乃至滿五得彼羅夷謂作標相取也房舍準田以判故云亦爾不言下決文不了又二初準例決即約理之曲直明犯不犯尼下脫相字即尼相言戒開述理故今下次約義決即就主心定與不定判犯輕重縱是僧地前主心決奪亦成重疏十處所者或店肆作處如是非一亦有二位如上列之十中初示相處所語通故云非一律云若家若市肆果園菜園庭前舍後若復有餘處等亦下判犯盜物盜體二位同前故略指之疏十一船處者亦有二科船中盜物即船為處若盜船體如僧祇中解船筏時越動時偷蘭雖斷繩未離者蘭要斷繩離處方重善生流水中解船離栓即重十一初總示舟下別釋初明盜物若下明盜船僧祇中明因果分齊次第之相善生離栓亦同栓巨月反樁也疏十二盜水者律中但明所損不出分齊如僧祇中溉灌流水或一宿直一文乃至四五比丘為於佛僧復自為盜壞彼渠得越水入田蘭滿五者夷摩得伽云計彼塘工過分而用水滿者結重十二初示本宗通漫律中但云盜水中金銀衣被魚鱉及壞他水處等如下引他部顯相僧祇前明主者計價下明比丘盜損為佛者他緣亦犯也渠即水溝伽論二義判犯一計塘工二用過分疏十三私度關塞者疏如律比丘無稅白衣應稅為彼過物故制重如十誦中比丘應稅不稅亦重雖不為過而示餘道以不被稅為他過物故犯罪也如多論中持國禁物出界入死罪故言重者但違王教故得吉羅薩遮經云不輸王課非盜也又僧祇云一切出家人不稅若賣買人應稅十三中初科本律比丘無稅者謂官不稅比丘物而為他過物也十誦初明自稅謂有國土稅比丘物雖下明為他免稅多論兩斷論云若國禁物出王界者入死罪若比丘持出律師初言得重後云不入重但有違王教吉據此縱令官稅比丘物而故不稅者止得吉耳此則決前十誦結重之文下引經律文據益顯薩遮尼犍子經云何等不應稅世尊弟子比丘比丘尼一切外道出家人物是名不應稅若賣買者應輸是名稅分齊課即稅也準此不稅無犯但是隨身道具若為治生不稅則如十誦犯重僧祇同上疏若官稅比丘方便自免者非犯一本不共要二非理稅我故上文云比丘無稅法也若成犯者賊來劫我方便隱物亦應犯重然有白衣官稅其物比丘為隱如律科重次中初明不稅無犯又三初約義定故下指文據即四分多論等文若下引事反質然下次明為俗故犯如律即上四分疏次明物體疏初云取信物者律中持人物在右手隨離結重若本左手持物盜心不還須捨盜心方移右手不捨而移是名重盜如是類之又十誦云若貸他物抵言不貸故妄得提如善見中偷方便故吉羅十云若先用盡後斷當已得重先斷當後離處方得夷受他寄物亦爾善見云若負他債比丘持去無盜故無罪也次物體中初信物者謂人寄附之物前引本律就身為處文約左右手以明犯相餘身分亦然故令準類律云頭上移肩上肩上移頭上左肩移右肩右肩移左肩下引諸部初十誦明貸寄前明抵拒犯提善見結吉示不同故十下次明犯重先用盡者謂己用過他所貸物後斷當者謂主來求索抵拒不還也先斷當者謂貸物猶在故約離處方犯受寄亦爾者抵拒斷當犯相並同次引善見謂負餘人債比丘輒爾為他持還但不成盜義應有罪疏二取水者律中離地水器盛而盜隨滿結重僧祇若以筒就孔中飲滿者重若稍飲數止咽咽偷蘭若器先塞盜拔塞時越注入器中蘭注滿者重若注未滿即悔畏重以倒本器中偷蘭雖繩斷未離處離處未斷繩俱蘭蘇油蜜等例同二中律約器盛者文云大小瓮及餘種種水器若香水若藥水若取者夷僧祇前明以筒盜飲稍即少也若下明持器盜取雖下約連器持去下例蘇油同上三判疏三楊枝者義同上相律隨有者便隨言之三中同上者亦為隨盜滿五成重律云若一若兩若衆多若一把一擔等律下通示律文列相之意謂前後所出隨據有者為言非止此數疏四園果草木者如上僧物中鈔中廣引四中初科指上即常住常住物下又指鈔即盜戒中彼引大集云盜僧物者罪同五逆隨損一毫則望十方凡聖一一結罪又引方等云五逆四重我亦能救盜僧物者我所不救等彼又廣引諸律明用得否撿彼看之疏僧園果木比丘多犯以我寺中不謂有犯然立寺者以盛無我之僧隨有施為無非為解脫故今不思此取他衆人所有之物以為自保此罪大也如僧護日藏分中特可畏也故須深思次科初敘喜犯然下次彰業重初明立寺之本今下次明盜取之情如下指教勸思僧護經彼因耶舍遊海邊見五十餘處地獄多是侵盜僧物現受苦報日藏具云大乘方等日藏經佛對日藏菩薩說諸破戒受苦等事鈔云別人得用僧薪草者此要具戒清淨應僧法者若行少缺得罪無量疏如僧祇中僧地種果有功聽與一熟乃至菜瓜例與一翦若於園中搖樹果落地持云方重若就園內食滿者結重十誦僧園樹華聽供養佛大木供僧皮葉隨比丘用僧祇院內樹薪供僧食用若無定限應取乾者三中僧祇初明賞功一熟謂一番熟者與之一翦亦約一番採摘若下次明盜果十誦樹華僧用供佛不成互用皮葉及僧祇樹薪並開別人取用準前明判要須戒淨疏五無足者律中蛇魚為初有主盜取故僧祇云若以龍蛇等盜取犯重若瞋罵言何以籠繫即開放者越五分若壞殺具無犯不應爾十誦摩得伽中壞網慈心吉羅五中律文先列蛇魚續云及餘無足衆生故云為初僧祇初明盜取彼云無足者所謂蛇蟒或蛇師比丘盜取蛇或筐滿五皆重今云龍者疑是文誤若下次明解放下引律論壞具皆輕以非盜故疏六二足者盜人為初六中人為初者律云人非人鳥乃餘二足衆生有主者重疏約律盜人令出家去如上可知既非僕隸則非別屬雖違王教如上多論盜出家中初明成重如上即約有主結也既下揀輕謂僕隸等損主故重餘無所損止可結吉故指如論即上度關等善見亦云盜人無罪者謂主人兒落度父母所遣等將去無罪是也疏義言若他兒子賊奪去將便損父母依報力用屬賊是強不得教走若自走來則不負賊故十誦中賊捉弟子將去師還奪取犯重賊未決想無犯弟子自偷身來者不犯如昔解云師不得奪身自得走者父母感子力強賊奪得重已屬賊是強師弱奪賊故重兒報正體是強賊得力用則弱走是強報相逐弱用隨來不犯奪賊中三初以義判前明賊奪成重子是父母所依假其力用所損處重故屬賊強不下教比丘護盜教走成重以損賊故自來無過以非意故故下引證可見如下引昔解初牒前兩判父下釋出所以初明師犯重意兒下次明自來無犯兒報強者自所有身非他屬故賊得弱者非所生親復非雇主故強報相逐者身隨己意故弱用隨來者賊無分故疏十誦云見他奴婢語言辛苦何不走去如語吉羅舉一足蘭舉二足重若奴已叛催令駛去隨語得重或言此儉彼豐奴即叛去不教故不犯或問豐樂逐比丘去即驅使者逢難喚走皆不犯三中四段前二教走成重後二不教無犯初明誘引若下次明催去駛疾也或言下三約比丘語彼或問下四據彼問比丘疏七四足多足律約畜論亦可準上七中律云象馬牛駱駝驢鹿羊及餘四足等多足者律云若蜂若百足及餘多足等並約有主成重故令準上疏同財業者謂違契要故此引也據此同財其相多種或資生同如今師資同活等取五即犯不假半分以彼同財全欺負故或同活生共營財業若生心盜則須計分滿十方重五是我分五欺彼故同契差別中初科前示犯意以同財業本無有犯但望違契有成盜義故云在此引也律云同事業得財物當共此契要也以盜心取五若過犯重即違契也下辨犯相初二句總標或下別釋初明資生同謂彼此有財無所簡別故取五即重次明同活生者謂共營生得財各半故取十成重活生或是寫倒疏言共要者二中要即約也疏律舉行盜先要共分如上律中弟子倫師衣誤得己衣須分一半與共要者以同要時但云得衣不問自他皆分半故初科上二句示犯律云共他作要教言某時去某時來若穿墻取物若道路劫取若燒從彼得財物來共分如上律中即前錯誤中僧祇文也疏如僧祇中兩教作者自共制言從今得衣二人共分一人得衣便自念言後得不必及是便解制云從今各任相祿先得衣者半滿結夷又得衣咒願已言且置汝邊便解制蘭又聞欲施便解要越有二糞掃衣者要共覓衣一得好衣解要二得好衣草覆三不覆解要如上犯罪三階列之後二句中不得重者由初立要入手共分以不捉衣解要故輕次科僧祇二節初約受施違要前明共制兩教謂兩人互教一下次明各解有三初貪好故解入已故重相謂福相祿即祿分二隱藏後解蘭三聞施先解吉此二並未入手故輕如後所決有下次明糞衣違要初明共要一下明各解又三初列句次句下略摶覆字第三句上略不取字如下示犯初句重次句蘭後句吉故云如上後下出後二句犯輕所以疏善見云期時共去中前中後今日明日今年明年相要不絶相當者重不如要者輕三中善見上明作要下示犯相言相當者論云時剋相應俱得罪不如輕者彼云若不從教教中前取而中後取教初夜取而後夜取教白月取而黑月取教此年取而後年取教者小罪偷蘭取者波羅夷此據專剋為言若本通漫不定時日隨違成重疏言伺候者規財便利覘候處所相期進不得財必共故也縱得不共為候亦犯三中初約共要犯覘勑豔反窺看也律云我為往觀彼村若城邑船渡山谷人所居處等於彼得物一切共盜取成重等縱下次約受教犯雖不共分盜戒教他能所同重故云亦犯疏言守護者為其掌録所在追求隨得共之故言此也若先不要但為守護既不同心義亦非犯四中初明共盜犯律云從外得財我當守護若所得物一切共故若下次明不共非犯疏言邏道者相望通塞防慮外人得財共之故曰也僧祇二人共盜一人守門一人入取解時俱越牽時俱蘭離時俱夷五中邏郎佐反遊奕守路也律中或作看道初示犯相通謂無人為疑塞則反之律云我當看道若有王者軍來若賊軍來長者軍來當相語告若有所得一切共是也下引文證同犯可知必非同意為守同上已上五種前二則通盜者互違後三但據共盜同別律不與疏文言不與者明主不捨心任私之成我盜也第三句釋文中心任謂己得自在私之謂不與他共注他不捨也若也物想他所護想有主想非己物非暫用非同意故也疏注中他物想者非己物也他護想者非暫用也有主想者非同意也物雖屬主同意破用雖盡無過故以此解釋成有主釋注中即用注文後三非句配前三想對之可見疏上雖約物明盜然結正時終須離處因明十種離處中以盜戒成犯雖約離處然其離相不必物離故以十門括示差別疏一文書成明離處者如今持律判亡僧物重輕互斷下筆成犯善見云書地作字一頭時輕兩頭時重二言教立善見云口斷多端偷夏唱大律中言辭誑惑取是三移標相者善見盜心取地移標得一髮亦重四墮籌如律隨下犯五異色如律壞本色故六轉齒如十誦蒲薄移棊子等七離處非犯如祇驅牛馬心疑故非犯八不離處明離處如見必得不疑動即重也九無離明離律中攻擊破村燒埋等十雜明如空中等相廣如鈔引初中凡判亡物判重入輕夷判輕歸重蘭但取文成不待物離善見書地者謂作契書判斷田地一頭輕者是方便蘭兩頭重者即究竟果二中口斷多端謂強詞巧辨非理而斷偷夏唱大如施十夏者物貪心欲取未滿言滿律中誑惑即邪心勸誘上之三相竝望發言決得無疑皆成夷重三中標相即今丈尺度量之物一髮重者善見云地深無價故四中如律調部云時有比丘易他分物籌佛言舉籌波羅夷又有比丘盜他分物籌佛言直五錢波羅夷五中並指調部文云若破若燒若埋若壞色佛言皆波羅夷上三即如九中所引六中轉謂翻轉齒即骰子棊子多用牙骨為之摴蒲即賭博之名今謂先曾約物而盜翻彼采或轉己負為勝或轉他勝為負虧他滿五皆重七中如祇即僧祇如前乘中具引八中如見即善見彼云空靜處盜決得無疑如擲杖空中必無不下故動即成重九中攻擊如上盜村體燒埋等如五中引十雜明者示不盡故下指鈔者彼云如空中吹物盜鳥曲弋斷流水注等即上物處中已明律盜心取疏文言盜心取者明心應境也欲明行盜心業須具必兼兩緣以成一盜故注解云賊心取也盜心中釋文初標示總意應猶稱也上云不與是境此句即心欲下出立句所以兩緣即心境注賊心取也有五種黑暗心邪心曲戾心恐怯心常有盜他心又五種取決定取恐怯取寄物取見便取倚託取或依親友強力若以言辭辨說誑惑而取者是疏律中具出二五盜心疏初云黑暗心者謂癡心也愚於教行不肯修學故於盜境生可學迷律云隨作結根本是也即如上引知事比丘互用佛僧物隨滿犯重也言邪心者謂邪命也貪心規度為財說法即是以利求利惡求多求外現清白內實邪濁故五分云諂心取財是盜也言曲戾心者即瞋心也與少嫌恨現相索多或示威怒相是也言恐怯者謂迫喝也或說地獄惡報或說王官勢力而得財者如摩得伽云強奪取是也言常有盜心者恆懷規奪得物乃休也五種心中初文又二初通示心相引律隨作犯者則知此心通犯諸戒又云更增無知罪則不學無知亦同此耳即下別指盜業即前三寶境中已明二中初示名邪命謂邪求養命貪下列相規謂希求度即籌慮規度說法事同治生販易故云即是等也故下引證三中初釋名曲謂非理戾即忿怒與下示相嫌恨約內心威怒約色相四中示名迫謂以事逼切喝謂說時作其大聲或可作遏謂抑遏也或下顯相說地獄謂濫託聖法王官謂倚恃豪勢如下引證第五可解疏又變此心云五種取者取是其業對境行事也次釋五取標簡中前五約心不出三毒若就通說莫非希物五並貪心若約別論如文乃異初二及四並是癡心三即瞋心五是貪心又前五種外相非盜故約心論後之五種內外俱盜故從外事疏言決定取者心慮已定必得如期故曰也言恐怯取者示身口相令生怖畏故取彼財如十誦中輕慢抵突而取他物是也言寄物取者或全抵債或以少還他是也言見便取者伺他慢藏陽作陰伏之類也言倚託取者或假名聞威德或恃親友形勝也第二引十誦文輕慢謂倨傲抵突謂觸犯四中慢藏謂不勤收舉陽作謂詐作餘事陰伏即潛藏他物五中二相假名德則通自他恃親友則唯在於他形勝謂位貌過人者如王臣貴族等疏餘注云或依親友下律中隨諸相下皆引此言當今季世多弊斯犯故聖制有以也文相易耳餘相中初示律文律列物處十三種別一一處後皆出此二相當下顯制意弊猶滯也下句點文以其事顯不勞釋故律隨不與取法疏文言隨不與取法者結罪分齊釋成重相也不與取者犯名也法者盜刑也滿五便入死位故是法攝謂比丘行盜準此以判故言隨也三中釋文初總示不下牒釋初釋不與取次釋法義謂下釋隨義準此判者即準國家滿五入死之法注以王立法若取五錢若直五錢物罪應至死佛隨王法盜滿制重也疏注中依王法故制有此位取錢者即五錢體也直五錢者財準錢法也猶如唐律隨有犯者皆約絹估以從尺寸方定刑名也注云盜五死罪準此行盜驅擯不別事同死也注中初科又三初釋王法此位即盜戒取下次釋滿五財即總於衆物唐律如下自引今時俗律亦約絹估驅𢷤同死者道俗制別片相似故疏如多論問盜何等錢而成重罪解有三種初云本依王舍國法隨彼用何等錢準彼為限二云隨國所用有佛法處即以為限後云佛依王法盜五得死依而結戒今隨有佛法處依國斷盜幾物應死即以為限如上三釋論師以後義為正次科引論中以錢體多別故問定之初解依王舍者以佛在彼國制此戒故彼是大銅錢一當十六則盜小錢須滿八十次解隨國用者無論物體但滿五數後解不約多少但隨國死刑為準論取後義今依次解耳疏然五錢義互釋不同判罪觀緣緩急者如母論善見所說若約護行草葉不取者是也取舍中初科上二句標諸說不出論家三解判下示教意初明判罪母論中一切戒皆有緩急二緣鈔記具引如盜戒乃至草木小葉他物不得取等名急若非他物想取名緩善見如下引若下次明護行母論善見四分條部竝有此文疏今諸持律多依十誦故彼文云古大錢者大銅錢也據今小錢即八十文次科依十誦者即取多論初解疏如多論中盜相通濫初釋本錢何由可曉後解隨國現斷入死言亦泛濫難可依承如此唐律強盜滿尺則是極刑竊盜五十匹罪至流縱多盜者不加至死論令準此則刑無死名比丘多竊少有強者縱有強奪計尺死刑盜五十匹又非死例準俗制道盜相叵論如僧祇云正無定法斷盜不定三中初二句通示初下別釋前破初解但傳聞彼錢時賖處隔莫知體相故云何由曉也後下次斥第三解初斥其通濫如下次引俗例強盜如劫奪竊盜即密取極刑即死罪叵猶不可如下後引文證明不可依疏若依四分但云五錢錢則八種並同一制可如多論中間一解隨國用錢準五為限則諍論自息也四中初示本宗有準八種謂金銀銅鐵白鑞木皮胡膠可下次取多論會同疏就斷盜相結罪分齊六門分之善見云於戒律中宜應從急又觀五事處時新故等斷盜中初科善見宜從急者謂護行也觀五事者謂判罪觀緣也五事文略隨身用處時如下引新故者彼云有物新貴後賤如新鐵鉢完淨無穿則貴後穿破便賤隨身用物者如刀斧初貴後賤若偷他斧應問主幾直買等如鈔記備引疏初錢有貴賤時如十誦錢貴盜一入重賤時百千入輕二貴賤處者如律貴處盜物賤處賣還依本處定價三善見云貴時盜賤時賣定罪還依本時如上三門唐律明相亦同也四取多非重不得而重者如伽論云數取四錢數作斷意乃至五千不犯重也又如四分燒埋壞色或教他不為己亦犯重故五不滿五結重過五但輕者如律衆多人遣一人盜五錢多人共分隨本一分滿五通犯如十誦中盜衆多人未分物雖多而輕謂亡比丘輕物也六盜一人一錢重如僧祇五人各以一錢同遣一人掌之若盜望護主結是也又如善見欲識盜相如師徒四人相教互盜一人六錢各得一夷一蘭此義應知如師語三弟子曰彼有六錢大者取三次小各取一我自取一乃至小弟子亦作此言彼有六錢和尚取三同學各一我自取一教人滿五夷自偷不入教人業故但蘭可以類知初時中貴謂以一當多賤則雖多成少二中但明貴盜賤賣賤盜貴賣亦從本斷第三依本亦同約處如下合同俗律四中初雙標如下引釋初釋上句又下次釋下句第五初標二句如下對句次釋可見六中初標句如下引釋僧祇中且從本主以立句義然望護主成重自是盜五耳善見中初立義如下示相四人互教乃約異時為言若一時中止可一人為能教三為所教能教取一即是盜一成重之義自偷即自業相成教人即假異緣剋果二業緣別故不相入律若為王得自在不屬人王大臣種種大臣輔佐王者所捉若殺若縛若驅出國汝是賊汝癡汝無所知是比丘波羅夷疏文中若為王下七相治罰賊法訶罵賊辭第四句標中點文可解疏所以列者欲明盜損道俗同弊輕仁薄義勿過於此故列此相用懲後犯顯意中初句徵問欲下引釋初約誡後釋弊惡也皆有此惡故云同弊輕仁謂無濟惠之心薄義謂非義而取懲音澄誡也疏又人解云初篇四夷餘三自犯無多過失顯盜是公白尚盜王材況餘凡庶而得免者故舉貴類賤舉難況易意可見也次科約彰過釋貴則無過國王難則無過王物故舉其極以況其餘疏捉殺四相輕重文亂若欲糾正應言捉縛驅殺也牒釋中初科以殺第二治法不次義須後列糾定也疏所言捉者僧祇云瓶沙王遠祖治賊但令栴陀羅拍頭捉手便自愧恥永不行盜所言縛者世濁情澆雖捉猶作乃於多人之處祖王使人以灰圍之及至父時止故灰圍行驅出法至瓶沙登位七反驅出還入為盜乃截一指愁悔無極佛為王說過去為養千愚事至阿闍世乃行殺戮也釋四相中並引僧祇文旃陀羅此翻殺者澆薄也灰圍即同縛也及下釋第三驅出似今之配流至下釋第四七反者彼云時有一賊七反驅出還來劫殺村城爾時有人捉縛與王乞令苦治王令將截去小指王尋生悔念言夫為王者愛念民物何有人王傷截人指即往問佛佛言過去世時有城名波羅奈國名迦尸王號名稱國民皆工巧伎以自生活若無伎術及作賊者皆付名愚癡時有作賊送至王所王言始有一愚若滿千數用作大會方苦治之敕付大臣令著無憂國與五欲樂後愚聞王賜樂不久滿千臣即白王王乃與食施寶敕愚人言汝等還家供養父母勤修家業勿復作賊爾時愚人聞敕奉行王即以位授太子入山學仙人法而說偈言本求千愚人作會謂難得如何未幾時千數忽已滿惡法日夜增大會於是止欲離世惡人宜時當出家佛言諸比丘爾時國王即瓶沙是先世已來常畏罪報今既為王續亦畏罪故生疑問佛也準有五法今既截指合歸後殺疏問如戒緣中若盜五錢罪應死者云何乃指其後殺邪答滿五合死古法常然王欲輕刑減死從𢷤如今此國竊滿絞刑政緩刑寬減從加伇也問中意謂既有四治不合戒緣獨指後一答中初二句釋戒緣明死王下示文列四治疏餘三罵辭及後結罪文相易解指餘中初句指當句及下指後二句注比丘如上諸處得物盜直五錢若過五錢波羅夷方便偷蘭遮若取減五錢偷蘭遮不得者突吉羅教人盜取彼若得物俱波羅夷若受教者自取異物若異處取物取者犯重教者偷蘭若為取物使無盜心教者波羅夷受使者不犯若教人取物謂遣盜取受教者犯重教者無犯有主想犯重若疑偷蘭無主物有主想疑偷蘭比丘尼等四衆並如上戒不犯者與想取己有想糞掃想暫取想親厚意想者是也疏就注辨相犯不犯中五衆犯相分文同上下更不分直隨相釋辨相中初科應先分二即犯不犯犯中又二即比丘及餘衆比丘又二初自作教他有主下境想相對初中又二前明自作教下後明教他前中又二初明成重方便下犯輕如是對之疏初明自作輕重相自作中重即注中滿五究竟輕謂方便減五等相疏就教人中分二初心境相當同犯相二若受教取異物下分二初有二句懷盜心同物處有異故重輕別後有二句取物是同心有無異故罪無罪別次釋教人分示中初二句即自取異物為一異處取物為二後二句即從若為取物下為他取物為一句教人取物為一句疏就初受教自取異物者主同物異也後句主異物同也取離地時專是所教故重能教乖境故但結本方便釋中初科前分句差別取下示犯重輕疏就後心有無中初能教有心所教無心若得物時須分半取以本要期得物分故後句所教有心亦須分半雖是我衣以所教取時作他想故盜緣成犯何得不分若不與者賊復奪賊義可見也次科前釋初句注中教字下脫者字須分半者即與所教必能教者本無期心不與無過後句亦分半者此定須與不與復成盜重作他想者以彼意謂為能教取故雖誤得己物亦須分與同上僧祇疏就境想中律文具列輕重二位今注略故但舉重者境想標中輕重二位者律中盜戒境想有二重初滿五有四句如注所引次減五四句亦同但初句結蘭餘三並吉疏計應五句有主無主想所以不出者濫故不明濫相如何若始終無心則不可學迷故非罪攝若前後想轉據後非罪前心有主偷蘭若云無罪則濫轉想若云偷蘭又濫本迷是以相與不出後諸例爾可以通鏡次科示所以中初標句徵意濫下約義申通初句略示濫相下委釋初重徵若下示相前列二心結犯有無若云下次敘兩濫明不可出下指例者即境想中凡四句者皆同此故疏問此由濫故便隱沒者何為後戒得具五邪初難中後戒即律殺戒具列五句是亦有濫理不當列疏答罪有緣非緣異故以無主想謂同糞掃非生罪緣人非人想境雖重輕同是制約生罪緣故所以有也答中初通答緣謂前境是生犯緣以下別釋初釋盜戒非緣人下釋殺戒有緣疏問若如此者不處分處分想非生罪緣何故具五次難中處分緣法後心無罪而列五句者則乖前義疏答彼以事法俱可學故雖有造作有教可依無容迷忘縱迷非學不結其罪以事是難容有大犯故列第三答中初敘可學無迷事即過量法即處分由教聽作各有制度故不容迷縱下次明不可學不出所以既有教法迷心非易故云事難若從迷忘無罪而除此句容有濫託而犯根本故云容大犯也疏問若如此釋律中地非地想暮非暮想亦迷非學何故列之三難中掘地日暮並是對事迷心無罪止合四句不應列五疏答同以轉想結前心罪如前境想互四五中說答中言同以者通前二房竝同此義淫中已釋故指如前疏問何名無主物答如鈔具引讀取通之即善見中子惡父逐後亡者是如僧祇中若失物時作捨心者是無主物如多論云取計滿犯明無主中初問次答上二句指廣彼引善見文同下引又引多論二國中間國破王走後王未立竝名無主即下略示善見可解若論此方屬官為主僧祇捨心理應得取下引多論顯己非主然己屬他故計成犯彼云若先心已捨正使己物亦不得取計非他屬取亦無過疏就不犯中疏與想取者實是他物意謂與我故非犯也言己有想者實是他物意謂己物無他想故言糞掃想者實是有主意謂無主開境想中初有主想句也言暫取者既非永用暫取借故開上主不捨中非暫取也言親友意者情若琴瑟財有何別古有食必兼人衣亦通被故衣從二人食字亦爾如親情故開上非情友也如律七法可為親友難作能作難與能與難忍能忍密事相告互相覆藏遭苦不捨貧賤不輕是也不犯中五前三約心明開後二就事明開三中境想初句者即取前不與下三非配此三開也五中初約世俗釋若琴瑟者喻其調和不相乖也食兼人者謂同食也衣通被者謂同服也衣字從二人者據篆體本作說文云象覆二人之形食字本從𠓛音集從皂音急說文云後𠓛象三合之形皂即穀香也今取上三合之義故云亦爾如下次引律解順此七法方入開位初三難事能為四即切磋琢磨五謂掩惡揚善後二存始終律不共住義如上解疏此戒人多潛犯不謂重罪但是粗心鈔疏雖繁猶恐未悟可例此斟酌犯罪相也故善見云戒中宜從急護此第二戒事相難解不得不曲碎解釋其義理分別汝當善思論文如此臨事可不免邪結勸中初敘數犯所以鈔下指撰述勸修故下引論文勉學前引論文後二句指文以勸
